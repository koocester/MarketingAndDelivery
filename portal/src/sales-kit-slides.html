function slides(){var k=KITS[KIT],d=COUNTRY[CTRY];return KIT==='COMPANY'?companySlides(k,d):nicheSlides(k,d);}
function render(){var S=slides(),deck=document.getElementById('deck');if(IDX>=S.length)IDX=S.length-1;deck.innerHTML=S.map(function(s,i){return '<section class="slide '+s.c+(i===IDX?' active':(i<IDX?' prev':''))+'">'+s.h+'</section>';}).join('');document.getElementById('count').textContent=(IDX+1)+' / '+S.length;document.getElementById('bar').style.width=((IDX+1)/S.length*100)+'%';document.getElementById('prev').disabled=IDX===0;document.getElementById('next').disabled=IDX===S.length-1;document.querySelectorAll('#cty button').forEach(function(b){b.classList.toggle('on',b.dataset.c===CTRY)});document.querySelectorAll('#lang button').forEach(function(b){b.classList.toggle('on',b.dataset.lg===LANG)});document.getElementById('kit').value=KIT;document.documentElement.dataset.market=CTRY;document.documentElement.lang=LANG==='ZH'?'zh-CN':(LANG==='ID'?'id':(LANG==='MS'?'ms':'en'));updateLabels();updateUrl();}
function updateLabels(){document.getElementById('pdf-label').textContent='PDF';document.getElementById('present-label').textContent=L('Present','演示','Presentasi','Bentang');document.getElementById('kit').setAttribute('aria-label',L('Sales kit','销售资料','Sales kit','Kit jualan'));}
function updateUrl(){var u=new URL(location.href);u.searchParams.set('kit',KIT);u.searchParams.set('c',CTRY);u.searchParams.set('lang',LANG);history.replaceState(null,'',u.pathname+u.search+'#slide-'+(IDX+1));}
function go(n){IDX=Math.max(0,Math.min(slides().length-1,IDX+n));render();}
document.getElementById('cty').innerHTML=['SG','MY','ID'].map(function(c){return '<button data-c="'+c+'">'+c+'</button>'}).join('');
document.getElementById('lang').innerHTML=[['EN','EN'],['ZH','中文'],['ID','ID'],['MS','BM']].map(function(x){return '<button data-lg="'+x[0]+'">'+x[1]+'</button>'}).join('');
document.getElementById('kit').innerHTML=Object.keys(KITS).map(function(k){return '<option value="'+k+'">'+KITS[k].name+' Sales Kit</option>'}).join('');
document.querySelectorAll('#cty button').forEach(function(b){b.onclick=function(){CTRY=this.dataset.c;IDX=0;render()}});document.querySelectorAll('#lang button').forEach(function(b){b.onclick=function(){LANG=this.dataset.lg;render()}});document.getElementById('kit').onchange=function(){KIT=this.value;IDX=0;render()};document.getElementById('prev').onclick=function(){go(-1)};document.getElementById('next').onclick=function(){go(1)};
document.addEventListener('keydown',function(e){if(e.key==='ArrowRight'||e.key==='PageDown'||e.key===' '){e.preventDefault();go(1)}if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(-1)}if(e.key==='Home'){IDX=0;render()}if(e.key==='End'){IDX=slides().length-1;render()}});
(function(){var pbtn=document.getElementById('presentbtn'),el=document.documentElement;function fs(){return document.fullscreenElement||document.webkitFullscreenElement}function enter(){var fn=el.requestFullscreen||el.webkitRequestFullscreen;if(fn){try{fn.call(el)}catch(e){}}else{document.body.classList.add('presenting');window.scrollTo(0,1)}}function exit(){var fn=document.exitFullscreen||document.webkitExitFullscreen;if(fs()&&fn){try{fn.call(document)}catch(e){}}document.body.classList.remove('presenting')}pbtn.onclick=function(){fs()||document.body.classList.contains('presenting')?exit():enter()};document.addEventListener('fullscreenchange',function(){document.getElementById('present-label').textContent=fs()?L('Exit','退出','Keluar','Keluar'):L('Present','演示','Presentasi','Bentang')})})();
(function(){var btn=document.getElementById('pdfbtn'),label=document.getElementById('pdf-label'),real=document.title;function filename(){return 'Koocester '+KITS[KIT].name+' Sales Kit '+CTRY+' '+LANG}window.addEventListener('afterprint',function(){document.title=real;label.textContent='PDF'});btn.onclick=function(){document.title=filename();label.textContent=L('Preparing','准备中','Menyiapkan','Menyediakan');setTimeout(function(){window.print()},180)}})();
var qs=new URLSearchParams(location.search);var qk=(qs.get('kit')||'').toUpperCase(),qc=(qs.get('c')||'').toUpperCase(),ql=(qs.get('lang')||'').toUpperCase();if(KITS[qk])KIT=qk;if(COUNTRY[qc])CTRY=qc;if(['EN','ZH','ID','MS'].indexOf(ql)>=0)LANG=ql;var hi=parseInt((location.hash.match(/slide-(\d+)/)||[])[1],10);if(hi)IDX=Math.max(0,hi-1);render();
