"","subhead":"","lines":[{"t":"lead","x":"The brief is the handoff. Write it so the delivery team knows exactly what was sold and can start without asking you."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Your numbers","head":"Leading: deals in active pipeline this week.","subhead":"","lines":[{"t":"lead","x":"Watch the leading number daily. It is the one you can still move. The lagging number is the result it produces."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Client work has deadlines","head":"Flag risk early.","subhead":"","lines":[{"t":"lead","x":"A video for a client carries a due date. If anything looks at risk of missing it, raise it early. A client deadline missed quietly is the worst way to lose them."}],"quiz":null,"gate":[]},{"n":11,"kind":"divider","eyebrow":"Part two","head":"The handoff","subhead":"","lines":[{"t":"lead","x":"Delivery should never have to call you."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Your mission","head":"Write the brief once, write it right.","subhead":"","lines":[{"t":"lead","x":"The brief is the only thing standing between you and a delivery team that has to guess. Name the client, the deal, the deadline and what was promised — clear enough that a stranger could run it."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"Your first day","head":"Do these five things","subhead":"","lines":[{"t":"li","x":"Open the base and find the Clients and Vendor table, that is sales home."},{"t":"li","x":"Open one client and follow the chain, client to project to videos, see how work is traced."},{"t":"li","x":"Create one practice client record and write a one-line brief."},{"t":"li","x":"Check your leading number for the week, deals in active pipeline."},{"t":"li","x":"Flag one at-risk client deadline to the manager channel as practice."}],"quiz":null,"gate":[]},{"n":14,"kind":"divider","eyebrow":"Part three","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Three calls. Get them graded."}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"Question 1 · the handoff","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You've just closed a new client and set up their Project (Delivery).","q":"Correct. The brief is the handoff. Write it so delivery knows exactly what was sold and can start without calling you — the sale isn't done until delivery can pick it up cleanly.\" data-no=\" Not quite. The handoff is the brief, not a heads-up or waiting to be asked. Write it clear enough that delivery can start without calling you.\"> You've just closed a new client and set up their Project (Delivery).","opts":[{"k":"A","t":"You email the producer a heads-up that a new client signed","correct":false},{"k":"B","t":"You write a brief clear enough that delivery can start without asking you","correct":true},{"k":"C","t":"You wait for delivery to ask you for details as needed","correct":false}]},"gate":[]},{"n":16,"kind":"body","eyebrow":"Question 2 · your numbers","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"It's Monday morning and you're planning your sales week.","q":"Correct. Leading: deals in active pipeline this week — watch it daily, it's the number you can still move. Deals won this month is the lagging result it produces.\" data-no=\" Not the leading number. Deals in active pipeline this week is what you can still move today. Deals won this month and quarterly revenue are lagging results, they just report what already happened.\"> It's Monday morning and you're planning your sales week.","opts":[{"k":"A","t":"Deals in active pipeline this week — leading","correct":true},{"k":"B","t":"Deals won this month — lagging","correct":false},{"k":"C","t":"Total revenue booked this quarter","correct":false}]},"gate":[]},{"n":17,"kind":"body","eyebrow":"Question 3 · qualifying","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"A promising lead reaches out, but they don't fit the brand and would strain the delivery team.","q":"Correct. Qualify hard before you invest time — a client who fits the brand and can be delivered well is worth ten who can't. Passing on a bad fit protects the brand and the delivery team.\" data-no=\" Not quite. Revenue from a bad-fit client costs more downstream — it strains delivery and risks the brand. Qualify hard and pass when it isn't a fit.\"> A promising lead reaches out, but they don't fit the brand and would strain the delivery team.","opts":[{"k":"A","t":"Qualify hard and pass — it protects both the brand and delivery","correct":true},{"k":"B","t":"Take the deal anyway, revenue is revenue","correct":false},{"k":"C","t":"Sign them and let delivery figure out the fit","correct":false}]},"gate":[]},{"n":18,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all five?","subhead":"","lines":[],"quiz":null,"gate":["Do you qualify every lead before it enters the pipeline?","Do you work the Clients and Vendor (Sales) table for every deal?","Do you write a brief clear enough for delivery to start without you?","Do you watch your leading number — pipeline in motion — daily?","Do you flag any client video at risk of its due date early?"]},{"n":19,"kind":"close","eyebrow":"","head":"Bring the work in. Hand it off clean.","subhead":"","lines":[{"t":"lead","x":"Qualify hard, sell with confidence, and hand off clean — the whole delivery engine can trust what you put in front of it."}],"quiz":null,"gate":[]}]},{"id":"sales_disco","bucket":"Sales & Success","title":"Discovery & qualifying","href":"discovery-qualifying-training.html","step":"Specialisation","count":18,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · module","head":"Discovery & qualifying","subhead":"","lines":[{"t":"lead","x":"Running the call that finds a real fit — before anyone wastes time building for a client who was never going to work."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"Your mission","head":"Find the fit before you sell the work.","subhead":"","lines":[{"t":"lead","x":"Discovery is one call with one job: understand the client well enough to know if this is a real fit. Qualify hard here, and everything downstream — the deal, the brief, delivery — runs clean."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"You leave knowing if it's a real fit — a clear yes or no, never a maybe you'll \"figure out later\""},{"t":"win","x":"The deal is logged — contact, stage and notes in HubSpot before you close the tab"},{"t":"win","x":"A next step is booked — a concrete action with a date, agreed on the call"},{"t":"win","x":"Bad fits are passed early — no time wasted on a client who was never going to work"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"Why qualify hard","head":"A bad-fit client costs more than no client.","subhead":"","lines":[{"t":"lead","x":"A wrong client drains the delivery team, eats your time, and risks the brand — often while paying the same as a good one. Discovery is the gate that protects delivery. Say no early and you free the team to win with the clients who fit."}],"quiz":null,"gate":[]},{"n":5,"kind":"divider","eyebrow":"Part one","head":"Run the call","subhead":"","lines":[{"t":"lead","x":"Five moves, in order. Rapport to next step."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"The discovery call · start to finish","head":"Five moves, in order.","subhead":"","lines":[{"t":"li","x":"Build rapport — open warm, earn permission to ask real questions."},{"t":"li","x":"Understand their goal & situation — where they want to get to, and where they are now."},{"t":"li","x":"Surface the real problem & its cost — what's actually blocking them, and what it costs to leave it."},{"t":"li","x":"Confirm budget, authority, timeline — money to match, the decision-maker in the room, a realistic date."},{"t":"li","x":"Agree the next step — one concrete action, with a date, before you hang up."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"The move that separates a pro","head":"Find the real problem. Then price the cost of it.","subhead":"","lines":[{"t":"lead","x":"Anyone can take a brief. Your job is to surface the problem underneath it — and make the cost of not fixing it real. \"What is this costing you every month it goes unsolved?\" A client who feels the cost is a client ready to buy."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Great questions vs weak questions","head":"","subhead":"","lines":[{"t":"li","x":"\"What does winning look like in six months?\""},{"t":"li","x":"\"What's the real cost of this staying broken?\""},{"t":"li","x":"\"Walk me through how you handle this today.\""},{"t":"li","x":"\"Who else weighs in on a decision like this?\""},{"t":"li","x":"\"You'd want more leads, right?\""},{"t":"li","x":"\"So you're happy to move fast?\""},{"t":"li","x":"\"Is budget a problem?\""},{"t":"li","x":"\"Makes sense, doesn't it?\""},{"t":"callout","x":"Open questions make them talk. Leading and yes/no questions make them agree without thinking — you learn nothing, and you talk them into a fit that isn't there."}],"quiz":null,"gate":[]},{"n":9,"kind":"divider","eyebrow":"Part two","head":"Read the fit","subhead":"","lines":[{"t":"lead","x":"Four green lights. And the flags that mean walk away."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Fit criteria vs red flags","head":"","subhead":"","lines":[{"t":"li","x":"A real growth goal — a specific outcome they want"},{"t":"li","x":"Budget that matches — money to fund the work"},{"t":"li","x":"A decision-maker in the room — the person who can say yes"},{"t":"li","x":"A realistic timeline — a date the work can actually land by"},{"t":"li","x":"Chasing vanity metrics — likes and views, no business goal"},{"t":"li","x":"No budget — wants the outcome, won't fund it"},{"t":"li","x":"No decision-maker — has to \"check with someone\""},{"t":"li","x":"\"Just exploring\" — no timeline, no real intent"},{"t":"p","x":"All four green lights, or it isn't qualified. One red flag isn't always fatal — but two means walk away, however warm they feel."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Log it in HubSpot · the Customer Relationship Management (CRM) system","head":"A lead you don't log is a lead you'll lose.","subhead":"","lines":[{"t":"lead","x":"Before the call is even cold: log the contact , set the deal stage , write your notes , and set the next step with a date . If it isn't in HubSpot, it didn't happen — and the follow-up that lives only in your memory is the one you'll miss."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"The skill under the skill","head":"Listen to receive , not to reply.","subhead":"","lines":[{"t":"lead","x":"Most people listen just long enough to load their next line. Don't. Ask the question, then go quiet and actually take in the answer. The person who talks least usually controls the call — because they're the one learning, while the other keeps revealing."}],"quiz":null,"gate":[]},{"n":13,"kind":"divider","eyebrow":"Your turn","head":"Three calls. Get them graded.","subhead":"","lines":[{"t":"lead","x":"Then the certification gate."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Question 1 · pick the stronger question","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You're ten minutes into a discovery call and want to understand what the client actually wants.","q":"Correct. It's open and outcome-focused — it makes the client describe their goal in their own words, and you learn what actually matters to them. The other two are leading and yes/no: they get a nod, not the truth.\" data-no=\" Not the strongest. The best discovery question is open and outcome-focused, so the client does the talking and reveals their real goal. Leading and yes/no questions just get you an agreement you can't trust.\"> You're ten minutes into a discovery call and want to understand what the client actually wants.","opts":[{"k":"A","t":"\"You'd want more leads from this, right?\"","correct":false},{"k":"B","t":"\"What would a win from this look like six months out?\"","correct":true},{"k":"C","t":"\"Is budget going to be a problem for you?\"","correct":false}]},"gate":[]},{"n":15,"kind":"body","eyebrow":"Question 2 · reading the fit","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"A friendly prospect loves the work, but says they'll \"need to run it past the founder\" and are \"not really thinking about budget yet.\"","q":"Correct. No decision-maker and no budget are two red flags at once — the person can't say yes and can't fund it. However warm the chat feels, this isn't qualified. Pass, or park it until the real decision-maker is in the room.\" data-no=\" Look again. They can't say yes and won't commit budget — that's two red flags together. Chasing the deal here burns your time and risks handing delivery a client who was never going to work.\"> A friendly prospect loves the work, but says they'll \"need to run it past the founder\" and are \"not really thinking about budget yet.\"","opts":[{"k":"A","t":"Green light — they're enthusiastic, push for the close","correct":false},{"k":"B","t":"Minor issue — send a proposal and hope it lands","correct":false},{"k":"C","t":"Two red flags — no decision-maker, no budget; not qualified yet","correct":true}]},"gate":[]},{"n":16,"kind":"body","eyebrow":"Question 3 · closing the call","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"The discovery call went well and it looks like a real fit. You're about to wrap up.","q":"Correct. Agree one concrete next step with a date, then log the contact, stage, notes and that next step in HubSpot before you move on. A next step without a date drifts; a call you don't log is a lead you'll lose.\" data-no=\" Not quite. The call ends the same way every time: book a concrete next step with a date, and log everything in HubSpot. 'I'll follow up sometime' and an unlogged call are how good leads quietly go cold.\"> The discovery call went well and it looks like a real fit. You're about to wrap up.","opts":[{"k":"A","t":"Agree a concrete next step with a date, then log it all in HubSpot","correct":true},{"k":"B","t":"Tell them you'll follow up sometime soon and keep it in your head","correct":false},{"k":"C","t":"Send a proposal immediately, no next step needed","correct":false}]},"gate":[]},{"n":17,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you run a discovery call that finds a real fit?","subhead":"","lines":[],"quiz":null,"gate":["Do you qualify hard, and pass a bad fit early?","Do you run the five moves — rapport, goal, problem & cost, budget/authority/timeline, next step?","Do you ask open, outcome-focused questions — not leading or yes/no?","Do you check all four fit criteria and watch for red flags?","Do you log the contact, stage, notes and next step in HubSpot?","Do you listen to receive — and let the client do most of the talking?"]},{"n":18,"kind":"close","eyebrow":"","head":"Find the fit. Log the deal. Book the next step.","subhead":"","lines":[{"t":"lead","x":"A good discovery call ends with certainty: you know whether it's real, the deal is in HubSpot, and a next step is booked. Qualify hard here, and delivery never inherits a client who was never going to work."}],"quiz":null,"gate":[]}]},{"id":"sales_close","bucket":"Sales & Success","title":"Closing & handoff","href":"closing-handoff-training.html","step":"Specialisation","count":20,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · sales module","head":"Closing & handoff","subhead":"","lines":[{"t":"lead","x":"Win the client, then hand delivery a clean brief so the work starts right — nothing lost between the yes and the base."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"Your mission","head":"The sale isn't done at \"yes\". It's done at a clean handoff.","subhead":"","lines":[{"t":"lead","x":"Two moves. First, close — ask for the obvious yes. Second, hand off — pass delivery a brief so complete they never have to call you. Both, every time."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"The client says yes — because the close was the obvious next step, not a trick"},{"t":"win","x":"Objections turn into \"here's what works\" — never argued, never hedged"},{"t":"win","x":"Delivery starts with everything it needs — nothing lost between sales and the base"},{"t":"win","x":"The client knows what happens next — who they'll hear from, and when — before you leave the call"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one","head":"Closing the client","subhead":"","lines":[{"t":"lead","x":"If discovery was done well, the close is easy."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Closing is not a trick","head":"The close is asking for the obvious yes .","subhead":"","lines":[{"t":"lead","x":"If you did discovery well, you already know their goal, their problem, and what they want. The close isn't pressure or a clever line — it's simply naming the obvious next step and inviting them to take it."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"The close · say it back, then ask","head":"Summarise, then invite the yes.","subhead":"","lines":[{"t":"callout","x":"Mirror their own words back. Goal → outcome → offer → \"shall we begin?\". When they hear their goal repeated and matched to a clear outcome, the yes is the natural answer."}],"quiz":null,"gate":[]},{"n":7,"kind":"divider","eyebrow":"Part two","head":"Handling objections","subhead":"","lines":[{"t":"lead","x":"Never argue. Never hedge. Reframe."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"The three you'll hear · reframe every one","head":"","subhead":"","lines":[{"t":"li","x":"The value isn't clear yet"},{"t":"li","x":"Re-anchor on the outcome and the cost of not acting"},{"t":"li","x":"Name the cost of waiting"},{"t":"li","x":"Show how starting now brings the result forward"},{"t":"li","x":"Bring proof — results, track record, a guarantee"},{"t":"li","x":"Make the first step small and safe"},{"t":"callout","x":"Reframe every objection into \"here's what works.\" You don't fight the objection and you don't hedge — you turn it into the reason to move."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"The price objection · what it really means","head":"\"Too expensive\" means the value isn't clear yet.","subhead":"","lines":[{"t":"lead","x":"It's almost never really about the number. Don't discount and don't defend the price — re-anchor on the outcome they'll get and the cost of doing nothing. When the value is obvious, the price stops being the question."},{"t":"callout","x":"Re-anchor, don't drop. \"For the result you want, here's what it's worth — and here's what staying stuck keeps costing you.\""}],"quiz":null,"gate":[]},{"n":10,"kind":"divider","eyebrow":"Part three","head":"The clean handoff","subhead":"","lines":[{"t":"lead","x":"The moment they say yes, delivery inherits the work."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Where the work goes the instant they agree","head":"Yes hands the work to delivery.","subhead":"","lines":[{"t":"lead","x":"The Marketing & Delivery base is where the work gets made. Your brief is the bridge to it. A clean brief means delivery starts the moment they inherit — no waiting, no guessing."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"A clean brief · six things, every time","head":"What delivery needs to start right","subhead":"","lines":[{"t":"li","x":"The client and their goal — who they are and what they came for."},{"t":"li","x":"The offer sold — exactly what they bought."},{"t":"li","x":"Deliverables and scope — what's in, what's out."},{"t":"li","x":"Timeline — key dates and the deadline."},{"t":"li","x":"Key contacts — who delivery talks to on the client side."},{"t":"li","x":"Anything promised on the call — every extra you committed to."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"A vague handoff creates rework and broken promises","head":"Clean vs vague","subhead":"","lines":[{"t":"li","x":"Delivery starts same day, no questions"},{"t":"li","x":"Scope and deadline are unambiguous"},{"t":"li","x":"Everything promised is written down"},{"t":"li","x":"The client gets exactly what they were sold"},{"t":"li","x":"Delivery has to call you to start"},{"t":"li","x":"Scope gets guessed — rework follows"},{"t":"li","x":"A promise you made never lands"},{"t":"li","x":"The client feels the drop between sales and delivery"}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Before you leave the call","head":"Log the win. Trigger the handoff. Set expectations.","subhead":"","lines":[{"t":"li","x":"Log the won deal in HubSpot — never let a won client sit in an inbox. The record is what triggers the handoff."},{"t":"li","x":"Trigger the handoff — the brief goes to delivery the moment the deal is marked won, not \"later\"."},{"t":"li","x":"Tell them what happens next — the steps from here, in plain terms."},{"t":"li","x":"Name who they'll hear from, and when — so the client is never left wondering."},{"t":"callout","x":"A won client in an inbox is a client half-lost. Log it, hand it off, and set expectations — all before you hang up."}],"quiz":null,"gate":[]},{"n":15,"kind":"divider","eyebrow":"Part four","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Three calls. Get them graded."}],"quiz":null,"gate":[]},{"n":16,"kind":"body","eyebrow":"Question 1 · the price objection","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You've closed well, but the client says: \"It's too expensive.\"","q":"Correct. \"Too expensive\" almost always means the value isn't clear yet. Don't discount and don't defend the price — re-anchor on the outcome they'll get and the cost of not acting. When the value is obvious, price stops being the question.\" data-no=\" Not the strongest move. Discounting or defending your costs both concede the point. The value isn't clear yet — re-anchor on the outcome and the cost of inaction, and the price stops being the question.\"> You've closed well, but the client says: \"It's too expensive.\"","opts":[{"k":"A","t":"Offer a discount to get the deal over the line","correct":false},{"k":"B","t":"Re-anchor on the outcome and the cost of not acting — the value isn't clear yet","correct":true},{"k":"C","t":"Walk through your costs to justify the price","correct":false}]},"gate":[]},{"n":17,"kind":"body","eyebrow":"Question 2 · the handoff brief","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"The client just said yes. You're about to hand the work to the Marketing & Delivery base.","q":"Correct. A clean brief carries the client and their goal, the offer sold, deliverables and scope, timeline, key contacts, and anything promised on the call. That's everything delivery needs to start right — nothing lost between sales and the base.\" data-no=\" Not enough. A name and a number — or a \"figure it out later\" — forces delivery to guess, and rework and broken promises follow. The brief needs the client and goal, offer sold, deliverables and scope, timeline, key contacts, and anything promised.\"> The client just said yes. You're about to hand the work to the Marketing & Delivery base.","opts":[{"k":"A","t":"Just the client's name and the amount they paid","correct":false},{"k":"B","t":"A quick note — delivery can work the details out as they go","correct":false},{"k":"C","t":"Client and goal, offer sold, deliverables and scope, timeline, contacts, and anything promised","correct":true}]},"gate":[]},{"n":18,"kind":"body","eyebrow":"Question 3 · the close","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"Discovery went well — you know the client's goal and what they want.","q":"Correct. If discovery was done well, the close is asking for the obvious yes: summarise their goal, the outcome you'll deliver, the offer, then \"shall we begin?\" No trick, no pressure — the natural next step.\" data-no=\" Not the close. Closing isn't a trick or a long wait. If discovery was done well, you summarise their goal → the outcome → the offer → \"shall we begin?\" and invite the obvious yes.\"> Discovery went well — you know the client's goal and what they want.","opts":[{"k":"A","t":"Use a clever pressure tactic to force the yes","correct":false},{"k":"B","t":"Summarise their goal → the outcome → the offer → \"shall we begin?\"","correct":true},{"k":"C","t":"Send a long proposal and wait for them to come back","correct":false}]},"gate":[]},{"n":19,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you close the client and hand a clean brief to delivery?","subhead":"","lines":[],"quiz":null,"gate":["Do you close by summarising goal → outcome → offer → \"shall we begin?\"","Do you reframe every objection into \"here's what works\" — never argue, never hedge?","On \"too expensive\", do you re-anchor on the outcome and the cost of not acting?","Does every handoff brief carry all six things delivery needs?","Do you log the won deal in HubSpot and trigger the handoff — never leave it in an inbox?","Do you set expectations before you leave the call — what's next, who, and when?"]},{"n":20,"kind":"close","eyebrow":"","head":"Ask for the yes. Hand off clean.","subhead":"","lines":[{"t":"lead","x":"Close by inviting the obvious yes, reframe every objection into what works, and hand delivery a brief so complete the work starts right — nothing lost between the sale and the base."}],"quiz":null,"gate":[]}]},{"id":"hubspot","bucket":"Sales & Success","title":"HubSpot","href":"sales-hubspot-training.html","step":"Specialisation","count":14,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · module","head":"The HubSpot CRM","subhead":"","lines":[{"t":"lead","x":"Sales. This is where every lead, every conversation and every deal lives — one place, one truth, no lost follow-ups."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"Every lead gets added — the moment it comes in, no exceptions"},{"t":"win","x":"Every touch gets logged — calls, emails, notes — the full history in one place"},{"t":"win","x":"Deals move through the pipeline — stage reflects reality, not wishful thinking"},{"t":"win","x":"You never lose a follow-up — a task is always set for the next action"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"The CRM, in plain English","head":"One place. Every contact. Every deal.","subhead":"","lines":[{"t":"lead","x":"HubSpot CRM is where Sales keeps track of the people you're talking to ( contacts ) and the businesses they work for ( companies ), the opportunities you're chasing as they move through a pipeline , what you need to do next ( tasks ), and the full history of every call, email and note tied to them."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"Why Sales uses it","head":"It's not admin. It's how you don't drop a deal.","subhead":"","lines":[{"t":"li","x":"Never lose a lead — everything's logged, nothing lives in your head or a notepad."},{"t":"li","x":"See the whole pipeline at a glance — who's where, what's stuck, what's about to close."},{"t":"li","x":"Always know your next action — a task tells you exactly what to do and when."},{"t":"li","x":"Hand off clean — anyone can pick up a deal and see the full history instantly."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"The five things you'll touch every day","head":"The core objects","subhead":"","lines":[{"t":"li","x":"Contacts — a person: name, email, phone, job title. Every call, email and note attaches here."},{"t":"li","x":"Companies — the business a contact works for. One company can hold many contacts."},{"t":"li","x":"Deals — a real opportunity, moving through defined stages toward a close."},{"t":"li","x":"Pipeline stages — the steps a deal moves through, e.g. appointment scheduled → qualified → proposal sent → closed won/lost."},{"t":"li","x":"Tasks — the to-dos and reminders tied to a contact or deal, so nothing gets forgotten."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Your daily flow · a new lead comes in","head":"Log it. Work it. Never lose it.","subhead":"","lines":[{"t":"callout","x":"The loop never stops. Every call ends the same way — log it, then set the next task. That's what keeps a deal from going cold."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Watch · two beginner walkthroughs","head":"See it live before you touch it.","subhead":"","lines":[{"t":"lead","x":"Ten minutes each. Watch both before you open your own HubSpot account."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"How it fits Koocester","head":"SMM hands you the warm lead. You take it from there.","subhead":"","lines":[{"t":"lead","x":"When a warm DM lead lands from Marketing / SMM, you log it in HubSpot — create the contact, attach a deal, and work it through the pipeline stage by stage. Keep HubSpot as the single source of truth: if it isn't in HubSpot, it didn't happen."}],"quiz":null,"gate":[]},{"n":9,"kind":"divider","eyebrow":"Your turn","head":"Three calls. Get them graded.","subhead":"","lines":[{"t":"lead","x":"Then the certification gate."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Question 1 · contacts vs deals","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You're setting up a new prospect in HubSpot for the first time.","q":"Correct. A contact is the person — their name, email, phone. A deal is the opportunity moving through the pipeline. Every deal needs a contact, but not every contact has an open deal.\" data-no=\" Not quite. A contact is the person record — name, email, phone. A deal is the opportunity, tracked separately as it moves through pipeline stages toward a close.\"> You're setting up a new prospect in HubSpot for the first time.","opts":[{"k":"A","t":"They're the same thing, just different names","correct":false},{"k":"B","t":"A contact is the person, a deal is the opportunity moving through the pipeline","correct":true},{"k":"C","t":"A contact is for companies, a deal is for individuals","correct":false}]},"gate":[]},{"n":11,"kind":"body","eyebrow":"Question 2 · a new lead lands","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"A warm DM lead just landed from Marketing / SMM. You open HubSpot.","q":"Correct. A new lead starts as a contact. Log the person first — then you can attach a deal to them and start working it through the pipeline.\" data-no=\" Not first. Before there's a pipeline stage or a task to set, the person needs to exist as a contact in HubSpot. Log the contact first, then attach the deal.\"> A warm DM lead just landed from Marketing / SMM. You open HubSpot.","opts":[{"k":"A","t":"Create or log the contact","correct":true},{"k":"B","t":"Move straight to setting a pipeline stage","correct":false},{"k":"C","t":"Wait until they reply before touching HubSpot","correct":false}]},"gate":[]},{"n":12,"kind":"body","eyebrow":"Question 3 · after the call","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"You just finished a call with a prospect and agreed on next steps.","q":"Correct. Log what happened on the call, and set the next task before you close the tab. That's the whole loop — without the task, the deal goes cold and the follow-up gets missed.\" data-no=\" Not enough. Logging the call is only half the job. Set the next task too — that's what guarantees the follow-up actually happens instead of living in your memory.\"> You just finished a call with a prospect and agreed on next steps.","opts":[{"k":"A","t":"Nothing — you'll remember the follow-up","correct":false},{"k":"B","t":"Move the deal to \"Closed Won\" straight away","correct":false},{"k":"C","t":"Log the call, and set the next task","correct":true}]},"gate":[]},{"n":13,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all five?","subhead":"","lines":[],"quiz":null,"gate":["Do you know the difference between a contact, a company and a deal?","Do you log every lead the moment it comes in?","Do you know what a pipeline stage is and why it matters?","Do you set a task after every call or email?","Is HubSpot your single source of truth — not a notebook or your memory?"]},{"n":14,"kind":"close","eyebrow":"","head":"Log it. Work it. Never lose it.","subhead":"","lines":[{"t":"lead","x":"HubSpot is the single source of truth for every lead you touch. Add the contact, work the deal, log every touch, set the next task — every time."}],"quiz":null,"gate":[]}]},{"id":"cs_success","bucket":"Sales & Success","title":"Customer success","href":"customer-success-training.html","step":"Your role","count":17,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · role certification","head":"Customer success","subhead":"","lines":[{"t":"lead","x":"You own the client relationship. Sales brings them in — you make sure they win, stay, and tell others."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"Clients onboarded smoothly — clear scope, cadence, one contact from day one"},{"t":"win","x":"Delivery on time and on-brief — what ships matches what was promised"},{"t":"win","x":"Clients renew and refer — results speak — they stay and send others"},{"t":"win","x":"Nothing promised is dropped — every commitment tracked through to done"},{"t":"win","x":"The client feels looked after — proactive, responsive, never left guessing"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"Your mission","head":"You own the client's outcome .","subhead":"","lines":[{"t":"lead","x":"Sales brings them in. You make sure they win and stay. A happy, delivered client is worth more than a new one."}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one","head":"The client relationship","subhead":"","lines":[{"t":"lead","x":"Onboard, deliver, keep them happy, grow it."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Kick off right","head":"Onboard the client — set them up to win from day one.","subhead":"","lines":[{"t":"li","x":"Confirm scope & expectations — what's promised, and what isn't"},{"t":"li","x":"Gather what you need — assets, access, information, upfront"},{"t":"li","x":"Set the cadence — how and when you'll update them"},{"t":"li","x":"One clear point of contact — you, always reachable"}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Turn the goal into a brief","head":"Own delivery — even when others do the work.","subhead":"","lines":[{"t":"callout","x":"You're accountable even when others build it. The team executes; you're the one who answers for whether it matched the promise."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Accountable, even when delegated","head":"Landing pages & offers are yours to answer for.","subhead":"","lines":[{"t":"lead","x":"CS is accountable for the client's landing pages and offers. You can delegate the internal build to the marketing coordinator — but the outcome is still yours."},{"t":"callout","x":"Delegating the build isn't delegating the accountability. If the page or offer doesn't convert, it's your problem to catch and fix."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Proactive, fast, human","head":"Keep them happy — and turn feedback into a fix.","subhead":"","lines":[{"t":"li","x":"Proactive updates — don't make them ask"},{"t":"li","x":"Respond fast — speed reads as care"},{"t":"li","x":"Turn a complaint into a fix + a stronger relationship — not a defence"},{"t":"li","x":"Never go silent — silence is the one thing they won't forgive"}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Results earn the renewal","head":"Retention and referrals follow delivered results .","subhead":"","lines":[{"t":"lead","x":"Renewals and referrals come from results, not charm. Spot the moment to deepen the relationship — upsell only where it genuinely helps them."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Nothing drops between seats","head":"You're the bridge — both directions.","subhead":"","lines":[{"t":"callout","x":"Nothing drops between seats. Sales hands you a warm lead with context; you hand delivery a clear brief; you hand the client the truth, on cadence."}],"quiz":null,"gate":[]},{"n":11,"kind":"divider","eyebrow":"Part two","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Four calls. Get them graded."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Question 1 · who owns the outcome","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A client project is underway. Sales closed it, the marketing coordinator built the landing page, an editor produced the content.","q":"Correct. Sales closes the deal, other teams touch the build — but you own the client's outcome end to end. If it slips, it's yours to catch and answer for.\" data-no=\" Not quite. Sales closing the deal doesn't make them accountable for the outcome, and 'whoever touched it last' isn't a real owner. You own the client's outcome, full stop.\"> A client project is underway. Sales closed it, the marketing coordinator built the landing page, an editor produced the content.","opts":[{"k":"A","t":"Sales — they closed the deal","correct":false},{"k":"B","t":"You — Customer Success owns the outcome, even when others do the work","correct":true},{"k":"C","t":"Whoever touched the record last","correct":false}]},"gate":[]},{"n":13,"kind":"body","eyebrow":"Question 2 · landing pages & offers","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"The marketing coordinator built the client's landing page. Conversion is low.","q":"Correct. You can delegate the internal build to the marketing coordinator, but the accountability for the client's landing page and offer stays with you.\" data-no=\" Not quite. The marketing coordinator may have built it and the client owns the offer, but the accountability for whether it converts sits with Customer Success — that's what 'delegate the build, not the outcome' means.\"> The marketing coordinator built the client's landing page. Conversion is low.","opts":[{"k":"A","t":"The marketing coordinator, since they built it","correct":false},{"k":"B","t":"You — you can delegate the build, but the outcome is yours","correct":true},{"k":"C","t":"The client, since it's their offer","correct":false}]},"gate":[]},{"n":14,"kind":"body","eyebrow":"Question 3 · handling a complaint","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A client emails, frustrated that a detail was missed on delivery.","q":"Correct. Respond fast, acknowledge it, and turn the complaint into a fix and a stronger relationship. Silence or a slow, defensive reply is what actually loses the client.\" data-no=\" Not quite. Waiting for a perfect explanation or forwarding it away reads as silence to the client. Respond fast, acknowledge, and turn it into a fix — that's the job.\"> A client emails, frustrated that a detail was missed on delivery.","opts":[{"k":"A","t":"Wait until you have the full explanation before replying","correct":false},{"k":"B","t":"Respond fast, acknowledge it, and turn it into a fix","correct":true},{"k":"C","t":"Forward it to the delivery team to explain directly","correct":false}]},"gate":[]},{"n":15,"kind":"body","eyebrow":"Question 4 · delivery matching the promise","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A deliverable shipped from the production team doesn't fully match what was scoped with the client.","q":"Correct. You're the final check. Catch the mismatch and get it fixed before it ever reaches the client — that's what 'own delivery' means.\" data-no=\" Not quite. Shipping a mismatch or asking the client to accept it as-is breaks the promise. You catch it and get it fixed before it reaches the client.\"> A deliverable shipped from the production team doesn't fully match what was scoped with the client.","opts":[{"k":"A","t":"Ship it anyway — the deadline matters more","correct":false},{"k":"B","t":"Catch the mismatch and get it fixed — you're the final check","correct":true},{"k":"C","t":"Ask the client to accept it as-is and fix it next round","correct":false}]},"gate":[]},{"n":16,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all five?","subhead":"","lines":[],"quiz":null,"gate":["Do you onboard clients cleanly, every time?","Do you own the outcome even when others build it?","Do you hold landing-page and offer accountability, even when delegated?","Do you handle feedback fast and turn it into a fix?","Do you drive renewals and referrals from delivered results?"]},{"n":17,"kind":"close","eyebrow":"","head":"Onboard them. Deliver the win. Keep them for life.","subhead":"","lines":[{"t":"lead","x":"You're the bridge between the client and the delivery machine. Sales opens the door — you make sure they win, stay, and bring the next one with them."}],"quiz":null,"gate":[]}]},{"id":"tech","bucket":"Operations & Tech","title":"Tech","href":"tech-maintainer-training.html","step":"Your role","count":33,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · role certification","head":"Tech maintainer","subhead":"","lines":[{"t":"lead","x":"The person who keeps the Marketing and Delivery base alive."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"Your mission","head":"Keep the machine running when Hakim is not there.","subhead":"","lines":[{"t":"lead","x":"The base runs itself most days. Your job is to understand how, spot when it drifts, and fix it without breaking the parts that already work."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"The mindset","head":"Understand before you touch.","subhead":"","lines":[{"t":"lead","x":"Every field, clock and button is wired to something downstream. A small edit in the wrong place goes quiet, not loud. Read first. Change second."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"Automations run clean — no red states, no silent failures"},{"t":"win","x":"Nothing breaks silently — you catch it before Hakim does"},{"t":"win","x":"Every change is tested first — one record before it touches hundreds"},{"t":"win","x":"The base stays healthy — fields tidy, views clean, docs current"},{"t":"p","x":"This is the bar. Everything that follows is how you hold it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":5,"kind":"divider","eyebrow":"Part one","head":"The base map","subhead":"","lines":[{"t":"lead","x":"The core tables you are looking after."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"The core tables","head":"","subhead":"","lines":[{"t":"p","x":"Plus the role Updates channels that receive the notifications."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"The two working tables","head":"Videos and Carousels do the work.","subhead":"","lines":[{"t":"lead","x":"A Project is only a harness. Vertical and country live on the Page, never on the Project. Records are born blank at Not Started and move one stage at a time."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"What runs on its own","head":"The base runs on ~85 automations.","subhead":"","lines":[{"t":"lead","x":"Buttons move stages. Scheduled scans watch the SLA clocks. Notifications route to each role's Updates channel. People auto-assign onto new records. Carousels fan out from worthy videos."}],"quiz":null,"gate":[]},{"n":9,"kind":"divider","eyebrow":"Part two","head":"The gotchas that will bite you","subhead":"","lines":[{"t":"lead","x":"Hard-won rules. Read every one."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Gotcha · the SLA clocks","head":"Modified-time fields drive the clocks.","subhead":"","lines":[{"t":"lead","x":"\"Last Video Stage Updated\" must track only the Video Stage field. If it tracks everything, any edit you make resets that clock and the overdue numbers go blind. So before any bulk write, check which modified-time fields it re-stamps."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Gotcha · time is tricky","head":"Two clocks, eight hours apart.","subhead":"","lines":[{"t":"lead","x":"An automation's NOW() reads as UTC plus 8. A formula's NOW() reads as UTC. So before you stamp a time or compare two of them, work out which clock you are on and account for the eight hour gap."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Gotcha · the trigger","head":"Matches conditions fires on entry only.","subhead":"","lines":[{"t":"lead","x":"The \"matches conditions\" trigger is edge triggered. It fires only when a record enters the state, and it ignores writes made by the API. So before you trust any trigger you wire, test it with a real stage change and watch it fire."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"Gotcha · auto-assign","head":"The Page owns the people.","subhead":"","lines":[{"t":"lead","x":"Auto-assign copies the default people from the Page onto every new record. So when you need to change who works an account, change the person on the Page, never on hundreds of records."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Gotcha · the fan-out","head":"The fan-out lives in AnyCross.","subhead":"","lines":[{"t":"lead","x":"The video to carousel fan-out runs in AnyCross, not n8n. So when a worthy video should spawn a carousel and does not, open AnyCross first, before you touch the base automations."}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"Gotcha · the followers sync","head":"The sync overwrites, it does not log.","subhead":"","lines":[{"t":"lead","x":"The followers sync replaces the current number and keeps no history. So never build a trend off the live value. If you need one, append dated rows instead of overwriting."}],"quiz":null,"gate":[]},{"n":16,"kind":"divider","eyebrow":"Part three","head":"The SLA and feedback layers","subhead":"","lines":[{"t":"lead","x":"The clocks that enforce, the numbers that return."}],"quiz":null,"gate":[]},{"n":17,"kind":"body","eyebrow":"The SLA layer","head":"Some digests are parked, on purpose.","subhead":"","lines":[{"t":"lead","x":"A set of overdue and stale digest automations is kept off until the team settles. Turn them on together when lead-time enforcement begins, and check the 9am timing against the NOW() offset."}],"quiz":null,"gate":[]},{"n":18,"kind":"body","eyebrow":"The feedback loop","head":"Numbers leave Lark to be seen.","subhead":"","lines":[{"t":"lead","x":"Published performance flows to Supabase. The dashboards live in Metabase, not in Lark. When someone asks for a chart, that is where it is built."}],"quiz":null,"gate":[]},{"n":19,"kind":"divider","eyebrow":"Part four","head":"How to change things safely","subhead":"","lines":[{"t":"lead","x":"The three moves that keep you out of trouble."}],"quiz":null,"gate":[]},{"n":20,"kind":"body","eyebrow":"Safe move · add","head":"Add a field or view in the UI.","subhead":"","lines":[{"t":"lead","x":"Adding is low risk. A field created through the API auto-shows in every view, so tidy visibility after. Building a view never touches the data underneath it."}],"quiz":null,"gate":[]},{"n":21,"kind":"body","eyebrow":"Safe move · never bulk-write blind","head":"Know what a write re-stamps.","subhead":"","lines":[{"t":"lead","x":"Never bulk-write to Videos without knowing what it re-stamps. A mass edit can reset the modified-time fields and wipe the overdue picture across the whole pipeline."}],"quiz":null,"gate":[]},{"n":22,"kind":"body","eyebrow":"Safe move · edit, do not duplicate","head":"Change the automation in place.","subhead":"","lines":[{"t":"lead","x":"Edit an automation, do not duplicate it. Duplicated button automations can carry corruption that blocks activation. Work on the original."}],"quiz":null,"gate":[]},{"n":23,"kind":"body","eyebrow":"Where the truth lives","head":"The base documents itself.","subhead":"","lines":[{"t":"lead","x":"The base's own docs and the role modules are the source of truth. Read them before you assume. Escalate to Hakim for anything structural."}],"quiz":null,"gate":[]},{"n":24,"kind":"body","eyebrow":"Your first week","head":"Tech gets a week, not a day.","subhead":"","lines":[{"t":"li","x":"Read the whole workflow module first. You cannot maintain what you do not understand."},{"t":"li","x":"Open the Automation center and read the automations behind one button end to end."},{"t":"li","x":"Trace one video from Not Started to Completed and watch what each stage stamps."},{"t":"li","x":"Find the SLA formula fields and the modified-time field that drives them."},{"t":"li","x":"Make one safe change on one test record, then verify it did only what you expected."},{"t":"li","x":"Bookmark where the truth lives, the base docs and these modules."}],"quiz":null,"gate":[]},{"n":25,"kind":"body","eyebrow":"Safe move · password management","head":"Credentials are the keys to the whole machine.","subhead":"","lines":[{"t":"lead","x":"One leaked password can undo every safeguard you have built. Handle credentials like they carry the whole base."},{"t":"li","x":"Use a password manager — never share passwords in chat, docs or plaintext."},{"t":"li","x":"A strong, unique password per service. No reuse across tools."},{"t":"li","x":"Two-factor authentication on everything that offers it."},{"t":"li","x":"Shared and team accounts live in a shared vault, not a personal DM."},{"t":"li","x":"Rotate access the moment someone leaves — offboarding starts with credentials."},{"t":"li","x":"Least privilege — people get access to what their role needs, nothing more."},{"t":"li","x":"Never hardcode secrets in code or workflows. An inline API key is a real, live risk."}],"quiz":null,"gate":[]},{"n":26,"kind":"body","eyebrow":"Safe move · device management","head":"The machines running the business need care too.","subhead":"","lines":[{"t":"lead","x":"A compromised laptop is a compromised base. Keep every device that touches company work locked down and known."},{"t":"li","x":"Company devices are inventoried — Hakim knows what exists and who holds it."},{"t":"li","x":"Screen-lock and full-disk encryption on, always."},{"t":"li","x":"OS and apps kept updated. Do not defer the security patches."},{"t":"li","x":"No unknown or unapproved software installed."},{"t":"li","x":"Secure every account signed in on the device, not just the device itself."},{"t":"li","x":"Clean offboarding — revoke access, then wipe or return the device."}],"quiz":null,"gate":[]},{"n":27,"kind":"divider","eyebrow":"Part five","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Four calls. Get them graded."}],"quiz":null,"gate":[]},{"n":28,"kind":"body","eyebrow":"Question 1 · who owns the people","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"A teammate wants to change who's assigned to all Wealth videos.","q":"Correct. Auto-assign copies the default people from the Page onto every new record — change the person there, never bulk-edit hundreds of records directly.\" data-no=\" Not the safe fix. The Page owns the people — change the default assignee there and it cascades to new records, rather than bulk-editing or relying on manual handoffs.\"> A teammate wants to change who's assigned to all Wealth videos.","opts":[{"k":"A","t":"Change the default assignee on the Page — it cascades to every new record","correct":true},{"k":"B","t":"Bulk-edit the assignee field across every existing Wealth video record","correct":false},{"k":"C","t":"Ask each producer to manually reassign their own records","correct":false}]},"gate":[]},{"n":29,"kind":"body","eyebrow":"Question 2 · before a bulk write","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"You're asked to bulk-write a value into a field on 200 Video records to backfill missing data.","q":"Correct. 'Last Video Stage Updated' must track only the Video Stage field. A bulk write that re-stamps it resets the clock and blinds the overdue numbers across the whole pipeline.\" data-no=\" Not the risk here. The real danger is a bulk write re-stamping the modified-time field that drives the SLA clocks — check that before any mass edit to Videos.\"> You're asked to bulk-write a value into a field on 200 Video records to backfill missing data.","opts":[{"k":"A","t":"Whether the Page has a default value set","correct":false},{"k":"B","t":"Whether the trigger is edge- or level-triggered","correct":false},{"k":"C","t":"Whether the write will re-stamp the modified-time field that drives the SLA clocks","correct":true}]},"gate":[]},{"n":30,"kind":"body","eyebrow":"Question 3 · the missing carousel","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A worthy video should have spawned a carousel automatically, but nothing happened.","q":"Correct. The video-to-carousel fan-out runs in AnyCross, not n8n or the base automations. Check there first before touching anything else.\" data-no=\" Not first. The fan-out lives in AnyCross, not in the base's own automations — that's the first place to check when a worthy video fails to spawn a carousel.\"> A worthy video should have spawned a carousel automatically, but nothing happened.","opts":[{"k":"A","t":"The base's role Updates notification channels","correct":false},{"k":"B","t":"AnyCross — the fan-out lives there, not in the base automations","correct":true},{"k":"C","t":"The Content Performance table","correct":false}]},"gate":[]},{"n":31,"kind":"body","eyebrow":"Question 4 · password hygiene","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A teammate asks you to send them the login for a shared tool so they can get started today.","q":"Correct. Passwords go in a password manager, protected by 2FA — never pasted into chat, docs, or plaintext, even for a teammate you trust.\" data-no=\" Not the safe fix. A password shared in chat or a doc sits there in plaintext forever. Store it in a password manager and turn on two-factor authentication instead.\"> A teammate asks you to send them the login for a shared tool so they can get started today.","opts":[{"k":"A","t":"Paste it into the team chat so they have it immediately","correct":false},{"k":"B","t":"Add them to the shared vault entry in the password manager, with 2FA on the account","correct":true},{"k":"C","t":"Put it in a shared doc labeled \"logins\" for anyone on the team to find","correct":false}]},"gate":[]},{"n":32,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all six?","subhead":"","lines":[],"quiz":null,"gate":["Can you name the core tables and what each one holds?","Do you know which field drives the SLA clocks?","Do you account for the eight hour NOW() offset before you stamp a time?","Do you change people on the Page, never on hundreds of records?","Do you test every change on one record before it touches hundreds?","Do you escalate anything structural to Hakim?"]},{"n":33,"kind":"close","eyebrow":"","head":"Empowering growth. Built on trust.","subhead":"","lines":[{"t":"lead","x":"You are the reason the base keeps running when nobody is watching. Read first, change second, escalate when it is structural."},{"t":"p","x":"This is the final module of the Academy path."}],"quiz":null,"gate":[]}]},{"id":"tech_auto","bucket":"Operations & Tech","title":"Automations & AnyCross","href":"automations-anycross-training.html","step":"Specialisation","count":27,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · tech certification","head":"Automations & AnyCross","subhead":"","lines":[{"t":"lead","x":"How to read, safely change, and rebuild the fan-outs that run the Marketing & Delivery base."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"Your mission","head":"Keep the fan-outs running, without breaking them.","subhead":"","lines":[{"t":"lead","x":"Records move through stages and create linked records on their own. Your job is to understand exactly how, change it when it needs changing, and never ship a fix that runs twice or does nothing at all."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"You can trace any fan-out — from the trigger to the last created record"},{"t":"win","x":"You change it without breaking idempotency — a re-run never duplicates"},{"t":"win","x":"You never ship a silent no-op — every button and trigger is proven to fire"},{"t":"win","x":"You test on one record first — never on hundreds, never blind"},{"t":"p","x":"This is the bar. Everything that follows is how you hold it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one","head":"The landscape","subhead":"","lines":[{"t":"lead","x":"What holds the data, and what moves it."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Three layers, one machine","head":"Data sits still. Automations move it.","subhead":"","lines":[{"t":"lead","x":"Lark Base holds the records. Native Lark automations push them through stages. AnyCross is the fan-out engine that creates the linked records automatically — one source record spawns the ones that depend on it."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"What a fan-out is","head":"One record enters. Many are born.","subhead":"","lines":[{"t":"lead","x":"A fan-out is an automation that reacts to one record reaching a state and creates a set of linked records from it — the downstream work it implies. That is the engine you are looking after. Understand it before you touch it."}],"quiz":null,"gate":[]},{"n":7,"kind":"divider","eyebrow":"Part two","head":"The golden rule","subhead":"","lines":[{"t":"lead","x":"Understand before you change."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Golden rule · read the whole automation","head":"Scroll to the very bottom before you judge it.","subhead":"","lines":[{"t":"lead","x":"An automation is a stack of action steps. The summary caption at the top undercounts them — it never shows the whole story. Open the action panel and scroll all the way down to \"Add action\" . Only when you have seen every step do you know what it actually does."},{"t":"callout","x":"The trap: you read the caption, assume you understand, and edit blind. The step that bites you is the one you never scrolled to."}],"quiz":null,"gate":[]},{"n":9,"kind":"divider","eyebrow":"Part three","head":"Idempotency","subhead":"","lines":[{"t":"lead","x":"Run it once, run it twice — same result."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Idempotency · guard against double-runs","head":"A fan-out that runs twice makes duplicates .","subhead":"","lines":[{"t":"lead","x":"The same trigger can fire more than once. If the automation has no guard, it spawns the linked records again — and now the base has doubles nobody asked for. Every fan-out you build or change must be safe to run twice."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"How to make it safe · the \"already done\" test","head":"Ask a fact that can't lag.","subhead":"","lines":[{"t":"li","x":"A link count — \"does this record already have its children?\""},{"t":"li","x":"A helper flag field you set the instant the work is done"},{"t":"li","x":"An only-when-empty guard — create only if nothing's there yet"},{"t":"li","x":"A rollup that can lag behind the write that fed it"},{"t":"li","x":"A number that's \"usually\" updated by now"},{"t":"li","x":"Any signal that is eventually right but not right yet"},{"t":"p","x":"Derive \"already done\" from something the record itself knows right now — a link count or a flag — never from a value that updates a beat late."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"The guard in one line","head":"Create only when the slot is empty.","subhead":"","lines":[{"t":"lead","x":"Wrap every \"create linked record\" step in a condition: only run if that link is still empty. Now a re-run finds the work already there, does nothing, and moves on. That single guard is what makes the whole fan-out idempotent."}],"quiz":null,"gate":[]},{"n":13,"kind":"divider","eyebrow":"Part four","head":"Triggers & buttons","subhead":"","lines":[{"t":"lead","x":"What starts an automation — and its hidden edges."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Triggers · pick the right one","head":"\"Matches conditions\" fires on entry only.","subhead":"","lines":[{"t":"li","x":"Fires only when a record enters the state"},{"t":"li","x":"Ignores writes made by the Application Programming Interface (API)"},{"t":"li","x":"Great for a one-time \"on arrival\" fan-out"},{"t":"li","x":"Fires every time the watched field changes"},{"t":"li","x":"Use this to react to a field changing"},{"t":"li","x":"The right choice when a value can change more than once"},{"t":"callout","x":"The mistake: wiring \"matches conditions\" and expecting it to fire when a field later changes, or when the API writes the value. It won't. To react to a change, watch the field with \"when a record updates\"."}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"Buttons · one button, one automation","head":"A button binds to exactly one automation.","subhead":"","lines":[{"t":"lead","x":"A button doesn't branch. It fires a single automation. If you need different outcomes, don't fork on the button — fork on the data after the click, inside that one automation's conditions."}],"quiz":null,"gate":[]},{"n":16,"kind":"body","eyebrow":"Buttons · the silent no-op","head":"A click can do nothing, and leave no log.","subhead":"","lines":[{"t":"lead","x":"Every automation has a conditions block. If a click doesn't meet those conditions, the automation no-ops silently — no action, no run in the log, no error. The user swears they clicked; nothing moved."},{"t":"callout","x":"Always read the conditions block first. When a button \"does nothing,\" the cause is almost always a precondition that wasn't met — not a broken button."}],"quiz":null,"gate":[]},{"n":17,"kind":"body","eyebrow":"Buttons · duplication corrupts them","head":"Don't duplicate an automation to reuse it.","subhead":"","lines":[{"t":"lead","x":"A duplicated automation can carry a corrupted card button that quietly blocks activation — it looks fine but won't turn on. If you hit that, turn OFF the \"Add buttons\" option to activate, then rewire the button cleanly. Better: edit the original in place instead of duplicating."}],"quiz":null,"gate":[]},{"n":18,"kind":"body","eyebrow":"Records · where they're born","head":"Every record is born at the first real stage.","subhead":"","lines":[{"t":"lead","x":"Records enter at the first stage — Not Started, or Planning — never dropped into the middle of the flow. So don't wire a fan-out to fork on which button was pressed. Let the record be born clean, then fork on the data it carries."}],"quiz":null,"gate":[]},{"n":19,"kind":"divider","eyebrow":"Part five","head":"Change it safely","subhead":"","lines":[{"t":"lead","x":"The moves that keep you out of trouble."}],"quiz":null,"gate":[]},{"n":20,"kind":"body","eyebrow":"The safe-change loop","head":"One record. Watch the log. Then scale.","subhead":"","lines":[{"t":"li","x":"Read the whole automation — scroll to \"Add action\" before you touch a step."},{"t":"li","x":"Test on one record — never on hundreds, never on live client work."},{"t":"li","x":"Watch the run log — confirm it fired, and did only what you expected."},{"t":"li","x":"Keep automations OFF during a migration — a mass import must not trip live fan-outs."},{"t":"li","x":"Re-enable at a known checkpoint — turn them back on together, at an agreed moment, not one at a time in the dark."},{"t":"callout","x":"Escalate anything structural to Hakim. Small, tested, reversible changes are yours. Reshaping the flow is a conversation first."}],"quiz":null,"gate":[]},{"n":21,"kind":"divider","eyebrow":"Part six","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Four calls. Get them graded."}],"quiz":null,"gate":[]},{"n":22,"kind":"body","eyebrow":"Question 1 · the button that does nothing","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"A teammate presses a button. Nothing moves. You check the run log — there's no entry at all .","q":"Correct. If a click doesn't meet the automation's conditions, it no-ops silently — no action, no run in the log, no error. Read the conditions block first; the button isn't broken.\" data-no=\" Not quite. The button isn't broken and there's no error to find. A click that fails the automation's conditions no-ops silently and leaves no log entry — so read the conditions block first.\"> A teammate presses a button. Nothing moves. You check the run log — there's no entry at all .","opts":[{"k":"A","t":"The button is broken and needs to be rebuilt from scratch","correct":false},{"k":"B","t":"The automation errored — the error is hidden somewhere in the log","correct":false},{"k":"C","t":"The click didn't meet the automation's conditions, so it no-opped silently","correct":true}]},"gate":[]},{"n":23,"kind":"body","eyebrow":"Question 2 · choosing a trigger","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You need an automation to run every time a certain field's value changes — including when it changes more than once.","q":"Correct. To react to a field changing, use 'when a record updates' watching that field. 'Matches conditions' is edge-triggered — it fires only on entry and ignores API writes.\" data-no=\" No. 'Matches conditions' is edge-triggered: it fires only when a record enters the state and ignores API writes. To react to a field changing, watch that field with 'when a record updates'.\"> You need an automation to run every time a certain field's value changes — including when it changes more than once.","opts":[{"k":"A","t":"\"Matches conditions\" — it watches the record for you","correct":false},{"k":"B","t":"\"When a record updates,\" watching that specific field","correct":true},{"k":"C","t":"A scheduled scan that re-reads every record each hour","correct":false}]},"gate":[]},{"n":24,"kind":"body","eyebrow":"Question 3 · keeping a fan-out idempotent","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"Your fan-out spawns linked records. You need it safe to run twice without creating duplicates.","q":"Correct. Derive 'already done' from a link count or a helper flag — something true right now — and guard each create step to run only when the slot is empty. A rollup can lag and let a re-run duplicate.\" data-no=\" Not safe. A rollup can lag behind the write that feeds it, so a re-run can fire before it updates and create duplicates. Guard on a link count or a helper flag, and only create when the slot is empty.\"> Your fan-out spawns linked records. You need it safe to run twice without creating duplicates.","opts":[{"k":"A","t":"Create only when the link is empty, keying off a link count or helper flag","correct":true},{"k":"B","t":"Trust a rollup field to tell you the children already exist","correct":false},{"k":"C","t":"Assume the trigger only ever fires once and skip the guard","correct":false}]},"gate":[]},{"n":25,"kind":"body","eyebrow":"Question 4 · before you change an automation","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You're about to edit a live automation. The summary caption says it has two steps.","q":"Correct. The summary caption undercounts the steps. Scroll the action panel all the way to 'Add action' so you've seen every step before you judge — or edit — what it does.\" data-no=\" Not enough. The summary caption undercounts the steps, so reading it isn't the same as understanding the automation. Scroll the action panel to the very bottom, to 'Add action', before you change anything.\"> You're about to edit a live automation. The summary caption says it has two steps.","opts":[{"k":"A","t":"Trust the caption — two steps is two steps","correct":false},{"k":"B","t":"Scroll the action panel to the bottom (\"Add action\") and read every step","correct":true},{"k":"C","t":"Duplicate it first so you have a spare copy to edit","correct":false}]},"gate":[]},{"n":26,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all six?","subhead":"","lines":[],"quiz":null,"gate":["Can you trace a fan-out from its trigger to the last record it creates?","Do you read the whole automation — scrolling to \"Add action\" — before judging it?","Do you guard every fan-out with a link count or flag, so a re-run never duplicates?","Do you pick the trigger by whether you need on-entry or on-change?","Do you read a button's conditions before calling it broken?","Do you test on one record and watch the log before you scale?"]},{"n":27,"kind":"close","eyebrow":"","head":"Read it, guard it, prove it fires.","subhead":"","lines":[{"t":"lead","x":"You can trace any fan-out, change it without breaking idempotency, and never ship a silent no-op. Understand before you change — every time."}],"quiz":null,"gate":[]}]},{"id":"tech_n8n","bucket":"Operations & Tech","title":"n8n & integrations","href":"n8n-integrations-training.html","step":"Specialisation","count":23,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · role certification","head":"n8n & integrations","subhead":"","lines":[{"t":"lead","x":"The always-on layer that runs the business while nobody is watching."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"Your mission","head":"Keep the always-on layer running, and safe to change.","subhead":"","lines":[{"t":"lead","x":"n8n is where the scheduled briefs, the data syncs and the alerts live. They run on their own timetable, on their own connection. Your job is to keep them running, and to change them without breaking what already works."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"The briefs, syncs and alerts run on their own — no laptop, no operator online, no missed morning"},{"t":"win","x":"History is preserved — every sync appends a dated row, trends never lost"},{"t":"win","x":"Secrets are safe — stored as credentials, rotated the moment they leak"},{"t":"win","x":"Nothing fails silently — you watch execution history and catch red before Hakim does"},{"t":"p","x":"This is the bar. Everything that follows is how you hold it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one","head":"n8n versus Lark","subhead":"","lines":[{"t":"lead","x":"Two automation layers. Know which does what."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Two layers, two jobs","head":"","subhead":"","lines":[{"t":"li","x":"Fire when a record changes"},{"t":"li","x":"Move stages, notify a channel, stamp a field"},{"t":"li","x":"Live and die inside one base"},{"t":"li","x":"Runs 24/7 on its own timetable"},{"t":"li","x":"Reaches across systems — Lark, Supabase, Metabase and more"},{"t":"li","x":"Has its own Lark token, so it never needs a person signed in"},{"t":"callout","x":"The line: native Lark automations react inside the base . n8n reaches across systems and runs on a schedule . When work must happen at a set time, or must touch more than one system, it belongs in n8n."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"What lives in n8n","head":"Three things run here, on a clock.","subhead":"","lines":[{"t":"p","x":"Because n8n runs on its own connection, none of these depend on a person being online."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"The daily briefs","head":"Built and sent from n8n, not from a laptop.","subhead":"","lines":[{"t":"lead","x":"Two briefs go out every morning: a Chief Executive Officer brief and a manager brief . Both are assembled and delivered inside n8n — so they land whether or not anyone is at their desk. There is no operator pressing send."},{"t":"callout","x":"Why it matters: a brief that depends on someone being online is a brief that gets missed. Move it to the always-on layer and the morning takes care of itself."}],"quiz":null,"gate":[]},{"n":8,"kind":"divider","eyebrow":"Part two","head":"The feedback loop","subhead":"","lines":[{"t":"lead","x":"Where performance data goes, and how it stays honest."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Where the numbers live","head":"Data to Supabase. Dashboards in Metabase. Not Lark.","subhead":"","lines":[{"t":"lead","x":"Content performance flows into Supabase , the database. The dashboards are built in Metabase — never in Lark. When someone asks for a chart, that is where it is built."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"How a video meets its numbers","head":"The post URL is the join key.","subhead":"","lines":[{"t":"lead","x":"Performance data doesn't know which video it belongs to on its own. The post-URL fields are what connect a video record to its performance — they are the join keys that tie the two sides together. Keep them clean, and the loop closes automatically."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"The rule that protects history","head":"Append dated rows. Never overwrite.","subhead":"","lines":[{"t":"lead","x":"When you sync followers or metrics, add a new dated row each time. Overwrite the current value and you lose the trend — there is no way to draw a line you never recorded. History only exists if you keep every reading."},{"t":"callout","x":"Watch out: the live followers sync replaces the current number and keeps no history. Never build a trend off the live value — append instead, or the chart has nothing to plot."}],"quiz":null,"gate":[]},{"n":12,"kind":"divider","eyebrow":"Part three","head":"Integration hygiene","subhead":"","lines":[{"t":"lead","x":"Secrets, and watching for silent failure."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"Credentials · handle with care","head":"Store secrets as credentials. Never inline.","subhead":"","lines":[{"t":"li","x":"Store every key as a credential or secret — never hard-code it inline in a node or a workflow."},{"t":"li","x":"An inline API key is a live risk — anyone who can open the workflow can read it."},{"t":"li","x":"Rotate any secret that has been exposed — the moment a key leaks, replace it. A rotated key is worthless to whoever saw the old one."},{"t":"callout","x":"Real risk: hard-coded secrets have been found inline in these workflows. If you spot one, move it to a credential and rotate it — do not leave it sitting in plain text."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Watch the runs","head":"A silent failure is worse than a loud one.","subhead":"","lines":[{"t":"lead","x":"Watch the execution history . A workflow that errors loudly tells you it broke. A workflow that fails silently — a brief that never sent, a sync that skipped a day — costs you far more, because nobody knows until the damage is done. Check the runs before you trust them."}],"quiz":null,"gate":[]},{"n":15,"kind":"divider","eyebrow":"Part four","head":"Changing things safely","subhead":"","lines":[{"t":"lead","x":"Three moves that keep you out of trouble."}],"quiz":null,"gate":[]},{"n":16,"kind":"body","eyebrow":"Safe change · the sequence","head":"Duplicate. Test one. Confirm downstream.","subhead":"","lines":[{"t":"li","x":"Duplicate before you edit — keep the working version intact so you can fall back."},{"t":"li","x":"Test with a single execution — one run, watched end to end, before it goes on the clock."},{"t":"li","x":"Confirm the downstream system received it — check Lark, Supabase or the channel actually got what you expected. A green run is not proof the other side arrived."}],"quiz":null,"gate":[]},{"n":17,"kind":"divider","eyebrow":"Part five","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Four calls. Get them graded."}],"quiz":null,"gate":[]},{"n":18,"kind":"body","eyebrow":"Question 1 · where dashboards live","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"Someone on the team asks you to build a dashboard of content performance.","q":"Correct. Dashboards are built in Metabase. Performance data flows into Supabase, the database, and Metabase reads from it. Lark is not where charts live.\" data-no=\" Not Lark. Content performance flows into Supabase, and the dashboards are built in Metabase. Lark runs the pipeline, but it is never where a chart is built.\"> Someone on the team asks you to build a dashboard of content performance.","opts":[{"k":"A","t":"In Lark — the same base the pipeline runs in","correct":false},{"k":"B","t":"In Metabase — reading from Supabase, the database","correct":true},{"k":"C","t":"In n8n — the layer that runs the syncs","correct":false}]},"gate":[]},{"n":19,"kind":"body","eyebrow":"Question 2 · syncing follower counts","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"You're wiring a sync that pulls the latest follower count for each page every day.","q":"Correct. Append a new dated row each time. Overwriting the current value destroys the trend — a chart can only plot readings you actually kept.\" data-no=\" No — that loses history. Overwrite the current number and the trend is gone for good. Append a dated row on every sync so the history survives.\"> You're wiring a sync that pulls the latest follower count for each page every day.","opts":[{"k":"A","t":"Append a new dated row — so the history is preserved","correct":true},{"k":"B","t":"Overwrite the current value — only today's number matters","correct":false},{"k":"C","t":"Overwrite, but keep a weekly backup instead","correct":false}]},"gate":[]},{"n":20,"kind":"body","eyebrow":"Question 3 · a key in plain text","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"You open a workflow and find an API key hard-coded inline in one of the nodes.","q":"Correct. Move it into a credential and rotate the exposed key. Anyone who opened the workflow could have read it, so the old key can no longer be trusted.\" data-no=\" Not enough. An inline key is a live risk — anyone with the workflow can read it. Move it to a credential AND rotate it, because the exposed key can no longer be trusted.\"> You open a workflow and find an API key hard-coded inline in one of the nodes.","opts":[{"k":"A","t":"Leave it — it's working, and changing it might break the run","correct":false},{"k":"B","t":"Move it into a credential, but keep the same key","correct":false},{"k":"C","t":"Move it into a credential and rotate the exposed key","correct":true}]},"gate":[]},{"n":21,"kind":"body","eyebrow":"Question 4 · changing a live workflow","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You need to change the brief that goes out every morning to hundreds of people.","q":"Correct. Duplicate first, test with a single execution, then confirm the downstream system actually received what you expected.
