ristic, simple Canva animation."}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"Sound · raw audio, effects, assets","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":16,"kind":"body","eyebrow":"Endings & brand marks","head":"","subhead":"","lines":[{"t":"li","x":"Use the CTA video from the CapCut space matched to the page (SG, MY, Event, Project, Business, ID)"},{"t":"li","x":"Tentative for events or other needs"},{"t":"li","x":"Apply at the end of the video"},{"t":"li","x":"Use the fixed watermark provided in the CapCut space"},{"t":"li","x":"Apply from the first second to the end"},{"t":"li","x":"Fixed position — strictly no adjustments"}],"quiz":null,"gate":[]},{"n":17,"kind":"divider","eyebrow":"Part four","head":"The workflow","subhead":"","lines":[{"t":"lead","x":"How the work moves, and the standard at each stage."}],"quiz":null,"gate":[]},{"n":18,"kind":"body","eyebrow":"Your edit kit","head":"The gear you cut on.","subhead":"","lines":[{"t":"lead","x":"You edit anywhere, so your kit travels. It's the same standard the producers shoot on — so the footage lands clean and you cut without excuses."},{"t":"win","x":"Laptop — edit anywhere — CapCut, your projects, the full cut on the move"},{"t":"win","x":"External SSD / storage — offload and back up every raw file — never work off a full drive"},{"t":"win","x":"iPhone — the camera the footage is shot on — know the source you're cutting"},{"t":"win","x":"External microphone — the clean audio captured on set — protect it, raw volume to max"}],"quiz":null,"gate":[]},{"n":19,"kind":"body","eyebrow":"Editing workflow · the stage order","head":"Rough cut to render, in order.","subhead":"","lines":[{"t":"li","x":"Rough cut — fast-paced, well-structured story, strong hook, easy to follow."},{"t":"li","x":"Subtitle — no typos, clear colours, synced timing, inside the safe area."},{"t":"li","x":"Recheck 1 — typos, subtitle timing, audio, watermark, CTA, frames, motion, transitions, exports."},{"t":"li","x":"Motion — smooth, on-brand, supports the story, never distracting."},{"t":"li","x":"SFX — supports emotion, balanced, timed to the pacing."},{"t":"li","x":"Render draft 1 → Quality Check (AI Amender Bot) → Render final."},{"t":"callout","x":"Quality Check: upload to the AI Amender Bot, review the recommendations, apply only the relevant revisions — before it goes to Frame.io."}],"quiz":null,"gate":[]},{"n":20,"kind":"body","eyebrow":"Render & export · exact settings","head":"Export it right or don't export it.","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":21,"kind":"body","eyebrow":"Editing SLA · turnaround by footage length","head":"Longer raw, longer clock.","subhead":"","lines":[{"t":"callout","x":"Notes: SLA covers the standard workflow. Complex motion or heavy revisions may need more time. Urgent projects follow the priority system. Amendment time is excluded from the initial editing SLA."}],"quiz":null,"gate":[]},{"n":22,"kind":"body","eyebrow":"Delivery · upload & amendments","head":"","subhead":"","lines":[{"t":"li","x":"Upload final to Frame.io in the correct folder: Country → Year → Pages → Month → Paid/Unpaid"},{"t":"li","x":"Copy & submit the Frame.io link into the Lark form"},{"t":"li","x":"Inform the respective Producer for review"},{"t":"li","x":"Check for incoming amendments every morning , prioritise them before new projects"},{"t":"li","x":"Upload revisions to \"To Review\" named V1, V2, V3…"},{"t":"li","x":"Move previous versions to \"Previous Draft\" , inform the Producer, repeat until finalised"}],"quiz":null,"gate":[]},{"n":23,"kind":"body","eyebrow":"Hard no · things editors are not allowed to do","head":"Do any of these and it's on you.","subhead":"","lines":[{"t":"li","x":"Missing deadlines without notice, or ignoring amendments and feedback"},{"t":"li","x":"Uploading videos without a Quality Check, or leaving typo, audio or subtitle mistakes"},{"t":"li","x":"Using incorrect export settings, or poor file organisation and naming"},{"t":"li","x":"Ignoring or changing brand guidelines without approval"},{"t":"li","x":"Sharing confidential files or footage — or a face reveal"}],"quiz":null,"gate":[]},{"n":24,"kind":"divider","eyebrow":"Part five","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Four calls. Get them graded."}],"quiz":null,"gate":[]},{"n":25,"kind":"body","eyebrow":"Question 1 · the colour code","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You're subtitling a guest answering a question in a Business video.","q":"Correct. The interviewee — the guest answering — is subtitled in yellow #ffcb00. White is the interviewer, green is positive/additional, red is a negative statement.\" data-no=\" Not that one. The interviewee's subtitle is yellow #ffcb00. White = interviewer, green #00ff18 = positive/additional, red #ec1d1d = negative statement.\"> You're subtitling a guest answering a question in a Business video.","opts":[{"k":"A","t":"White #ffffff","correct":false},{"k":"B","t":"Yellow #ffcb00","correct":true},{"k":"C","t":"Green #00ff18","correct":false}]},"gate":[]},{"n":26,"kind":"body","eyebrow":"Question 2 · the role label","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"Under the interviewee's name you're adding their role, e.g. \"founder of Tomaz Shoes\".","q":"Correct. The role / title under a person's name uses Times New Roman, italic, white. Helvetica is primary text; Inter Black is for prices and hero names.\" data-no=\" No. The role label is Times New Roman, italic, white — it's the one reserved use for that font. Helvetica is the primary font; Inter Black is for prices and big hero names.\"> Under the interviewee's name you're adding their role, e.g. \"founder of Tomaz Shoes\".","opts":[{"k":"A","t":"Helvetica","correct":false},{"k":"B","t":"Inter Black","correct":false},{"k":"C","t":"Times New Roman, italic","correct":true}]},"gate":[]},{"n":27,"kind":"body","eyebrow":"Question 3 · a price title","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"A Homes video reveals the property price on screen.","q":"Correct. Prices are green #00ff18 in Inter Black (with glow). Green signals the money / positive highlight; Inter Black gives it the bold weight.\" data-no=\" Not quite. A price uses green #00ff18 in Inter Black, with glow — green is the positive/money colour and Inter Black is the bold hero font.\"> A Homes video reveals the property price on screen.","opts":[{"k":"A","t":"Green #00ff18 · Inter Black","correct":true},{"k":"B","t":"White #ffffff · Helvetica","correct":false},{"k":"C","t":"Yellow #ffcb00 · Times New Roman","correct":false}]},"gate":[]},{"n":28,"kind":"body","eyebrow":"Question 4 · export & delivery","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"Your edit passed Quality Check and you're rendering the final file.","q":"Correct. Export 1080P, H.264, MP4, 30 FPS, higher bitrate — and the video name must match the name in Lark. You also export the .srt and upload it to Frame.io for the SMM.\" data-no=\" No. The final export is 1080P, H.264, MP4, 30 FPS, and the file name must match the name in Lark exactly — plus export the .srt to Frame.io.\"> Your edit passed Quality Check and you're rendering the final file.","opts":[{"k":"A","t":"720P, any name, MP4 — speed matters most","correct":false},{"k":"B","t":"1080P, H.264, MP4, 30 FPS, name matches Lark, export .srt too","correct":true},{"k":"C","t":"4K, H.265, MOV, 60 FPS","correct":false}]},"gate":[]},{"n":29,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you edit to the Koocester SOP?","subhead":"","lines":[],"quiz":null,"gate":["Do you know the caption colour code — white, yellow, green, red — by heart?","Can you set subtitles to the exact size, spacing and shadow specs?","Do you know the title SOP for each vertical — fonts, colours, positions, glow?","Will you always add the fixed watermark and the page-matched CTA?","Do you Quality Check, then export with the correct settings and Lark-matched name?","Will you hit the SLA, and never do a hard-no (no face reveal, no skipped QC)?"]},{"n":30,"kind":"close","eyebrow":"","head":"On-brand. Precise. Emotional.","subhead":"","lines":[{"t":"lead","x":"Every cut carries the Koocester name. Follow the SOP to the number, tell the story with feeling, ship it clean and on time."}],"quiz":null,"gate":[]}]},{"id":"ve_pacing","bucket":"Marketing & Content","title":"Editing fundamentals — pacing & rhythm","href":"editing-fundamentals-training.html","step":"Specialisation","count":22,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · craft certification","head":"Editing fundamentals — pacing & rhythm","subhead":"","lines":[{"t":"lead","x":"Not the brand look — the craft of the cut . How you hook, hold and move a viewer through time so they feel something and never swipe."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"Your edits hook in 3 seconds — the strongest moment opens, no slow intro"},{"t":"win","x":"They hold to the end — nothing sags, every second earns the next"},{"t":"win","x":"You cut with rhythm — the pace moves with the energy and the track"},{"t":"win","x":"They make people feel something — the edit lands emotionally, not just cleanly"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"The real job","head":"Editing is controlling attention through time.","subhead":"","lines":[{"t":"lead","x":"You are not trimming clips. You decide what the viewer sees, when they see it, and how they feel about it — second by second. Every cut is a choice about their attention and their emotion. That is the whole craft."}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one","head":"The hook","subhead":"","lines":[{"t":"lead","x":"The first 3 seconds decide everything."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"The first 3 seconds decide if they stay","head":"Open on the strongest moment. Always.","subhead":"","lines":[{"t":"lead","x":"A viewer decides in three seconds. So never open with a slow intro, a logo, or \"hi guys\". Start on the best moment you have — the punchline, the reveal, the reaction — then earn the rest."},{"t":"callout","x":"The test: if the first frame doesn't stop a thumb, nothing after it matters. Front-load your strongest second."}],"quiz":null,"gate":[]},{"n":6,"kind":"divider","eyebrow":"Part two","head":"Pacing","subhead":"","lines":[{"t":"lead","x":"Cut with the energy. Fast where it's hot, slow where it's deep."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Pacing · match the cut to the energy","head":"Fast when it's hot. Breathe when it's deep.","subhead":"","lines":[{"t":"lead","x":"Speed up through high-energy moments — quick cuts drive momentum. Then slow down and hold on the emotional beats: a pause, a look, a line landing. Pacing is contrast. All-fast is exhausting; all-slow is dead."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"When to cut · every cut earns its place","head":"","subhead":"","lines":[{"t":"li","x":"On the action — cut on a movement, it hides the join"},{"t":"li","x":"The moment a beat is finished — don't linger"},{"t":"li","x":"When a new cut adds information or energy"},{"t":"li","x":"To jump the viewer forward, past the boring bit"},{"t":"li","x":"Dead air — silence, \"umms\", the wind-up before the point"},{"t":"li","x":"Repeats — the same idea said twice"},{"t":"li","x":"Anything that doesn't move the story or the feeling"},{"t":"li","x":"A cut just to cut — every cut must earn its place"},{"t":"callout","x":"The rule: if a second isn't earning its place, it's costing you the viewer. When in doubt, cut it."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Rhythm & music · cut to the track","head":"The track sets the cadence .","subhead":"","lines":[{"t":"lead","x":"Cut on the beat. Line your edits up to the rhythm of the music — the drop, the downbeat, the change — and the video feels intentional instead of random. Use sound to drive energy: a rising track lifts a montage, a beat under a reveal makes it hit harder."},{"t":"callout","x":"Feel the beats per minute (BPM). A fast track wants fast cuts; a slow one wants space. Fighting the music is the fastest way to make an edit feel off."}],"quiz":null,"gate":[]},{"n":10,"kind":"divider","eyebrow":"Part three","head":"Holding them","subhead":"","lines":[{"t":"lead","x":"Retention, variety, and the feeling that makes it land."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Retention · tighten relentlessly","head":"Remove anything that makes them swipe .","subhead":"","lines":[{"t":"lead","x":"Every video has swipe points — the moment attention dips and a thumb moves. Your job is to find and kill them: the slow bit, the repeat, the pause with nothing in it. Watch your own edit as a stranger would and cut ruthlessly until nothing sags."},{"t":"callout","x":"Tighten twice. Your first cut is always too long. Pass through again and pull out another 10% — it almost always plays better."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"B-roll & variety · show, don't tell","head":"Cover the words with the thing.","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"Emotion · the edit should make people feel","head":"A clean cut is nothing if it doesn't feel .","subhead":"","lines":[{"t":"lead","x":"This is the Koocester difference. The edit is not there to be tidy — it's there to make someone feel something: awe, curiosity, warmth, the ka-ching of a win. Hold the reaction shot a beat longer. Let the music swell. Build the moment, then land it."},{"t":"callout","x":"Ties to storytelling. Pacing, music and the held beat are your tools for emotion. The story is the what ; your cut is the how it feels ."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"The ending · land the call to action","head":"Carry the energy into the ask.","subhead":"","lines":[{"t":"lead","x":"Don't let the video die before the call to action (CTA). Hold the momentum right to the end, then land the ask cleanly — the comment keyword, the follow, the offer — while the viewer is still feeling it. A strong edit that fumbles the last three seconds leaks the lead you just earned."},{"t":"callout","x":"End on a high, not a fade. The CTA lands best on the emotional peak, not after the energy has already drained away."}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"The difference that matters","head":"Technically correct is not the same as holding.","subhead":"","lines":[{"t":"callout","x":"Anyone can make a correct edit. Your job is the one that holds — hooks in 3 seconds, moves with rhythm, and lands with emotion."}],"quiz":null,"gate":[]},{"n":16,"kind":"divider","eyebrow":"Part four","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Four calls. Get them graded."}],"quiz":null,"gate":[]},{"n":17,"kind":"body","eyebrow":"Question 1 · the first 3 seconds","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You've got great footage but your edit opens with a 4-second logo and a slow establishing shot.","q":"Correct. Open on the strongest moment. The first 3 seconds decide if they stay, so front-load your best second — the reveal, the reaction, the punchline — never a slow intro.\" data-no=\" Not that. The first 3 seconds decide if they stay. Open on the strongest moment you have, not a logo, a greeting, or a slow build. Front-load your best second.\"> You've got great footage but your edit opens with a 4-second logo and a slow establishing shot.","opts":[{"k":"A","t":"Keep the intro — viewers need context first","correct":false},{"k":"B","t":"Open on the strongest moment, cut the slow intro","correct":true},{"k":"C","t":"Add music over the logo so it feels faster","correct":false}]},"gate":[]},{"n":18,"kind":"body","eyebrow":"Question 2 · dead air","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"Mid-video, the guest pauses for two seconds — no words, no reaction, nothing happening.","q":"Correct. Cut it. A dead pause with nothing in it is a swipe point — silence, an 'umm', a wind-up before the point all bleed retention. Tighten relentlessly.\" data-no=\" No. A dead pause is a swipe point — cut it out. Dead air, repeats and wind-ups all cost you the viewer. Every second must earn its place.\"> Mid-video, the guest pauses for two seconds — no words, no reaction, nothing happening.","opts":[{"k":"A","t":"Leave it — real pauses feel authentic","correct":false},{"k":"B","t":"Slow it down so it feels intentional","correct":false},{"k":"C","t":"Cut it — dead air makes viewers swipe","correct":true}]},"gate":[]},{"n":19,"kind":"body","eyebrow":"Question 3 · an emotional beat","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"The guest says something moving and the room goes quiet — it's the emotional peak of the video.","q":"Correct. Let it breathe. On an emotional beat you slow down and hold — the pause, the look, the line landing. Pacing is contrast: fast where it's hot, space where it's deep.\" data-no=\" Not quite. An emotional beat wants space, not speed. Slow down and hold it — let the moment land. Fast cuts are for high-energy moments, not the deep ones.\"> The guest says something moving and the room goes quiet — it's the emotional peak of the video.","opts":[{"k":"A","t":"Let it breathe — hold the shot, slow the pace","correct":true},{"k":"B","t":"Cut fast through it to keep the energy up","correct":false},{"k":"C","t":"Skip it — emotional bits slow the video down","correct":false}]},"gate":[]},{"n":20,"kind":"body","eyebrow":"Question 4 · rhythm & music","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You're cutting a fast montage over an upbeat track with a clear beat.","q":"Correct. Cut on the beat. Lining edits up to the track's rhythm — the drop, the downbeat, the change — makes the video feel intentional and drives its energy.\" data-no=\" No. Cut to the track's rhythm. Editing on the beat makes the video feel deliberate and lifts its energy; ignoring the music makes even clean cuts feel off.\"> You're cutting a fast montage over an upbeat track with a clear beat.","opts":[{"k":"A","t":"Ignore the music — cut whenever the footage changes","correct":false},{"k":"B","t":"Cut on the beat, in rhythm with the track","correct":true},{"k":"C","t":"Cut at random so it feels natural","correct":false}]},"gate":[]},{"n":21,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you cut for attention, rhythm and emotion?","subhead":"","lines":[],"quiz":null,"gate":["Do you open every edit on the strongest moment, in the first 3 seconds?","Do you pace with the energy — fast where it's hot, breathing where it's deep?","Does every cut earn its place, and is all dead air gone?","Do you cut to the track's rhythm and use sound to drive energy?","Do you tighten relentlessly so nothing makes a viewer swipe?","Does the edit make people feel something, and land the CTA on a high?"]},{"n":22,"kind":"close","eyebrow":"","head":"Hook. Hold. Make them feel.","subhead":"","lines":[{"t":"lead","x":"The cut is where a good story becomes an unmissable one. Open on the strongest moment, move with rhythm, kill every swipe point, and land it with emotion. That's the difference between correct and unforgettable."}],"quiz":null,"gate":[]}]},{"id":"ve_capcut","bucket":"Marketing & Content","title":"CapCut proficiency","href":"capcut-training.html","step":"Specialisation","count":27,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · tool certification","head":"CapCut — fast and clean","subhead":"","lines":[{"t":"lead","x":"CapCut is the editing tool the team uses. This is how a Koocester editor sets up, cuts, captions and exports — quickly, and exactly to the editing Standard Operating Procedure (SOP)."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"You set up, cut, caption and export in CapCut — the whole pipeline, without hunting for a button"},{"t":"win","x":"Every project is 1080P vertical, 30 frames per second — matched to the Koocester export SOP from the start"},{"t":"win","x":"Captions follow the colour code and subtitle specs — white, yellow, green, red — size and shadow to the number"},{"t":"win","x":"The export matches the SOP, every time — 1080P, H.264, MP4, 30 fps, name matches Lark, .srt exported"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"The tool mindset","head":"Know CapCut so well the tool disappears .","subhead":"","lines":[{"t":"lead","x":"The story is the job — CapCut is just the hands. When you know the moves cold, you stop fighting the interface and spend your time on the cut, the pacing and the feeling. Fast and clean, never one at the cost of the other."}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one","head":"Set up the project","subhead":"","lines":[{"t":"lead","x":"Get the canvas and the interface right before you cut a frame."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"New project · match the export SOP up front","head":"1080P vertical, 30 frames per second.","subhead":"","lines":[{"t":"callout","x":"Set the canvas and frame rate first. If the project matches the export SOP from the start, nothing gets rescaled or re-timed at the end — the export just works."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"The interface · three zones you live in","head":"Preview, timeline, tracks.","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":7,"kind":"divider","eyebrow":"Part two","head":"The core moves","subhead":"","lines":[{"t":"lead","x":"Cut, speed, motion — the muscle memory of a fast edit."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Building the rough cut · four moves","head":"Cut, trim, split, ripple-delete.","subhead":"","lines":[{"t":"callout","x":"Ripple-delete is the workhorse. Split at the dead moment, ripple-delete it, and the timeline tightens itself. Cut after every phrase, keep the pace fast, kill every pause."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Speed · control the energy","head":"Speed ramps move the emotion , not just the clip.","subhead":"","lines":[{"t":"lead","x":"Slow a moment down to let it land, or ramp up to drive energy through a montage. Use CapCut's curve speed to ramp smoothly in and out rather than a hard jump — and always keep the story readable. Fast for pace, slow for feeling, never speed for its own sake."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Keyframes · motion done right","head":"Two keyframes = one clean move.","subhead":"","lines":[{"t":"li","x":"Set the start — put the playhead where the move begins, add a keyframe on position, scale or opacity."},{"t":"li","x":"Set the end — move the playhead forward, change the value; CapCut fills the motion between."},{"t":"li","x":"Ease it — smooth the in and out so the move feels premium, never robotic."},{"t":"callout","x":"Keyframes drive every title and b-roll move — slide-ups, the money \"ka-ching\" reveal, subtle push-ins. On-brand motion supports the story and never distracts."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Transitions · less is more","head":"A hard cut is a transition. Use it most of the time.","subhead":"","lines":[{"t":"lead","x":"Reach for a transition only when it earns its place — a clean whoosh into a reveal, a match cut that carries the story. Skip the flashy library effects. Sound effects and motion carry the energy; the cut carries the story."}],"quiz":null,"gate":[]},{"n":12,"kind":"divider","eyebrow":"Part three","head":"Text & captions","subhead":"","lines":[{"t":"lead","x":"Auto-caption, correct, colour-code — then set the exact specs."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"Captions · let CapCut do the first pass","head":"Auto-caption, then correct — always.","subhead":"","lines":[{"t":"li","x":"Run auto-captions — CapCut transcribes the whole track in seconds. This is your draft, never your final."},{"t":"li","x":"Correct every line — fix typos, punctuation, names and mis-hears; auto-captions are wrong on brand names and numbers."},{"t":"li","x":"Sync the timing — cut after every phrase so each line matches the voice, then colour-code by speaker."},{"t":"callout","x":"Never ship raw auto-captions. The subtitle checklist: no typos, proper punctuation, easy to read, clear colours, timing synced, on-brand, inside the safe area."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"The caption colour code · learn it cold","head":"Colour tells the viewer who's speaking.","subhead":"","lines":[{"t":"p","x":"These are the subtitle colours you apply as content — not the deck's colours. Red Green Blue (RGB) hex values:"}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"Subtitle details · set them exactly in CapCut","head":"Same numbers, every time.","subhead":"","lines":[{"t":"callout","x":"Tip: set one subtitle to spec, then copy its style onto the rest so every line matches without re-typing the numbers."}],"quiz":null,"gate":[]},{"n":16,"kind":"divider","eyebrow":"Part four","head":"Audio","subhead":"","lines":[{"t":"lead","x":"Raw voice, sound effects, music, ducking."}],"quiz":null,"gate":[]},{"n":17,"kind":"body","eyebrow":"Sound · clean voice first, everything else supports it","head":"","subhead":"","lines":[{"t":"callout","x":"The rule: if you can't hear every word clearly, the mix is wrong. Voice on top, music ducked underneath, effects punctuating the cut."}],"quiz":null,"gate":[]},{"n":18,"kind":"divider","eyebrow":"Part five","head":"Fast & clean","subhead":"","lines":[{"t":"lead","x":"Shortcuts, the export SOP, and a tidy project."}],"quiz":null,"gate":[]},{"n":19,"kind":"body","eyebrow":"Speed · edit with the keyboard, not the mouse","head":"Shortcuts are where the speed lives.","subhead":"","lines":[{"t":"callout","x":"The clean workflow: rough cut first (split + ripple-delete), then subtitles, then motion, then sound effects — one pass per layer, never jumping around."}],"quiz":null,"gate":[]},{"n":20,"kind":"body","eyebrow":"Export · exact settings, matched to the SOP","head":"Export it right or don't export it.","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":21,"kind":"body","eyebrow":"Tidy projects · tick each as you build the habit","head":"A clean project is a fast project.","subhead":"","lines":[{"t":"callout","x":"Tidy is speed. When the project is organised, the next edit — and the next editor — starts fast instead of untangling your timeline."}],"quiz":null,"gate":[]},{"n":22,"kind":"divider","eyebrow":"Part six","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Three calls. Get them graded."}],"quiz":null,"gate":[]},{"n":23,"kind":"body","eyebrow":"Question 1 · export frame rate","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"Your edit passed Quality Check and you're rendering the final file in CapCut.","q":"Correct. The SOP export is 30 frames per second — and you set the project to 30 fps at the start so nothing gets re-timed. Full export: 1080P, H.264, MP4, 30 fps, name matches Lark, plus the .srt.\" data-no=\" No. The Koocester export SOP is 30 frames per second (fps) — set on the project up front and again on export. Full export: 1080P, H.264, MP4, 30 fps, Lark-matched name, .srt exported.\"> Your edit passed Quality Check and you're rendering the final file in CapCut.","opts":[{"k":"A","t":"24 frames per second","correct":false},{"k":"B","t":"30 frames per second","correct":true},{"k":"C","t":"60 frames per second","correct":false}]},"gate":[]},{"n":24,"kind":"body","eyebrow":"Question 2 · the colour code","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You've auto-captioned a clip and you're colour-coding a guest answering a question.","q":"Correct. The interviewee — the guest answering — is subtitled in yellow #ffcb00. White is the interviewer, green #00ff18 is positive/additional, red #ec1d1d is a negative statement.\" data-no=\" Not that one. The interviewee's subtitle is yellow #ffcb00. White = interviewer, green #00ff18 = positive/additional, red #ec1d1d = negative statement.\"> You've auto-captioned a clip and you're colour-coding a guest answering a question.","opts":[{"k":"A","t":"White #ffffff","correct":false},{"k":"B","t":"Yellow #ffcb00","correct":true},{"k":"C","t":"Green #00ff18","correct":false}]},"gate":[]},{"n":25,"kind":"body","eyebrow":"Question 3 · project set-up","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"You open CapCut to start a new Koocester edit.","q":"Correct. A new project is 1080P, 9:16 vertical (1080 × 1920) at 30 fps — set to match the export SOP before you cut a frame, so nothing gets rescaled at the end.\" data-no=\" No. The project is 1080P, 9:16 vertical (1080 × 1920) at 30 frames per second — matched to the export SOP up front. Not landscape, not 720P.\"> You open CapCut to start a new Koocester edit.","opts":[{"k":"A","t":"720P, 16:9 landscape","correct":false},{"k":"B","t":"4K, 1:1 square","correct":false},{"k":"C","t":"1080P, 9:16 vertical, 30 fps","correct":true}]},"gate":[]},{"n":26,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you edit to the Koocester SOP in CapCut, fast and clean?","subhead":"","lines":[],"quiz":null,"gate":["Do you start every project at 1080P vertical, 30 frames per second?","Can you cut fast — split, trim, ripple-delete — with keyboard shortcuts?","Do you auto-caption, then correct, and colour-code by speaker?","Can you set subtitles to the exact size, spacing and shadow specs?","Is your voice clean and on top, with music ducked underneath?","Do you export 1080P, H.264, MP4, 30 fps, Lark-matched name, and the .srt?"]},{"n":27,"kind":"close","eyebrow":"","head":"Set up. Cut. Caption. Export.","subhead":"","lines":[{"t":"lead","x":"CapCut is the hands; the SOP is the standard. Set the canvas right, cut with the keyboard, caption to the colour code, mix the voice clean, and export to spec — fast, and exactly to the number."}],"quiz":null,"gate":[]}]},{"id":"network","bucket":"Marketing & Content","title":"Sourcing & networking","href":"sourcing-networking-training.html","step":"Producer · specialisation","count":23,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · Producer","head":"Sourcing & networking","subhead":"","lines":[{"t":"lead","x":"Finding credible people worth featuring, building a real relationship, and locking the shoot. Networking is the skill underneath all of it."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"How to win","head":"A qualified, credible candidate, confirmed in writing, shoot date locked.","subhead":"","lines":[{"t":"lead","x":"Qualified means they pass all five questions in the qualification screen, even one \"No\" kills it. And underneath the booking sits the real win: a genuine relationship with someone worth knowing."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"Credible people found — real, verifiable, and worth featuring"},{"t":"win","x":"A real relationship built — not just a booking, someone glad they met you"},{"t":"win","x":"All 5 gates pass — even one \"No\" and the candidate is out"},{"t":"win","x":"Shoot locked in writing — the date confirmed, never just a verbal yes"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"Why it matters","head":"Sourcing is the biggest driver of credibility, growth, and virality .","subhead":"","lines":[{"t":"lead","x":"A great candidate carries average production. A weak candidate sinks great production. We never ship a video without a qualified source, so the person you find matters more than anything you shoot."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Three rules that never bend","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":6,"kind":"divider","eyebrow":"Part one","head":"Networking","subhead":"","lines":[{"t":"lead","x":"The relationship, before the ask."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"What networking success looks like","head":"","subhead":"","lines":[{"t":"lead","x":"You have networked well with a high-net-worth person when all four are true:"},{"t":"callout","x":"The comfortable impression is the goal. Not a booking on day one, a person who is glad they met you."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"How to leave a comfortable impression","head":"","subhead":"","lines":[{"t":"li","x":"Lead with genuine interest, ask about something they actually said or built"},{"t":"li","x":"Be specific, not generic flattery"},{"t":"li","x":"Give before you take, be useful or interesting first"},{"t":"li","x":"Be people-smart, read the room and match their energy"},{"t":"li","x":"Add them as a contact and follow up lightly"},{"t":"li","x":"Lead with the ask, no pitch in the first minute"},{"t":"li","x":"Mention payment, ever"},{"t":"li","x":"Over-talk, listen more than you speak"},{"t":"li","x":"Force it, a comfortable no beats a pushy yes"}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Where to source · channels in priority","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":10,"kind":"divider","eyebrow":"Part two","head":"Outreach","subhead":"","lines":[{"t":"lead","x":"Reach out, follow up, handle objections."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Reach out · pre-send checklist","head":"","subhead":"","lines":[{"t":"li","x":"A specific reference to something they actually said, built, or won, never generic flattery."},{"t":"li","x":"Their name spelled correctly ."},{"t":"li","x":"Channel-appropriate length : DM 60 words or less, email 120 words or less."},{"t":"callout","x":"Templates live in the wiki (warm intro, in-person at an event, cold DM, cold email). They are starters, be people-smart and adjust for the situation."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Follow-up rules","head":"","subhead":"","lines":[{"t":"li","x":"After a cold DM or email: wait 4 working days , follow up exactly once . Maximum 2 touchpoints from a cold start."},{"t":"li","x":"After that: park them, re-engage in 6 months with a different angle."},{"t":"li","x":"After a verbal yes but no date locked: re-engage at 7 days , mark Lost at 14 days ."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"Handling objections","head":"Acknowledge, diagnose, reframe, soft close.","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":14,"kind":"divider","eyebrow":"Part three","head":"Qualify, verify, lock","subhead":"","lines":[{"t":"lead","x":"Credible, confirmed, in writing."}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"Qualify · the five gates","head":"Five Yeses, or it's a No .","subhead":"","lines":[{"t":"li","x":"Real & verifiable — is their success genuine, and does it survive an external check (registry, company footprint)?"},{"t":"li","x":"Clean reputation — does the market vouch for them? A quiet network check comes back with no red flags."},{"t":"li","x":"Right voice for the Page — are they a true fit for this vertical and audience, not a stretch?"},{"t":"li","x":"A story worth watching — do they carry a story or insight that can travel and earn the view?"},{"t":"li","x":"Exposure-aligned & camera-ready — happy to feature for earned exposure (no payment) and comfortable on camera?"},{"t":"callout","x":"Every answer must be Yes. Even one \"No\" kills the candidate — no exceptions."}],"quiz":null,"gate":[]},{"n":16,"kind":"body","eyebrow":"Verify externally · never interrogate","head":"","subhead":"","lines":[{"t":"li","x":"Business registry check — confirm the company exists, they are a director or owner, dates align (e.g. ACRA)."},{"t":"li","x":"Reverse company search — LinkedIn employee count, customer case studies, news footprint. Real businesses leave traces, shell brands have one website and a TikTok."},{"t":"li","x":"Quiet network check — DM one or two trusted contacts in their space: \"Ever come across [Name]? How are they?\""},{"t":"callout","x":"Rule: if two or more come back weak, drop the candidate. Don't book."}],"quiz":null,"gate":[]},{"n":17,"kind":"body","eyebrow":"Lock & schedule","head":"","subhead":"","lines":[{"t":"lead","x":"Send the booking confirmation covering the date, location, time and duration, what we'll cover, what to bring, and a reaffirmation, no payment, earned exposure ."},{"t":"lead","x":"Random shoots (captured first, qualified after): upload to the Tracker as DO NOT POST , a private record flagged out of the publish queue. The Senior Producer revisits these periodically."},{"t":"callout","x":"Get it in writing. A verbal yes is not a lock, the candidate must reply confirming the date."}],"quiz":null,"gate":[]},{"n":18,"kind":"divider","eyebrow":"Part four","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Three calls. Get them graded."}],"quiz":null,"gate":[]},{"n":19,"kind":"body","eyebrow":"Question 1 · finding credible people","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"Next month's calendar needs one more credible feature and you're starting the search from scratch.","q":"Correct. Events are the highest-signal channel — you've already met the person in person. Warm referrals, LinkedIn, Instagram and publications all rank below it.\" data-no=\" Not the top pick. Events rank highest — you've met the person in person, which beats any cold digital channel. Work down the ranked list from there.\"> Next month's calendar needs one more credible feature and you're starting the search from scratch.","opts":[{"k":"A","t":"A cold Instagram search for lifestyle accounts","correct":false},{"k":"B","t":"Events — you've already met people there in person","correct":true},{"k":"C","t":"Publications, podcasts and articles","correct":false}]},"gate":[]},{"n":20,"kind":"body","eyebrow":"Question 2 · qualifying hard","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"A candidate had a great call and says their business is thriving. You haven't verified anything independently yet.","q":"Correct. A good conversation is not verification. Run the business registry check, the reverse company search, and the quiet network check — if two or more come back weak, drop the candidate.\" data-no=\" Not enough. A warm conversation isn't verification. Before locking anything, run the external checks — registry, reverse search, quiet network — and drop the candidate if two or more come back weak.\"> A candidate had a great call and says their business is thriving. You haven't verified anything independently yet.","opts":[{"k":"A","t":"Book it — a good conversation is enough signal","correct":false},{"k":"B","t":"Send the booking confirmation, they sound credible","correct":false},{"k":"C","t":"Verify externally, and drop the candidate if two or more checks come back weak","correct":true}]},"gate":[]},{"n":21,"kind":"body","eyebrow":"Question 3 · locking the shoot","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"A high-net-worth candidate says yes on the phone to the shoot date. Nothing has been confirmed in a message yet.","q":"Correct. A verbal yes is not a lock. Get it in writing — the candidate must reply confirming the date before the shoot counts as booked.\" data-no=\" Not locked. A verbal yes doesn't count. You need the candidate to confirm the date in writing — and payment is never part of the offer.\"> A high-net-worth candidate says yes on the phone to the shoot date. Nothing has been confirmed in a message yet.","opts":[{"k":"A","t":"No — get it in writing, a verbal yes doesn't lock the shoot","correct":true},{"k":"B","t":"Yes, proceed to book the crew immediately","correct":false},{"k":"C","t":"No, but promising payment will secure it","correct":false}]},"gate":[]},{"n":22,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all six?","subhead":"","lines":[],"quiz":null,"gate":["Have you built real rapport, not just made an ask?","Are you sourcing from the highest-signal channels first, events and warm referrals?","Does every candidate pass all five qualifying gates before you book them?","Have you verified them externally, registry, reverse search, quiet network check?","Is the shoot confirmed in writing, not just a verbal yes?","Have you kept payment out of the conversation, start to finish?"]},{"n":23,"kind":"close","eyebrow":"","head":"Know the person first. The booking follows.","subhead":"","lines":[{"t":"lead","x":"Networking is the trait that makes sourcing easy. Build real relationships, qualify hard, and the credible faces will keep coming."}],"quiz":null,"gate":[]}]},{"id":"shoot","bucket":"Marketing & Content","title":"How to shoot","href":"producer-shoot-training.html","step":"Producer · specialisation","count":30,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · Producer","head":"How to shoot","subhead":"","lines":[{"t":"lead","x":"Shoot day, start to finish. Clean footage for every HEART row, backed up before you leave. 1.5 to 4 hours on location."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"How to win","head":"Every HEART row has footage, audio is clean, everything is backed up.","subhead":"","lines":[{"t":"lead","x":"Shoot day is done when every row in the brief has A-roll and B-roll, the audio is clean, and it is all uploaded, before you leave the location. Not after. Before."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"You're on location 30 minutes early — the guest never arrives before you do"},{"t":"win","x":"The hook shot is captured first — the most important shot in the video, not an afterthought"},{"t":"win","x":"Audio plays back clean — no hum, no traffic, no wind — checked on headphones"},{"t":"win","x":"Footage is backed up by HEART folder — before you leave the location, not after"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"Why it matters","head":"Three things kill shoots. None can be fixed in editing.","subhead":"","lines":[{"t":"lead","x":"This SOP makes all three rare."},{"t":"li","x":"Bad audio — you cannot clean voice that was recorded dirty."},{"t":"li","x":"Missing supporting shots — no B-roll means the editor has nothing to cut to."},{"t":"li","x":"Wrong framing — a badly framed shot is a lost shot."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Three rules that never bend","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Two terms, one order","head":"","subhead":"","lines":[{"t":"lead","x":"A-roll = the interview footage, what the guest says. B-roll = every supporting shot, close-ups, wides, action."},{"t":"callout","x":"Why B-roll first? You scout the location while shooting, the guest gets comfortable seeing the camera before they are on it, and rapport builds so the interview happens with a relaxed guest. Relaxed guest, better answers, better video."}],"quiz":null,"gate":[]},{"n":7,"kind":"divider","eyebrow":"Part one","head":"Before you leave the office","subhead":"","lines":[{"t":"lead","x":"Gear, settings, buffer."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Always check before leaving","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"iPhone settings · verify every shoot","head":"","subhead":"","lines":[{"t":"callout","x":"Why HDR off? HDR makes shots look different across lighting changes. Off keeps every clip consistent, which makes editing faster and the final video cleaner."}],"quiz":null,"gate":[]},{"n":10,"kind":"divider","eyebrow":"Part two","head":"On site · the first 30 minutes","subhead":"","lines":[{"t":"lead","x":"Reach early. Set up before the guest."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Arrival & site assessment","head":"","subhead":"","lines":[{"t":"li","x":"A-roll spot — quiet (no traffic, aircon hum, fridge buzz), background contrasts with the guest's wardrobe, soft natural light (window light is best)."},{"t":"li","x":"B-roll spots — list them by the HEART row they serve. Hook visual first, it is shot #1."},{"t":"li","x":"Test audio in the A-roll spot on headphones, listen for traffic, aircon, fridge, echo, wind. Bad noise, move the spot."},{"t":"li","x":"Lock exposure & white balance — tap and hold on the guest's face for AE/AF lock, slide to adjust brightness."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Guest arrival · five minutes","head":"","subhead":"","lines":[{"t":"li","x":"Welcome warmly, offer water."},{"t":"li","x":"Clip the mic on, inside the collar, pointing toward the mouth."},{"t":"li","x":"Recap the rules in 60 seconds: faceless format so the voice carries everything, answer in complete sentences starting with the topic not \"yeah\", 30–60 seconds per answer, pause and restart anytime."},{"t":"li","x":"Walk the guest to the A-roll spot, show the framing."},{"t":"li","x":"Mic test, guest counts \"one, two, three, four, five\", listen on headphones."}],"quiz":null,"gate":[]},{"n":13,"kind":"divider","eyebrow":"Part three","head":"Capture","subhead":"","lines":[{"t":"lead","x":"B-roll, then A-roll."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"B-roll capture · hook visual first","head":"","subhead":"","lines":[{"t":"li","x":"Roll 1–2 seconds BEFORE the action"},{"t":"li","x":"Each clip 3 seconds minimum, 5 is better"},{"t":"li","x":"Subject moving OR camera moving, never both static"},{"t":"li","x":"Multiple angles of every important thing"},{"t":"li","x":"Wipe the lens, move with your legs for stability"},{"t":"li","x":"Static camera + static subject (unusable)"},{"t":"li","x":"Clips under 3 seconds (editor can't use them)"},{"t":"li","x":"Trust the screen, tap to check focus"},{"t":"callout","x":"Coverage rule: every HEART row needs at least one B-roll clip, roughly one clip per 5 seconds of scene. 2 strong clips beat 5 weak ones."}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"Composition · easy to remember","head":"","subhead":"","lines":[{"t":"li","x":"Rule of thirds — place the subject on a grid line, not always centred."},{"t":"li","x":"Don't cut at joints — the frame edge should not end at neck, wrist, knee or ankle. Cut mid-chest or hip."},{"t":"li","x":"Layer depth — something close, the subject in the middle, something blurry behind. Three layers looks rich."},{"t":"li","x":"Lead room — leave space on the side the subject is looking toward."},{"t":"callout","x":"The 3-second rule: every clip at least 3 seconds. Editors trim down, they cannot make a clip longer. Storage is cheap, regret is expensive."}],"quiz":null,"gate":[]},{"n":16,"kind":"body","eyebrow":"A-roll capture · the interview","head":"","subhead":"","lines":[{"t":"li","x":"Roll BEFORE you ask the question"},{"t":"li","x":"Say the take first: \"Question 1, take 1\""},{"t":"li","x":"2–3 takes per question, even if the first sounds great"},{"t":"li","x":"Record in 10-minute intervals"},{"t":"li","x":"Listen back after EVERY question, no exceptions"},{"t":"li","x":"Say \"uh-huh\" or \"right\" while the guest talks (kills the audio)"},{"t":"li","x":"Interrupt to correct, let them finish then redo"},{"t":"li","x":"Trust the meter, listen on headphones"}],"quiz":null,"gate":[]},{"n":17,"kind":"body","eyebrow":"Coaching the guest · voice carries the video","head":"If an answer is monotone or rushed, redo it.","subhead":"","lines":[{"t":"li","x":"\"That was good, let's do one more with more energy.\""},{"t":"li","x":"\"Slow down on the punchline, let the number land.\""},{"t":"li","x":"\"Smile when you say that, it comes through in the voice.\""},{"t":"li","x":"\"Talk like you're explaining to a friend, not pitching to a crowd.\""},{"t":"li","x":"\"Pause for a second before the surprising number, it gives it weight.\""},{"t":"callout","x":"Movement: mix smooth and raw. Slow + smooth for calm sections, raw + handheld for the high-energy parts."}],"quiz":null,"gate":[]},{"n":18,"kind":"body","eyebrow":"Question design SOP · yours to own","head":"Five rules for questions that cut clean.","subhead":"","lines":[{"t":"li","x":"One ask per question — combining two asks gets a tangled answer."},{"t":"li","x":"Maximum ten words — cut filler like \"walk me through the…\""},{"t":"li","x":"Specific over abstract — \"This Ferrari\" beats \"your car.\""},{"t":"li","x":"Force topic-first answers — phrase it so the guest starts with the topic, not a connective. This is the highest-leverage editing win."},{"t":"li","x":"Short, confident, concise — say it once, cleanly."},{"t":"callout","x":"This is yours. Producers ask the questions on the shoot, own the design, not just the delivery."}],"quiz":null,"gate":[]},{"n":19,"kind":"body","eyebrow":"Coach the guest's tone · before each question","head":"The faceless format means the guest's voice carries everything.","subhead":"","lines":[{"t":"li","x":"Vary the pace — slow on the punchline, fast on the setup."},{"t":"li","x":"Land the number — pause before and after key figures."},{"t":"li","x":"Vocal smile — smiles register even without a face on camera."},{"t":"li","x":"Avoid monotone — if it sounds flat, redo with more energy."},{"t":"li","x":"Conversational, not presentational — talk like explaining to a friend."},{"t":"callout","x":"Frame it this way: you're directing a performance, not just recording answers."}],"quiz":null,"gate":[]},{"n":20,"kind":"body","eyebrow":"The producer's mindset · on the shoot","head":"Genuine reactions. Improv-ready follow-ups.","subhead":"","lines":[{"t":"li","x":"Genuine enthusiasm, only in the right moments — a real \"wow\" lands only when earned."},{"t":"li","x":"Improv-ready with burning follow-ups — when the guest drops a valuable answer, go off-script."},{"t":"li","x":"The right follow-up is the question the viewer would shout at the screen, or a thought-provoking, out-of-the-box question that makes both guest and viewer think."}],"quiz":null,"gate":[]},{"n":21,"kind":"divider","eyebrow":"Part four","head":"Wrap & handoff","subhead":"","lines":[{"t":"lead","x":"Fill the gaps, back up, notify."}],"quiz":null,"gate":[]},{"n":22,"kind":"body","eyebrow":"Final B-roll fill & wrap","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":23,"kind":"body","eyebrow":"Back up before you leave · upload same day","head":"The editor cannot start without files in the right folders.","subhead":"","lines":[{"t":"lead","x":"Back up on location (iCloud sync on, or manual to Google Drive). Drop every clip into the HEART row it was shot for:"},{"t":"p","x":"If a take serves two HEART rows, copy it into both. Update the Tracker, notify the editor."}],"quiz":null,"gate":[]},{"n":24,"kind":"divider","eyebrow":"Part five","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Three calls. Get them graded."}],"quiz":null,"gate":[]},{"n":25,"kind":"body","eyebrow":"Question 1 · the first rule","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"The guest is scheduled to arrive at 2:00pm. You're deciding what time to be on site.","q":"Correct. Reach early is one of the three rules that never bend — 30 minutes minimum before the guest, non-negotiable. Those 30 minutes decide the whole day: site assessment, A-roll spot, audio test, exposure lock.\" data-no=\" Not enough. The rule is 30 minutes minimum before the guest, non-negotiable. Those 30 minutes decide the whole day, arriving with the guest or right before leaves no time to assess the site or test audio.\"> The guest is scheduled to arrive at 2:00pm. You're deciding what time to be on site.","opts":[{"k":"A","t":"1:45pm, right before the guest — that's close enough","correct":false},{"k":"B","t":"1:30pm, 30 minutes early minimum — the rule never bends","correct":true},{"k":"C","t":"2:00pm, same time as the guest, to save time","correct":false}]},"gate":[]},{"n":26,"kind":"body","eyebrow":"Question 2 · capture order","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"You've just arrived and finished the site assessment. The guest hasn't arrived yet.","q":"Correct. B-roll first, then A-roll, then a final B-roll fill. Shooting B-roll first lets you scout the location, gets the guest used to seeing the camera before they're on it, and builds rapport, so the interview happens with a relaxed guest. The hook visual is shot #1 of that B-roll pass, it's the most important shot in the video.\" data-no=\" Wrong order. Capture is B-roll first, then A-roll, then a final B-roll fill. B-roll first scouts the location and warms the guest up to the camera before the interview, and the hook visual, the most important shot in the video, gets captured in that first pass.\"> You've just arrived and finished the site assessment. The guest hasn't arrived yet.","opts":[{"k":"A","t":"B-roll first, hook visual as shot #1, then A-roll, then a final B-roll fill","correct":true},{"k":"B","t":"A-roll first, so the interview is fresh before you tire yourself out shooting B-roll","correct":false},{"k":"C","t":"Whichever is faster to set up, the order doesn't change the footage","correct":false}]},"gate":[]},{"n":27,"kind":"body","eyebrow":"Question 3 · wrap & backup","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"It's the end of the shoot. Every HEART row has B-roll, and the audio played back clean on headphones.","q":"Correct. Back up on location before you leave, sorting every clip, A-roll and B-roll, into the HEART row folder it was shot for. The editor cannot start without files in the right folders, and it all uploads the same day.\" data-no=\" Not quite. Backup happens on location, before you leave, and every clip, A-roll and B-roll both, gets sorted into its HEART row folder. Waiting until later or skipping half the footage means the editor has nothing to start from.\"> It's the end of the shoot. Every HEART row has B-roll, and the audio played back clean on headphones.","opts":[{"k":"A","t":"Nothing — the footage can be uploaded anytime later that week","correct":false},{"k":"B","t":"Just back up the A-roll now; B-roll can wait until you're back at the office","correct":false},{"k":"C","t":"Back up on location now, sorting every clip into its HEART row folder","correct":true}]},"gate":[]},{"n":28,"kind":"body","eyebrow":"Question 4 · designing a clean question","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You want to ask about the Ferrari's horsepower and how much it cost.","q":"Correct. One ask, topic named specifically, and phrased so the answer starts with the topic. That's the highest-leverage editing win, the guest doesn't open with a connective like \"so\" or \"yeah\".\" data-no=\" Not clean enough. A good question is one ask (not two stacked together), names the specific thing (\"this Ferrari,\" not \"your car\"), and is phrased so the guest's answer starts with the topic, not a connective.\"> You want to ask about the Ferrari's horsepower and how much it cost.","opts":[{"k":"A","t":"\"So, tell me about the horsepower and how much it costs?\"","correct":false},{"k":"B","t":"\"This Ferrari, what's the horsepower?\"","correct":true},{"k":"C","t":"\"Yeah, what do you think about its power?\"","correct":false}]},"gate":[]},{"n":29,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all six?","subhead":"","lines":[],"quiz":null,"gate":["Do you reach the location at least 30 minutes before the guest?","Do you shoot B-roll first, with the hook visual as shot #1?","Is every HEART row covered with usable B-roll before you leave?","Do you listen back on headphones after every interview question?","Is the audio clean — no hum, traffic or wind — checked before you leave?","Is everything backed up on location, sorted by HEART folder, same day?"]},{"n":30,"kind":"close","eyebrow":"","head":"Reach early. Hook first. Bring the energy.","subhead":"","lines":[{"t":"lead","x":"Every shoot done to this bar gives the editor everything they need, and gives the video its best shot at going viral."}],"quiz":null,"gate":[]}]},{"id":"offer","bucket":"Marketing & Content","title":"Offer creation & lead magnets","href":"offer-creation-training.html","step":"Offer & conversion","count":22,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · module","head":"Offer creation & lead magnets","subhead":"","lines":[{"t":"lead","x":"The offer is where a performance business wins or loses. This module teaches what an offer and a lead magnet are, and exactly how to build one that converts."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"The one idea","head":"The offer beats the production.","subhead":"","lines":[{"t":"lead","x":"A great offer with average content beats great content with a weak offer, every time. Master the offer, and every view is worth more."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"You can build a Grand Slam Offer — using the 5 moves, named with MAGIC"},{"t":"win","x":"You can move all four Value Equation levers — dream, belief, time, effort — on a real offer"},{"t":"win","x":"You can build a lead magnet that converts — one narrow problem, solved completely, in 7 steps"},{"t":"win","x":"You can coach a client to a stronger offer — and handle their objections without losing the sale"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one","head":"The Grand Slam Offer","subhead":"","lines":[{"t":"lead","x":"Alex Hormozi · $100M Offers"}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Alex Hormozi · $100M Offers","head":"An offer so good they feel stupid saying no .","subhead":"","lines":[{"t":"lead","x":"That is a Grand Slam Offer. You do not win by being cheaper, you win by making the value so obvious that price stops being the question."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"The Value Equation","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Build an offer in 5 moves","head":"","subhead":"","lines":[{"t":"li","x":"Write the dream. What result do they badly want?"},{"t":"li","x":"List what's stopping them. Every problem in the way."},{"t":"li","x":"Solve each one. One fix per problem."},{"t":"li","x":"Pick the format. Guide, tool, template, session."},{"t":"li","x":"Cut the weak, stack the rest. Into one offer."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Name it · the MAGIC formula · Hormozi","head":"A great name sells the offer.","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":9,"kind":"divider","eyebrow":"Part two","head":"The lead magnet","subhead":"","lines":[{"t":"lead","x":"Alex Hormozi · $100M Leads"}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"What a lead magnet is","head":"A complete fix for one small problem .","subhead":"","lines":[{"t":"lead","x":"The free thing a viewer gets in exchange for becoming a lead. A great one solves a single, specific problem completely and gives a quick win, good enough to sell, but given free so it pulls them toward the paid offer."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Your turn · build one in 7 steps","head":"","subhead":"","lines":[{"t":"lead","x":"Pick a real page and fill each blank in your head as you go:"},{"t":"li","x":"The one narrow problem you'll solve → ______"},{"t":"li","x":"How you solve it → ______"},{"t":"li","x":"The format (checklist, guide, tool) → ______"},{"t":"li","x":"Its name → ______"},{"t":"li","x":"Make it easy to consume → how?"},{"t":"li","x":"Make it worth consuming → over-deliver how?"},{"t":"li","x":"The next step to the paid offer → ______"}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Worked example · the same 7 steps, filled in","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"What makes a lead magnet actually convert","head":"","subhead":"","lines":[{"t":"p","x":"The free magnet is step one of a value ladder, it must pull the viewer up to the paid offer."},{"t":"p","x":"In one line the viewer knows exactly what they get and why it matters. Confusion kills conversion."},{"t":"p","x":"Show it works, then over-deliver, so the viewer feels they owe you the next step."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Where the offer lives","head":"One lead magnet per video.","subhead":"","lines":[{"t":"lead","x":"The lead magnet is set per video. When the producer marks a video carousel-worthy, that carousel inherits the same lead magnet. Every piece of content carries one offer, and every offer earns a lead."}],"quiz":null,"gate":[]},{"n":15,"kind":"divider","eyebrow":"Part three","head":"When the client brings the offer","subhead":"","lines":[{"t":"lead","x":"Don't just take it. Raise it."}],"quiz":null,"gate":[]},{"n":16,"kind":"body","eyebrow":"Negotiate the offer up","head":"A weak client offer wastes great content.","subhead":"","lines":[{"t":"lead","x":"When a client hands you the offer, coach them to a stronger one. Run it through the same equation:"},{"t":"li","x":"Raise the dream — push for a bigger, more specific result."},{"t":"li","x":"Raise the belief — add proof, a guarantee, a track record."},{"t":"li","x":"Shrink time and effort — faster and easier to claim."},{"t":"li","x":"Stack a bonus — one extra that costs little, adds a lot."}],"quiz":null,"gate":[]},{"n":17,"kind":"body","eyebrow":"Handle the client's objections","head":"Acknowledge, diagnose, reframe, soft close.","subhead":"","lines":[{"t":"lead","x":"Objection: \"I don't want to give away too much for free.\""},{"t":"li","x":"Acknowledge — \"Totally fair, you want to protect the value.\""},{"t":"li","x":"Diagnose — \"Is it the cost, or the worry it replaces the paid thing?\""},{"t":"li","x":"Reframe — a strong free offer earns trust and pulls buyers to the paid sale."},{"t":"li","x":"Soft close — \"If the paid offer stays clearly bigger, open to a stronger free one?\""}],"quiz":null,"gate":[]},{"n":18,"kind":"divider","eyebrow":"Part four","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Solve it. Get it graded."}],"quiz":null,"gate":[]},{"n":19,"kind":"body","eyebrow":"Exercise 1 · spot the value killer","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"The offer on the page: \"Book a 1-hour consultation call next month to discuss your home.\"","q":"The offer on the page: \"Book a 1-hour consultation call next month to discuss your home.\"","opts":[{"k":"A","t":"The dream outcome isn't big enough","correct":false},{"k":"B","t":"It's too slow and too much effort (1 hour, next month)","correct":true},{"k":"C","t":"There isn't enough proof","correct":false}]},"gate":[]},{"n":20,"kind":"body","eyebrow":"Exercise 2 · will this lead magnet work?","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"The lead magnet: \"Our 50-page guide to everything about luxury real estate.\"","q":"The lead magnet: \"Our 50-page guide to everything about luxury real estate.\"","opts":[{"k":"A","t":"It should not be free","correct":false},{"k":"B","t":"It's too broad, it doesn't solve one narrow problem fast","correct":true},{"k":"C","t":"It doesn't have a name","correct":false}]},"gate":[]},{"n":21,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all six?","subhead":"","lines":[],"quiz":null,"gate":["Can you explain the Value Equation — good stuff bigger, bad stuff smaller?","Can you build an offer in 5 moves and name it with MAGIC?","Can you build a lead magnet that solves one narrow problem in 7 steps?","Can you spot the value killer in a weak offer?","Can you say why a broad lead magnet underperforms?","Can you coach a client to a stronger offer and handle their objections?"]},{"n":22,"kind":"close","eyebrow":"","head":"Own the offer. Own the numbers.","subhead":"","lines":[{"t":"lead","x":"Read $100M Offers and $100M Leads in full, then build offers to this bar. Next in your path: building landing pages, and amending videos."}],"quiz":null,"gate":[]}]},{"id":"landing","bucket":"Marketing & Content","title":"Building landing pages","href":"landing-page-training.html","step":"Offer & conversion","count":21,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · module","head":"Building landing pages","subhead":"","lines":[{"t":"lead","x":"The page where a click becomes a lead. This is what a converting landing page holds, and how to build one that captures the offer you created."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"The page has one job — capture the lead, nothing else"},{"t":"win","x":"The anatomy converts — headline, offer, proof, form, one clear CTA"},{"t":"win","x":"The HubSpot page is built and published — live, with the URL ready to share"},{"t":"win","x":"The lead flow is tested — submit → thank-you/redirect → magnet arrives"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What a landing page is","head":"One page. One job.","subhead":"","lines":[{"t":"lead","x":"A landing page has a single purpose: turn the visitor who tapped your offer into a captured lead. No menu, no detours, no other links. Everything on it either moves them toward the form, or it should not be there."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"What a landing page wins you","head":"Least friction, most database.","subhead":"","lines":[{"t":"lead","x":"The spine is simple: reduce friction as much as possible, capture as much of the database as possible. It also wins by:"},{"t":"li","x":"Qualifying — one or two smart questions filter for high-quality leads."},{"t":"li","x":"Speed-to-lead — instantly delivers the magnet and fires the follow-up while intent is hot."},{"t":"li","x":"Segmenting — captures just enough to route the lead to the right offer."},{"t":"li","x":"Retargeting — even non-converters become an audience you can chase."},{"t":"li","x":"Direct book or buy — for high-intent traffic, skip the email and go straight to a call."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"The anatomy of a converting page","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"The headline","head":"One clear promise, the dream outcome.","subhead":"","lines":[{"t":"lead","x":"The visitor decides in a second whether to stay. Lead with the outcome they want, not with your brand or your process. If they cannot tell what they get and why it matters from the headline alone, rewrite it. Clarity beats clever."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Proof","head":"Make it believable.","subhead":"","lines":[{"t":"lead","x":"A big promise raises a big doubt. Answer it with proof, real results, numbers, testimonials, or credibility markers. The more you claim, the more proof the page needs."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"The ask","head":"One action. The fewest fields.","subhead":"","lines":[{"t":"lead","x":"Give the page exactly one call to action, repeated, with nothing competing for the click. Then ask for the minimum, usually a name and one contact. Every extra field costs you leads, so only ask for what you truly need now."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Message match","head":"The page must match the video.","subhead":"","lines":[{"t":"lead","x":"Whatever the video or carousel promised, the page must deliver the same words, the same offer, the same look. If the visitor feels they landed somewhere else, they leave. Keep the scent from hook to page unbroken."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Mobile first, fast","head":"Built for a thumb, loads instantly.","subhead":"","lines":[{"t":"lead","x":"Almost every visitor arrives on a phone, from a reel. Design for the thumb first, and keep it fast, a slow page loses leads before it even loads. Big tap targets, short copy, the form in reach."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Who owns what","head":"One standard, two owners.","subhead":"","lines":[{"t":"li","x":"Owns internal landing pages"},{"t":"li","x":"Our own campaigns and offers"},{"t":"li","x":"Owns client landing pages"},{"t":"li","x":"Higher stakes, client brand fidelity"},{"t":"callout","x":"Same bar for both. Internal or client, every page holds a clear promise, the offer, proof, and one call to action."}],"quiz":null,"gate":[]},{"n":12,"kind":"divider","eyebrow":"Build it","head":"Building the page in HubSpot","subhead":"","lines":[{"t":"lead","x":"Click by click, page to publish."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"HubSpot · the build · part 1 of 2","head":"","subhead":"","lines":[{"t":"li","x":"Content → Landing Pages , then click Create a landing page (top right)."},{"t":"li","x":"First time only:
