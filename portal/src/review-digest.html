more to explore.\"","q":"Correct. A landing page has a single purpose: turn the visitor into a captured lead. No menu, no detours, no other links — everything either moves them toward the form or it doesn't belong.\" data-no=\" No. A landing page has one job: convert the click into a captured lead. A blog roll and social links are detours — they add friction and give the visitor an exit that isn't the form.\"> A teammate wants to add a blog roll and three social links to the landing page, \"so visitors have more to explore.\"","opts":[{"k":"A","t":"No — the page's single job is turning the click into a captured lead, extra links only add friction","correct":true},{"k":"B","t":"Yes, as long as they're placed below the form","correct":false},{"k":"C","t":"Yes — more content keeps visitors on the page longer","correct":false}]},"gate":[]},{"n":18,"kind":"body","eyebrow":"Question 2 · anatomy that converts","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"The headline promises \"your home's luxury value, free in 24 hours,\" but visitors are leaving before filling the form.","q":"Correct. A big promise raises a big doubt. Proof — real results, numbers, testimonials or credibility — is what makes the promise believable enough to act on.\" data-no=\" Not quite. The anatomy piece missing here is proof. A big promise raises a big doubt, and only proof — results, testimonials, credibility — answers it enough for the visitor to trust the form.\"> The headline promises \"your home's luxury value, free in 24 hours,\" but visitors are leaving before filling the form.","opts":[{"k":"A","t":"A second CTA button, so there's more than one chance to click","correct":false},{"k":"B","t":"A shorter headline","correct":false},{"k":"C","t":"Proof — the big promise raises doubt that only proof can answer","correct":true}]},"gate":[]},{"n":19,"kind":"body","eyebrow":"Question 3 · the HubSpot build order","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You've just dragged the Form module onto the page and kept it to name + one contact field.","q":"Correct. Right after the form comes On submit — choose Show thank you message or Redirect to a page, URL, meeting or payment link, so the lead magnet delivers the instant it's earned. Page Settings, SEO and Publish come after that.\" data-no=\" Not yet. Straight after adding the Form module comes the form's On submit settings — Show thank you message or Redirect to a page, URL, meeting or payment link, delivering the magnet instantly. Settings, SEO and Publish are the steps after that.\"> You've just dragged the Form module onto the page and kept it to name + one contact field.","opts":[{"k":"A","t":"Click Publish, then fix the details afterward","correct":false},{"k":"B","t":"Open On submit and set a thank-you message or redirect that delivers the magnet instantly","correct":true},{"k":"C","t":"Click the Optimize icon to check SEO recommendations","correct":false}]},"gate":[]},{"n":20,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all six?","subhead":"","lines":[],"quiz":null,"gate":["Does the page have one job — capture the lead, nothing else?","Does the anatomy convert — headline, offer, proof, form, one CTA all present?","Is the copy message-matched to the video or carousel that sent the click?","Have you set what happens after submit — a thank-you or redirect that delivers the magnet instantly?","Is the HubSpot page built and published, with the URL ready to use?","Have you tested the full lead flow end to end?"]},{"n":21,"kind":"close","eyebrow":"","head":"A page with one job, done well.","subhead":"","lines":[{"t":"lead","x":"Build every page to this bar and the lead magnet you created actually captures leads. Next in your path: amending videos."}],"quiz":null,"gate":[]}]},{"id":"amend","bucket":"Marketing & Content","title":"Amending videos","href":"amending-videos-training.html","step":"Offer & conversion","count":16,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · module","head":"Amending videos","subhead":"","lines":[{"t":"lead","x":"You approve what ships. This module is the approver's eye, what to look for, how to decide, and how to give amendments that get fixed fast."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"You decide what ships","head":"You are the gate.","subhead":"","lines":[{"t":"lead","x":"The Content strategist holds source approval and QC. The Marketing coordinator holds final approval and organic approval. Nothing goes live without one of you. Judge to a standard, not a mood, and the whole pipeline rises to it."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"You spot problems fast — gut, grammar and story, nothing slips through"},{"t":"win","x":"The sweeps run in order — Watch 1, Sweep 1, Sweep 2, never skipped or merged"},{"t":"win","x":"Amendments are specific and timestamped — exact frame, exact fix, never \"make it better\""},{"t":"win","x":"The result is viral and lead-generating — every check serves both outcomes, not just one"}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"Review in three passes · in this order","head":"","subhead":"","lines":[{"t":"li","x":"Watch once, no notes"},{"t":"li","x":"Would you stop scrolling?"},{"t":"li","x":"Unsure = story problem"},{"t":"li","x":"Captions & typos"},{"t":"li","x":"On-screen text, names, numbers"},{"t":"li","x":"Animation & motion polish"},{"t":"li","x":"Story, flow, scene changes"},{"t":"li","x":"Every planning variable (next)"},{"t":"li","x":"All the judgment calls"}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Sweep 2 · every planning variable is a checkpoint","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"The decision","head":"Approve, or send it back.","subhead":"","lines":[{"t":"li","x":"Clears every check, no exceptions"},{"t":"li","x":"Moves forward, clock passes to the next owner"},{"t":"li","x":"No \"approved but…\", if it needs a change, it's not approved"},{"t":"li","x":"Misses at least one check"},{"t":"li","x":"Rejected into the fix-and-resubmit view, with a clear reason"},{"t":"li","x":"Amendment clock starts the moment it lands there"}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Amendment strategies","head":"Feedback that gets fixed fast.","subhead":"","lines":[{"t":"li","x":"Be specific. Comment on the frame, name the exact change. Never \"make it better.\""},{"t":"li","x":"Point to the standard. Cite the storyboard or brand guideline, not your opinion."},{"t":"li","x":"Must-fix first. List what blocks approval, then the nice-to-haves."},{"t":"li","x":"One round. Send the whole list at once, not one fix at a time."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Vague vs specific · commenting in Frame.io","head":"Comment on the frame. Say the exact change.","subhead":"","lines":[{"t":"callout","x":"Frame.io stamps the timecode for you. Pause on the exact frame, comment there, and the note pins itself to that moment. You never type \"0:00–0:03\" — you just name the precise change, right where it happens."},{"t":"p","x":"\"The intro feels off, can you fix the hook and tighten it up a bit?\""},{"t":"p","x":"\"Open on the price reveal, not the walk-in.\" · \"Dead air here — cut it.\" · \"Caption breaks brand case — lower-case it.\""}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Coach the person, not just the piece","head":"One miss is a fix. A repeat is a pattern.","subhead":"","lines":[{"t":"lead","x":"Reject the video and you fix one clip. Spot the same check failing again and again and you've found the real problem — the skill, not the piece. That's the yellow-card conversation. Coach it once, and every video after it gets better."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"How we say it","head":"Reframe every \"no\" into \"here's what works\" .","subhead":"","lines":[{"t":"lead","x":"Amendments raise the standard, they do not knock the person down. Lead with what to do, not what is wrong. Specific, direct, and from abundance, that is how feedback lands and the work gets better fast."}],"quiz":null,"gate":[]},{"n":11,"kind":"divider","eyebrow":"Your turn","head":"Three calls, graded.","subhead":"","lines":[{"t":"lead","x":"Put the approver's eye to work on real scenarios."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Question 1 · the three passes","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You've just finished Watch 1 and the video felt fine as a normal viewer. Before you get into hook, HEART and offer.","q":"Correct. Sweep 1 is the fast, objective pass — captions and typos, text on screen, names and numbers, and the animation/motion polish. Sweep 2 is where you judge story, flow, scene changes, and every planning variable.\" data-no=\" Not Sweep 1. That's Sweep 2's job (story, flow, scene changes, every planning variable), or skips the passes entirely. Sweep 1 is the fast, objective pass: grammar/typos, on-screen text, and animation/motion polish, before you make any judgment calls.\"> You've just finished Watch 1 and the video felt fine as a normal viewer. Before you get into hook, HEART and offer.","opts":[{"k":"A","t":"Judging story, HEART rows and scene changes","correct":false},{"k":"B","t":"The fast pass: captions/typos, on-screen text, and animation polish","correct":true},{"k":"C","t":"Nothing — you approve straight after Watch 1","correct":false}]},"gate":[]},{"n":13,"kind":"body","eyebrow":"Question 2 · one round, not many","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"Reviewing a video, you find three issues: a weak hook, a pacing drag in the middle, and a caption that breaks brand case.","q":"Correct. Send the whole list in one round, must-fix first. Feeding fixes one at a time drags the video into round after round and burns the amendment clock. One clear list, then the editor fixes it all and resubmits once.\" data-no=\" No — that's a slow loop. Sending fixes one at a time (or only the biggest) means the video bounces back and forth, blowing the clock and leaving issues behind. Send all of it in one round, must-fix first.\"> Reviewing a video, you find three issues: a weak hook, a pacing drag in the middle, and a caption that breaks brand case.","opts":[{"k":"A","t":"All three in one round, must-fix first","correct":true},{"k":"B","t":"One at a time, so the editor isn't overwhelmed","correct":false},{"k":"C","t":"Just the hook — it's the biggest issue","correct":false}]},"gate":[]},{"n":14,"kind":"body","eyebrow":"Question 3 · amendment strategy","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"A coordinator leaves a Frame.io comment on a video: &ldquo;the intro feels off, can you make it better?&rdquo;","q":"Correct. &ldquo;Make it better&rdquo; is vague — the editor can't act on it. You're already commenting on the frame in Frame.io, so name the exact change: &ldquo;open on the price reveal, not the walk-in.&rdquo; That gets fixed in one pass.\" data-no=\" Not quite. The note is vague — the editor can't act on &ldquo;make it better.&rdquo; Frame.io already pins your comment to the moment, so you don't need a timestamp; you need the exact change named, e.g. &ldquo;open on the price reveal, not the walk-in.&rdquo;\" > A coordinator leaves a Frame.io comment on a video: &ldquo;the intro feels off, can you make it better?&rdquo;","opts":[{"k":"A","t":"Nothing — brief notes save everyone time","correct":false},{"k":"B","t":"It's too specific — general direction gives the editor more freedom","correct":false},{"k":"C","t":"It's vague — name the exact change (Frame.io already marks the moment)","correct":true}]},"gate":[]},{"n":15,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all six?","subhead":"","lines":[],"quiz":null,"gate":["Do you run all three sweeps, gut, grammar, everything else, in order?","Do you check every Sweep 2 variable: hook, story, pacing, visuals, scenes, CTA, on-brand, truth?","Is \"on-brand\" for you voice + privacy blur + watermark, not maroon?","Does every amendment sit on the frame and name the exact change?","Do you separate must-fix from polish, and send the whole list at once?","Do you turn a repeat pattern into a coaching conversation?"]},{"n":16,"kind":"close","eyebrow":"","head":"A value-packed video that spreads and converts.","subhead":"","lines":[{"t":"lead","x":"The end goal of every amend: a high-performance video that goes viral and collects high-quality leads. Brief, concise, precise, that is the job of the gate."}],"quiz":null,"gate":[]}]},{"id":"mc_dash","bucket":"Marketing & Content","title":"Reading your dashboard","href":"mc-dashboard-training.html","step":"Specialisation","count":15,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · marketing coordinator skill","head":"Reading your dashboard","subhead":"","lines":[{"t":"lead","x":"Your dashboard tells you what to do next — if you know how to read it. This is the method."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"You read it daily — not a glance when someone asks — a real check"},{"t":"win","x":"You know your one number — Lead → Customer conversion, cold, on demand"},{"t":"win","x":"You spot what's winning or stalling — before anyone has to tell you"},{"t":"win","x":"You act on it — reading ends in a decision, not just a look"},{"t":"p","x":"This is the bar. Everything that follows is how you get there — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"Your growth cockpit","head":"The live n8n command dashboard is your cockpit.","subhead":"","lines":[{"t":"lead","x":"Koocester runs one command dashboard with a view for every role. Yours — the Marketing coordinator / growth view — shows the numbers that matter to growth: pipeline, lead-gen activity, leads, and conversion."},{"t":"callout","x":"Confirm before you rely on it. Your exact URL and login live in the vault — check them against what's on screen before you treat a tile as gospel."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"The key idea","head":"Lead numbers you can act on today. Lag numbers are the result.","subhead":"","lines":[{"t":"li","x":"Videos in pipeline"},{"t":"li","x":"Shoots scheduled"},{"t":"li","x":"Lead-gen posts live"},{"t":"li","x":"Leads captured"},{"t":"li","x":"Customers won"},{"t":"callout","x":"Watch the lead numbers to change the lag numbers. By the time a lag number moves, it's too late to fix this week — the lead number is where you still have a lever."}],"quiz":null,"gate":[]},{"n":5,"kind":"divider","eyebrow":"Part two","head":"Your one number","subhead":"","lines":[{"t":"lead","x":"Everything on the dashboard supports it."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Your OMTM · the One Metric That Matters","head":"For growth, it's one number: Lead → Customer.","subhead":"","lines":[{"t":"lead","x":"Every other tile supports this one. Pipeline feeds posts live, posts live feed leads, leads feed customers — but the number you're accountable for is the conversion in the middle."},{"t":"p","x":"Illustrative — your live tiles may differ. Confirm the exact set on your dashboard."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Reading, not looking","head":"For every tile, ask three questions.","subhead":"","lines":[{"t":"li","x":"Lead or lag? — decide what you can still act on today."},{"t":"li","x":"Up or down vs target? — a number with no target isn't a target."},{"t":"li","x":"What's the ONE action it tells me to take? — reading ends in a decision."},{"t":"callout","x":"If a number doesn't change what you do next, you haven't finished reading it — you've just looked at it."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Reading ends in a decision","head":"Double down on what's winning. Diagnose what's stalling.","subhead":"","lines":[{"t":"lead","x":"Winning number → feed it into next month's ideas. Stalling number → diagnose with the funnel, same one you use on a single video."},{"t":"callout","x":"A stalling dashboard number is a stalling video, scaled up. A dashboard you don't act on is wallpaper."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Build the habit","head":"Two reads. Not one.","subhead":"","lines":[{"t":"li","x":"What moved since yesterday?"},{"t":"li","x":"Any lead number stalling right now?"},{"t":"li","x":"One action, taken today"},{"t":"li","x":"Trend on the OMTM — up, flat, or down?"},{"t":"li","x":"What's winning — feed it into next month"},{"t":"li","x":"Adjust the plan, not just the day"}],"quiz":null,"gate":[]},{"n":10,"kind":"divider","eyebrow":"Part three","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Three calls. Get them graded."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Question 1 · lead vs lag","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You're scanning your dashboard and see three tiles: leads captured this week, lead-gen posts live this week, customers this month.","q":"Correct. Lead-gen posts live is something you did — a lead indicator you can still act on today. Leads captured and customers are lag: they're the result, already happened.\" data-no=\" Not lead. Lead indicators are things you can act on today — videos in pipeline, shoots scheduled, lead-gen posts live. Leads captured and customers are lag: the result, already happened.\"> You're scanning your dashboard and see three tiles: leads captured this week, lead-gen posts live this week, customers this month.","opts":[{"k":"A","t":"Leads captured this week","correct":false},{"k":"B","t":"Lead-gen posts live this week","correct":true},{"k":"C","t":"Customers this month","correct":false}]},"gate":[]},{"n":12,"kind":"body","eyebrow":"Question 2 · your OMTM","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"Hakim asks you: \"If you could only watch one number on your dashboard, which one?\"","q":"Correct. The One Metric That Matters for growth is the Lead → Customer conversion. Every other tile — pipeline, posts live, cost per lead — supports this one number.\" data-no=\" Not quite. Views and follower count are supporting numbers. The OMTM for growth is the Lead → Customer conversion — the number everything else on the dashboard exists to move.\"> Hakim asks you: \"If you could only watch one number on your dashboard, which one?\"","opts":[{"k":"A","t":"Views this week","correct":false},{"k":"B","t":"Lead → Customer conversion","correct":true},{"k":"C","t":"Follower count","correct":false}]},"gate":[]},{"n":13,"kind":"body","eyebrow":"Question 3 · reading a stalled number","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"Your dashboard shows high views this week, but the leads-captured tile barely moved.","q":"Correct. High views with few leads points to the Act / Capture stage — the CTA, the lead magnet, or the ManyChat / landing flow. It's almost never the content when views are already strong.\" data-no=\" Look at the funnel first. High views with few leads is almost always the Act / Capture stage — a weak or missing CTA, lead magnet, or a broken ManyChat / landing flow. Waiting it out or blaming the hook skips the diagnosis.\"> Your dashboard shows high views this week, but the leads-captured tile barely moved.","opts":[{"k":"A","t":"The hook — views this high mean it's not converting","correct":false},{"k":"B","t":"The Act / Capture stage — CTA, lead magnet, ManyChat / landing flow","correct":true},{"k":"C","t":"Nowhere yet — give it another week","correct":false}]},"gate":[]},{"n":14,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all five?","subhead":"","lines":[],"quiz":null,"gate":["Do you check your dashboard daily, not just when asked?","Do you know your OMTM — Lead → Customer conversion — cold?","Can you tell a lead indicator from a lag indicator on sight?","When a number is off, do you diagnose with the funnel before guessing?","Do you feed what's winning into next month's plan?"]},{"n":15,"kind":"close","eyebrow":"","head":"Read it daily. Know your number. Act on it.","subhead":"","lines":[{"t":"lead","x":"A dashboard is only as good as the decisions it produces. Check it, name the lead numbers, and move before the lag numbers tell you it's too late."}],"quiz":null,"gate":[]}]},{"id":"cs_story","bucket":"Marketing & Content","title":"How to storyboard","href":"how-to-storyboard-training.html","step":"Specialisation","count":30,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · skill module","head":"How to storyboard","subhead":"","lines":[{"t":"lead","x":"Plan the whole faceless-interview video before anyone shoots a frame. Hook to Trust, arc by arc, so every scene earns the next and the CTA feels inevitable."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"Every arc passes its own quality questions — no scene survives on vibes alone"},{"t":"win","x":"The hook stops the scroll in 2 seconds — or it doesn't ship"},{"t":"win","x":"The CTA is irresistible — stupid not to take it, on every video"},{"t":"win","x":"The data lands as story, not a flex — authority earned through a lesson, never a raw stat"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":3,"kind":"divider","eyebrow":"Part one","head":"The arc","subhead":"","lines":[{"t":"lead","x":"A video is not a list of scenes. It's a chain — each stage earns the next."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"What a storyboard is · and why it matters","head":"A great arc makes people watch to the end — and act.","subhead":"","lines":[{"t":"lead","x":"A storyboard is the plan for that arc, built stage by stage before the shoot. Every video, faceless-interview format, follows the same eight-stage chain:"},{"t":"callout","x":"Storyboard it before you shoot it. Every stage has its own pass/fail questions. If a stage can't answer them on paper, it won't answer them on camera either — fix it in the plan, not in the edit."},{"t":"callout","x":"This isn't just for producers. Every Koocester video runs through this exact chain — it's the shared language marketing, strategists, editors, and CS all speak when they talk about a video. Know the arc, and you can read, brief, or critique any video in the pipeline."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Set the video up first · Video Details","head":"Before you storyboard a single scene, lock these.","subhead":"","lines":[{"t":"win","x":"Page featured in — which Page this video belongs to"},{"t":"win","x":"Objective — default = revenue / lead generation, unless deliberately routed to brand awareness, authority, sales enablement, or community"},{"t":"win","x":"Target audience — a specific persona, not \"everyone\""},{"t":"win","x":"Dream outcome — the viewer's win"},{"t":"win","x":"Win metric — the company's win"},{"t":"win","x":"Offer / CTA — what they get, what they do"},{"t":"win","x":"Interviewee outfit cluster — set before the shoot, not on the day"}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Before you plan · what to gather from the guest, in the call","head":"Five things to pull from every guest — mark the musts.","subhead":"","lines":[{"t":"li","x":"Story & credibility — their journey, the turning points"},{"t":"li","x":"The numbers — revenue, costs, timelines — the stuff that lands as story"},{"t":"li","x":"Dream outcome — the win they deliver to a viewer"},{"t":"li","x":"Offer for the CTA — paid: the client's offer · unpaid: our lead-gen offer"},{"t":"li","x":"Winning picture — what success looks like to them. Set expectations, don't overpromise."},{"t":"li","x":"Outfit cluster — set before the shoot, not on the day."},{"t":"callout","x":"Get this in the call, before you plan. Everything else in this deck builds on these five things."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Paid vs unpaid · plan every video, by default","head":"","subhead":"","lines":[{"t":"lead","x":"Every video gets planned. By default, every video is planned as unpaid — objective is our lead generation, and you don't need the guest present to plan it. Gather what you need from them first (previous slide), then storyboard solo."},{"t":"li","x":"You storyboard it yourself — the guest doesn't need to be present"},{"t":"li","x":"Objective is always our lead generation"},{"t":"li","x":"DO NOT show the template"},{"t":"li","x":"Set expectations clearly — never overpromise"},{"t":"li","x":"Storyboard it WITH the interviewee , together"},{"t":"li","x":"Client controls the objective"},{"t":"li","x":"Show them the template"},{"t":"li","x":"Set expectations clearly — never overpromise"},{"t":"callout","x":"Plan every video. No guest, no problem — unpaid videos get storyboarded solo, using what you gathered in the call."}],"quiz":null,"gate":[]},{"n":8,"kind":"divider","eyebrow":"Part two","head":"Design the questions and the shot","subhead":"","lines":[{"t":"lead","x":"Five rules for questions. One formula for every visual."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Question Design SOP · 5 rules","head":"","subhead":"","lines":[{"t":"li","x":"One ask per question — never stack two questions in one."},{"t":"li","x":"Max ten words — long questions get long, wandering answers."},{"t":"li","x":"Specific over abstract — \"This Ferrari\" beats \"your car.\""},{"t":"li","x":"Force topic-first answers — the single highest-leverage edit you can make to a question."},{"t":"li","x":"Coach the guest's tone — vary pace, let the number land, vocal smile, avoid monotone, conversational not presentational."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Visual prompting formula · every shot on the storyboard","head":"[person] + [action] + [environment] + [emotional state] + [framing]","subhead":"","lines":[{"t":"callout","x":"This is the skill that matters most. If you can't picture the shot, you can't storyboard it — every single item on this storyboard must resolve to a visual prompt."},{"t":"callout","x":"Production rule. A visual prompt must include [person] + [action] at minimum — an empty environment with no one doing anything is not a shot."}],"quiz":null,"gate":[]},{"n":11,"kind":"divider","eyebrow":"Part three","head":"Build the arc, stage by stage","subhead":"","lines":[{"t":"lead","x":"Hook. Establishment. Four arcs. Resolve. Trust. Each with its own pass/fail bar."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"","head":"","subhead":"","lines":[{"t":"callout","x":"Example. \"What do you do for a living?\" → \"I own Snoopy IP\" → hook = an overview of the Snoopy Truck as the interviewee steps out; title card: \"1 of 1 Snoopy Truck in Singapore.\" Visual prompt: [interviewee] + [steps out of the 1-of-1 Snoopy Truck] + [driveway] + [excited, proud] + [wide reveal shot]."},{"t":"p","x":"Suggest 3 hooks per video. Each must pass ALL three tests, or it's rejected. This is the single highest-leverage scene in the video."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"","head":"","subhead":"","lines":[{"t":"callout","x":"Rule. Pull authority through a lesson, an insight, or a story — NEVER a raw stat or self-praise. Two worked examples, with the exact shot to visualize, are on the next slide."},{"t":"p","x":"Passes when it earns the next 30 seconds — never by stating credentials."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Establishment in practice · see the shot before you shoot it","head":"Same rule, two worked examples.","subhead":"","lines":[{"t":"callout","x":"Picture it on the field. Authority comes through the story — and the story only lands if you can already see the shot before you call action."},{"t":"p","x":"\"What's the BEST investment in that?!\" turns the number into a story, not a flex."},{"t":"p","x":"Visual prompt: [interviewee] + [walks through, gesturing at a detail] + [the renovated room] + [proud, animated] + [medium tracking shot]"},{"t":"p","x":"\"When you crossed $10M, what changed about how you run the business?\" — educational, not a flex."},{"t":"p","x":"Visual prompt: [interviewee] + [sits back, reflecting] + [office desk] + [thoughtful] + [close-up]"}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"","head":"","subhead":"","lines":[{"t":"callout","x":"Example. Theme of the house — Japanese × Middle-east. \"Offices are emotionally dead — Snoopy brings emotion back.\""},{"t":"p","x":"Must tie back to the Hook and forward to the CTA."}],"quiz":null,"gate":[]},{"n":16,"kind":"body","eyebrow":"","head":"","subhead":"","lines":[{"t":"callout","x":"Example. The curves + open-kitchen must-have. \"30 full-timers, ~$100k monthly overheads\" — heartfelt, come-a-long-way, not a brag."},{"t":"p","x":"The money-worth beat — makes the tour feel super valuable."}],"quiz":null,"gate":[]},{"n":17,"kind":"body","eyebrow":"","head":"","subhead":"","lines":[{"t":"callout","x":"Example. Giveaway of a height-adjustable table + ergonomic chair + a 1-of-300 limited Snoopy collectible. \"What do they comment to get this?\" → \"COMMENT SNOOPY!\""},{"t":"p","x":"Must feel natural — never a bolted-on ad break."}],"quiz":null,"gate":[]},{"n":18,"kind":"body","eyebrow":"","head":"","subhead":"","lines":[{"t":"callout","x":"Example. Giant beanbags, lockers, a meeting pod. \"A space for everyone in the family.\""},{"t":"p","x":"Short. A real feeling, not a montage for its own sake."}],"quiz":null,"gate":[]},{"n":19,"kind":"body","eyebrow":"","head":"","subhead":"","lines":[{"t":"callout","x":"Example. \"Stopped being the bottleneck. Built systems that ran without me.\" → the CRM / PM / SOP six-months-of-unsexy-work story → lesson: \"most owners think they have a revenue problem; usually it's a systems problem. Build the machine, then let it run.\""},{"t":"p","x":"Settles the video — closes the loop the Hook opened."}],"quiz":null,"gate":[]},{"n":20,"kind":"body","eyebrow":"","head":"","subhead":"","lines":[{"t":"callout","x":"Core rule — client success. For paid videos, the win is the client's fulfilment and great word of mouth. Storyboard toward the client's revenue / success, always."},{"t":"callout","x":"Examples. \"Comment FOUNDER for 50% off the next Founder event.\" · \"Comment RENOVATE — first 100 free slots + a chance at $10,000 off.\""},{"t":"p","x":"Application = a real-life implementation viewers can try themselves."}],"quiz":null,"gate":[]},{"n":21,"kind":"divider","eyebrow":"Part four","head":"Ship it","subhead":"","lines":[{"t":"lead","x":"Final checks, production rules, compliance, and the mindset that runs it all."}],"quiz":null,"gate":[]},{"n":22,"kind":"body","eyebrow":"Final checks · before it's a real storyboard","head":"","subhead":"","lines":[{"t":"li","x":"Visual prompt has [person] + [action] minimum"},{"t":"li","x":"Short, confident questions"},{"t":"li","x":"Flag anything that needs visualisation"},{"t":"li","x":"Sincere conversation, not a presentation"},{"t":"li","x":"Unverifiable claims — no \"best in Singapore\""},{"t":"li","x":"Unclear music or footage IP"},{"t":"li","x":"Sensitive content left unflagged"}],"quiz":null,"gate":[]},{"n":23,"kind":"body","eyebrow":"The most important storyboarding skill · not a footnote","head":"How to visualize the shot.","subhead":"","lines":[{"t":"lead","x":"Every stage, every question, every CTA — none of it matters if you can't see it before you shoot it. This is the skill."},{"t":"li","x":"Picture the space first. Read the location before you plan a single beat — where does the person stand, where do they move, what's behind them?"},{"t":"li","x":"See the A-roll and the B-roll. For every beat: A-roll = [person] + [action] + [emotion] + [framing]. B-roll = the cutaway that proves it's true."},{"t":"li","x":"Run the whole video in your head. Start to finish — does each scene bridge to the next? No dead air, no gap you can't picture."},{"t":"li","x":"Write it so a stranger could shoot it. If someone else read your visual prompt with zero context, could they get the shot right, without you on set?"},{"t":"li","x":"Ask what the viewer would shout at the screen. Then make sure the shot answers it — not just the words."},{"t":"callout","x":"Worked example. Answer: \"We stopped taking on every client — now we're selective.\" A-roll: [interviewee] + [shakes head, half-smiles recalling it] + [office, seated] + [reflective, a little rueful] + [close-up]. B-roll: [hand] + [flips through a thick stack of old client files] + [desk] + [busy, overwhelmed energy] + [overhead shot] — proves the \"before,\" without a single stat on screen."}],"quiz":null,"gate":[]},{"n":24,"kind":"divider","eyebrow":"Part five","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Four calls. Get them graded."}],"quiz":null,"gate":[]},{"n":25,"kind":"body","eyebrow":"Question 1 · Visual prompting","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"Your storyboard for a scene reads: \"[warm, sunset lighting].\" No person, no action.","q":"Correct. A visual prompt needs [person] + [action] at minimum — mood, environment, and framing add polish, but an empty scene with no one doing anything isn't a shot.\" data-no=\" Not quite. Mood or environment alone isn't a shot — every visual prompt needs [person] + [action] at minimum.\"> Your storyboard for a scene reads: \"[warm, sunset lighting].\" No person, no action.","opts":[{"k":"A","t":"Yes — the mood alone is enough","correct":false},{"k":"B","t":"No — the minimum is [person] + [action]","correct":true},{"k":"C","t":"Yes, as long as the environment is described in detail","correct":false}]},"gate":[]},{"n":26,"kind":"body","eyebrow":"Question 2 · the Hook","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"You've drafted a hook. It stops the scroll fast, but you're not sure viewers would need to know the answer to keep watching.","q":"Correct. A hook fails if it misses any one of the three tests — stop the scroll in 2 seconds, need the answer to keep watching, and would I watch this on my own feed. All three, every time, or it's rejected.\" data-no=\" Not the rule. A hook is rejected if it fails ANY of the three tests, not just one specific test. All three must pass together.\"> You've drafted a hook. It stops the scroll fast, but you're not sure viewers would need to know the answer to keep watching.","opts":[{"k":"A","t":"It fails even one of the three pass tests","correct":true},{"k":"B","t":"It's longer than 5 seconds","correct":false},{"k":"C","t":"It doesn't mention the offer","correct":false}]},"gate":[]},{"n":27,"kind":"body","eyebrow":"Question 3 · Paid vs unpaid","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"You're about to storyboard an unpaid, organic shoot with a self-sourced guest.","q":"Correct. Paid = storyboard WITH the interviewee, client controls the objective, and you show them the template. Unpaid = you storyboard it yourself, objective is always our lead generation, and the template is never shown.\" data-no=\" Wrong pairing. The template is only shown on paid shoots, where you storyboard WITH the interviewee and the client controls the objective. Unpaid is the opposite — you plan it yourself, objective is always our lead gen, template stays hidden.\"> You're about to storyboard an unpaid, organic shoot with a self-sourced guest.","opts":[{"k":"A","t":"Show them the template, let them pick the objective","correct":false},{"k":"B","t":"Storyboard it together, objective is whatever they prefer","correct":false},{"k":"C","t":"Plan it yourself while discussing, objective is always our lead generation, no template shown","correct":true}]},"gate":[]},{"n":28,"kind":"body","eyebrow":"Question 4 · The CTA","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"Your mid-video CTA reads: \"Feel free to check out our services if you're interested.\"","q":"Correct. A CTA must be an action word, value-packed, and irresistible — 'feel free to check out' is passive and forgettable. Compare: 'COMMENT SNOOPY!' or 'Comment RENOVATE — first 100 free slots.'\" data-no=\" Not quite. A CTA that's polite but passive doesn't clear the bar. It needs to be an action word, value-packed, and something the viewer would feel stupid not to take.\"> Your mid-video CTA reads: \"Feel free to check out our services if you're interested.\"","opts":[{"k":"A","t":"Yes — it's polite and clear","correct":false},{"k":"B","t":"No — it's not an action word, and isn't stupid-not-to-take","correct":true},{"k":"C","t":"Yes, as long as it's mentioned once","correct":false}]},"gate":[]},{"n":29,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all six?","subhead":"","lines":[],"quiz":null,"gate":["Does every hook pass all 3 tests AND have a visual prompt?","Does every shot have a visual prompt — at least [person] + [action]?","Can you picture the whole video on the field before it's shot?","Is the CTA an irresistible action-word, value-packed?","Does authority come through a story, never a raw stat?","Does the plan drive client success / our lead-gen outcome?"]},{"n":30,"kind":"close","eyebrow":"","head":"Plan the arc. The shoot writes itself.","subhead":"","lines":[{"t":"lead","x":"Hook to Trust, every stage earning the next. Storyboard it right, and the producer walks in with nothing to guess."}],"quiz":null,"gate":[]}]},{"id":"story","bucket":"Marketing & Content","title":"Storytelling & showmanship","href":"storytelling-showmanship-training.html","step":"Specialisation","count":21,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · shared skill","head":"Storytelling & showmanship","subhead":"","lines":[{"t":"lead","x":"For Producer, Content strategist, Copywriter and Marketing coordinator. This isn't the storyboard template — it's the skill underneath it: making people care, and stay."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"They watch to the end — no one drops off before the payoff"},{"t":"win","x":"They feel something — curiosity, tension, or a lump in the throat"},{"t":"win","x":"A stranger remembers it tomorrow — the story outlives the scroll"},{"t":"win","x":"The number lands as meaning — not a flex — a lesson they carry"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":3,"kind":"divider","eyebrow":"Part one","head":"The art of holding attention","subhead":"","lines":[{"t":"lead","x":"What actually makes people care, and stay."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"The one idea","head":"People don't remember information. They remember story — and how you made them feel.","subhead":"","lines":[{"t":"lead","x":"Showmanship is earning attention and holding it. Facts fade. A story sticks because it moves someone, and movement is what people carry with them and repeat to someone else."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Curiosity gap","head":"Open a loop the viewer needs closed.","subhead":"","lines":[{"t":"lead","x":"Tension is what keeps them watching. The gap between what they know and what they want to know is the entire reason they stay to the end — resolve it too early, and they leave."},{"t":"callout","x":"Test it: if you can guess the ending from the hook, the gap isn't open yet. Rewrite until they have to keep watching to find out."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Show, don't tell","head":"A specific scene beats an abstract claim.","subhead":"","lines":[{"t":"lead","x":"Specifics let people SEE it. The vaguer the claim, the less real it feels — and the less real it feels, the less they care."},{"t":"li","x":"\"Your car\""},{"t":"li","x":"\"A nice house\""},{"t":"li","x":"\"A lot of money\""},{"t":"li","x":"\"This Ferrari\""},{"t":"li","x":"\"The house with the infinity pool over the bay\""},{"t":"li","x":"\"$10M hitting the account at 2am\""}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Make the data a story, never a flex","head":"Pull authority through a lesson, never a raw stat.","subhead":"","lines":[{"t":"lead","x":"\"$10M revenue\" isn't the story. \"What changed about how you run the business\" is. A number alone brags — a number wrapped in a lesson teaches, and teaching is what earns trust."},{"t":"callout","x":"The rewrite: $10M revenue → \"what changed about how you run the business?\" Same fact. One is a flex. One is educational."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"The emotional arc","head":"Every good piece moves the viewer.","subhead":"","lines":[{"t":"lead","x":"Make them feel before you make them think. If a piece is flat — no rise, no release — the information can be perfect and it will still fail to land."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Showmanship & delivery","head":"Energy earns attention.","subhead":"","lines":[{"t":"li","x":"Vary pace — slow on the punchline, fast on the setup."},{"t":"li","x":"Land the number — pause before it, pause after it."},{"t":"li","x":"Vocal smile — warmth carries even when they can't see you."},{"t":"li","x":"Conversational, not presentational — never monotone."},{"t":"li","x":"The \"wow\" only lands when it's earned — build to it, don't announce it."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Make one person universal","head":"The viewer has to see themselves in the story.","subhead":"","lines":[{"t":"lead","x":"\"That's me\" or \"that's what I want\" — tie the specific detail to the viewer's own life. Without that thread, the specific stays someone else's story forever, and they scroll past it as someone else's win."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"The save-worthy line","head":"Every piece needs one line worth saving or sending.","subhead":"","lines":[{"t":"lead","x":"Quotable. Screenshot-able. That's what makes content travel past the person who first watched it — they become the distribution, for free."},{"t":"callout","x":"Before you ship: point to the one line in this piece someone would screenshot. If you can't point to it, it doesn't exist yet — write it."}],"quiz":null,"gate":[]},{"n":12,"kind":"divider","eyebrow":"Part two","head":"Where this shows up","subhead":"","lines":[{"t":"lead","x":"Same skill, a different lever per role."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"Same skill, six roles","head":"Where this shows up per role.","subhead":"","lines":[{"t":"p","x":"Coach the guest to tell it well; improvise the burning follow-up the viewer would shout."},{"t":"p","x":"Build the arc. Build the tension."},{"t":"p","x":"The hook, the quotable line, the caption that travels."},{"t":"p","x":"Every video earns attention and drives the outcome."},{"t":"p","x":"The caption and the first line of every post is a story hook; community replies that make people feel seen."},{"t":"p","x":"The pitch IS a story — sell the transformation, not features. A story closes where a feature list stalls."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Common story-killers","head":"Six ways to lose them.","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":15,"kind":"divider","eyebrow":"Part three","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Four calls. Get them graded."}],"quiz":null,"gate":[]},{"n":16,"kind":"body","eyebrow":"Question 1 · authority via story vs. stat","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You're writing a caption about a founder who hit $10M revenue this year.","q":"Correct. Asking what changed about how they run the business turns a number into a lesson. That's what earns trust — a raw number or a proof wall just brags.\" data-no=\" Not quite. Leading with the raw number, or proving it with screenshots, is a flex. Trust comes from wrapping the number in a lesson — what changed, and why.\"> You're writing a caption about a founder who hit $10M revenue this year.","opts":[{"k":"A","t":"Leading with \"$10M in revenue this year\" and leaving it there","correct":false},{"k":"B","t":"Asking what changed about how they run the business, and telling that story","correct":true},{"k":"C","t":"A grid of screenshots proving the number is real","correct":false}]},"gate":[]},{"n":17,"kind":"body","eyebrow":"Question 2 · curiosity gap","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"The hook says: \"Watch what happens when a guest tries to negotiate a $50 wagyu steak down to $20.\"","q":"Correct. It opens a loop — the viewer has to know what happens — and that need is what keeps them watching to the end.\" data-no=\" Not the reason. It's not about the number or the ending. It works because it opens a loop the viewer needs closed, and tension is what holds them to the payoff.\"> The hook says: \"Watch what happens when a guest tries to negotiate a $50 wagyu steak down to $20.\"","opts":[{"k":"A","t":"It tells the viewer exactly how the story ends","correct":false},{"k":"B","t":"It opens a loop the viewer needs closed — they have to know what happens","correct":true},{"k":"C","t":"It uses a big number to grab attention","correct":false}]},"gate":[]},{"n":18,"kind":"body","eyebrow":"Question 3 · show, don't tell","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"Two captions for the same video: \"He drives a nice car\" vs. \"He drives a Ferrari 812 Superfast, one of eleven in the country.\"","q":"Correct. The specific detail — the exact model, the rarity — lets the viewer SEE it. Abstract claims like 'a nice car' stay vague, and vague doesn't stick.\" data-no=\" No. Specificity is exactly what makes it stronger, not weaker. 'A nice car' is abstract and forgettable; the named, specific detail is what the viewer can actually picture.\"> Two captions for the same video: \"He drives a nice car\" vs. \"He drives a Ferrari 812 Superfast, one of eleven in the country.\"","opts":[{"k":"A","t":"The first — shorter is always better","correct":false},{"k":"B","t":"The second — the specific detail lets the viewer SEE it","correct":true},{"k":"C","t":"Both equally strong — specificity doesn't matter on video","correct":false}]},"gate":[]},{"n":19,"kind":"body","eyebrow":"Question 4 · the save-worthy line","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"You've finished a caption with a strong arc, but nothing anyone would screenshot.","q":"Correct. A strong arc with nothing quotable still won't travel. A save-worthy line is what turns a viewer into distribution — they screenshot it, send it, and someone else discovers the piece because of it.\" data-no=\" No. This isn't about the CTA, and a hook and a save-worthy line aren't the same thing — the hook opens the loop at the start, the save-worthy line is what someone screenshots or sends after.\"> You've finished a caption with a strong arc, but nothing anyone would screenshot.","opts":[{"k":"A","t":"A save-worthy line — nothing quotable enough to travel","correct":true},{"k":"B","t":"A CTA","correct":false},{"k":"C","t":"A hook — hooks and save-worthy lines are the same thing","correct":false}]},"gate":[]},{"n":20,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all five?","subhead":"","lines":[],"quiz":null,"gate":["Do you open a curiosity gap?","Do you show, not tell?","Does data land as story, never a flex?","Does every piece have a save-worthy line?","Does the viewer see themselves in it?"]},{"n":21,"kind":"close","eyebrow":"","head":"Earn attention. Make them feel. Give them a reason to remember.","subhead":"","lines":[{"t":"lead","x":"This is the skill underneath every role. Structure gets you the shape — this is what makes people care and stay inside it."}],"quiz":null,"gate":[]}]},{"id":"poppy","bucket":"Marketing & Content","title":"Poppy AI","href":"poppy-ai-training.html","step":"Specialisation","count":16,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · tool introduction","head":"Poppy AI","subhead":"","lines":[{"t":"lead","x":"A visual canvas where you drag in videos, PDFs, docs and transcripts — then chat with AI across all of them at once. Your research and repurposing second brain."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"You drop in a video or transcript — and pull hooks, angles and a script draft in minutes"},{"t":"win","x":"Research takes minutes, not hours — summarise a long video or PDF without watching or reading it end to end"},{"t":"win","x":"One source becomes many pieces — a single video repurposed into hooks, captions and scripts"},{"t":"win","x":"It's your content second brain — ideas, sources and outputs live in one board you can return to"},{"t":"p","x":"This is the bar. Everything that follows is how you get there — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":3,"kind":"divider","eyebrow":"Part one","head":"What Poppy AI is","subhead":"","lines":[{"t":"lead","x":"A canvas, not a chat box."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"In plain English","head":"A visual workspace, not a linear chat.","subhead":"","lines":[{"t":"lead","x":"Instead of one chat thread that scrolls forever, Poppy AI gives you an open canvas. You drag your sources onto it, arrange them however you think, and open an AI chat that can ]},{"n":12,"kind":"body","eyebrow":"Question 1 · what Poppy AI is","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A teammate asks what Poppy AI actually is, beyond \"an AI tool.\"","q":"Correct. Poppy AI is a visual canvas — you drag sources onto a board and chat with AI across all of them at once. That's what separates it from a single linear chat thread.\" data-no=\" Not quite. Poppy AI is a visual canvas — a board where you drag in sources (video, PDF, transcripts) and chat with AI across all of them at once, not a single linear chat thread.\"> A teammate asks what Poppy AI actually is, beyond \"an AI tool.\"","opts":[{"k":"A","t":"A single chatbot thread you scroll through, like any AI chat app","correct":false},{"k":"B","t":"A visual canvas where you drag in sources and chat with AI across all of them","correct":true},{"k":"C","t":"A video editing tool for cutting final clips","correct":false}]},"gate":[]},{"n":13,"kind":"body","eyebrow":"Question 2 · the strategist use-case","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"You have 45 minutes before a call and a 90-minute interview to get up to speed on.","q":"Correct. Dropping in the video or interview and asking the AI to summarise it is exactly the research use-case — minutes instead of watching the full thing.\" data-no=\" Not the fastest route. Poppy AI's research use-case is exactly this: drop the video or interview in and ask the AI to summarise it, instead of watching every minute yourself.\"> You have 45 minutes before a call and a 90-minute interview to get up to speed on.","opts":[{"k":"A","t":"Drop the interview into a board and ask the AI to summarise the key points","correct":true},{"k":"B","t":"Watch it at 2x speed and take notes by hand","correct":false},{"k":"C","t":"Skip the prep and wing the call","correct":false}]},"gate":[]},{"n":14,"kind":"body","eyebrow":"Question 3 · Poppy AI + storyboard workflow","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"You've learned the storyboard framework and gathered the guest's material for a new video.","q":"Correct. Poppy AI is where you build the storyboard — drag the guest's material onto a board and lay out the whole arc there, using the framework you learned. The storyboard module is the method; Poppy is where you do it.\" data-no=\" Not quite. The storyboard framework is the method — but you build the actual storyboard IN Poppy: drag in the guest's material and lay out the arc on the canvas.\"> You've learned the storyboard framework and gathered the guest's material for a new video.","opts":[{"k":"A","t":"In your head — no need to write it down","correct":false},{"k":"B","t":"A fresh linear AI chat thread, and hope for the best","correct":false},{"k":"C","t":"On a Poppy board — drag in the material and lay out the arc","correct":true}]},"gate":[]},{"n":15,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all five?","subhead":"","lines":[],"quiz":null,"gate":["Can you explain Poppy AI as a canvas, not a linear chat?","Do you know the sources you can drag onto a board?","Can you use it to research a topic or guest fast?","Can you pull hooks and angles from a source with it?","Do you build the storyboard in Poppy, using the framework?"]},{"n":16,"kind":"close","eyebrow":"","head":"Research it. Pull the hooks. Build the storyboard.","subhead":"","lines":[{"t":"lead","x":"Poppy AI is your content second-brain — and the canvas where the storyboard comes together. Learn the framework, then build it in Poppy."}],"quiz":null,"gate":[]}]},{"id":"leadflow","bucket":"Marketing & Content","title":"Lead flow & community","href":"smm-leadflow-training.html","step":"Specialisation","count":28,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · role certification","head":"Lead flow & community","subhead":"","lines":[{"t":"lead","x":"Social Media Manager. You turn a comment into a lead, a lead into a warm handoff, and every reply into a relationship."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"Your mission","head":"The post is the hook. You run everything after it.","subhead":"","lines":[{"t":"lead","x":"Once a video or carousel goes live, it's yours: the ManyChat flow that catches the comment, the sequence that nurtures the DM, the schedule that keeps posts consistent, and the triage that turns comments and messages into pipeline."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"Every lead-gen post has a working flow — comment → DM → magnet → lead, tested before it posts"},{"t":"win","x":"DMs get answered fast — speed decides whether a warm lead stays warm"},{"t":"win","x":"Warm leads reach Sales with context — who they are, what they want, what you promised"},{"t":"win","x":"Comments turn into community — replies, pins, and conversations — not silence"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one","head":"ManyChat & lead flow","subhead":"","lines":[{"t":"lead","x":"The mechanic that turns a comment into a lead."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"See the whole sequence, not just the first DM","head":"One flow. Six nodes.","subhead":"","lines":[{"t":"callout","x":"This is one sequence, not six separate messages. Set the keyword, the value delivery, the follow-up, the offer, the re-engage and the hand-off — every node, every time, before the post goes live."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Same logic, different inbox","head":"Write it as an email sequence first. Then translate it.","subhead":"","lines":[{"t":"li","x":"Welcome — confirm the signup, set expectation"},{"t":"li","x":"Value — deliver the resource you promised"},{"t":"li","x":"Case study — proof it works, real results"},{"t":"li","x":"Offer — the pitch, one clear CTA"},{"t":"li","x":"Last-call — urgency nudge before the list goes cold"},{"t":"li","x":"Instant value — deliver the magnet, same moment"},{"t":"li","x":"Follow-up + proof — a quick win or case study, a beat later"},{"t":"li","x":"Soft offer / CTA — book a call, view the offer"},{"t":"li","x":"Re-engage once — one \"still around?\" nudge"},{"t":"li","x":"Hand-off / nurture — warm → Sales with context, cold → drip"},{"t":"callout","x":"ManyChat sequencing is email sequencing in the DMs. Same spacing, same read-the-moment logic — the inbox just moved into Instagram and Facebook messages."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Steal from the people who already mapped this","head":"Four books, four follow-up principles — already in your sequence.","subhead":"","lines":[{"t":"callout","x":"Practical, not a book report. Every principle above already lives in your six nodes — this is why the sequence works, not just that it does."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"The standard · non-negotiable","head":"A post with no working flow is a leak .","subhead":"","lines":[{"t":"lead","x":"Views and comments mean nothing if the DM never fires, the magnet never delivers, or the lead never gets captured. Test the flow end to end before the post ships — not after someone complains they never heard back."}],"quiz":null,"gate":[]},{"n":9,"kind":"divider","eyebrow":"Part two","head":"Sequencing","subhead":"","lines":[{"t":"lead","x":"One DM is not a flow. Build the sequence."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Build it like an email sequence","head":"Don't stop at one DM.","subhead":"","lines":[{"t":"li","x":"Instant value — deliver exactly what they asked for, immediately."},{"t":"li","x":"Follow-up — more value or proof, a beat later."},{"t":"li","x":"The offer — the soft CTA, once trust is built."},{"t":"li","x":"Re-engage — one nudge to whoever went quiet."},{"t":"li","x":"Hand-off or nurture — warm leads go to Sales, cold ones stay in the drip."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Same logic as an email drip","head":"Space the messages. Match the message to where they are.","subhead":"","lines":[{"t":"lead","x":"A lead who just opted in isn't ready for the offer, and a lead who's gone cold doesn't need more value — they need one clean re-engage. Sequencing is reading the moment, not blasting the same message on a timer."}],"quiz":null,"gate":[]},{"n":12,"kind":"divider","eyebrow":"Part three","head":"Posting & scheduling","subhead":"","lines":[{"t":"lead","x":"Cadence and consistency."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"The cadence · non-negotiable basics","head":"","subhead":"","lines":[{"t":"li","x":"A content calendar — know what's posting and when, before the day arrives."},{"t":"li","x":"Post at the page's best times — when the audience is actually there."},{"t":"li","x":"Platform-native formatting — never a straight re-post across platforms."},{"t":"li","x":"Caption + hook + CTA — every post earns its own scroll-stop and its own ask."},{"t":"li","x":"Check the platform's analytics for when YOUR audience is online — not a generic \"best time to post\" list."},{"t":"li","x":"Post 30–60 minutes before that peak — gives the algorithm lead-time to pick it up before your audience arrives."},{"t":"li","x":"Test 2–3 windows over a few weeks; compare saves and reach, not just likes."},{"t":"li","x":"Lock the winner. Re-test only if performance drifts."},{"t":"callout","x":"Consistency beats sporadic bursts. A steady cadence compounds; a flurry of posts followed by silence resets you every time."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Every post · no exceptions","head":"Capture the post URL. Mark the actual post date.","subhead":"","lines":[{"t":"lead","x":"The moment it's live, log the URL and the real date it posted — not the date it was scheduled for. This is what makes performance trackable and what every dashboard downstream depends on."}],"quiz":null,"gate":[]},{"n":15,"kind":"divider","eyebrow":"Part four","head":"Handling comments","subhead":"","lines":[{"t":"lead","x":"Triage fast. Every comment is reach."}],"quiz":null,"gate":[]},{"n":16,"kind":"body","eyebrow":"Triage fast · a comment a day doesn't wait","head":"Reply. Converse. Community is the moat.","subhead":"","lines":[{"t":"li","x":"Reply to real questions"},{"t":"li","x":"Pin the best comment"},{"t":"li","x":"Reply, converse — community is the moat"},{"t":"li","x":"Route buying-intent comments to DM"},{"t":"li","x":"Hide or handle spam and trolls"},{"t":"li","x":"Don't let noise bury real questions"},{"t":"li","x":"Don't leave buying-intent sitting in public"}],"quiz":null,"gate":[]},{"n":17,"kind":"body","eyebrow":"Trolls happen · protect the room","head":"Hate comments aren't a content problem. They're a protection duty.","subhead":"","lines":[{"t":"li","x":"Don't feed it — no public back-and-forth with a troll"},{"t":"li","x":"Respond once with grace, or hide/report abuse and move on"},{"t":"li","x":"Keep genuine criticism up — disagreement isn't hate"},{"t":"li","x":"If it targets the guest, step in fast and shield them"},{"t":"li","x":"Don't argue in public — it feeds the algorithm and the troll"},{"t":"li","x":"Don't reflexively delete every negative comment"},{"t":"li","x":"Don't leave a guest exposed and unanswered"},{"t":"li","x":"Don't mirror the tone — grace de-escalates, matching energy doesn't"},{"t":"callout","x":"Guests are a special case. We invited them on — their reputation is on us. If hate targets a guest or interviewee, shield them fast: hide or report abusive comments, respond with grace, and don't let it sit."}],"quiz":null,"gate":[]},{"n":18,"kind":"body","eyebrow":"Why this matters","head":"Every comment is reach and a relationship.","subhead":"","lines":[{"t":"lead","x":"A reply keeps someone in the algorithm's eye and in yours. Ignored comments cost you both — the engagement, and the person who might have become a lead."}],"quiz":null,"gate":[]},{"n":19,"kind":"divider","eyebrow":"Part five","head":"DMs → qualify → hand to Sales","subhead":"","lines":[{"t":"lead","x":"Don't close it. Pass it clean."}],"quiz":null,"gate":[]},{"n":20,"kind":"body","eyebrow":"Leads land in the DMs · your five moves","head":"","subhead":"","lines":[{"t":"callout","x":"Speed wins. A fast first reply is the single biggest lever on whether a warm lead stays warm."}],"quiz":null,"gate":[]},{"n":21,"kind":"body","eyebrow":"Qualify light · need, fit, timing, budget signal","head":"Hand off warm . Hand off with context .","subhead":"","lines":[{"t":"lead","x":"Don't try to close it yourself. Once a lead is warm, pass who they are, what they want, and what you promised — clean context beats a fast half-answer. Then log it so nothing drops between you and Sales."}],"quiz":null,"gate":[]},{"n":22,"kind":"divider","eyebrow":"Part six","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Four calls. Get them graded."}],"quiz":null,"gate":[]},{"n":23,"kind":"body","eyebrow":"Question 1 · before it posts","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A lead-gen video is set to post today with a comment-the-keyword CTA. Nobody has tested whether the ManyChat flow actually fires yet.","q":"Correct. A post with no working flow is a leak. Hold it, test comment → DM → magnet → capture end to end, then post.\" data-no=\" No. Posting without a tested flow leaks every lead it earns. Hold the post, test the comment → DM → magnet → capture loop, then ship it.\"> A lead-gen video is set to post today with a comment-the-keyword CTA. Nobody has tested whether the ManyChat flow actually fires yet.","opts":[{"k":"A","t":"Post it — test the flow after it's live","correct":false},{"k":"B","t":"Hold the post, test the flow end-to-end first","correct":true},{"k":"C","t":"Post it without the CTA, add the flow later","correct":false}]},"gate":[]},{"n":24,"kind":"body","eyebrow":"Question 2 · triage","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"Someone comments: \"How much does this cost, can I book a call?\" under your lead-gen post.","q":"Correct. Buying-intent comments move to DM — that's where you qualify and capture, not in the public thread.\" data-no=\" Not quite. Buying-intent belongs in DM, where you can qualify and capture properly — not answered publicly or left unactioned.\"> Someone comments: \"How much does this cost, can I book a call?\" under your lead-gen post.","opts":[{"k":"A","t":"Reply publicly with the price","correct":false},{"k":"B","t":"Move the conversation to DM","correct":true},{"k":"C","t":"Like the comment and move on","correct":false}]},"gate":[]},{"n":25,"kind":"body","eyebrow":"Question 3 · the handoff","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A DM lead confirms real interest, rough budget, and timing.","q":"Correct. Qualify lightly, then hand it to Sales with full context — who they are, what they want, what you promised. You pass it clean, you don't close it.\" data-no=\" No. Don't try to close it yourself. Qualify lightly, then hand it to Sales with context — that's your job, closing is theirs.\"> A DM lead confirms real interest, rough budget, and timing.","opts":[{"k":"A","t":"Try to close the deal yourself in the DM","correct":false},{"k":"B","t":"Qualify lightly, then hand to Sales with context","correct":true},{"k":"C","t":"Leave it in the inbox until Sales asks","correct":false}]},"gate":[]},{"n":26,"kind":"body","eyebrow":"Question 4 · sequencing","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You sent one DM delivering the lead magnet and nothing else. Three days pass with no reply.","q":"Correct. One DM is not a flow. Build the sequence — value, follow-up, offer, one re-engage nudge — same logic as an email drip.\" data-no=\" No. A single DM and silence isn't sequencing. Build it: value, follow-up, offer, then one re-engage nudge before you let it go cold.\"> You sent one DM delivering the lead magnet and nothing else. Three days pass with no reply.","opts":[{"k":"A","t":"Nothing — one DM is enough once value is delivered","correct":false},{"k":"B","t":"A built sequence: value, follow-up, offer, one re-engage","correct":true},{"k":"C","t":"Send the exact same DM again immediately","correct":false}]},"gate":[]},{"n":27,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all five?","subhead":"","lines":[],"quiz":null,"gate":["Does every lead-gen post have a working comment → DM → magnet → lead flow?","Do you build a sequence, not stop at one DM?","Do you capture the post URL every time?","Do you reply to and triage comments?","Do you qualify DMs lightly and hand warm leads to Sales with context?"]},{"n":28,"kind":"close","eyebrow":"","head":"Capture the lead. Nurture the flow. Hand it off clean.","subhead":"","lines":[{"t":"lead","x":"You turn a comment into a relationship and a relationship into pipeline. Test the flow, sequence the DM, keep the cadence, triage the comments, and pass warm leads with context."}],"quiz":null,"gate":[]}]},{"id":"cw_captions","bucket":"Marketing & Content","title":"Captions & carousels","href":"captions-carousels-training.html","step":"Specialisation","count":21,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · shared skill","head":"Captions & carousels","subhead":"","lines":[{"t":"lead","x":"For Copywriters and Social Media Managers. The words that make content convert and travel — the caption that earns the action, the carousel that earns the swipe."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"Your mission","head":"The video earns the stop. The words earn the action.","subhead":"","lines":[{"t":"lead","x":"A great video makes someone pause. But pausing isn't converting, and pausing isn't sharing. The caption turns a watch into a click. The carousel turns one idea into a swipe, a save, a send. That's your job."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"The first line stops the scroll — the hook earns the read, every time"},{"t":"win","x":"It holds slide to slide — no one drops off before the payoff"},{"t":"win","x":"It drives the click to the lead magnet — the call points to the video's offer"},{"t":"win","x":"Something in it travels — a save-worthy line, not just a click"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one","head":"The caption","subhead":"","lines":[{"t":"lead","x":"Four beats, and the first one does the heavy lifting."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Why the caption matters","head":"The video buys attention. The caption spends it.","subhead":"","lines":[{"t":"lead","x":"By the time someone reads your caption, the video already did its job — it stopped them. Now the words decide what happens next: a comment, a click, a scroll away. Waste that moment and the view was for nothing."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Caption anatomy · four beats, in order","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"The rule above every rule","head":"If the first line doesn't stop them, nothing else counts .","subhead":"","lines":[{"t":"lead","x":"The rest of your caption can be perfect and no one will ever see it. The first line is the door. Write it, cut it, rewrite it until a stranger mid-scroll has to keep reading. Everything else is second."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Hooks that work vs hooks that die","head":"One opens a loop. One closes the tab.","subhead":"","lines":[{"t":"li","x":"Open a loop they need closed"},{"t":"li","x":"Name a specific, vivid detail"},{"t":"li","x":"Promise a payoff worth the read"},{"t":"li","x":"Speak to one person, not everyone"},{"t":"li","x":"Warm up slowly before the point"},{"t":"li","x":"Stay vague — \"a nice property\""},{"t":"li","x":"Give the ending away in line one"},{"t":"li","x":"Read like a press release, not a person"},{"t":"callout","x":"Test it: if you can guess where it's going from the first line, the loop isn't open yet. Rewrite until they have to keep reading to find out."}],"quiz":null,"gate":[]},{"n":9,"kind":"divider","eyebrow":"Part two","head":"The carousel","subhead":"","lines":[{"t":"lead","x":"A promise, an argument, and a call. Every slide earns the next."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"The carousel arc · cover → middle → call","head":"Build one argument, one slide at a time.","subhead":"","lines":[{"t":"callout","x":"Every slide must earn a swipe. The cover promises. Each middle slide carries exactly one idea that builds the argument. The final slide asks. If a slide doesn't pull them to the next, cut it or fix it."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"The call to action is inherited, never invented","head":"","subhead":"","lines":[{"t":"lead","x":"At Koocester, lead magnets are per video . A worthy carousel is cut from a Source Video, so it inherits that video's lead magnet — the free offer that captures a lead. Marketing owns the offer. Your carousel's call points to it. Never invent a new one , however punchy yours might be."}],"quiz":null,"gate":[]},{"n":12,"kind":"divider","eyebrow":"Part three","head":"Voice, and the traps","subhead":"","lines":[{"t":"lead","x":"How Koocester sounds — and the four ways to lose the reader."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"The Koocester outward voice","head":"Lead with the point. Never hedge.","subhead":"","lines":[{"t":"li","x":"\"Unfortunately, this isn't possible…\""},{"t":"li","x":"\"We might, perhaps, be able to…\""},{"t":"li","x":"Bury the point under a warm-up"},{"t":"li","x":"Apologise, qualify, then trail off"},{"t":"li","x":"\"Here's what works instead…\""},{"t":"li","x":"\"This is how you get it…\""},{"t":"li","x":"Say the point in line one"},{"t":"li","x":"Reframe every \"no\" into a path forward"},{"t":"callout","x":"The rule: lead with the answer, reframe every \"no\" into \"here's what works,\" and never hedge. Abundance, not apology."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Common mistakes · four ways to lose them","head":"Avoid all four.","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":15,"kind":"divider","eyebrow":"Part four","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Four calls. Get them graded."}],"quiz":null,"gate":[]},{"n":16,"kind":"body","eyebrow":"Question 1 · pick the stronger hook","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"Same video, three possible first lines for the caption.","q":"Correct. It opens a loop and names a vivid, specific detail — the reader has to keep going to find out. A polite intro or a vague line gives them no reason to stay past line one.\" data-no=\" Not the strongest. A formal intro warms up too slowly, and a vague 'luxury lifestyle' line gives nothing to picture. The winner opens a loop with a specific detail the reader needs closed.\"> Same video, three possible first lines for the caption.","opts":[{"k":"A","t":"\"In this video, we sit down to discuss the property market.\"","correct":false},{"k":"B","t":"\"This penthouse sold in 48 hours — for a reason nobody expected.\"","correct":true},{"k":"C","t":"\"We love bringing you luxury lifestyle content every week.\"","correct":false}]},"gate":[]},{"n":17,"kind":"body","eyebrow":"Question 2 · the first line","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"A caption opens with a full, polite introduction and saves its sharpest, most surprising line for the third paragraph.","q":"Correct. The first line is the hook — it's the only line most people read before deciding to stay. If it doesn't stop the scroll, the rest of the caption is never seen.\" data-no=\" Not quite. The sharpest line belongs first, not saved for later. The first line is the hook — the only one most people read before choosing to stay. Lead with it.\"> A caption opens with a full, polite introduction and saves its sharpest, most surprising line for the third paragraph.","opts":[{"k":"A","t":"Nothing — a strong payoff always makes up for a slow open","correct":false},{"k":"B","t":"Add more hashtags so it gets discovered anyway","correct":false},{"k":"C","t":"Move the sharp line to the first line — it's the hook","correct":true}]},"gate":[]},{"n":18,"kind":"body","eyebrow":"Question 3 · the carousel's call to action","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"You've built a carousel from a worthy video, and you think a different, punchier offer would convert better than the video's lead magnet.","q":"Correct. Lead magnets are per video, and a worthy carousel inherits its offer from its Source Video. Marketing owns the offer — you point the CTA at it, you don't invent a new one.\" data-no=\" No. The carousel inherits its lead magnet from the Source Video it was cut from — Marketing owns the offer. However punchy your idea, keep the call true to the inherited offer.\"> You've built a carousel from a worthy video, and you think a different, punchier offer would convert better than the video's lead magnet.","opts":[{"k":"A","t":"The Source Video's lead magnet — the carousel inherits it","correct":true},{"k":"B","t":"Your new punchier offer — you're the writer","correct":false},{"k":"C","t":"No CTA — let the Social Media Manager add one later","correct":false}]},"gate":[]},{"n":19,"kind":"body","eyebrow":"Question 4 · spot the mistake","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A middle slide of a carousel packs six separate points into one dense block of text.","q":"Correct. One slide, one idea. Cramming a whole argument onto a single slide overwhelms the reader and kills the swipe — spread the ideas out so each slide earns the next.\" data-no=\" Not the main issue. The design isn't the problem — the slide is carrying too many ideas at once. One slide, one idea, so each earns the swipe to the next.\"> A middle slide of a carousel packs six separate points into one dense block of text.","opts":[{"k":"A","t":"The font is too small to read on a phone","correct":false},{"k":"B","t":"Too many ideas on one slide — it should be one idea per slide","correct":true},{"k":"C","t":"The slide needs its own call to action","correct":false}]},"gate":[]},{"n":20,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all six?","subhead":"","lines":[],"quiz":null,"gate":["Is your first line always a hook that stops the scroll?","Does every caption run hook → context → value → call to action?","Does your carousel cover promise, middles carry one idea each, and the final slide call?","Does the call to action point to the Source Video's lead magnet, never a new one?","Do you lead with the point, reframe every \"no,\" and never hedge?","Do you avoid the four traps — buried hook, no call, writing for yourself, cramming a slide?"]},{"n":21,"kind":"close","eyebrow":"","head":"Words that convert, and words that travel.","subhead":"","lines":[{"t":"lead","x":"The video earns the stop. You earn the action — a hook that stops the scroll, a carousel that holds slide to slide, and a call that drives the click to the lead magnet."}],"quiz":null,"gate":[]}]},{"id":"sales","bucket":"Sales & Success","title":"Sales","href":"sales-training.html","step":"Your role","count":19,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · role certification","head":"Sales pipeline.","subhead":"","lines":[{"t":"lead","x":"Bring the right clients in, qualify hard, and hand delivery a brief they can run with."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"Your mission","head":"Bring the clients in, then hand off clean.","subhead":"","lines":[{"t":"lead","x":"Win the client, qualify them properly, and set their work up so delivery can pick it up without calling you. The sale isn't done until the handoff is clean."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"Pipeline full of qualified clients — enough deals in motion to hit the month"},{"t":"win","x":"Clean handoff briefs — delivery starts without calling you"},{"t":"win","x":"Leading number moved today — the pipeline count you can still act on"},{"t":"win","x":"Client deadlines flagged early — never a surprise, never a silent miss"}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one","head":"Qualify, then win","subhead":"","lines":[{"t":"lead","x":"Not every lead deserves a slot in the pipeline."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Your mission","head":"Bring in the right clients, not just any client.","subhead":"","lines":[{"t":"lead","x":"Qualify before you invest time. A client who fits the brand and can be delivered well is worth ten who can't. Qualify hard up front and delivery never inherits a mismatch."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Your home","head":"Clients and Vendor (Sales) is your table.","subhead":"","lines":[{"t":"lead","x":"It holds the client, the deal, and the pipeline stage. Everything you own lives here. Keep it current and the pipeline reads itself."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Sales connects to delivery","head":"","subhead":"","lines":[{"t":"lead","x":"Your client's work becomes a Project, the delivery container for everything made for them. Every video carries a Client or Vendor link, a field pointing back to your client, so their work is traceable end to end."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"What you fill","head":
