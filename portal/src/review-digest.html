ps the team honest","correct":true},{"k":"B","t":"Nothing — rituals are a luxury you drop when busy","correct":false},{"k":"C","t":"The only issue is scheduling; move it, don't defend it","correct":false}]},"gate":[]},{"n":21,"kind":"body","eyebrow":"Before you scale · run the design audit","head":"Five things to have in place.","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":22,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all six?","subhead":"","lines":[],"quiz":null,"gate":["Do you treat culture as designed — through what you hire, reward and tolerate?","Does every role and outcome have exactly one owner?","Are decision rights named before the decision, not fought over during it?","Do you hire for GUIDE values-fit, and refuse the skilled-but-off-values pass?","Do you ritualise belonging — a truth room that survives the busy weeks?","Are you the thermostat — setting the standard, not matching the room?"]},{"n":23,"kind":"close","eyebrow":"","head":"Design the org. Protect the culture. It's the product.","subhead":"","lines":[{"t":"lead","x":"Clear ownership. Hire for GUIDE. Ritualise belonging so it survives scale. Be the thermostat, not the thermometer. Do that, and the culture compounds into the thing no competitor can copy."}],"quiz":null,"gate":[]}]}],"order":["Foundation · everyone","The base","Marketing & Content","Sales & Success","Operations & Tech","Finance & People","Management & Command"]};</script>

  order.forEach(function(bk){
    var mine=decks.filter(function(d){return d.bucket===bk;}); if(!mine.length) return;
    var sec=document.createElement('section'); sec.className='bkt'; sec.id='bk-'+bk.replace(/[^a-z]/gi,'');
    sec.innerHTML='<h2>'+esc(bk)+'</h2>';
    var opt=document.createElement('option'); opt.value=sec.id; opt.textContent=bk; jump.appendChild(opt);
    mine.forEach(function(d){ sec.appendChild(deckEl(d)); });
    wrap.appendChild(sec);
  });
  function slideHTML(s){
    var h='<div class="sl'+(s.kind==='divider'?' div':'')+'">';
    h+='<span class="sn">S'+s.n+'</span>';
    if(s.eyebrow) h+='<span class="eb">'+esc(s.eyebrow)+'</span>';
    if(s.head) h+='<h3>'+esc(s.head)+'</h3>';
    if(s.subhead) h+='<div class="sub">'+esc(s.subhead)+'</div>';
    (s.lines||[]).forEach(function(l){ h+='<div class="ln '+l.t+'">'+esc(l.x)+'</div>'; });
    if(s.quiz){ var q=s.quiz; h+='<div class="quiz">';
      if(q.scenario)h+='<div class="sc">'+esc(q.scenario)+'</div>';
      if(q.q)h+='<div class="q">'+esc(q.q)+'</div>';
      (q.opts||[]).forEach(function(o){ h+='<div class="o'+(o.correct?' correct':'')+'"><span class="k">'+o.k+'</span>'+esc(o.t)+'</div>'; });
      h+='</div>'; }
    if(s.gate&&s.gate.length){ h+='<div class="gate">'; s.gate.forEach(function(g){ h+='<div class="gq">'+esc(g)+'</div>'; }); h+='</div>'; }
    h+='</div>'; return h;
  }
  function deckEl(d){
    var el=document.createElement('div'); el.className='deck'; el.id='deck-'+d.id; el.setAttribute('data-id',d.id);
    var st=rget(d.id);
    var body=d.slides.map(slideHTML).join('') || '<div class="empty">No text extracted — open the deck to review.</div>';
    el.innerHTML=
      '<div class="dhead">'
      +'<span class="dt">'+esc(d.title)+'</span>'
      +'<span class="step">'+esc(d.step||'')+'</span>'
      +'<span class="sc'+(d.count<=18?' few':'')+'">'+d.count+' slides</span>'
      +'<span class="spacer"></span>'
      +'<button class="stbtn '+st+'" data-id="'+d.id+'">'+ST[st]+'</button>'
      +'<a class="open" href="'+d.href+'" target="_blank">open ▸</a>'
      +'</div>'
      +'<div class="dbody">'
      +'<textarea class="note" data-id="'+d.id+'" placeholder="notes for this deck — issues, fixes (saved automatically, syncs with the console)">'+esc(nget(d.id))+'</textarea>'
      +body+'</div>';
    return el;
  }
  // bind status + notes
  wrap.addEventListener('click',function(e){
    var b=e.target.closest('.stbtn'); if(!b) return;
    var id=b.getAttribute('data-id'), ns=NEXT[rget(id)]; rset(id,ns);
    b.className='stbtn '+ns; b.textContent=ST[ns]; summary(); applyFilter();
  });
  wrap.addEventListener('input',function(e){ var t=e.target; if(t.classList.contains('note')) nset(t.getAttribute('data-id'),t.value); });
  // summary
  function summary(){
    var ok=0,work=0,todo=0,n=decks.length;
    decks.forEach(function(d){var s=rget(d.id); if(s==='ok')ok++;else if(s==='work')work++;else todo++;});
    document.getElementById('barI').style.width=(n?Math.round(ok/n*100):0)+'%';
    document.getElementById('progT').textContent=ok+' / '+n+' approved  ·  🟡 '+work+'  ·  ⬜ '+todo;
    document.getElementById('revd').textContent='';
  }
  // filter + search
  var mode='all', term='';
  function applyFilter(){
    decks.forEach(function(d){
      var el=document.getElementById('deck-'+d.id); if(!el) return;
      var st=rget(d.id), show=true;
      if(mode==='todo')show=st==='todo'; else if(mode==='work')show=st==='work';
      else if(mode==='ok')show=st==='ok'; else if(mode==='notok')show=st!=='ok';
      if(show && term){ show=(el.textContent||'').toLowerCase().indexOf(term)>-1; }
      el.classList.toggle('hide',!show);
    });
    // hide empty buckets
    [].forEach.call(document.querySelectorAll('.bkt'),function(sec){
      var any=[].some.call(sec.querySelectorAll('.deck'),function(x){return !x.classList.contains('hide');});
      sec.style.display=any?'':'none';
    });
  }
  [].forEach.call(document.querySelectorAll('.chip'),function(c){
    c.onclick=function(){ mode=c.getAttribute('data-f');
      [].forEach.call(document.querySelectorAll('.chip'),function(x){x.classList.toggle('on',x===c);});
      applyFilter(); };
  });
  document.getElementById('srch').addEventListener('input',function(e){ term=(e.target.value||'').toLowerCase().trim(); applyFilter(); });
  jump.addEventListener('change',function(e){ var el=document.getElementById(e.target.value); if(el) el.scrollIntoView({behavior:'smooth'}); e.target.value=''; });
  summary(); applyFilter();
})();
</script>
</body>
</html>
