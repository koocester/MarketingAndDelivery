<title>Koocester Academy · Review Digest</title>
<style>
:root{--maroon:#C02025;--maroon-tint:#faf3f3;--ink:#0a0a0a;--body:#333;--muted:#767676;--line:#E4E4E4;--line2:#F0F0F0;--bg:#fff;--ok:#1b7f4b;
--base:'Helvetica Neue',Helvetica,Inter,'SF Pro Text',Arial,sans-serif;--shadow:0 1px 2px rgba(0,0,0,.04),0 10px 30px rgba(0,0,0,.05);}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);font-family:var(--base);-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:var(--maroon)}
/* top bar */
.top{position:sticky;top:0;z-index:30;background:rgba(255,255,255,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:12px clamp(16px,4vw,40px)}
.top h1{margin:0;font-size:18px;font-weight:800;color:var(--ink);letter-spacing:-.02em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.top h1 .k{color:var(--maroon)}
.prog{display:flex;align-items:center;gap:10px;margin-top:9px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.bar{flex:0 0 180px;height:7px;background:var(--line2);border-radius:5px;overflow:hidden}.bar i{display:block;height:100%;background:var(--maroon);width:0;transition:width .4s}
.ctl{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chip{appearance:none;border:1.5px solid var(--line);background:#fff;color:var(--body);font:700 12.5px var(--base);padding:7px 13px;border-radius:20px;cursor:pointer;transition:.14s}
.chip:hover{border-color:var(--maroon);color:var(--maroon)}
.chip.on{background:var(--maroon);border-color:var(--maroon);color:#fff}
.srch{flex:1;min-width:150px;max-width:280px;border:1.5px solid var(--line);border-radius:20px;padding:7px 14px;font:14px var(--base)}
.srch:focus{outline:none;border-color:var(--maroon)}
.jump{margin-left:auto;font-size:12px}
.jump select{border:1.5px solid var(--line);border-radius:18px;padding:6px 10px;font:600 12px var(--base);color:var(--body);cursor:pointer}
/* layout */
.wrap{max-width:1000px;margin:0 auto;padding:0 clamp(16px,4vw,40px) 120px}
.bkt{margin-top:40px}
.bkt>h2{font-size:13px;letter-spacing:.12em;text-transform:uppercase;color:var(--maroon);font-weight:800;border-bottom:2px solid var(--maroon);padding-bottom:8px;margin:0 0 4px;position:sticky;top:118px;background:var(--bg);z-index:10}
/* deck card */
.deck{border:1px solid var(--line);border-radius:16px;margin-top:20px;box-shadow:var(--shadow);overflow:hidden;scroll-margin-top:170px}
.deck.hide{display:none}
.dhead{display:flex;align-items:center;gap:12px;padding:15px 18px;background:#fafafa;border-bottom:1px solid var(--line);flex-wrap:wrap;position:sticky;top:150px;z-index:5}
.dhead .dt{font-size:16px;font-weight:800;color:var(--ink);letter-spacing:-.01em}
.dhead .step{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.dhead .sc{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:16px;padding:3px 10px}
.dhead .sc.few{color:var(--ok);border-color:#bfe6cf}
.dhead .spacer{flex:1}
.stbtn{appearance:none;border:1.5px solid var(--line);background:#fff;font:800 12.5px var(--base);padding:7px 13px;border-radius:20px;cursor:pointer;transition:.14s;white-space:nowrap}
.stbtn.todo{color:var(--muted)}
.stbtn.work{color:#9a6a00;border-color:#e9d08a;background:#fff9ec}
.stbtn.ok{color:#0f5d34;border-color:#bfe6cf;background:#eefaf2}
.dhead a.open{font-size:12.5px;font-weight:700;text-decoration:none;border:1.5px solid var(--maroon);color:var(--maroon);padding:7px 13px;border-radius:20px;transition:.14s}
.dhead a.open:hover{background:var(--maroon);color:#fff}
.dbody{padding:6px 18px 16px}
.note{width:100%;min-height:44px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font:13.5px var(--base);color:var(--ink);margin:12px 0 4px;resize:vertical;background:#fff}
.note:focus{outline:none;border-color:var(--maroon)}
.note::placeholder{color:#aaa}
/* slide row */
.sl{padding:14px 0;border-top:1px solid var(--line2)}
.sl:first-child{border-top:0}
.sl .sn{display:inline-block;font-size:11px;font-weight:800;color:#fff;background:var(--maroon);border-radius:6px;padding:2px 7px;margin-right:9px;vertical-align:middle}
.sl.div .sn{background:var(--ink)}
.sl .eb{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--maroon);font-weight:700}
.sl.div .eb{color:var(--muted)}
.sl h3{margin:4px 0 6px;font-size:17px;font-weight:800;color:var(--ink);letter-spacing:-.01em;line-height:1.25}
.sl .sub{font-size:14px;font-weight:700;color:var(--body);margin:-2px 0 6px}
.ln{margin:4px 0;font-size:14px;line-height:1.5}
.ln.lead{color:var(--body)}
.ln.li{padding-left:16px;position:relative}.ln.li:before{content:'•';color:var(--maroon);position:absolute;left:2px;font-weight:800}
.ln.win{padding-left:16px;position:relative;color:var(--body)}.ln.win:before{content:'✓';color:var(--ok);position:absolute;left:0;font-weight:800}
.ln.callout{border-left:3px solid var(--maroon);background:var(--maroon-tint);padding:8px 12px;border-radius:0 8px 8px 0;font-size:13.5px;color:#5a1518}
.ln.p{color:var(--muted);font-size:13px}
.quiz{border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;background:#fcfcfc}
.quiz .sc{font-size:13px;color:var(--body);font-style:italic;margin-bottom:5px}
.quiz .q{font-weight:800;color:var(--ink);font-size:14px;margin-bottom:6px}
.quiz .o{font-size:13.5px;margin:3px 0;padding-left:20px;position:relative;color:var(--body)}
.quiz .o.correct{color:#0f5d34;font-weight:700}
.quiz .o .k{position:absolute;left:0;font-weight:800;color:var(--muted)}
.quiz .o.correct .k{color:var(--ok)}
.quiz .o.correct:after{content:' ✓';color:var(--ok)}
.gate{margin:8px 0}
.gate .gq{font-size:13.5px;margin:3px 0;padding-left:18px;position:relative}.gate .gq:before{content:'▸';color:var(--maroon);position:absolute;left:0}
.empty{color:var(--muted);font-size:13px;font-style:italic;padding:8px 0}
@media (max-width:640px){.bkt>h2{top:0;position:static}.dhead{position:static}.bar{flex-basis:120px}}
</style>
</head>

dia company built on performance and storytelling. We specialise in performance marketing and brand storytelling. We partner with credible brands to produce content, manage campaigns, build audiences, and deliver high-quality marketing results."},{"t":"p","x":"Performance marketing means marketing measured by outcomes, not impressions. Brand storytelling means building a brand people trust through the stories we tell."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Our purpose","head":"Symbol of Inspiration. Empowering Growth. Powered by People.","subhead":"","lines":[{"t":"lead","x":"We exist to be the growth partner businesses trust to deliver outcomes that matter — not vanity metrics. We turn credible brands into category-defining ones, ideas into audiences, marketing spend into measurable impact."},{"t":"callout","x":"None of it happens without people — our audience, our team, our community. Our culture is the product. It always has been."}],"quiz":null,"gate":[]},{"n":6,"kind":"divider","eyebrow":"How we behave","head":"The values spell GUIDE","subhead":"","lines":[{"t":"lead","x":"Five words that steer every decision. One at a time."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Value · G of GUIDE","head":"G — Growth & Curiosity","subhead":"","lines":[{"t":"lead","x":"We stay students. Curiosity is the engine, growth is the output. We ask sharper questions, learn faster than the market, and never assume we've arrived."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Check · living G of GUIDE","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A campaign you ran last quarter worked well. This quarter you're tempted to run the exact same playbook without asking what's changed.","q":"Correct. Growth & Curiosity means staying a student. We never assume we've arrived — we question the playbook and learn what changed.\" data-no=\" Not quite. Growth & Curiosity means never assuming you've arrived. Question the playbook and keep learning — don't coast on last quarter.\"> A campaign you ran last quarter worked well. This quarter you're tempted to run the exact same playbook without asking what's changed.","opts":[{"k":"A","t":"Repeat last quarter's playbook exactly — it already worked","correct":false},{"k":"B","t":"Stay a student: question what's changed and sharpen the approach","correct":true},{"k":"C","t":"Wait for a manager to tell you what to change","correct":false}]},"gate":[]},{"n":9,"kind":"body","eyebrow":"Value · U of GUIDE","head":"U — Uniting through trust and relationships","subhead":"","lines":[{"t":"lead","x":"We win by earning trust. Relationships are the real asset. We keep our word and unite people around a shared outcome, because trust compounds and can't be bought back once broken."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Check · living U of GUIDE","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You promised a client a deliverable by Friday. Midweek it's looking tight. Cutting a corner would let you hit the date without anyone noticing.","q":"Correct. Uniting is built on trust, and trust can't be bought back once broken. You keep your word and protect the relationship over a quiet shortcut.\" data-no=\" Not quite. Uniting through trust means keeping your word. Trust compounds and can't be bought back once broken — flag it early, don't cut a quiet corner.\"> You promised a client a deliverable by Friday. Midweek it's looking tight. Cutting a corner would let you hit the date without anyone noticing.","opts":[{"k":"A","t":"Ship the corner-cut version on time — the date matters most","correct":false},{"k":"B","t":"Flag it early and keep your word on quality, protecting the trust","correct":true},{"k":"C","t":"Stay silent and hope they don't spot the shortcut","correct":false}]},"gate":[]},{"n":11,"kind":"body","eyebrow":"Value · I of GUIDE","head":"I — Impact through inspiration","subhead":"","lines":[{"t":"lead","x":"We inspire people to act, so they move because they want to. We chase impact that matters, real outcomes over vanity metrics. If the work changes nothing, it isn't done."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Check · living I of GUIDE","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"Two ways to hit the target: a high-pressure hard-sell that nags people into clicking, or a story that genuinely moves them to act.","q":"Correct. Impact through inspiration means we move people by inspiring them, not pressuring them — and we chase real outcomes over numbers that only look good.\" data-no=\" Not quite. Impact through inspiration means inspiring people to act, not pressuring them — and chasing outcomes that matter, not vanity numbers.\"> Two ways to hit the target: a high-pressure hard-sell that nags people into clicking, or a story that genuinely moves them to act.","opts":[{"k":"A","t":"The hard-sell — pressure gets faster clicks","correct":false},{"k":"B","t":"The story that moves people to act, because we inspire rather than pressure","correct":true},{"k":"C","t":"Whichever produces the bigger number on the report","correct":false}]},"gate":[]},{"n":13,"kind":"body","eyebrow":"Value · D of GUIDE","head":"D — Dare to be bold and innovate","subhead":"","lines":[{"t":"lead","x":"We take the bold bet and build what doesn't exist yet. We'd rather try the untried format than repeat the safe one. Playing safe is the real risk."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Check · living D of GUIDE","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A big client launch is coming up. The safe option is the format everyone's seen a hundred times. You have a bolder, untested concept that fits the brief better but carries more risk.","q":"Correct. Dare to be bold and innovate means backing the untried bet that fits the goal and building what doesn't exist yet. Playing safe is the real risk.\" data-no=\" Not quite. Dare to be bold and innovate means taking the bold bet, not defaulting to the safe, done-before route. Playing safe is the real risk — pitch the untried format that fits the goal.\"> A big client launch is coming up. The safe option is the format everyone's seen a hundred times. You have a bolder, untested concept that fits the brief better but carries more risk.","opts":[{"k":"A","t":"Default to the safe, done-before format — it's the low-risk choice","correct":false},{"k":"B","t":"Take the bold bet: pitch the untested concept that fits the brief better","correct":true},{"k":"C","t":"Copy exactly what a competitor did last month to be safe","correct":false}]},"gate":[]},{"n":15,"kind":"body","eyebrow":"Value · E of GUIDE","head":"E — Empathy and Giving","subhead":"","lines":[{"t":"lead","x":"We lead with empathy and give first. Understand people before selling to them, help before being asked. As the founder says: win the hearts of people, win everything."}],"quiz":null,"gate":[]},{"n":16,"kind":"body","eyebrow":"Check · living E of GUIDE","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"Someone in the community asks a genuine question in your DMs. They're not a client and may never be. Answering it properly will cost you 20 minutes.","q":"Correct. Empathy and Giving means we give first and help before we're asked — win the hearts of people, win everything. Value isn't conditional on a sale.\" data-no=\" Not quite. Empathy and Giving means giving first and helping before we're asked, whether or not there's a sale in it. Win the hearts of people, win everything.\"> Someone in the community asks a genuine question in your DMs. They're not a client and may never be. Answering it properly will cost you 20 minutes.","opts":[{"k":"A","t":"Ignore it — they're not paying, so it's not worth your time","correct":false},{"k":"B","t":"Give first: help properly, because we help before we're asked","correct":true},{"k":"C","t":"Send a quick link and move on to save the effort","correct":false}]},"gate":[]},{"n":17,"kind":"divider","eyebrow":"Your turn","head":"Which value applies?","subhead":"","lines":[{"t":"lead","x":"Three calls. Match the moment to a GUIDE value."}],"quiz":null,"gate":[]},{"n":18,"kind":"body","eyebrow":"Question 1 · which value applies?","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"A client asks for the same safe campaign everyone runs. You see an untested, bolder format that fits their goal better — and you pitch it.","q":"Correct. This is D — Dare to be bold and innovate. The safe, done-before route is the real risk; we take the bold bet that fits the goal.\" data-no=\" Not quite. The move here is D — Dare to be bold and innovate. We'd rather try the untested format that fits the goal than repeat the safe one.\"> A client asks for the same safe campaign everyone runs. You see an untested, bolder format that fits their goal better — and you pitch it.","opts":[{"k":"A","t":"U — Uniting through trust and relationships","correct":false},{"k":"B","t":"I — Impact through inspiration","correct":false},{"k":"C","t":"D — Dare to be bold and innovate","correct":true}]},"gate":[]},{"n":19,"kind":"body","eyebrow":"Question 2 · which value applies?","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"A teammate is drowning before a deadline. Nobody asked you to help — you notice, step in, and give your time to get them over the line.","q":"Correct. This is E — Empathy and Giving. You noticed, you gave your time first, and you helped before being asked.\" data-no=\" Not quite. This is E — Empathy and Giving. Leading with empathy and giving first, without being asked, is the value in action.\"> A teammate is drowning before a deadline. Nobody asked you to help — you notice, step in, and give your time to get them over the line.","opts":[{"k":"A","t":"E — Empathy and Giving","correct":true},{"k":"B","t":"G — Growth & Curiosity","correct":false},{"k":"C","t":"D — Dare to be bold and innovate","correct":false}]},"gate":[]},{"n":20,"kind":"body","eyebrow":"Question 3 · our purpose in practice","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A campaign racks up a huge view count, but produces no leads and no real result for the client.","q":"Correct. Our purpose is to deliver outcomes that matter, not vanity metrics. A big view count with no real result isn't success — you'd push for measurable impact.\" data-no=\" Reread the purpose. We exist to deliver outcomes that matter, not vanity metrics. Impressive-looking numbers with no real result are exactly what we don't celebrate.\"> A campaign racks up a huge view count, but produces no leads and no real result for the client.","opts":[{"k":"A","t":"A win — the reach numbers look great on a report","correct":false},{"k":"B","t":"Not a win — it's a vanity metric, not an outcome that matters","correct":true},{"k":"C","t":"Fine as-is — results aren't our responsibility","correct":false}]},"gate":[]},{"n":21,"kind":"body","eyebrow":"Make it yours · tick what you can already do","head":"Recall GUIDE from memory","subhead":"","lines":[{"t":"p","x":"The word is already the memory trick: a good leader is a GUIDE . Anchor it with one sentence, \"A great GUIDE grows, unites, makes impact, dares, and gives.\" Now the recall drill: cover this slide, and say all five out loud, in order, G · U · I · D · E . Can't reach five? Scroll back and run it again until it's automatic."},{"t":"p","x":"Tick each once you can say what it means in your own words. Five out of five is the goal."}],"quiz":null,"gate":[]},{"n":22,"kind":"body","eyebrow":"Vision 2035","head":"","subhead":"","lines":[{"t":"lead","x":"To inspire over 1 billion people a year and shape industries — through influential media, impactful education, and data intelligence."},{"t":"callout","x":"Not a Singapore agency that happens to expand. We aim for media dominance and market leadership in every country we enter — the world's most trusted growth ecosystem, headquartered in Singapore."}],"quiz":null,"gate":[]},{"n":23,"kind":"body","eyebrow":"Three quotes the founder lives by","head":"The mindset behind the mission.","subhead":"","lines":[{"t":"li","x":"\"To get something you never had, you have to do something you never did.\""},{"t":"li","x":"\"The harder you work, the luckier you get.\""},{"t":"li","x":"\"Win the hearts of people, win everything.\""}],"quiz":null,"gate":[]},{"n":24,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Do you know what Koocester stands for?","subhead":"","lines":[],"quiz":null,"gate":["Can you say, in your own words, why Koocester exists?","Can you name all five GUIDE values from memory?","Do you let GUIDE shape your decisions, not just decorate a wall?","Will you measure success by outcomes that matter, not vanity metrics?","Does your work ladder up to the Vision 2035?","Would you behave the same way when no one is watching?"]},{"n":25,"kind":"close","eyebrow":"","head":"You are the values now.","subhead":"","lines":[{"t":"lead","x":"Knowing GUIDE isn't the job. Living it is. From here, the culture is exactly as strong as the way you personally behave when no one is watching — in every campaign, every hire, every client."},{"t":"p","x":"This is on you."},{"t":"p","x":"Nobody hands the culture down to you. You carry it. When you're in the room, GUIDE shows up because you bring it. That's the commitment you're making by finishing this. Now go live it."}],"quiz":null,"gate":[]}]},{"id":"f_brand","bucket":"Foundation · everyone","title":"Brand guideline","href":"brand-guideline-training.html","step":"Foundation","count":42,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · foundations","head":"Brand guideline","subhead":"","lines":[{"t":"lead","x":"How we look, and how we sound. Everyone follows it, every asset."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"Why this matters","head":"The brand is the product.","subhead":"","lines":[{"t":"lead","x":"People buy Koocester because they trust it, and trust is built by looking and sounding the same every single time. One maroon, one voice, one standard. Consistency is what makes a small brand feel like a category leader."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"You spot off-brand in one glance — wrong colour, wrong type, wrong ratio jumps out immediately"},{"t":"win","x":"Maroon is the only accent — used sparingly, never a full colour wash"},{"t":"win","x":"Everything sits in Helvetica — one hierarchy, bold for emphasis, never capitals"},{"t":"win","x":"White-dominant, logo untouched — roughly 60/30/10, official file only, never retyped"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"What we are","head":"Symbol of inspiration. Empowering growth. Powered by people.","subhead":"","lines":[{"t":"lead","x":"The tagline: empowering growth, built on trust. Growth is what we deliver. Trust is how we earn it."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Our personality","head":"The trusted operator.","subhead":"","lines":[{"t":"lead","x":"Authority with clean restraint. When in doubt, take the quieter, more premium option."}],"quiz":null,"gate":[]},{"n":6,"kind":"divider","eyebrow":"Part one","head":"How we look","subhead":"","lines":[{"t":"lead","x":"Colour, type, logo, imagery."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Colour","head":"One maroon. No gold.","subhead":"","lines":[{"t":"lead","x":"Roughly 60% white, 30% black, 10% maroon. Maroon is a single accent, a button, a rule, a highlight, never a wash. There is no gold in this brand."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Colour pairings","head":"Right pairings, wrong pairings.","subhead":"","lines":[{"t":"p","x":"✓ Correct — use these"},{"t":"p","x":"&#10007; Incorrect — never"},{"t":"p","x":"Pale tints and greys are for backgrounds and dividers only. Never set words in them. Notice the wrong column is hard to read — that is the point."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Type","head":"Helvetica, done right.","subhead":"","lines":[{"t":"p","x":"✓ Do this"},{"t":"p","x":"&#10007; Not this"},{"t":"p","x":"One typeface, one hierarchy per view. Bold does the emphasis work, capitals never do. White space is a feature, not a gap to fill."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"The logo","head":"","subhead":"","lines":[{"t":"lead","x":"The wordmark is lowercase koocester in black, with the descriptor in maroon: group, homes, business, foodie, autos, wealth. In writing we capitalise \"Koocester\". The logo itself stays lowercase. Always use the official files in the brand folder. Never retype it."},{"t":"p","x":"koocester wealth"}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Logo, the rules","head":"See it right. Spot it wrong.","subhead":"","lines":[{"t":"p","x":"&#10007; Wrong — never do this"},{"t":"p","x":"✓ Right — use these"},{"t":"p","x":"Official file only, never retyped, never rotated or skewed. One colourway at a time, and never mix."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Imagery and motion","head":"Editorial, real, calm.","subhead":"","lines":[{"t":"p","x":"✓ Use this"},{"t":"p","x":"Editorial quality, real depth, natural light. Premium and real."},{"t":"p","x":"&#10007; Never"},{"t":"p","x":"No stock, no busy frames, no off-brand colour."}],"quiz":null,"gate":[]},{"n":13,"kind":"divider","eyebrow":"Part two &middot; this matters most","head":"How we sound","subhead":"","lines":[{"t":"lead","x":"The voice, and the words."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"The voice","head":"Direct and brief, from abundance.","subhead":"","lines":[{"t":"li","x":"Lead with the answer. Bullets beat paragraphs."},{"t":"li","x":"Possibility framing. We open doors, never confuse abundance with flattery."},{"t":"li","x":"Truth over comfort. Say the accurate thing, with numbers."},{"t":"li","x":"Warm, not soft. Confident, not loud. Show, do not boast."}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"Question 1 · brand voice","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A team member opens a client update with three sentences of pleasantries before getting to the result.","q":"Correct. Lead with the answer. The outcome goes in the first line, then the context. Warm-up before the point buries what the reader came for.\" data-no=\" Not quite. Our voice leads with the answer. Put the outcome first, then the context. Pleasantries before the point make the reader dig for it.\"> A team member opens a client update with three sentences of pleasantries before getting to the result.","opts":[{"k":"A","t":"Keep the warm-up first, it builds rapport before the news","correct":false},{"k":"B","t":"Lead with the result in the first line, then add the context underneath","correct":true},{"k":"C","t":"Cut everything to a single blunt word so it's fast","correct":false}]},"gate":[]},{"n":16,"kind":"body","eyebrow":"","head":"Negativity is not our voice.","subhead":"","lines":[{"t":"p","x":"A hard taboo, not a preference — the one line in this guide you never cross. It applies to everything you put out: every message, every reply, every caption, down to the smallest note or DM."}],"quiz":null,"gate":[]},{"n":17,"kind":"body","eyebrow":"Question 2 · brand voice","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"A client asks to launch on their old platform, which genuinely won't support the system. A team member starts typing: \"No, that won't work.\"","q":"Correct. Reframe the limit into the way forward. We never lead with 'no' or 'can't' — not even in a quick internal note. Lead with what works.\" data-no=\" Not quite. Negativity is a hard taboo, and it applies to everything — even a fast reply. Drop the rejection words and lead with what we can do.\"> A client asks to launch on their old platform, which genuinely won't support the system. A team member starts typing: \"No, that won't work.\"","opts":[{"k":"A","t":"\"No, that won't work on your old platform, sorry\"","correct":false},{"k":"B","t":"\"Unfortunately your platform can't handle it\"","correct":false},{"k":"C","t":"\"Here's the setup that gets you live fastest — and why it'll perform better\"","correct":true}]},"gate":[]},{"n":18,"kind":"body","eyebrow":"The voice · inside the team too","head":"It's how we talk to each other.","subhead":"","lines":[{"t":"lead","x":"The voice isn't only for clients. Same move on a status update, a team message, a handover note — lead with the point, reframe the block into the way forward. A teammate reads it the way a client would."},{"t":"p","x":"Same honesty, opened from possibility. A blocker still gets named — with the way forward leading. Internal or external, one voice."}],"quiz":null,"gate":[]},{"n":19,"kind":"body","eyebrow":"The words we use","head":"","subhead":"","lines":[{"t":"p","x":"Numbers over adjectives. \"Turned $4k into 38 qualified buyers\" beats \"great results\"."}],"quiz":null,"gate":[]},{"n":20,"kind":"body","eyebrow":"Question 3 · brand voice","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A prospect says their budget is small and worries it isn't worth starting. Three replies are drafted.","q":"Correct. Abundance speaks from possibility. We turn a small budget into what it can become — with real numbers — never talk down or lower the ceiling.\" data-no=\" Not quite. That speaks from scarcity. Koocester leads from abundance: show what's possible with what they have, in real numbers, never shrink their expectations.\"> A prospect says their budget is small and worries it isn't worth starting. Three replies are drafted.","opts":[{"k":"A","t":"\"With a budget that small, keep your expectations low\"","correct":false},{"k":"B","t":"\"Here's what that budget can turn into — a first batch of qualified buyers, on the numbers\"","correct":true},{"k":"C","t":"\"Budgets that size rarely get anywhere, to be honest\"","correct":false}]},"gate":[]},{"n":21,"kind":"body","eyebrow":"Voice · the core move","head":"Positivity reframing.","subhead":"","lines":[{"t":"lead","x":"Lead with the positive, reframe every negative into the way forward, and speak from abundance, not scarcity. This is the single move that most makes us sound like Koocester."},{"t":"p","x":"Same truth, opened from possibility. Numerals like 1–9 are fine — the words are what carry the voice."}],"quiz":null,"gate":[]},{"n":22,"kind":"body","eyebrow":"Question 4 · brand voice","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"A junior editor's first cut misses the brief, and they're anxious about it. You're giving the feedback — coaching a teammate, in Koocester's voice.","q":"Correct. Coaching runs on the same voice: lead with what's working, then the one specific move that lifts it. Warm, precise, forward — truth over comfort, never a bare 'wrong'.\" data-no=\" Not quite. On-voice coaching leads with what's strong, then names the one specific fix that raises the bar. A blunt 'this is wrong' deflates; a vague 'it's fine' hides the truth. Warm and precise, both at once.\"> A junior editor's first cut misses the brief, and they're anxious about it. You're giving the feedback — coaching a teammate, in Koocester's voice.","opts":[{"k":"A","t":"\"Strong pace and a sharp hook — you're close. One move takes it there: re-cut the open to the brief's promise, and it's ready.\"","correct":true},{"k":"B","t":"\"This is wrong, you missed the brief — redo it.\"","correct":false},{"k":"C","t":"\"It's fine, don't worry about it, we'll sort it later.\"","correct":false}]},"gate":[]},{"n":23,"kind":"body","eyebrow":"Tone","head":"One voice, dialled to context.","subhead":"","lines":[{"t":"lead","x":"The voice never changes. Tone shifts with the reader's stakes: higher stakes, more precise and proof led; top of funnel, warmer and punchier."}],"quiz":null,"gate":[]},{"n":24,"kind":"body","eyebrow":"Question 5 · brand voice","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You're writing a high-stakes proposal to a cautious investor who wants evidence before they commit.","q":"Correct. The voice never changes — only the tone dials to the stakes. A cautious investor wants precise, proof-led, numbers. Hype would read as risk, not confidence.\" data-no=\" Not quite. Same voice, tuned to the stakes. High stakes and a cautious reader call for precise and proof-led, not hype or emoji. Lead with the numbers.\"> You're writing a high-stakes proposal to a cautious investor who wants evidence before they commit.","opts":[{"k":"A","t":"Warm, punchy and playful, with a few emoji to keep it light","correct":false},{"k":"B","t":"Precise and proof-led, leading with the numbers and the outcomes","correct":true},{"k":"C","t":"Big superlatives and hype to show how confident we are","correct":false}]},"gate":[]},{"n":25,"kind":"body","eyebrow":"What good looks like","head":"You've got it when","subhead":"","lines":[{"t":"li","x":"Anything you make uses only white, black and one maroon accent."},{"t":"li","x":"You never retype the logo, you use the official file."},{"t":"li","x":"You lead with the answer, and reframe every \"no\"."},{"t":"li","x":"A stranger could tell your work is Koocester without seeing the logo."}],"quiz":null,"gate":[]},{"n":26,"kind":"body","eyebrow":"Brand voice · make it stick","head":"Three voice moves, made distinct.","subhead":"","lines":[{"t":"lead","x":"They work together, but they are not the same thing. Know which is which."}],"quiz":null,"gate":[]},{"n":27,"kind":"divider","eyebrow":"Part three","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Three calls. Get them graded."}],"quiz":null,"gate":[]},{"n":28,"kind":"body","eyebrow":"Question 6 · colour","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A junior designer drafts a launch banner with a gold ribbon behind the headline because \"it looks premium.\"","q":"Correct. There is no gold in this brand. Maroon #C02025 is the single accent, a button, a rule, a highlight, never a wash, and never paired with gold.\" data-no=\" Not quite. Gold has no place in the Koocester palette. Swap it for the single maroon accent, #C02025, that's the only colour allowed to carry emphasis.\"> A junior designer drafts a launch banner with a gold ribbon behind the headline because \"it looks premium.\"","opts":[{"k":"A","t":"Keep the gold, it reads as luxury","correct":false},{"k":"B","t":"Swap gold for maroon #C02025, the only accent colour in the brand, no gold ever","correct":true},{"k":"C","t":"Use both gold and maroon together for contrast","correct":false}]},"gate":[]},{"n":29,"kind":"body","eyebrow":"Question 7 · brand voice","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"This one tests brand voice , not design. A client asks for delivery by Friday, and it genuinely isn't possible. A team member drafts the reply: \"No, we can't do that by Friday.\"","q":"Correct. This is the single habit that makes us sound like Koocester: reframe every 'no' into 'here's what works'. Lead with the answer, possibility over apology, never the rejection words.\" data-no=\" Not quite. Our voice never rejects. We avoid no, don't, can't, never. Reframe the limit as a choice and lead with what we can do.\"> This one tests brand voice , not design. A client asks for delivery by Friday, and it genuinely isn't possible. A team member drafts the reply: \"No, we can't do that by Friday.\"","opts":[{"k":"A","t":"\"Unfortunately Friday is impossible, sorry for the inconvenience\"","correct":false},{"k":"B","t":"\"We can have it right for you by Tuesday, here's how\"","correct":true},{"k":"C","t":"\"No, that timeline doesn't work for us\"","correct":false}]},"gate":[]},{"n":30,"kind":"body","eyebrow":"Question 8 · colour balance","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"A new deck template fills the whole slide background in maroon, with white text over it, calling it \"bold branding.\"","q":"Correct. Maroon is a single accent, a button, a rule, a highlight, never a full background wash. The brand stays white-dominant, roughly 60% white, 30% black, 10% maroon.\" data-no=\" No. A maroon background wash breaks the ratio. The brand is white-dominant, about 60% white, 30% black, 10% maroon, with maroon reserved as a single accent, never a wash.\"> A new deck template fills the whole slide background in maroon, with white text over it, calling it \"bold branding.\"","opts":[{"k":"A","t":"Yes, more maroon means stronger brand presence","correct":false},{"k":"B","t":"Yes, as long as the logo is white","correct":false},{"k":"C","t":"No, the palette is roughly 60% white, 30% black, 10% maroon; maroon is a single accent, never a full wash","correct":true}]},"gate":[]},{"n":31,"kind":"body","eyebrow":"Question 9 · brand voice","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You're writing the opening line of a pitch and choosing how to describe what Koocester does.","q":"Correct. We name what we deliver, from abundance: the system that delivers qualified buyers. 'Agency services' and 'guaranteed results' aren't our words.\" data-no=\" Not quite. On-voice, we say 'the system' and 'qualified buyers', not 'agency services' or empty guarantees. Name the outcome, from possibility.\"> You're writing the opening line of a pitch and choosing how to describe what Koocester does.","opts":[{"k":"A","t":"\"We're an agency offering a range of marketing services\"","correct":false},{"k":"B","t":"\"We build the system that delivers you qualified buyers, ready to buy\"","correct":true},{"k":"C","t":"\"Great results, guaranteed, or your money back\"","correct":false}]},"gate":[]},{"n":32,"kind":"body","eyebrow":"Question 10 · brand voice","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"A prospect asks: \"Can you guarantee me 100 leads?\" An honest guarantee of that exact number isn't possible.","q":"Correct. We never reject, and we never over-promise. Reframe into what we can genuinely commit to — the system, the volume math, the first buyers — from abundance.\" data-no=\" Not quite. 'No' rejects; a blank 'can't' shuts the door. Reframe into what we can truthfully commit to, led with the positive.\"> A prospect asks: \"Can you guarantee me 100 leads?\" An honest guarantee of that exact number isn't possible.","opts":[{"k":"A","t":"\"No, we can't guarantee that\"","correct":false},{"k":"B","t":"\"We can't promise numbers, sorry\"","correct":false},{"k":"C","t":"\"Here's what we commit to — the system, the volume math, and your first qualified buyers within the first weeks\"","correct":true}]},"gate":[]},{"n":33,"kind":"body","eyebrow":"Question 11 · brand voice","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"A prospect pushes back on price: \"That's more than I wanted to spend.\"","q":"Correct. An objection is an opening, not a wall. Reframe the investment into what it becomes — the outcome, in numbers — and lead with that. Never apologise for the price or knock a rival.\" data-no=\" Not quite. Lead with what the investment turns into, in real numbers — that's the abundance move. A bare 'sorry, that's the price' or a jab at competitors both fall off-voice.\"> A prospect pushes back on price: \"That's more than I wanted to spend.\"","opts":[{"k":"A","t":"\"Here's what that investment turns into — a first batch of qualified buyers, on the numbers — so it pays for itself\"","correct":true},{"k":"B","t":"\"It's actually cheap compared to the other agencies out there\"","correct":false},{"k":"C","t":"\"Sorry, that's just our price, it is what it is\"","correct":false}]},"gate":[]},{"n":34,"kind":"body","eyebrow":"Question 12 · brand voice · on a shoot","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"Mid-shoot, the client suddenly wants to scrap the agreed shot list for an off-brief idea. You're the producer, on the clock.","q":"Correct. A producer holds the plan without a single 'no'. Acknowledge the idea, lead with the must-have shots, then open the door to theirs. Confident and warm, never the rejection words — even under shoot pressure.\" data-no=\" Not quite. On a shoot the voice still holds. Never a flat 'no' or an audible sigh — protect the must-have shots by leading with them, then make room for the new idea. Calm, in control, forward.\"> Mid-shoot, the client suddenly wants to scrap the agreed shot list for an off-brief idea. You're the producer, on the clock.","opts":[{"k":"A","t":"\"Love the energy — let's lock the three hero shots we came for first, then we've got room to play with that.\"","correct":true},{"k":"B","t":"\"No, that's not on the shot list, we can't do it.\"","correct":false},{"k":"C","t":"\"That'll throw the whole schedule off, honestly.\"","correct":false}]},"gate":[]},{"n":35,"kind":"body","eyebrow":"Question 13 · brand voice · on a shoot","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"An hour before the shoot, the venue manager says you can't bring in your own lighting rig.","q":"Correct. Vendor pushback is a puzzle, not a wall. Lead with the way forward inside their constraint, keep it collaborative, and never assign blame. The shoot stays premium and keeps moving.\" data-no=\" Not quite. A producer never hands a vendor a bare 'problem' or points fingers. Reframe the constraint into the workaround and lead with it — collaborative, calm, still premium.\"> An hour before the shoot, the venue manager says you can't bring in your own lighting rig.","opts":[{"k":"A","t":"\"Here's how we get the look within your rules — natural light plus our compact kit, still premium. Which corner works best?\"","correct":true},{"k":"B","t":"\"This is a real problem, we can't shoot without our rig.\"","correct":false},{"k":"C","t":"\"That wasn't communicated to us — this one's on you.\"","correct":false}]},"gate":[]},{"n":36,"kind":"body","eyebrow":"Question 14 · brand voice","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A reply turns \"We're out of slots this month\" into \"Here's the next opening that works — and it's soon.\"","q":"Correct. Turning 'we're out of slots' into 'here's the next opening that works' is positivity reframing — a limit reframed as the way forward. Distinct from simply leading with the point.\" data-no=\" Not quite. This is positivity reframing: a 'no' (out of slots) turned into the way forward. Leading with the point is about order; abundance is about possibility — here the move is the reframe.\"> A reply turns \"We're out of slots this month\" into \"Here's the next opening that works — and it's soon.\"","opts":[{"k":"A","t":"Lead with the point — answer first, context after","correct":false},{"k":"B","t":"Positivity reframing — a limit turned into the way forward","correct":true},{"k":"C","t":"Numbers over adjectives — proof instead of hype","correct":false}]},"gate":[]},{"n":37,"kind":"body","eyebrow":"Question 15 · brand voice","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"You're drafting a community post and want it to sound unmistakably like Koocester.","q":"Correct. Abundance speaks from possibility, never fear, and never by knocking others. 'Here's what becomes possible' opens the door; scarcity and rival-bashing are off-voice.\" data-no=\" Not quite. Koocester speaks from abundance — possibility, not fear, and never knocking a competitor. Lead with what becomes possible.\"> You're drafting a community post and want it to sound unmistakably like Koocester.","opts":[{"k":"A","t":"\"Here's what becomes possible when the system's built right\"","correct":true},{"k":"B","t":"\"Unlike the cheaper agencies that keep failing you...\"","correct":false},{"k":"C","t":"\"Act now before you fall behind everyone else\"","correct":false}]},"gate":[]},{"n":38,"kind":"body","eyebrow":"Question 16 · brand voice","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"A social caption is drafted as: \"Don't miss out — spots are almost gone.\"","q":"Correct. Fear-of-missing-out sells from scarcity; we open from possibility. Lead with what becomes possible once they're in — the door opening, not closing.\" data-no=\" Not quite. 'Don't miss out' and 'last chance' push from fear. Koocester opens the door: lead with what becomes possible once they're in, from abundance.\"> A social caption is drafted as: \"Don't miss out — spots are almost gone.\"","opts":[{"k":"A","t":"\"Here's what becomes possible once you're in — and there's still room this round\"","correct":true},{"k":"B","t":"\"Keep it — urgency and FOMO are what drive sign-ups\"","correct":false},{"k":"C","t":"\"Last chance — you'll regret missing this one\"","correct":false}]},"gate":[]},{"n":39,"kind":"body","eyebrow":"Question 17 · brand voice","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"A results post reads: \"We got amazing, incredible results for this client!\"","q":"Correct. Numbers over adjectives. A specific result — dollars in, buyers out, timeframe — carries more weight than any superlative. Show it, never boast it.\" data-no=\" Not quite. 'Amazing' and 'best ever' are adjectives doing the work numbers should do. Lead with the specific result — the spend, the buyers, the timeframe.\"> A results post reads: \"We got amazing, incredible results for this client!\"","opts":[{"k":"A","t":"\"$4k turned into 38 qualified buyers in 6 weeks — here's how\"","correct":true},{"k":"B","t":"\"Keep it — big superlatives show how confident we are\"","correct":false},{"k":"C","t":"\"Best results we've ever seen, hands down\"","correct":false}]},"gate":[]},{"n":40,"kind":"body","eyebrow":"Question 18 · brand voice","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"A prospect asks: \"How do I know this will actually work for me?\"","q":"Correct. Doubt is met with proof, from abundance. Lead with the system and the numbers it's hit for businesses like theirs, then map it to them. Never a blind 'trust us' or a hedged 'no guarantee'.\" data-no=\" Not quite. 'Trust us' asks for faith; 'no guarantee' leads with the negative. Answer doubt with the system and real numbers for businesses like theirs, then map it to them.\"> A prospect asks: \"How do I know this will actually work for me?\"","opts":[{"k":"A","t":"\"Here's the exact system and the numbers it's hit for businesses like yours — let's map it to yours\"","correct":true},{"k":"B","t":"\"Trust us, it always works\"","correct":false},{"k":"C","t":"\"There's no guarantee, but we'll try our best\"","correct":false}]},"gate":[]},{"n":41,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all six?","subhead":"","lines":[],"quiz":null,"gate":["Do you use only white, black and one maroon accent?","Do you use the official logo file only, never recolour, stretch or retype it?","Do you set everything in Helvetica, bold for emphasis, never all capitals?","Is your layout white-dominant, roughly 60% white, 30% black, 10% maroon?","Do you lead with the answer, and reframe every \"no\" into \"here's what works\"?","Could a stranger tell it's Koocester without seeing the logo?"]},{"n":42,"kind":"close","eyebrow":"","head":"Empowering growth. Built on trust.","subhead":"","lines":[{"t":"lead","x":"Next in foundations: how the base works. The full master guideline lives in the brand folder for anything deeper."}],"quiz":null,"gate":[]}]},{"id":"f_tools","bucket":"Foundation · everyone","title":"Tools & accounts","href":"tools-accounts-training.html","step":"Foundation","count":22,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · foundation","head":"Tools & accounts","subhead":"","lines":[{"t":"lead","x":  owner, no deadline and no clear result. It clearly needs doing.","q":"Correct. A real task needs an owner, a deadline and a definition of done — what success looks like. Set all three before anyone starts.\" data-no=\" Not yet. The standard is owner + deadline + definition of done. Without a clear 'what success looks like', the work gets started blind and comes back wrong.\"> A task lands in the group chat with no owner, no deadline and no clear result. It clearly needs doing.","opts":[{"k":"A","t":"Just an owner — they'll figure out the rest","correct":false},{"k":"B","t":"An owner, a deadline, and what success looks like","correct":true},{"k":"C","t":"Nothing — start immediately so nothing is delayed","correct":false}]},"gate":[]},{"n":15,"kind":"body","eyebrow":"Question 2 · tools by role","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"You're a Social Media Manager and you need to run paid ads.","q":"Correct. Ad buying runs through Meta Business Suite. Metricool is for posting, and ManyChat handles automated replies — different jobs.\" data-no=\" No. Ad buying is Meta Business Suite. Metricool posts your content and ManyChat runs automated replies — neither buys ads.\"> You're a Social Media Manager and you need to run paid ads.","opts":[{"k":"A","t":"Metricool","correct":false},{"k":"B","t":"ManyChat","correct":false},{"k":"C","t":"Meta Business Suite","correct":true}]},"gate":[]},{"n":16,"kind":"body","eyebrow":"Question 3 · where work happens","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"You're on the content team and you're about to start your day's work.","q":"Correct. Daily content work lives in the Marketing & Delivery Base — a Lark Base, the single source of truth. Not chat, not a homepage.\" data-no=\" No. Daily content work happens in the Marketing & Delivery Base (a Lark Base). Chat is for talking; the company homepage isn't set up yet — the Base is where the work is tracked.\"> You're on the content team and you're about to start your day's work.","opts":[{"k":"A","t":"In the Lark group chat","correct":false},{"k":"B","t":"On the company homepage","correct":false},{"k":"C","t":"In the Marketing & Delivery Base","correct":true}]},"gate":[]},{"n":17,"kind":"body","eyebrow":"Question 4 · which app for what","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A cut is ready and a teammate asks where to leave time-stamped feedback on it.","q":"Correct. We review videos in Frame.io — that's the review and feedback platform. Editors, the Marketing coordinator and the Content strategist all work there.\" data-no=\" No. Video review and feedback happens in Frame.io. CapCut is for editing the video, not reviewing it; Google Drive just stores files.\"> A cut is ready and a teammate asks where to leave time-stamped feedback on it.","opts":[{"k":"A","t":"CapCut","correct":false},{"k":"B","t":"Frame.io","correct":true},{"k":"C","t":"Google Drive","correct":false}]},"gate":[]},{"n":18,"kind":"body","eyebrow":"Question 5 · CapCut vs Canva","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"You're a video editor and you've just received the footage for a new piece. Canva is open on your other screen.","q":"Correct. Video is edited in CapCut — always. Canva is design and graphics, never video editing — don't confuse the two. Frame.io is only for reviewing the finished cut.\" data-no=\" No. Video editing happens in CapCut . Canva is for design and graphics, not video , and Frame.io is only for reviewing the finished cut.\"> You're a video editor and you've just received the footage for a new piece. Canva is open on your other screen.","opts":[{"k":"A","t":"CapCut","correct":true},{"k":"B","t":"Frame.io","correct":false},{"k":"C","t":"Canva","correct":false}]},"gate":[]},{"n":19,"kind":"body","eyebrow":"Question 6 · which app for what","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"You paid for something for a shoot and need to claim it back.","q":"Correct. Reimbursements and company spend go through Aspire — everyone uses it for that.\" data-no=\" No. Reimbursements and company spend run through Aspire. Xero is the accounting system for Sales & Finance, and Bitwarden only holds passwords.\"> You paid for something for a shoot and need to claim it back.","opts":[{"k":"A","t":"Xero","correct":false},{"k":"B","t":"Bitwarden","correct":false},{"k":"C","t":"Aspire","correct":true}]},"gate":[]},{"n":20,"kind":"body","eyebrow":"Question 7 · which app for what","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A producer has raw files from a shoot and needs to put them where the team can pull them.","q":"Correct. Producers store files in Google Drive. Bitwarden is for passwords and Metabase is a Tech dashboard tool — neither stores your files.\" data-no=\" No. Producer files live in Google Drive. Bitwarden manages passwords and Metabase builds dashboards for Tech — they don't store your footage.\"> A producer has raw files from a shoot and needs to put them where the team can pull them.","opts":[{"k":"A","t":"Bitwarden","correct":false},{"k":"B","t":"Google Drive","correct":true},{"k":"C","t":"Metabase","correct":false}]},"gate":[]},{"n":21,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Are your accounts set up and are you operating inside the system?","subhead":"","lines":[],"quiz":null,"gate":["Do you have access to every app your role needs on the stack?","Have you joined all your required Lark groups?","Do you know your daily work lives in the Marketing & Delivery Base?","Are your Lark links set to open in-app and your timezone set to your country?","Do you know your Protocols come through the Academy — finish your foundation, then your role module?","Can you set every task with an owner, a deadline and what success looks like?"]},{"n":22,"kind":"close","eyebrow":"","head":"Now go win .","subhead":"","lines":[{"t":"lead","x":"Day one is done . Apps live. Every task with an owner , a deadline and a definition of done . Your Protocols unlock as you finish the Academy. Find your role module — and win."}],"quiz":null,"gate":[]}]},{"id":"f_policies","bucket":"Foundation · everyone","title":"Policies & compliance","href":"policies-compliance-training.html","step":"Foundation","count":28,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · Foundations · everyone does this module","head":"Policies & compliance","subhead":"","lines":[{"t":"lead","x":"This is your foundation module — everyone takes it. One clear set of rules for how we work, protect our clients, and look after each other. Know these and you're always on solid ground."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"Start here · the fine line, made clear","head":"Your contract is the source of truth. This module makes it real.","subhead":"","lines":[{"t":"lead","x":"When you joined, you signed a contract — the legal agreement that governs everything here. This module is the plain-English version: the same commitments, translated into how you actually live them day to day. We keep the legal text where it belongs and give you something you can use."},{"t":"callout","x":"Know these well and you're always on solid ground. When something isn't spelled out here, your contract and HR have the answer — and they're glad to walk you through it."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"You guard client and company data — credentials in Bitwarden, shared on a need-to-know basis"},{"t":"win","x":"You declare every gift and barter — even the ones you turn down"},{"t":"win","x":"You represent us well, online and off — confidential stays confidential"},{"t":"win","x":"When unsure, you check and ask — your contract and HR have the answer — asking is always right"},{"t":"p","x":"This is the bar. Everything that follows shows you how to hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one · everyday policies","head":"The habits that keep us safe","subhead":"","lines":[{"t":"lead","x":"Six everyday policies, one idea each. What they mean for you, day to day."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Everyday policy · data protection & security","head":"Guard client and company data like it's your own.","subhead":"","lines":[{"t":"lead","x":"Handling data responsibly keeps clients confident in us and keeps the company safe. A few habits carry most of the weight."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Everyday policy · code of conduct","head":"Respect is the standard — with each other and with clients.","subhead":"","lines":[{"t":"lead","x":"A workplace people trust is one where everyone feels safe and valued. That's on all of us."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Everyday policy · IT & acceptable use","head":"Company systems power the work — keep them secure and clean.","subhead":"","lines":[{"t":"lead","x":"Our accounts and devices are here to do the job well. Treat them with the same care you'd want."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Everyday policy · social-media conduct","head":"Online, you're a face of Koocester — post like it.","subhead":"","lines":[{"t":"lead","x":"Your presence reflects on all of us. A little intention goes a long way."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Everyday policy · expenses & reimbursement","head":"Spend on real business needs — and document everything.","subhead":"","lines":[{"t":"li","x":"Spend within policy on genuine business needs."},{"t":"li","x":"Pay via Aspire where you can — that's our company card."},{"t":"li","x":"Keep every receipt — snap a photo on the spot so nothing goes missing."},{"t":"li","x":"Submit with your manager's approval through the proper channel."},{"t":"li","x":"Get reimbursed cleanly on the next cycle. Clear records make it fast."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Everyday policy · leave & attendance","head":"Plan time off ahead — it keeps the team flowing.","subhead":"","lines":[{"t":"lead","x":"Good notice lets everyone plan around you. Here's how leave works."}],"quiz":null,"gate":[]},{"n":11,"kind":"divider","eyebrow":"Part two · gifts & barter","head":"The Gifts & Barter rules","subhead":"","lines":[{"t":"lead","x":"The everyday policy that lands in your inbox most. In two parts — what to declare, and how we operate. Know them cold."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Why this matters","head":"Gifts and barter are constant. You are personally accountable for how they're handled.","subhead":"","lines":[{"t":"lead","x":"As a media company covering homes, food, autos and wealth, we're offered free products, meals, trips and barter deals constantly. Handled well, that's normal business. Handled wrong, it's a reputational risk (readers stop trusting our coverage), an editorial-integrity risk (coverage starts looking bought), and a tax risk (undeclared value is still value). Declare everything — that one habit is what protects the brand , and it's on every one of us, every time, no exceptions."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"The Gifts & Barter rules · declare & thresholds","head":"","subhead":"","lines":[{"t":"li","x":"Declare everything. Any gift, meal, trip, product, or barter offer through your Koocester work goes in the Register — even ones you decline."},{"t":"li","x":"Token (≤ S$50) — e.g. a meal or sample. Log only, no approval needed."},{"t":"li","x":"Over S$50, or tied to coverage — log it and get manager approval before you accept."},{"t":"li","x":"High value, or could look like influence — decline and escalate. No exceptions."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"The Gifts & Barter rules · how we operate","head":"","subhead":"","lines":[{"t":"li","x":"Never solicit. Never ask for gifts or discounts using Koocester's name."},{"t":"li","x":"Coverage is never for sale. A gift never buys or changes what, whom, or how we feature or edit."},{"t":"li","x":"Barter is a documented deal, not a handshake. Defined deliverables, approved by the Head of Growth and Finance, recorded like any client."},{"t":"li","x":"Disclose to the audience where platforms require it — gifted or paid-partnership labels, used honestly."},{"t":"li","x":"Know who owns it. High-value gifts are company property. Staff keep only token items."},{"t":"p","x":"When in doubt — declare and ask. Asking first is always the right move. It is never a mistake."}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"One flow · run every gift or barter offer through it","head":"Received or offered something? Run this.","subhead":"","lines":[{"t":"callout","x":"Free food ≠ a free video. A gift never obligates coverage. If the trade doesn't add up — a free meal for a free video — you can and should reject it."},{"t":"p","x":"Three checkpoints, in order: the S$50 line , manager approval , influence check . If you're ever unsure which lane you're in, treat it as the higher one."}],"quiz":null,"gate":[]},{"n":16,"kind":"body","eyebrow":"Try it · the Gifts & Barter Register","head":"Log a declaration","subhead":"","lines":[{"t":"lead","x":"A live demo of the register. Fill it in like you would for real — this exact habit is what keeps you covered."}],"quiz":null,"gate":[]},{"n":17,"kind":"body","eyebrow":"The Gifts & Barter Register · keep it lightweight","head":"Six fields. Log it the day it happens.","subhead":"","lines":[{"t":"callout","x":"The register is not a punishment. It's proof you did the right thing. A logged token item is a non-event. An undeclared one is the risk."}],"quiz":null,"gate":[]},{"n":18,"kind":"body","eyebrow":"Editorial integrity · brief, but non-negotiable","head":"Four that protect what we publish.","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":19,"kind":"body","eyebrow":"What you signed · awareness, not fine print","head":"Three commitments already in your contract.","subhead":"","lines":[{"t":"lead","x":"You agreed to these when you joined. Here's what each means in plain terms."},{"t":"callout","x":"You agreed to these in your contract when you joined. The full legal terms live in your signed contract and with HR — this slide is just so you know what you're living by. Questions? HR is glad to walk you through it."}],"quiz":null,"gate":[]},{"n":20,"kind":"divider","eyebrow":"Your turn","head":"Three calls","subhead":"","lines":[{"t":"lead","x":"Get them graded."}],"quiz":null,"gate":[]},{"n":21,"kind":"body","eyebrow":"Question 1 · the token gift","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"A brand sends you a S$30 product sample after a shoot. It has nothing to do with any coverage decision.","q":"Correct. S$30 is under the S$50 line and it's a plain sample — no coverage attached. Log it in the register and keep it. No approval needed.\" data-no=\" Not quite. S$30 is under the S$50 line and isn't tied to coverage — that's a token gift. Log only, you keep it. No approval step, and it's never a straight refuse.\"> A brand sends you a S$30 product sample after a shoot. It has nothing to do with any coverage decision.","opts":[{"k":"A","t":"Log it in the register — you keep it, no approval needed","correct":true},{"k":"B","t":"Get manager approval before accepting","correct":false},{"k":"C","t":"Decline it — any brand gift is off-limits","correct":false}]},"gate":[]},{"n":22,"kind":"body","eyebrow":"Question 2 · the high-value gift, tied to coverage","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"Someone you're about to feature sends you a S$800 gadget, unprompted, the week before the piece runs.","q":"Correct. S$800 is well above the S$50 line, and it's from someone we're about to feature — log it and get manager approval before accepting. If approved, the gadget is company property, not yours to keep.\" data-no=\" No. S$800 from someone we're about to feature is over the line and tied to coverage — log + manager approval before accepting, not a quiet keep. And if it's approved, it's company property, not yours.\"> Someone you're about to feature sends you a S$800 gadget, unprompted, the week before the piece runs.","opts":[{"k":"A","t":"Log it and keep it quietly — it's not affecting the piece","correct":false},{"k":"B","t":"Log it, get manager approval before accepting — if kept, it's company property","correct":true},{"k":"C","t":"Accept it, disclose it publicly, no approval needed","correct":false}]},"gate":[]},{"n":23,"kind":"body","eyebrow":"Question 3 · the core principle","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"Someone offers a very generous gift, hoping it improves their odds of being featured.","q":"Correct. Coverage is never for sale. No gift, however generous, buys or changes what we feature or how we edit it — that line doesn't move regardless of value.\" data-no=\" No. Coverage is never for sale, at any value. A great gift doesn't earn a feature — value and generosity don't move that line, ever.\"> Someone offers a very generous gift, hoping it improves their odds of being featured.","opts":[{"k":"A","t":"Yes, if it's declared and logged first","correct":false},{"k":"B","t":"Yes, above a certain value, with manager approval","correct":false},{"k":"C","t":"No — coverage is never for sale, regardless of value","correct":true}]},"gate":[]},{"n":24,"kind":"body","eyebrow":"Question 4 · data security","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"A teammate is covering for you this week and needs a client's login to keep things moving.","q":"Correct. Credentials live in Bitwarden, shared on a need-to-know basis. One teammate covering means one teammate gets access — clean and secure.\" data-no=\" Not quite. Passwords belong in Bitwarden, shared only with the person who needs them. Chat and mass email spread a credential further than it should go — Bitwarden keeps it tight.\"> A teammate is covering for you this week and needs a client's login to keep things moving.","opts":[{"k":"A","t":"Share it through Bitwarden to just that teammate","correct":true},{"k":"B","t":"Drop it in chat so it's quick to find","correct":false},{"k":"C","t":"Email it to the whole team so anyone can jump in","correct":false}]},"gate":[]},{"n":25,"kind":"body","eyebrow":"Question 5 · social-media conduct","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"A client's unreleased campaign is exciting, and you'd love to post a sneak peek to your personal followers.","q":"Correct. Client and company confidential work stays offline until it's public. Once the client releases it, celebrate away.\" data-no=\" No. Confidential client work stays off your feed until the client makes it public. The instinct to share great work is right — the timing is what matters. Wait for the green light, then celebrate it.\"> A client's unreleased campaign is exciting, and you'd love to post a sneak peek to your personal followers.","opts":[{"k":"A","t":"Keep it offline until the client makes it public, then celebrate it","correct":true},{"k":"B","t":"Post it now — it's great work and shows what we do","correct":false},{"k":"C","t":"Post it, and take it down fast if the client notices","correct":false}]},"gate":[]},{"n":26,"kind":"body","eyebrow":"Question 6 · the source of truth","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"You're unsure whether something you're about to do fits our policies. A colleague says, \"the training slides skip it, so it's fine.\"","q":"Correct. This module is the plain-English guide; your signed contract is the legal source of truth. When something isn't covered here, the contract and HR have the real answer.\" data-no=\" Not quite. These slides make the rules easy to live — but your signed contract is the source of truth. When something's unclear, check the contract and ask HR; they're glad to help.\"> You're unsure whether something you're about to do fits our policies. A colleague says, \"the training slides skip it, so it's fine.\"","opts":[{"k":"A","t":"Your signed contract is the source of truth — check it and ask HR","correct":true},{"k":"B","t":"If the slides skip it, there's no rule","correct":false},{"k":"C","t":"Whatever the group chat lands on","correct":false}]},"gate":[]},{"n":27,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all six?","subhead":"","lines":[],"quiz":null,"gate":["Will you declare every gift and barter offer you receive, including the ones you turn down?","Will you keep credentials in Bitwarden and share data on a need-to-know basis?","Will you help keep our workplace respectful and harassment-free?","Will you keep client and company confidential info offline until it's public?","Do you understand your signed contract — NDA, non-compete and non-solicit included — is the source of truth?","Will you check the contract and ask your manager or HR whenever you're unsure?"]},{"n":28,"kind":"close","eyebrow":"","head":"Live it daily. Ask when unsure. Protect the brand.","subhead":"","lines":[{"t":"lead","x":"Guard our data, respect each other, declare every gift, and represent us well online. Your signed contract is the source of truth; this module is how you live it. When you're not sure, check the contract and ask — that's always the right call."}],"quiz":null,"gate":[]}]},{"id":"f_90days","bucket":"Foundation · everyone","title":"Your first 90 days","href":"first-90-days-training.html","step":"Foundation","count":23,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · onboarding","head":"Your first 90 days","subhead":"","lines":[{"t":"lead","x":"Your first 90 days is the audition for everything that follows. How fast you earn trust, own your work, and raise the quality decides your scope, your rank, and how far you go here. This is where the trajectory is set."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"What's expected of you","head":"","subhead":"","lines":[{"t":"p","x":"One expectation sits above every other: how fast you climb from relied-on , to owning your outcomes , to raising the standard the whole team works to. The measure is real, measurable movement on the numbers that matter — results, not activity ."},{"t":"p","x":"Know exactly what you're here to become. This is the bar you're measured against from day one — and it's what unlocks bigger scope, the command ranks, and promotion."}],"quiz":null,"gate":[]},{"n":3,"kind":"divider","eyebrow":"Part one · the universal timeline","head":"The path everyone walks","subhead":"","lines":[{"t":"lead","x":"First 24 hours → Week 1 → Week 2 → 30 → 60 → 90. Same rhythm, every role."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"First 24 hours · all five on day one","head":"Day one is setup. Finish all five.","subhead":"","lines":[{"t":"li","x":"Join every required Lark group — company, your department, and your role channel."},{"t":"li","x":"Read your department Standard Operating Procedure (SOP) — how your team actually works."},{"t":"li","x":"Meet your manager — introduce yourself, agree how you'll check in."},{"t":"li","x":"Check your Weekly Priorities — what matters this week, in writing."},{"t":"li","x":"Understand your Key Performance Indicators (KPIs) — the numbers you'll be measured on."},{"t":"callout","x":"All five, day one. None of this is \"later in the week\" — you can't do the work until you're plugged in and you know the standard."},{"t":"p","x":"Gets set up when someone walks them through it."},{"t":"p","x":"Is fully plugged in by end of day one and shows up to meet their manager with questions ready."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Week 1 · learn + execute","head":"Learn the systems, then do the work.","subhead":"","lines":[{"t":"callout","x":"Week 1 is hands-on from the start. You watch, then you do — guidance mid-week, your first solo task by the weekend."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Week 2 · perform + improve","head":"Raise the quality, take the wheel.","subhead":"","lines":[{"t":"callout","x":"By the end of Week 2 the work is yours. You own your tasks end to end and you're already improving how you do them."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Milestone · 30 days","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Milestone · 60 days","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Milestone · 90 days","head":"","subhead":"","lines":[{"t":"callout","x":"Evaluation is bi-annual — every six months. You complete a Bi-annual Review Form twice a year — a full review with peer reviews and a manager review together."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"How we work · the standard, day one to forever","head":"These are THE five rules.","subhead":"","lines":[{"t":"p","x":"Learn them once. They apply on day one, at day 90, and every day after — this is how we work, always ."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"The performance mindset · how the best rise","head":"Built for performance . We move at pace.","subhead":"","lines":[{"t":"callout","x":"Evaluation is bi-annual — but reputation is daily. The people who own outcomes early, and move the needle, are the ones who earn bigger scope, the command ranks, and promotion. Start now."},{"t":"p","x":"AT PACE Performance Built for performance . We move at pace. Excellent isn't handed out — it's chosen, daily. This is the gear we run in: fast, focused, and always climbing."}],"quiz":null,"gate":[]},{"n":12,"kind":"divider","eyebrow":"Part two · your role","head":"What you actually ship","subhead":"","lines":[{"t":"lead","x":"Find your role. These are your concrete, shippable first-90-days deliverables."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"Your department · one shared goal","head":"Marketing runs on one number: Leads & Reach .","subhead":"","lines":[{"t":"lead","x":"Different jobs, one scoreboard. Every content role rows toward the same goal."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Every other team · one goal each","head":"One number per department.","subhead":"","lines":[{"t":"lead","x":"You align to your department's goal — the number everyone there rows toward."},{"t":"callout","x":"Align to your department's number. The full playbook for YOUR role lives in your role module — read that closely; it's how you own your outcomes by day 60."}],"quiz":null,"gate":[]},{"n":15,"kind":"divider","eyebrow":"Part three · make it visible","head":"Track your milestones","subhead":"","lines":[{"t":"lead","x":"Progress that isn't visible didn't happen. Tick each milestone as you clear it."}],"quiz":null,"gate":[]},{"n":16,"kind":"body","eyebrow":"Your first-90-days checklist · tick as you go","head":"Where are you?","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":17,"kind":"divider","eyebrow":"Part four","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Four calls. Get them graded."}],"quiz":null,"gate":[]},{"n":18,"kind":"body","eyebrow":"Question 1 · your first 24 hours","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"It's your first morning. You're keen to look useful and start producing output straight away.","q":"Correct. All five happen on day one: join every required Lark group, read your department SOP, meet your manager, check your Weekly Priorities, and understand your KPIs. You can't do the work until you're plugged in and you know the standard.\" data-no=\" Not quite. The first 24 hours are all five, on day one — join your Lark groups, read the department SOP, meet your manager, check Weekly Priorities, and understand your KPIs. It isn't a slow week of watching.\"> It's your first morning. You're keen to look useful and start producing output straight away.","opts":[{"k":"A","t":"Ship a finished piece of work to prove yourself fast","correct":false},{"k":"B","t":"Join your Lark groups, read the SOP, meet your manager, check priorities, understand your KPIs","correct":true},{"k":"C","t":"Wait quietly and watch until someone gives you a task","correct":false}]},"gate":[]},{"n":19,"kind":"body","eyebrow":"Question 2 · how we work","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"In a meeting, a useful action comes up — but nobody's name is on it, there's no date, and it's fuzzy what \"done\" would even look like.","q":"Correct. Every task carries three things: an owner, a deadline, and what success looks like (the definition of done). Set all three and it lives in the system, someone answers for it, and you both know when it's truly finished. No task = no work.\" data-no=\" Not yet. A task with no owner, no deadline, or no clear \"done\" is orphan work. Give it all three — an owner, a deadline, and what success looks like — so it becomes real and finishable.\"> In a meeting, a useful action comes up — but nobody's name is on it, there's no date, and it's fuzzy what \"done\" would even look like.","opts":[{"k":"A","t":"Leave it — someone will pick it up if it matters","correct":false},{"k":"B","t":"Note it in your head and try to remember it later","correct":false},{"k":"C","t":"Give it an owner, a deadline, and what success looks like","correct":true}]},"gate":[]},{"n":20,"kind":"body","eyebrow":"Question 3 · the 90-day bar","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"You're approaching day 90 and want to know what the top of the ramp looks like.","q":"Correct. By day 90 you raise the bar — you lead, drive improvements, and set a standard others start matching. Relied-on is day 30, owning outcomes is day 60; day 90 is where you make the work better. Evaluation is bi-annual, via the Bi-annual Review Form.\" data-no=\" Not the bar. By day 90 the standard is raising the bar — leading and improving the work so others match your standard. Being reliable is the day-30 level; owning outcomes is day 60. Day 90 asks for more.\"> You're approaching day 90 and want to know what the top of the ramp looks like.","opts":[{"k":"A","t":"You raise the bar — lead, drive improvements, and set a standard others match","correct":true},{"k":"B","t":"You do exactly what you're told, nothing more","correct":false},{"k":"C","t":"You've been here 90 days — time served is enough","correct":false}]},"gate":[]},{"n":21,"kind":"body","eyebrow":"Question 4 · finishing early","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"You finish everything on your task list well before end of day. Nobody has handed you anything new.","q":"Correct. High performers don't wait to be fed work. Finished early is a signal to find the next task — clear a bottleneck, sharpen what you shipped, or take on scope. Owning outcomes early is exactly what gets noticed at the Bi-annual Review and earns bigger scope.\" data-no=\" Not the move. Waiting to be assigned work — or padding the clock to look busy — is 'just okay'. A high performer finds the next task before being asked: clear a bottleneck or raise the quality of what you've shipped. That's how ownership shows up.\"> You finish everything on your task list well before end of day. Nobody has handed you anything new.","opts":[{"k":"A","t":"Wait quietly for someone to assign the next thing","correct":false},{"k":"B","t":"Slow the current work down to fill the time and look busy","correct":false},{"k":"C","t":"Find the next task before being asked — clear a bottleneck or raise the quality of what you've shipped","correct":true}]},"gate":[]},{"n":22,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Do you know how to make your first 90 days count?","subhead":"","lines":[],"quiz":null,"gate":["Do you know all five things to finish in your first 24 hours?","Do you know your Week 1 and Week 2 milestones?","Do you know what 30, 60 and 90 days each require of you?","Do you know what your role ships — and that the full detail lives in your role module?","Do you work the five How We Work rules by default — every task with an owner, deadline, and what success looks like?","Do you know the ramp — relied on by day 30, owning outcomes by 60, raising the bar by 90?"]},{"n":23,"kind":"close","eyebrow":"","head":"Own it from day one.","subhead":"","lines":[{"t":"lead","x":"Your first 90 days are your audition — make them yours. Finish the first 24 hours, hit every milestone, ship your role's deliverables, then go beyond. Climb from relied-on at 30, to owning outcomes at 60, to raising the bar at 90 — and the scope, the ranks, and the promotion follow. Start today."}],"quiz":null,"gate":[]}]},{"id":"f_rewards","bucket":"Foundation · everyone","title":"Rewards & consequences","href":"rewards-consequences-training.html","step":"Foundation","count":19,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · everyone","head":"Rewards & consequences","subhead":"","lines":[{"t":"lead","x":"How we hold the standard here — said out loud, to everyone. The bar is only real if it is rewarded when met and has a consequence when missed."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"Why this module exists","head":"Great people stay when the bar is real .","subhead":"","lines":[{"t":"lead","x":"The deal is simple: do great work and you're rewarded for it — coast, and there's a consequence. When that's true and fair, the best people want to stay. When people coast and nothing happens, the best people lose faith and leave."},{"t":"callout","x":"So we say it out loud, to everyone — what earns a reward, and what happens if you fall short. That plain honesty is exactly what makes the bar fair."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"
