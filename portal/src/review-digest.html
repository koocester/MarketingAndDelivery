win","x":"Everyone knows exactly what earns the next rung — the reward is named, not guessed at"},{"t":"win","x":"Everyone knows what happens if the bar is missed — the consequence is named too, in advance"},{"t":"win","x":"It never comes as a surprise — said at onboarding, in every review, in writing"},{"t":"win","x":"Reward and consequence are applied fairly — the same bar, the same way, for everyone"},{"t":"p","x":"This is the bar. Everything that follows is how we hold it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"The Koocester frame · abundance, not fear","head":"Performance and belonging are the same thing .","subhead":"","lines":[{"t":"lead","x":"This is not \"be tough or be kind\" — that's a false trade. People feel they belong because the standard is real and everyone is held to it. A clear reward and a clear consequence are how we say: your work matters, and so does everyone's around you."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"The one idea","head":"A bar with no reward and no consequence is just a poster .","subhead":"","lines":[{"t":"lead","x":"The bar — your Key Performance Indicator (KPI) — only becomes real when clearing it earns something and missing it triggers something. And both have to be said out loud, early, and fairly . Said late, or only to some, it isn't a standard — it's a surprise."}],"quiz":null,"gate":[]},{"n":6,"kind":"divider","eyebrow":"Part one","head":"The rewards ladder","subhead":"","lines":[{"t":"lead","x":"What great performance earns — and how you climb."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Clear the bar · climb the ladder","head":"You climb it rung by rung — each level unlocks more.","subhead":"","lines":[{"t":"callout","x":"Dare to be bold, and it compounds. Growth & Curiosity is a Koocester value — the ladder is how we pay it back."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"The rule of the ladder","head":"One rule: clear your bar three reviews running → the next rung opens.","subhead":"","lines":[{"t":"lead","x":"A rung is earned by clearing your bar three reviews running — proven over time, not one quick milestone. And the climb keeps its promise: once you step up, the very next review measures you against the results the new rung expects. Reward is a standard everyone can see, not a mood or a favour: you always know where you stand and what the next climb takes. No politics, no guessing."}],"quiz":null,"gate":[]},{"n":9,"kind":"divider","eyebrow":"Part two","head":"The consequence ladder","subhead":"","lines":[{"t":"lead","x":"The fair, escalating response when the bar is missed — read this as kindness, not punishment."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Sustained under-performance · a fair escalation","head":"Four steps, in order. Most people never leave step one.","subhead":"","lines":[{"t":"callout","x":"This is Empathy & Giving in practice. Escalation is slow, supported, and always aimed first at helping someone succeed — not at removing them."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"The reframe · consequence is care","head":"A consequence, said early, is the kindest move there is.","subhead":"","lines":[{"t":"lead","x":"Care is not comfort. The most respectful thing you can do is tell someone the truth early enough that they can still do something about it."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Non-negotiable · no surprises, ever","head":"If it wasn't said, it doesn't count.","subhead":"","lines":[{"t":"callout","x":"Uniting through trust. A consequence a person never saw coming is a failure of ours, not just theirs. It gets said early, said clearly, and put in writing — every time."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"Where it all lands · the rhythm","head":"It all ties to the Bi-annual Review .","subhead":"","lines":[{"t":"lead","x":"Twice a year — every six months — we check the same bar for everyone, on the Bi-annual Review Form. Clear it and the reward ladder moves. Miss it repeatedly and the consequence ladder starts — at coaching, not at exit. That six-month rhythm is the heartbeat: predictable, fair, and known to all in advance."}],"quiz":null,"gate":[]},{"n":14,"kind":"divider","eyebrow":"Part three","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Three calls. Get them graded."}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"Question 1 · sustained under-performance","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A teammate has been coached on the same gap for weeks. The gap is still there. Everyone can see the bar is being missed.","q":"Correct. Coaching came first and the gap is still there, so the fair next step is a formal Performance Improvement Program (PIP) — written expectations, support, a timeline, and a clear definition of success. Not a surprise exit, and not silence.\" data-no=\" Not that. You don't jump to exit, and you don't go silent. After coaching hasn't closed the gap, the fair, kind next step is a formal Performance Improvement Program (PIP): written expectations, support, a timeline, and a defined 'what success looks like'.\"> A teammate has been coached on the same gap for weeks. The gap is still there. Everyone can see the bar is being missed.","opts":[{"k":"A","t":"Move straight to a respectful exit — coaching already failed","correct":false},{"k":"B","t":"Open a formal Performance Improvement Program (PIP) with a clear timeline","correct":true},{"k":"C","t":"Say nothing more, to avoid an awkward conversation","correct":false}]},"gate":[]},{"n":16,"kind":"body","eyebrow":"Question 2 · no surprises","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"A manager is about to raise a consequence with someone who has never once been told what the bar was or what missing it triggers.","q":"Correct. Reward and consequence are told at onboarding, referenced in every review and 1-on-1, and put in writing. A consequence someone never saw coming is a failure of ours — the whole point is that it's never a surprise.\" data-no=\" No. The rule is 'no surprises, ever'. Reward and consequence must be said at onboarding, repeated in reviews and 1-on-1s, and put in writing — not sprung on someone at the moment it bites.\"> A manager is about to raise a consequence with someone who has never once been told what the bar was or what missing it triggers.","opts":[{"k":"A","t":"Proceed — results are results, whether or not it was explained","correct":false},{"k":"B","t":"Only bring it up if the person asks about it first","correct":false},{"k":"C","t":"Stop — it should have been said at onboarding and in writing; no surprises","correct":true}]},"gate":[]},{"n":17,"kind":"body","eyebrow":"Question 3 · the kind move","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"A strong teammate has started slipping. You could quietly let it slide 'to be nice', or name it now with a plan.","q":"Correct. Naming the gap early — with a plan and support — is the kindest move. Staying quiet 'to be nice' robs the person of the chance to fix it while it's small, and tells the team the bar is optional. Consequence, said early, is care.\" data-no=\" Reconsider. Silence isn't kindness. Naming the gap early, with a plan and support, is the most respectful thing you can do — it gives the person a real chance to fix it and keeps the bar real for everyone else.\"> A strong teammate has started slipping. You could quietly let it slide 'to be nice', or name it now with a plan.","opts":[{"k":"A","t":"Name it early, with a plan and support — clarity is the kindness","correct":true},{"k":"B","t":"Let it slide for now so they don't feel singled out","correct":false},{"k":"C","t":"Skip the coaching and put them straight on a PIP","correct":false}]},"gate":[]},{"n":18,"kind":"body","eyebrow":"Certification · answer Yes to both questions","head":"Do you understand what earns reward and what triggers consequence here?","subhead":"","lines":[],"quiz":null,"gate":["Do you know exactly what earns the next rung of the rewards ladder?","Do you know what happens if the bar is missed, step by step?"]},{"n":19,"kind":"close","eyebrow":"","head":"A real bar: rewarded when met, consequences when missed.","subhead":"","lines":[{"t":"lead","x":"Great work climbs. Missed work meets help first. Both said out loud, early, in writing — never a surprise."}],"quiz":null,"gate":[]}]},{"id":"f_comms","bucket":"Foundation · everyone","title":"Communication & meetings","href":"communication-meetings-training.html","step":"Foundation","count":21,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · foundation · everyone","head":"How we communicate & meet","subhead":"","lines":[{"t":"lead","x":"The base layer everyone stands on. Where we talk, how we talk, when we meet — and the one room that keeps us honest."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"Why this is the foundation","head":"Great work moves at the speed of clear communication.","subhead":"","lines":[{"t":"lead","x":"Every role, every project, every ritual runs on the same base layer: we talk in the right place, we always carry an ask, and we meet only to decide. Get this right and everything downstream gets faster."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're doing this well when…","subhead":"","lines":[{"t":"win","x":"You communicate clearly — you lead with the point, no digging for it"},{"t":"win","x":"Your messages always carry an ask — a message with no ask is noise"},{"t":"win","x":"Meetings you're in create action items — every meeting ends with owners and deadlines"},{"t":"win","x":"You show up real in the rituals — a Win, a real Struggle, and a Need"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one","head":"Where we talk","subhead":"","lines":[{"t":"lead","x":"Two channels. Each has a job. Don't mix them up."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Two channels, two jobs","head":"","subhead":"","lines":[{"t":"li","x":"Tasks — the work lives here"},{"t":"li","x":"Protocols — our standard way of doing things"},{"t":"li","x":"Project management — every project, tracked"},{"t":"li","x":"Daily huddles , by department"},{"t":"li","x":"Talking to people outside the company"},{"t":"li","x":"Quick, time-sensitive back-and-forth"},{"t":"li","x":"Never where a task or decision is logged"},{"t":"callout","x":"The rule: if it's work, it's in Lark. If it's fast or external, WhatsApp. A decision made on WhatsApp isn't real until it lands as a Lark task."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Set Lark up right · once, today","head":"Two settings. Do them now .","subhead":"","lines":[{"t":"li","x":"Open links in Navigation Bar — so links open cleanly inside Lark instead of bouncing you out. Turn it on in your Lark settings."},{"t":"li","x":"Set your timezone — critical when you're travelling. If your timezone is wrong, every deadline and huddle time reads wrong. Fix it before you fly."},{"t":"callout","x":"Why it matters: the whole company runs on Lark's clock. A wrong timezone quietly makes you late to everything — and nobody can see why."}],"quiz":null,"gate":[]},{"n":7,"kind":"divider","eyebrow":"Part two","head":"How we work","subhead":"","lines":[{"t":"lead","x":"Five principles. They apply to everyone, everywhere."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"The five principles","head":"","subhead":"","lines":[{"t":"li","x":"Tasks must have an owner and a deadline — one name, one date. No orphans."},{"t":"li","x":"Meetings must create action items — if nothing's assigned, the meeting didn't happen."},{"t":"li","x":"No task = no work — if it isn't a task in Lark, it doesn't exist and won't get done."},{"t":"li","x":"Speed > perfection — ship, learn, improve. A good move now beats a perfect one later."},{"t":"li","x":"Clarity > assumptions — spell it out. Never assume the other person filled the gap the way you would."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Question 1 · the five principles","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A colleague drops a message in the chat: “We should really redo the landing page.” No owner, no deadline. It's aimed vaguely at the group.","q":"Correct. No task = no work, and every task needs an owner and a deadline. A message with neither isn't work yet — turn it into a real task before you touch it.\" data-no=\" Not quite. A message with no owner and no deadline isn't a task, and no task = no work. Don't silently start, and don't ignore it — make it a real task with an owner and a deadline first.\"> A colleague drops a message in the chat: “We should really redo the landing page.” No owner, no deadline. It's aimed vaguely at the group.","opts":[{"k":"A","t":"Quietly start working on it, since someone should","correct":false},{"k":"B","t":"Turn it into a Lark task with an owner and a deadline before it counts as work","correct":true},{"k":"C","t":"Ignore it — it's not addressed to you","correct":false}]},"gate":[]},{"n":10,"kind":"divider","eyebrow":"Part three","head":"How we talk","subhead":"","lines":[{"t":"lead","x":"Communication etiquette. Respect people's time and attention."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Communication etiquette · do this every time","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"The one that changes everything","head":"A message with no ask is noise .","subhead":"","lines":[{"t":"lead","x":"Before you hit send, ask yourself: what do I want the reader to do? If there's no answer, you're adding to the pile, not moving work forward. Lead with the point, name the ask, give the deadline. Every time."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"Question 2 · etiquette","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You need a status update from a teammate who's mid deep-work block. It's not urgent and no decision hangs on it.","q":"Correct. Async by default. Send a clear ask, respect their focus, and meet only when a decision is actually needed — a status update never is.\" data-no=\" No. We're async by default and we protect focus time. You don't call a meeting for a status update, and you don't shatter someone's deep work — send a clear async ask and let them answer.\"> You need a status update from a teammate who's mid deep-work block. It's not urgent and no decision hangs on it.","opts":[{"k":"A","t":"Call a quick meeting so you can talk it through live","correct":false},{"k":"B","t":"Send an async message with a clear ask; meet only if a decision is needed","correct":true},{"k":"C","t":"Message “you there?” and keep pinging until they reply","correct":false}]},"gate":[]},{"n":14,"kind":"divider","eyebrow":"Part four","head":"When we meet","subhead":"","lines":[{"t":"lead","x":"The rhythm of the company. Know what each ritual is for."}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"The meeting & ritual cadence","head":"","subhead":"","lines":[{"t":"callout","x":"Why TBC? With the new dashboards and live data, the picture is visible without a meeting — so routine meetings are becoming lighter and less frequent. The rituals stay; we're finalising exactly how often each one runs. Async-first, meet only when it earns it."}],"quiz":null,"gate":[]},{"n":16,"kind":"divider","eyebrow":"Part five · the culture jewel","head":"The truth room","subhead":"","lines":[{"t":"lead","x":"Once a month. Five people. Total honesty."}],"quiz":null,"gate":[]},{"n":17,"kind":"body","eyebrow":"The monthly Group 1-to-1 · three things, in turn","head":"","subhead":"","lines":[{"t":"li","x":"Something real you're proud of this month"},{"t":"li","x":"Name it out loud — belonging starts here"},{"t":"li","x":"A real struggle, not a safe one"},{"t":"li","x":"If it doesn't cost something to say it, go deeper"},{"t":"li","x":"A concrete request from one named person"},{"t":"li","x":"Not “help” — a clear, answerable ask"},{"t":"callout","x":"Roughly five people. Each person shares all three, in turn. You listen to receive, not to reply — no fixing, no rebutting, just hearing."}],"quiz":null,"gate":[]},{"n":18,"kind":"body","eyebrow":"Why the truth room works","head":"Performance and belonging are the same thing .","subhead":"","lines":[{"t":"lead","x":"Not a trade-off, not a balance — the same thing. People do their best work where they feel they belong, and they belong where they can tell the truth. “What's said here stays here.” That confidentiality is what makes the honesty possible."}],"quiz":null,"gate":[]},{"n":19,"kind":"body","eyebrow":"Question 3 · the truth room","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"It's your first monthly Group 1-to-1 — the truth room. It's your turn to share.","q":"Correct. A Win, a real Struggle, and a Need aimed at one named person. Not metrics, not gossip — three honest things, shared in turn, and what's said there stays there.\" data-no=\" Not those. The three things are a Win, a real Struggle (one that costs something to say), and a Need — a specific ask from one named person. It's honesty, not reporting or venting.\"> It's your first monthly Group 1-to-1 — the truth room. It's your turn to share.","opts":[{"k":"A","t":"A Win, a real Struggle, and a Need from one named person","correct":true},{"k":"B","t":"Your numbers, your blockers, and your plan for next month","correct":false},{"k":"C","t":"A complaint, a bit of gossip, and a favour to ask the room","correct":false}]},"gate":[]},{"n":20,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you communicate the Koocester way and use the rituals?","subhead":"","lines":[],"quiz":null,"gate":["Do you keep work in Lark — tasks, protocols, projects — and use WhatsApp only for fast or external chat?","Have you set Lark to open links in the Navigation Bar and set your timezone?","Does every task have an owner and a deadline — and no task means no work?","Do your messages lead with the point and always carry a clear ask?","Are you async by default — meeting only when a live decision is needed?","Will you show up real in the truth room — Win, Struggle, Need?"]},{"n":21,"kind":"close","eyebrow":"","head":"Right place. Clear ask. Show up real.","subhead":"","lines":[{"t":"lead","x":"That's the base layer everyone stands on. Now go do your role's module."}],"quiz":null,"gate":[]}]},{"id":"f_1on1","bucket":"Foundation · everyone","title":"One-to-ones","href":"one-to-ones-training.html","step":"Foundation","count":23,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · everyone","head":"One-to- ones","subhead":"","lines":[{"t":"lead","x":"A regular one-to-one to connect, grow, and support each other. Same flow every time — so nobody gets left behind and everybody keeps rising."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"Why the one-to-one matters","head":"This is how we stay connected, grow, and unblock each other.","subhead":"","lines":[{"t":"lead","x":"A one-to-one is dedicated time to be honest, be heard, and move forward together. It's where progress gets seen, blockers get cleared, and people feel genuinely supported. Show up open — you'll both leave lighter and clearer."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"Ground rule · one thing to do first","head":"Always record the session.","subhead":"","lines":[{"t":"lead","x":"Hit record in Lark Meeting at the very start — every time. Lark's built-in meeting recording keeps the conversation fully present (no scrambling to take notes), nothing meaningful is lost, and every action agreed is captured cleanly for follow-up."},{"t":"callout","x":"Do it first: start the Lark Meeting recording before the conversation begins, so the whole session is captured from the opening word."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"How we show up","head":"","subhead":"","lines":[{"t":"li","x":"Keep it constructive — all sharing and feedback is grounded in mutual respect and given to help, not to score points."},{"t":"li","x":"Keep an open mind — every conversation is a chance to improve together. Come curious, ready to learn something new."},{"t":"li","x":"Respect the journey — honour each other's experiences, perspectives and growth. That respect is what builds trust and unity."}],"quiz":null,"gate":[]},{"n":5,"kind":"divider","eyebrow":"Before we start","head":"The agenda","subhead":"","lines":[{"t":"lead","x":"To start, set the shape of the session. Eleven stops, in order — from reflection to real life. Same flow every time, so it's always safe and easy to open up."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Agenda · step 1 of 11","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Agenda · step 2 of 11","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Agenda · step 3 of 11","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Agenda · step 4 of 11","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Agenda · step 5 of 11","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Agenda · step 6 of 11","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Agenda · step 7 of 11","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"Agenda · step 8 of 11","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Agenda · step 9 of 11","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"Agenda · step 10 of 11","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":16,"kind":"body","eyebrow":"Agenda · step 11 of 11","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":17,"kind":"body","eyebrow":"Before we end · the must-ask questions","head":"Always close with these five.","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":18,"kind":"body","eyebrow":"The 1-2-1 checklist","head":"What a great one-to-one achieves.","subhead":"","lines":[{"t":"win","x":"Understand each other's working styles — you know how to get the best from each other"},{"t":"win","x":"Strengthen respect and collaboration — the relationship gets warmer and more open"},{"t":"win","x":"Drive accountability and performance — clear actions, owned and followed through"},{"t":"win","x":"Foster safety, trust and team morale — people feel heard, backed and secure"},{"t":"win","x":"Spark continuous growth — every session leaves you both a step further on"}],"quiz":null,"gate":[]},{"n":19,"kind":"body","eyebrow":"Your turn · question 1","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You're sitting down for a one-to-one. Before the conversation gets going, there's one thing to do first.","q":"Correct. Start the recording in Lark Meeting before the conversation begins — that keeps you fully present and captures every action from the opening word.\" data-no=\" Almost. The very first move is to hit record in Lark Meeting, before you start talking — so the whole session is captured and no action gets lost. Then run the agenda from the top.\"> You're sitting down for a one-to-one. Before the conversation gets going, there's one thing to do first.","opts":[{"k":"A","t":"Jump straight into work updates and take notes as you go","correct":false},{"k":"B","t":"Start recording in Lark Meeting, then run the agenda from the top","correct":true},{"k":"C","t":"Wait until something important comes up, then start recording","correct":false}]},"gate":[]},{"n":20,"kind":"body","eyebrow":"Your turn · question 2","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"A teammate asks why every one-to-one gets recorded in Lark Meeting.","q":"Exactly. We record so the conversation stays fully present, nothing meaningful is lost, and every action agreed is captured for clean follow-up.\" data-no=\" Not the reason. We record to stay present in the moment, keep nothing meaningful from slipping away, and capture the actions agreed — so follow-up is clean. It's a support, not a scorecard.\"> A teammate asks why every one-to-one gets recorded in Lark Meeting.","opts":[{"k":"A","t":"To keep a file on people in case something goes wrong","correct":false},{"k":"B","t":"Because it's a formal rule and someone might check","correct":false},{"k":"C","t":"To stay present, lose nothing meaningful, and capture the actions agreed","correct":true}]},"gate":[]},{"n":21,"kind":"body","eyebrow":"Your turn · question 3","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"It's the team-dynamics part of the agenda, and it's your turn to give a colleague some feedback.","q":"Spot on. Team-dynamics feedback is constructive 360° input, grounded in respect, given to uplift and strengthen the relationship. Kind, honest, growth-first.\" data-no=\" Reframe it. Feedback here is constructive and respectful — 360° input meant to uplift and strengthen the relationship, not to vent or win. Keep it kind, honest, and growth-first.\"> It's the team-dynamics part of the agenda, and it's your turn to give a colleague some feedback.","opts":[{"k":"A","t":"Constructive and respectful — offered to uplift and strengthen the relationship","correct":true},{"k":"B","t":"Blunt and unfiltered, so they really feel the point","correct":false},{"k":"C","t":"Skip it to keep things comfortable and avoid any friction","correct":false}]},"gate":[]},{"n":22,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Are you ready to run a real one-to-one?","subhead":"","lines":[],"quiz":null,"gate":["Will you start every session by recording it in Lark Meeting?","Will you run the full agenda, in order, every time?","Will your feedback stay constructive, respectful and growth-first?","Will you close with the five must-ask questions?","Will you capture the actions agreed and follow through?"]},{"n":23,"kind":"close","eyebrow":"","head":"Record it. Run the flow. Show up real.","subhead":"","lines":[{"t":"lead","x":"That's a Koocester one-to-one — connect, grow, and support each other, every single time. Bring the truth, keep it kind, and leave with clear actions. Go make someone's week better."}],"quiz":null,"gate":[]}]},{"id":"f_security","bucket":"Foundation · everyone","title":"Security & IT access","href":"security-it-access-training.html","step":"Foundation","count":23,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · foundation · everyone","head":"Security & IT access","subhead":"","lines":[{"t":"lead","x":"The day-one non-negotiables for protecting Koocester's accounts, devices and client data. Everyone does this module — no exceptions."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"Why this comes first","head":"One weak login can cost the whole company.","subhead":"","lines":[{"t":"lead","x":"Koocester runs on accounts, devices and client trust. A leaked password, a lost laptop, a clicked phishing link — any one of them can expose client data or hand an attacker the keys. Security isn't the IT team's job. It's everyone's , starting with you."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're doing this right when…","subhead":"","lines":[{"t":"win","x":"Your accounts are locked down — unique passwords, two-factor on everything, nothing shared"},{"t":"win","x":"You never leak client data — it stays inside approved systems, always"},{"t":"win","x":"You report anything suspicious — the moment you see it, not the next day"},{"t":"win","x":"Your device is safe — updated, encrypted, and only trusted software on it"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one","head":"Step one: the Declaration","subhead":"","lines":[{"t":"lead","x":"No access is granted until it's signed."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Mandatory under company policy","head":"","subhead":"","lines":[{"t":"lead","x":"It's the form where you accept the rules in this module — how you'll protect accounts, devices and data. It's not paperwork for its own sake: it's the switch that turns your access on. No signed Declaration, no logins."},{"t":"callout","x":"Do this first. If you haven't submitted the signed Declaration, stop here and ask your manager or IT — everything after this assumes it's done."}],"quiz":null,"gate":[]},{"n":6,"kind":"divider","eyebrow":"Part two","head":"Lock down your accounts","subhead":"","lines":[{"t":"lead","x":"Passwords, two-factor, and never sharing."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Account hygiene · the four habits","head":"Make every login hard to break.","subhead":"","lines":[{"t":"li","x":"Strong, unique passwords — a different one for every account, generated and stored in the company password manager . Never reuse, never write them down."},{"t":"li","x":"Two-factor authentication (2FA) on everything — a second step beyond the password, on every account that offers it. It stops a stolen password on its own."},{"t":"li","x":"Never share credentials — not with a colleague, not \"just this once\". Access is granted to you , and it stays with you."},{"t":"li","x":"Lock your screen — every time you step away, even for a minute. An unlocked laptop is an open door."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Bitwarden · our password manager","head":"Bitwarden holds every password — so you don't have to.","subhead":"","lines":[{"t":"lead","x":"Bitwarden is the company vault. It generates strong, unique passwords, stores them safely, and fills them in for you. It's how we keep every login hard to break — with zero effort to remember."},{"t":"li","x":"One strong password per account — always let Bitwarden generate and store it. Reused or weak passwords stay in the past."},{"t":"li","x":"Credentials live in Bitwarden only — always keep passwords in the vault, never in chats, emails, or on a sticky note."},{"t":"li","x":"Shared logins are shared through Bitwarden — the secure way to hand someone a page or social login, always."},{"t":"callout","x":"Who holds the shared page & social logins: only Producers, Social Media Managers, and the Marketing Coordinator — the people who post to and manage the pages. Tech administers the vault and controls who can see what. Everyone else still uses Bitwarden every day for their own strong passwords."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Device security · your laptop and phone","head":"A safe device is updated, encrypted, and clean.","subhead":"","lines":[{"t":"li","x":"Keep it updated — install operating system and app updates promptly. Most attacks exploit old, unpatched software."},{"t":"li","x":"Keep it encrypted — turn on full-disk encryption so a lost device doesn't mean leaked data."},{"t":"li","x":"Don't install untrusted software — no random apps, extensions, or downloads. If you're not sure it's safe, ask IT before you install."},{"t":"li","x":"Report a lost or stolen device immediately — the faster IT knows, the faster access can be cut and the device wiped."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Data & confidentiality · the one to internalise above all","head":"Client data never leaves approved systems.","subhead":"","lines":[{"t":"lead","x":"This is the single most important rule in this module. Company and client data stays inside the tools we've approved for it — always. Nothing gets shared, downloaded, or sent externally without permission. And treat what you paste into outside tools with real care — including artificial intelligence (AI) tools : once it's pasted, you've sent it out, and you can't take it back."},{"t":"callout","x":"The simple test: if you're about to move data outside an approved system — email, download, upload, paste — stop and ask whether you have permission. If you're not sure, you don't. Get this one right every single time."}],"quiz":null,"gate":[]},{"n":11,"kind":"divider","eyebrow":"Part three","head":"Spotting the trap","subhead":"","lines":[{"t":"lead","x":"Phishing, links, and when to slow down."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Phishing & links · treat the unexpected as suspicious","head":"When in doubt, don't click — verify.","subhead":"","lines":[{"t":"li","x":"An unexpected link or attachment, even from a known name"},{"t":"li","x":"Urgent pressure: \"act now\", \"your account will be closed\""},{"t":"li","x":"A login page reached from a link in an email or message"},{"t":"li","x":"A sender address that's slightly off, or doesn't match"},{"t":"li","x":"Verify the sender through a channel you trust"},{"t":"li","x":"Go to the site directly, don't follow the link"},{"t":"li","x":"Hover to see the real destination before anything"},{"t":"li","x":"When unsure, ask IT before you click"},{"t":"p","x":"There's no penalty for checking. There's a real cost to clicking a bad link. Slow down — it takes seconds."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"Scam & fake emails · treat the unexpected as suspicious","head":"Real platforms never email you to \"confirm your password\".","subhead":"","lines":[{"t":"li","x":"\"You're verified\" / \"your account is verified\" out of nowhere"},{"t":"li","x":"Fake Facebook, Meta or Instagram emails about your page"},{"t":"li","x":"\"Confirm your account\" or \"login required\" links"},{"t":"li","x":"Unexpected invoices or payment requests"},{"t":"li","x":"Read the real sender address, not just the display name"},{"t":"li","x":"Hover a link to see where it truly goes before clicking"},{"t":"li","x":"Platforms never ask you to confirm a password by email"},{"t":"li","x":"Verify inside the real app — never through the email's link"},{"t":"p","x":"This is for everyone, but doubly so if you handle email or the pages — Sales in the inbox, Social Media Managers on the accounts. When a \"verification\" or \"urgent account\" email lands, open the real app yourself and confirm there."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Access = responsibility","head":"What happens under your login is on you.","subhead":"","lines":[{"t":"li","x":"You're accountable — activity under your account is treated as yours. Guard it like it is."},{"t":"li","x":"Least privilege — you get only the access you need to do your job, nothing more. If you're offered access you don't need, decline it."},{"t":"li","x":"Off-board cleanly — when you leave a project or the company, access is handed back and closed out. No lingering logins."},{"t":"callout","x":"More access isn't a perk. Every extra login you hold is another door someone could come through. Keep your footprint small."}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"If something goes wrong · speed is everything","head":"Report it fast. Hiding it is the only real mistake.","subhead":"","lines":[{"t":"lead","x":"Clicked a bad link? Lost a device? Sent something to the wrong place? Tell IT or your manager immediately . There is no blame for honest, early reporting — a problem caught in minutes is small; one hidden for a day can become a breach. This is one of the most important habits in the whole module."},{"t":"callout","x":"Speed beats shame every time. The people who report fast protect the company. The only unforgivable move is staying quiet and hoping."}],"quiz":null,"gate":[]},{"n":16,"kind":"divider","eyebrow":"Part four","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Five calls. Get them graded."}],"quiz":null,"gate":[]},{"n":17,"kind":"body","eyebrow":"Question 1 · a suspicious link","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"An email lands from what looks like a service you use. It says your account will be locked and gives you a link to log in and confirm .","q":"Correct. Don't click. An unexpected link asking you to log in is the classic phishing move — even if the sender looks familiar. Go to the site directly, verify the sender through a trusted channel, and if you're unsure, ask IT before you touch it.\" data-no=\" No. Never log in through a link you weren't expecting. It's the classic phishing trap. Don't click — go to the site directly, verify the sender, and ask IT if you're unsure.\"> An email lands from what looks like a service you use. It says your account will be locked and gives you a link to log in and confirm .","opts":[{"k":"A","t":"Click it and log in quickly, before the account locks","correct":false},{"k":"B","t":"Forward it to a colleague to check if it's real","correct":false},{"k":"C","t":"Don't click — verify the sender, go to the site directly, ask IT if unsure","correct":true}]},"gate":[]},{"n":18,"kind":"body","eyebrow":"Question 2 · handling client data","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You want to move some client data out of an approved system — to download it, email it, or paste it into an outside tool.","q":"Correct. Client data leaves an approved system only when you have explicit permission for that specific move. No permission means no download, no external send, no paste into an outside tool — including AI tools.\" data-no=\" Not quite. Convenience, deadlines and 'just this once' are never the rule. Client data leaves an approved system only with explicit permission for that specific move — otherwise it stays put.\"> You want to move some client data out of an approved system — to download it, email it, or paste it into an outside tool.","opts":[{"k":"A","t":"Whenever it's faster or more convenient for the work","correct":false},{"k":"B","t":"Only when you have explicit permission for that specific move","correct":true},{"k":"C","t":"Any time, as long as you delete it afterwards","correct":false}]},"gate":[]},{"n":19,"kind":"body","eyebrow":"Question 3 · a lost device","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"You realise your work laptop is missing — left in a taxi, or taken. It has access to company accounts.","q":"Correct. Report it immediately. The faster IT knows, the faster your access can be cut and the device wiped remotely. Encryption helps, but speed is what limits the damage — and there's no blame for reporting fast.\" data-no=\" No. Don't wait and don't hope it turns up. Report a lost or stolen device to IT immediately so access can be cut and the device wiped. Early reporting is exactly what's expected.\"> You realise your work laptop is missing — left in a taxi, or taken. It has access to company accounts.","opts":[{"k":"A","t":"Report it to IT immediately so access can be cut and the device wiped","correct":true},{"k":"B","t":"Wait a day to see if it turns up before saying anything","correct":false},{"k":"C","t":"Do nothing — it's encrypted, so it's fine","correct":false}]},"gate":[]},{"n":20,"kind":"body","eyebrow":"Question 4 · sharing access","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A teammate is blocked and asks you to quickly share your password so they can get into a tool you have access to and they don't.","q":"Correct. Never share credentials — not even once, not even with a trusted teammate. Access is granted to you, and activity under your login is treated as yours. If a colleague needs access, they request their own through IT.\" data-no=\" No. Credentials are never shared, even briefly, even with someone you trust. Access is yours and you're accountable for it. Have the colleague request their own access through IT.\"> A teammate is blocked and asks you to quickly share your password so they can get into a tool you have access to and they don't.","opts":[{"k":"A","t":"Share it just this once — they're on the team and it's urgent","correct":false},{"k":"B","t":"Don't share it — have them request their own access through IT","correct":true},{"k":"C","t":"Log in for them and let them use your session","correct":false}]},"gate":[]},{"n":21,"kind":"body","eyebrow":"Question 5 · a \"verify your account\" email","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"An email that looks like it's from Instagram says your account needs verifying, and gives you a link to confirm your login .","q":"Correct. Ignore the link. Real platforms never ask you to confirm a password or account by email. Check the real sender address, then verify inside the app itself — open Instagram directly, never through the email's link.\" data-no=\" No. Never confirm a login through a link in an unexpected email — that's exactly how fake 'verification' scams work. Real platforms don't email you to confirm a password. Check the sender, then verify inside the real app.\"> An email that looks like it's from Instagram says your account needs verifying, and gives you a link to confirm your login .","opts":[{"k":"A","t":"Click the link and enter your password to keep the account","correct":false},{"k":"B","t":"Reply to the email to ask whether it's genuine","correct":false},{"k":"C","t":"Ignore the link — check the sender, then verify inside the real app","correct":true}]},"gate":[]},{"n":22,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you keep Koocester's accounts and data safe?","subhead":"","lines":[],"quiz":null,"gate":["Have you signed the IT & Digital Access Declaration?","Are your passwords unique, in the password manager, with two-factor on?","Will you never share credentials, and lock your screen when you step away?","Is your device updated, encrypted, and free of untrusted software?","Will client data stay inside approved systems, never pasted into outside tools?","Will you verify before clicking, and report anything suspicious immediately?"]},{"n":23,"kind":"close","eyebrow":"","head":"Locked down, alert, and quick to report.","subhead":"","lines":[{"t":"lead","x":"Security is a set of small habits done every day — strong logins, a clean device, data kept where it belongs, and a fast shout the moment something looks wrong. Do them, and you protect the whole company."}],"quiz":null,"gate":[]}]},{"id":"f_org","bucket":"Foundation · everyone","title":"The org & who to ask","href":"org-who-to-ask-training.html","step":"Foundation","count":18,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · foundation","head":"The org & who to ask","subhead":"","lines":[{"t":"lead","x":"How the company is laid out, where the work lives, and exactly who to turn to the moment you're stuck."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"Why this matters","head":"Knowing who to ask is a skill. Learn it first.","subhead":"","lines":[{"t":"lead","x":"The fastest people here aren't the ones who know everything — they're the ones who know exactly where to look and who to ask . Get this right and you'll never sit stuck. Get it wrong and small questions turn into lost days."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"You know the structure — the departments, the ranks, and how they fit together"},{"t":"win","x":"You know who to ask for any question — people, systems, or your own work — you know the door"},{"t":"win","x":"You never sit blocked in silence — the moment you're stuck, you reach out — early"},{"t":"win","x":"You ask well — what you tried, what you need, and by when"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one","head":"The structure","subhead":"","lines":[{"t":"lead","x":"The departments, and the ranks above them."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Four departments · who sits where","head":"","subhead":"","lines":[{"t":"p","x":"Every role lives inside one of these four. Find yours — and know your neighbours, because you'll work across them every week."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Above the departments · the chain","head":"Manager, then Head of Department, then C-Suite.","subhead":"","lines":[{"t":"lead","x":"Three ranks sit above your team — each one more senior than the last."},{"t":"callout","x":"Escalation goes up the chain. Start with your Manager. Things move up to the Head of Department, and only the biggest calls reach the C-Suite."}],"quiz":null,"gate":[]},{"n":7,"kind":"divider","eyebrow":"Part two","head":"Where things live","subhead":"","lines":[{"t":"lead","x":"Four places. Learn what each one is for."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Where things live · your map of the company","head":"","subhead":"","lines":[{"t":"callout","x":"Check Koocester Academy first. If there's an SOP for it, the answer is already written — asking a person is your second move, not your first."}],"quiz":null,"gate":[]},{"n":9,"kind":"divider","eyebrow":"Part three","head":"Who to ask","subhead":"","lines":[{"t":"lead","x":"When you're stuck — and the one mistake to never make."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Stuck? Route the question to the right door","head":"Every question has a door. Knock on the right one.","subhead":"","lines":[{"t":"li","x":"Anything about your work, priorities, or a blocker"},{"t":"li","x":"Not sure who owns it? Ask them — they'll point you"},{"t":"li","x":"Leave, pay, policy, personal matters"},{"t":"li","x":"Onboarding and anything about you as an employee"},{"t":"li","x":"Logins, tools, a system that's broken or won't load"},{"t":"li","x":"Access requests and anything technical"},{"t":"callout","x":"Ask early. Being blocked in silence is the mistake — never sit stuck hoping it clears. A question asked early costs minutes; one buried for a day costs the whole team."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Ownership · every job has a name on it","head":"One owner per task. One decision-maker per call.","subhead":"","lines":[{"t":"lead","x":"Every task has a single owner — the person accountable for it moving. Every decision has one decision-maker — the person whose call it is. When you have a question, find that person and route it to them. Don't broadcast to everyone; ask the one who owns it."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"How to ask well · three lines, every time","head":"A good question answers itself halfway.","subhead":"","lines":[{"t":"callout","x":"Tried · Need · By when. Three lines turn a vague \"I'm stuck\" into a question anyone can answer in seconds."}],"quiz":null,"gate":[]},{"n":13,"kind":"divider","eyebrow":"Part four","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Three calls. Get them graded."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Question 1 · a system won't load","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"You go to open a tool you need for today's task and it won't load — it keeps rejecting your login.","q":"Correct. Logins, tools, broken systems and access requests all go to Operations (Tech). That's their door — route it straight there.\" data-no=\" Not quite. A broken system or a login problem is a systems issue — that's Operations (Tech). HR handles people and admin; your Manager handles your work and priorities.\"> You go to open a tool you need for today's task and it won't load — it keeps rejecting your login.","opts":[{"k":"A","t":"Human Resources (HR) — they set up new employees","correct":false},{"k":"B","t":"The C-Suite — it's blocking your work","correct":false},{"k":"C","t":"Operations (Tech) — systems and access are theirs","correct":true}]},"gate":[]},{"n":15,"kind":"body","eyebrow":"Question 2 · a question about your leave","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You want to book time off next month and you're not sure how much leave you have left or how to request it.","q":"Correct. Leave, pay, policy and personal matters are owned by Human Resources (HR). People and admin questions go to them.\" data-no=\" No. Leave is a people/admin question — Human Resources (HR) owns it. Operations (Tech) handles systems; your Manager handles your work, but the policy itself sits with HR.\"> You want to book time off next month and you're not sure how much leave you have left or how to request it.","opts":[{"k":"A","t":"Operations (Tech) — they run the systems","correct":false},{"k":"B","t":"Human Resources (HR) — people and admin are theirs","correct":true},{"k":"C","t":"Whoever answers first in the team chat","correct":false}]},"gate":[]},{"n":16,"kind":"body","eyebrow":"Question 3 · stuck on your own work","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"You're halfway through a task, you've checked Koocester Academy, and you're still blocked. The deadline is tomorrow.","q":"Correct. Your Manager is the first port of call for anything about your work or a blocker — and you ask early. Sitting blocked in silence is the mistake.\" data-no=\" Not this. Never sit blocked in silence hoping it clears — that's the mistake. For a blocker on your own work, your Manager is the first person to ask, and you ask early.\"> You're halfway through a task, you've checked Koocester Academy, and you're still blocked. The deadline is tomorrow.","opts":[{"k":"A","t":"Ask your Manager now, with what you tried and what you need","correct":true},{"k":"B","t":"Keep quiet and hope it clears before the deadline","correct":false},{"k":"C","t":"Email the C-Suite directly to be safe","correct":false}]},"gate":[]},{"n":17,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Do you know the org and who to ask?","subhead":"","lines":[],"quiz":null,"gate":["Do you know the four departments and where your role sits?","Do you know the chain — Manager, Head of Department, C-Suite?","Do you know where work lives — Home on Lark, your source of truth, Koocester Academy, Meetings?","Do you know who to ask for people, systems, and your own work?","Will you ask early, and never sit blocked in silence?","Can you ask well — what you tried, what you need, by when?"]},{"n":18,"kind":"close","eyebrow":"","head":"Know the map. Ask early. Never sit stuck.","subhead":"","lines":[{"t":"lead","x":"You've got the structure, you know exactly who to ask for any question, and you'll never sit blocked in silence. That's the foundation — everything else builds on it."}],"quiz":null,"gate":[]}]},{"id":"f_ai","bucket":"Foundation · everyone","title":"How we use AI","href":"how-we-use-ai-training.html","step":"Foundation · AI-native","count":21,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · foundation","head":"How we use Artificial Intelligence","subhead":"","lines":[{"t":"lead","x":"Koocester is Artificial Intelligence (AI)-native. Everyone here uses AI to go faster and think bigger — this is how we do it, and where the line sits."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"The mindset","head":"AI is a force-multiplier , not a replacement.","subhead":"","lines":[{"t":"lead","x":"It does not replace you. It multiplies you. The Large Language Model (LLM) is the sharpest junior you've ever had — tireless, fast, and only as good as the direction you give it. You stay the one in charge."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"How the work splits","head":"It does the first 70% fast. You own the part that matters.","subhead":"","lines":[{"t":"callout","x":"Automate the mundane, own the judgment. Let AI clear the busywork so your hours go to the decisions that actually move the number."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"What success looks like","head":"You're using AI well when…","subhead":"","lines":[{"t":"win","x":"You reach for AI daily — it's the first move on almost every task, not a last resort"},{"t":"win","x":"You feed Poppy your work context — client strategies and campaign work belong in Poppy; only true secrets — passwords, logins, payment details — stay out of everything"},{"t":"win","x":"You own and check every output — you verify before it ships — the result is yours, not the model's"},{"t":"win","x":"You think bigger, not just faster — AI frees your hours for the judgment calls that matter"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":5,"kind":"divider","eyebrow":"Part one","head":"When to reach for it","subhead":"","lines":[{"t":"lead","x":"And when to keep your hands on the wheel."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Where AI earns its keep · and where it doesn't","head":"","subhead":"","lines":[{"t":"li","x":"Ideation — angles, hooks, names, first ideas"},{"t":"li","x":"First drafts — captions, emails, briefs, outlines"},{"t":"li","x":"Research & summarising — digest long things fast"},{"t":"li","x":"Restructuring — reshape messy notes into order"},{"t":"li","x":"Coding & automation — scripts, workflows, formulas"},{"t":"li","x":"Analysis — spot patterns, sanity-check numbers"},{"t":"li","x":"The final judgment call — the decision is yours to own"},{"t":"li","x":"Costly-if-wrong, unchecked — anything a mistake would hurt, without a human review"},{"t":"li","x":"True secrets — passwords, logins, payment details, personal identifiers (client strategy & campaign work goes into Poppy)"},{"t":"p","x":"AI does the heavy lifting. The call, the check, and the confidential stuff stay with you."}],"quiz":null,"gate":[]},{"n":7,"kind":"divider","eyebrow":"Part two","head":"Guardrails","subhead":"","lines":[{"t":"lead","x":"Non-negotiable. These three protect us and our clients."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Guardrail 1 · confidentiality","head":"Never paste confidential data into a public AI tool.","subhead":"","lines":[{"t":"lead","x":"A client's private brief, internal financials, personal data — none of it goes into a public chatbot. Assume anything you paste could be stored or seen. If it's confidential, keep it out. No exceptions."},{"t":"callout","x":"The test: would you be comfortable if this appeared outside the company? If not, it doesn't go in."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Guardrail 2 · you own the output","head":"AI can be confidently wrong . Always verify.","subhead":"","lines":[{"t":"lead","x":"A Large Language Model (LLM) will invent facts, figures and sources and state them with total confidence — this is called a hallucination . Never ship what it gives you unchecked. You put your name on the output, so the result is yours to verify — every claim, every number, every quote."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Guardrail 3 · honesty","head":"Disclose AI use where honesty requires it.","subhead":"","lines":[{"t":"lead","x":"AI is a tool, and using it is not something to hide. But where being open matters — a client expecting your own work, a claim of authorship, anything where the truth would change how someone reads it — say so. Never let AI make us look dishonest."}],"quiz":null,"gate":[]},{"n":11,"kind":"divider","eyebrow":"Part three","head":"Getting good outputs","subhead":"","lines":[{"t":"lead","x":"Garbage in, garbage out. Great brief in, great work out."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Brief it like you'd brief a sharp junior","head":"Give it four things — then iterate.","subhead":"","lines":[{"t":"li","x":"Context — what this is for, who it's for, what you already know"},{"t":"li","x":"A role — \"you are a senior copywriter for a luxury brand…\""},{"t":"li","x":"Examples — show it one or two of the good, so it matches"},{"t":"li","x":"The format — exactly the shape you want back (length, structure, tone)"},{"t":"callout","x":"Then iterate. The first answer is a starting point, not the finish. Push back, refine, ask again — the second and third passes are where it gets sharp."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"Go past a single prompt","head":"Chain the steps. Feed the output back in.","subhead":"","lines":[{"t":"lead","x":"The power isn't in one clever prompt — it's in the loop . Take one output and make it the next input. When a loop is worth running again and again, that's where automation comes in: build it once, let it run."},{"t":"p","x":"THE LOOP · OUTPUT → NEXT INPUT STEP 1 Research STEP 2 Draft STEP 3 Critique STEP 4 Refine Feed the output back in The power isn't in one clever prompt — it's in the loop . Take one output and make it the next input. When a loop is worth running again and again, that's where automation comes in: build it once, let it run."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"The tools we use","head":"","subhead":"","lines":[{"t":"li","x":"Ideation and first drafts"},{"t":"li","x":"Problem-solving and analysis"},{"t":"li","x":"Your everyday thinking partner"},{"t":"li","x":"Content research"},{"t":"li","x":"Builds storyboards for videos"},{"t":"li","x":"Turns ideas into a shot plan"},{"t":"li","x":"Runs loops without you"},{"t":"li","x":"Connects our tools together"},{"t":"li","x":"The workhorse behind the scenes"},{"t":"p","x":"New tools will come and go. The mindset and the guardrails don't change."}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"Your job now","head":"Find where AI makes your work faster.","subhead":"","lines":[{"t":"lead","x":"That's what AI-native means: not one team using it, but everyone. A producer, a copywriter, a coordinator, a salesperson — each finds the specific spots where AI takes the first 70% off their plate. Look at your week, find the repeatable, and hand it to the machine."},{"t":"callout","x":"The standard: if a task is slow, repetitive, or a blank page — ask first whether AI can do the heavy lifting before you do it by hand."}],"quiz":null,"gate":[]},{"n":16,"kind":"divider","eyebrow":"Part four","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Three calls. Get them graded."}],"quiz":null,"gate":[]},{"n":17,"kind":"body","eyebrow":"Question 1 · what belongs in Poppy","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You're planning a client campaign. You have their strategy and campaign plan , plus the password to their ad account . You want Poppy's help building the content.","q":"Correct. Client strategies, campaign plans and briefs are exactly what Poppy is built for — feed it your work context and it gets genuinely useful. The one thing that stays out is true secrets: passwords, logins, card and payment details, personal identifiers.\" data-no=\" Not quite. Client strategy and campaign context aren't the kind of secret that blocks AI — they're precisely what Poppy needs to help. Feed the plan in. The only things that never go in are true secrets: passwords, logins, card/payment details, personal identifiers.\"> You're planning a client campaign. You have their strategy and campaign plan , plus the password to their ad account . You want Poppy's help building the content.","opts":[{"k":"A","t":"Nothing — anything client-related is off-limits to AI","correct":false},{"k":"B","t":"The strategy and campaign plan — that's what Poppy is for; keep the password out","correct":true},{"k":"C","t":"Everything, password included — give Poppy full access to move faster","correct":false}]},"gate":[]},{"n":18,"kind":"body","eyebrow":"Question 2 · a confident answer","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"AI gives you a specific, confident statistic to use in a client deck — an exact figure, stated with total certainty.","q":"Correct. A Large Language Model can hallucinate — state invented facts with total confidence. You own the output, so you verify the statistic before it ships. Confidence is not proof.\" data-no=\" No. AI can be confidently wrong — it invents facts and figures and states them with certainty. You put your name on it, so you verify the number before using it. Never ship an unchecked claim.\"> AI gives you a specific, confident statistic to use in a client deck — an exact figure, stated with total certainty.","opts":[{"k":"A","t":"Use it — it sounded precise and sure","correct":false},{"k":"B","t":"Verify it against a real source first — you own the output","correct":true},{"k":"C","t":"Ask the AI again; if it repeats the number it's true","correct":false}]},"gate":[]},{"n":19,"kind":"body","eyebrow":"Question 3 · a weak result","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"You typed one vague line into the AI and got back a generic, forgettable result.","q":"Correct. Vague prompt, vague answer. Give it context, a role, an example and the exact format you want — then iterate. A great brief in is what gets great work out.\" data-no=\" Not quite. The tool isn't the problem — the brief is. A one-line vague prompt gives a vague answer. Add context, a role, an example and the format you want, then iterate.\"> You typed one vague line into the AI and got back a generic, forgettable result.","opts":[{"k":"A","t":"Give it context, a role, an example and the exact format — then iterate","correct":true},{"k":"B","t":"Give up — AI can't do this kind of task well","correct":false},{"k":"C","t":"Paste the same prompt into a different tool and hope","correct":false}]},"gate":[]},{"n":20,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you use AI the Koocester way?","subhead":"","lines":[{"t":"lead","x":"Fast, safe, and owning the output."}],"quiz":null,"gate":["Do you reach for AI daily to go faster and think bigger?","Do you keep confidential data out of public AI tools, always?","Do you verify every output and own the result yourself?","Do you brief it with context, a role, examples and a format?","Do you chain steps into loops instead of stopping at one prompt?","Can you find where AI makes your specific work faster?"]},{"n":21,"kind":"close","eyebrow":"","head":"Automate the mundane. Own the judgment.","subhead":"","lines":[{"t":"lead","x":"This is the foundation everything else at Koocester is built on. Use AI every day, keep it safe, and always own the output. Now go find where it makes your work faster."}],"quiz":null,"gate":[]}]},{"id":"f_device","bucket":"Foundation · everyone","title":"Company devices — do's & don'ts","href":"device-management-training.html","step":"Foundation","count":19,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · foundation","head":"Company devices the do's & don'ts","subhead":"","lines":[{"t":"lead","x":"Your laptop, phone and microphone are company property in your care. This is how you look after them — and what to do the moment something goes wrong."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"The frame · read this first","head":"It's not yours. It's in your care .","subhead":"","lines":[{"t":"lead","x":"Every device you're issued — laptop, phone, microphone — is company property. You're the one accountable for it while it's with you: secure, backed up, cared for, and used only for approved work. Treat it better than you'd treat your own."},{"t":"callout","x":"Accountable, not just holding it. The moment it's assigned to you, its security, its condition and its data are your responsibility."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're doing it right when…","subhead":"","lines":[{"t":"win","x":"It's secure — updated, encrypted, and locked whenever you step away"},{"t":"win","x":"Your work is backed up — never a single local copy that one failure could erase"},{"t":"win","x":"It's cared for & safe — clean, protected, never left unattended in public"},{"t":"win","x":"Approved use only — company software and accounts for company work"},{"t":"win","x":"You report problems fast — lost, stolen or damaged — the moment it happens"},{"t":"win","x":"Your setup just works — fast, clear, and able to reach every system you need"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one","head":"Look after it · the DO's","subhead":"","lines":[{"t":"lead","x":"Six habits that keep your device secure and your work safe."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Do · keep it secure","head":"Updated, encrypted, locked .","subhead":"","lines":[{"t":"lead","x":"Install updates when they're offered — they close the security holes attackers use. Keep disk encryption on so a stolen device is useless to a thief. And lock the screen every single time you step away, even for a minute."},{"t":"callout","x":"Locking is a reflex, not a decision. Stand up, lock it. Coffee, meeting, bathroom — lock it. An unlocked, unattended device is an open door."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Do · back up your work","head":"One copy is no copy.","subhead":"","lines":[{"t":"lead","x":"Keep your work in the company's approved cloud systems, not stranded on the device's desktop. If the only copy of something important lives locally, a spill, a theft or a dead drive erases it forever — and no one can recover it for you."},{"t":"callout","x":"The test: if your laptop vanished right now, would you lose any work? If the answer is yes, back it up before you do anything else."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Do · keep it safe & cared for","head":"Never leave it unattended in public .","subhead":"","lines":[{"t":"lead","x":"A device out of your sight in a café, a car or a co-working space is a device that walks off. Keep it physically safe, keep it clean and cared for, and protect the screen, the ports and the microphone. Small daily care is what makes it last."},{"t":"callout","x":"Guard it like cash. You wouldn't leave a stack of notes on a café table while you order — treat the device the same way."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Do · approved software & accounts only","head":"Company work, company tools .","subhead":"","lines":[{"t":"lead","x":"Use only company-approved software and sign in with company accounts for company work. Approved tools are patched, monitored and supported. Random downloads and personal logins are how malware and data leaks get in — and how work ends up somewhere no one can find or protect it."},{"t":"callout","x":"Unsure if a tool is approved? Ask before you install. A ten-second question beats a security incident."}],"quiz":null,"gate":[]},{"n":9,"kind":"divider","eyebrow":"Part two","head":"Never do this · the DON'Ts","subhead":"","lines":[{"t":"lead","x":"The red lines. Any one of these puts the whole company at risk."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Don't · the red lines","head":"On a company device, never:","subhead":"","lines":[{"t":"li","x":"Install untrusted or pirated software — it's the fastest way to bring in malware"},{"t":"li","x":"Jailbreak or root the device — it strips out the protections that keep it safe"},{"t":"li","x":"Disable security settings — encryption, firewall, screen-lock, updates all stay on"},{"t":"li","x":"Do risky personal browsing on it — sketchy sites and downloads infect the whole machine"},{"t":"li","x":"Let family or friends use it — it's yours to use, no one else's"},{"t":"li","x":"Keep the only copy of important work local — with no backup, one failure loses it all"},{"t":"p","x":"Every one of these trades a small convenience now for a serious risk to the whole company later. Not worth it."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Personal vs work · keep the line clean","head":"Work lives on the work device.","subhead":"","lines":[{"t":"li","x":"Keep all company work on the company device"},{"t":"li","x":"Store it in company-approved systems and accounts"},{"t":"li","x":"Sign in to work tools with your work login"},{"t":"li","x":"Keep work reachable, protected and recoverable"},{"t":"li","x":"Move company work onto a personal laptop or phone"},{"t":"li","x":"Email files to a personal account \"to be safe\""},{"t":"li","x":"Save work into personal cloud drives or chats"},{"t":"li","x":"Mix personal logins into company systems"},{"t":"callout","x":"Why it matters: work on personal devices and accounts can't be secured, backed up or handed over cleanly — it's lost the day you're not there."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"If something happens · this is the big one","head":"Lost, stolen or broken? Report it now.","subhead":"","lines":[{"t":"lead","x":"The moment a device is lost, stolen or damaged, report it immediately. Speed is everything — a fast report lets us lock it, wipe it remotely and protect the data before anyone can reach it. An hour's delay can turn a minor incident into a real breach."},{"t":"callout","x":"Reporting early is never punished. Hiding it is the real mistake. Nobody is in trouble for a stolen bag — you're only in trouble for staying quiet while the damage spreads."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"Two more standards · offboarding & setup","head":"Return it clean. Flag a bad setup early.","subhead":"","lines":[{"t":"li","x":"Offboarding — when you leave a role or the company, every device and all access is returned cleanly and on time. Nothing walks out the door, nothing stays logged in."},{"t":"li","x":"Setup standard — if you can't work fast, communicate clearly, and access the systems you need, your setup is not acceptable. Flag it early so it gets fixed — don't quietly struggle on a broken machine."},{"t":"callout","x":"A bad setup is a bottleneck, not a personality trait. Raise it the moment it slows you down — a slow or half-connected device costs the whole team."}],"quiz":null,"gate":[]},{"n":14,"kind":"divider","eyebrow":"Part three","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Three calls. Get them graded."}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"Question 1 · a device goes missing","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"Your work laptop is stolen from a café table while you're at the counter. It has company work on it.","q":"Correct. Report it immediately. A fast report lets the company lock the device, wipe it remotely and protect the data before anyone can reach it. Speed limits the damage — and reporting early is never punished.\" data-no=\" Not first. Retracing your steps or waiting lets the clock run while the data sits exposed. Report it immediately, then look — the fast report is what lets us lock and wipe the device in time.\"> Your work laptop is stolen from a café table while you're at the counter. It has company work on it.","opts":[{"k":"A","t":"Retrace your steps and try to find it yourself before telling anyone","correct":false},{"k":"B","t":"Report it to the company immediately so it can be locked and wiped","correct":true},{"k":"C","t":"Wait a day in case it turns up, then decide whether to report it","correct":false}]},"gate":[]},{"n":16,"kind":"body","eyebrow":"Question 2 · someone wants to borrow it","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"A friend asks to borrow your work laptop for the evening to do some personal browsing.","q":"Correct. No. It's a company device in your care and you're accountable for it — nobody else uses it, for anything. A guest account or \"just browsing\" doesn't change who's responsible if something goes wrong.\" data-no=\" No. A company device is yours to use for approved work and no one else's — not for a friend's browsing, not on a guest account. If it's in your care, you're accountable for whatever happens on it.\"> A friend asks to borrow your work laptop for the evening to do some personal browsing.","opts":[{"k":"A","t":"Sure — it's just personal browsing, no harm done","correct":false},{"k":"B","t":"Yes, as long as you set them up on a guest account first","correct":false},{"k":"C","t":"No — it's a company device in your care, no one else uses it","correct":true}]},"gate":[]},{"n":17,"kind":"body","eyebrow":"Question 3 · the only-copy trap","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You've spent three days on an important deck, saved only to your laptop's desktop. Nowhere else.","q":"Correct. The risk is that it's the only copy with no backup — one spill, theft or dead drive and three days of work is gone. Back it up to the company's approved systems now. Emailing it to a personal account isn't a fix — that's work leaking off approved systems.\" data-no=\" Look again. The problem isn't the work itself — it's that the only copy sits locally with no backup. One failure erases it. Save it into the company's approved systems; a personal account is not an approved, safe place for it.\"> You've spent three days on an important deck, saved only to your laptop's desktop. Nowhere else.","opts":[{"k":"A","t":"No problem — it's safe because it's on your device","correct":false},{"k":"B","t":"It's the only copy with no backup — save it to approved company systems","correct":true},{"k":"C","t":"Email it to your personal account so you have a spare copy","correct":false}]},"gate":[]},{"n":18,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you look after your company device the right way?","subhead":"","lines":[],"quiz":null,"gate":["Is your device updated, encrypted, and locked when you step away?","Is your work backed up to approved systems, never a single local copy?","Do you keep it physically safe, cared for, and never unattended in public?","Do you use only company-approved software and accounts for work — and never lend it out?","Would you report a lost, stolen or damaged device immediately?","Is your setup fast, clear, and able to reach every system you need?"]},{"n":19,"kind":"close","eyebrow":"","head":"Secure it, back it up, report fast.","subhead":"","lines":[{"t":"lead","x":"The device is company property in your care. Look after it, use it only for approved work, and the day something goes wrong — speak up immediately. Speed is what limits the damage."}],"quiz":null,"gate":[]}]},{"id":"base","bucket":"The base","title":"How the base works","href":"mnd-workflow-slides.html","step":"Everyone in marketing","count":31,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · Marketing & Delivery base","head":"How the Marketing & Delivery base works","subhead":"","lines":[{"t":"lead","x":"The base is the Lark tracker where every piece of marketing work lives. Watch this first, then move on to your own role module."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"You can walk any video Not Started → Completed — and name the owner of every stage in between"},{"t":"win","x":"You know project = harness, page = vertical — the project just groups the work, the page carries the truth"},{"t":"win","x":"You know what buttons, clocks & auto-assign do — on their own, without asking who's supposed to act next"},{"t":"win","x":"You fill every bright yellow cell — the base only ever asks for what it can't fill itself"},{"t":"p","x":"This is the bar. Everything that follows is how the base gets you there — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What this base is","head":"The marketing team's project-management base.","subhead":"","lines":[{"t":"lead","x":"This is how the marketing and delivery team runs content, project management from the first idea to the live post. The roles below work inside it. Sales hand a client over; Tech keeps it healthy."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"Where the work comes from","head":"Client, to page, to pipeline.","subhead":"","lines":[{"t":"lead","x":"Sales hand a client over and we build their base. Projects, and their events, feed into pages. The page is where the content is born, and from there it walks the pipeline all the way to a live post."},{"t":"lead","x":"A page is the common denominator of everything, every video and carousel hangs off one."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"The model in one line","head":"A project is a harness, of two kinds.","subhead":"","lines":[{"t":"lead","x":"Every project is either an internal campaign or a client, the only difference is a client box inside."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"How a record lives","head":"Only the yellow is yours.","subhead":"","lines":[{"t":"lead","x":"A record arrives pre-filled, the page pours in its defaults and auto-assigns your team. What is left for you turns bright yellow."},{"t":"p","x":"A bright yellow cell is the base asking you for the one thing it cannot fill itself. Complete it and the record is done."}],"quiz":null,"gate":[]},{"n":7,"kind":"divider","eyebrow":"Part one","head":"The video pipeline","subhead":"","lines":[{"t":"lead","x":"The main flow, first stage to last, and who owns each step."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Twelve stages, one owner each","head":"","subhead":"","lines":[{"t":"p","x":"ManyChat is created the moment editing starts and must be ready before Ready to upload, so the CTA fires the instant the post goes live."}],"quiz":null,"gate":[]},{"n":9,"kind":"divider","eyebrow":"Part two","head":"The carousel pipeline","subhead":"","lines":[{"t":"lead","x":"Shorter, and it rides off the videos."}],"quiz":null,"gate":[]},{"n":10,"kin
