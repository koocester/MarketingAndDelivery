ly, because a stronger frame holds attention longer."}],"quiz":null,"gate":[]},{"n":23,"kind":"body","eyebrow":"Where to look","head":"Your view is your cue.","subhead":"","lines":[{"t":"lead","x":"Each role has its own view, showing only the records waiting on you, that is your cue to act. The notification reaches you directly the moment something needs you. Between the two, everything stays in view."}],"quiz":null,"gate":[]},{"n":24,"kind":"body","eyebrow":"What success looks like","head":"","subhead":"","lines":[{"t":"p","x":"Clear all four gates, then move on to your role module."}],"quiz":null,"gate":[]},{"n":25,"kind":"body","eyebrow":"Your first week","head":"","subhead":"","lines":[{"t":"li","x":"Open the Marketing & Delivery base and find the view with your role's name, that queue is your home."},{"t":"li","x":"Learn your stages and their lead times, so you know the pace expected of you."},{"t":"li","x":"Read a live record top to bottom, and let the yellow cells show you what belongs there."},{"t":"li","x":"Move one record forward with its button, and watch the base carry it on."},{"t":"li","x":"Continue in the Koocester Academy to your role module for the detail."}],"quiz":null,"gate":[]},{"n":26,"kind":"divider","eyebrow":"Check yourself","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Three questions on how the base works. Get them graded."}],"quiz":null,"gate":[]},{"n":27,"kind":"body","eyebrow":"Question 1 · the data model","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You're setting up a wealth video for Singapore inside a client project.","q":"Correct. The vertical and country live on the Page . A project is only a harness — it holds the campaign together but carries no vertical of its own. That's why you pick the Page first: it sets vertical + country and auto-assigns the team.\" data-no=\" Not there. The project is just a harness — it carries no vertical. The vertical (food, autos, wealth) and the country live on the Page , which is why the Page is what you set first.\"> You're setting up a wealth video for Singapore inside a client project.","opts":[{"k":"A","t":"On the project — it owns the whole campaign","correct":false},{"k":"B","t":"On the Page — the project is only a harness","correct":true},{"k":"C","t":"Typed fresh onto each individual video","correct":false}]},"gate":[]},{"n":28,"kind":"body","eyebrow":"Question 2 · reading the lead-time clock","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A video has been sitting at the Editing stage well past that stage's lead time.","q":"Correct. Every stage has a lead-time clock — how long work should take there. Past it, the record is overdue and flags as a bottleneck. That's your cue to unblock it: chase the owner of that stage, not the record itself.\" data-no=\" Not that. The clock isn't decoration, and an overdue clock doesn't mean the video is done. Each stage has a lead time; once it's past, the record is overdue — a bottleneck to clear by chasing the stage's owner.\"> A video has been sitting at the Editing stage well past that stage's lead time.","opts":[{"k":"A","t":"The video is finished and ready to post","correct":false},{"k":"B","t":"This stage is overdue — a bottleneck to clear","correct":true},{"k":"C","t":"Nothing — the clock is just decoration","correct":false}]},"gate":[]},{"n":29,"kind":"body","eyebrow":"Question 3 · reading the grid","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"In a grid view, one cell on your record is glowing bright yellow.","q":"Correct. A bright-yellow cell is a must-fill field that's still empty . Fill it — the record can't move cleanly through its stage until every yellow cell on it is filled. Yellow is the base telling you what it needs from you.\" data-no=\" Not a bug. Bright yellow isn't an error or an 'approved' flag. It marks a must-fill field that's empty — fill it so the record can move through its stage.\"> In a grid view, one cell on your record uccess looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"The calendar is always full — enough in the pipeline to hit every month"},{"t":"win","x":"Every video has an objective + an exact target — set on creation, no guesswork"},{"t":"win","x":"Nothing sits past its lead time — jams cleared the moment they appear"},{"t":"win","x":"What wins gets doubled down — fed straight into next month's ideas"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"Where work is born","head":"Everything is created in a project .","subhead":"","lines":[{"t":"lead","x":"You never make a loose video or carousel. You open a project and create the work inside it. The project is the harness that holds the campaign together."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Video and carousel are deliverables","head":"","subhead":"","lines":[{"t":"p","x":"Create a video and it appears as a deliverable on the project. Same for a carousel. The project shows everything it owes at a glance."}],"quiz":null,"gate":[]},{"n":6,"kind":"divider","eyebrow":"Part one","head":"Creating the work","subhead":"","lines":[{"t":"lead","x":"What you fill, and in what order."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"On a new video · fill the Page first","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"The Page does the assigning, not you","head":"Pick the Page. The team assigns itself .","subhead":"","lines":[{"t":"lead","x":"Producer, strategist, editor, copywriter and approvers all cascade onto the record automatically from the Page. An automation handles it, you do not assign people by hand."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"How you plan · backtrack from the calendar","head":"Start from the post date. Subtract backwards.","subhead":"","lines":[{"t":"callout","x":"The post date is the anchor. It's fixed. You read left to right, but each step subtracts the lead time the stage needs — so the calendar sets every due date, and the due dates tell you what to create today."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Every video · pick exactly ONE objective","head":"","subhead":"","lines":[{"t":"li","x":"A great hook — every video needs one"},{"t":"li","x":"A keyword viewers comment to get the offer"},{"t":"li","x":"A landing page + a ManyChat flow that replies automatically"},{"t":"li","x":"A great hook — every video needs one"},{"t":"li","x":"A story worth sharing"},{"t":"li","x":"Views and reach, no hard offer"}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Success is measurable","head":"If you can't measure it, it isn't a target.","subhead":"","lines":[{"t":"lead","x":"Give every video one exact number — a lead target or a view target — alongside the due date. Set it on creation and success becomes a fact you can check, not an opinion. No number, no way to know if it worked."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Lead magnets","head":"One lead magnet. Per video.","subhead":"","lines":[{"t":"lead","x":"A lead magnet is the free offer viewers get for commenting. It attaches to the specific video , never to the Page — one video, one offer. If the objective is lead generation, set the lead magnet before you submit."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"Who brings the video idea?","head":"","subhead":"","lines":[{"t":"li","x":"Own the idea for internal projects"},{"t":"li","x":"Watch the stats across all content and double down on what's winning"},{"t":"li","x":"Wealth & Sensational, shot in the field"},{"t":"li","x":"Closest to the guest and the moment"},{"t":"li","x":"Owns the planned idea for clients"},{"t":"li","x":"Shapes the angle and storyboard"}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"The handoff · where your button stops","head":"You create and subm or straight from a project. It can't move until its offer exists — so you give it a Page and a lead magnet in the Lead Magnets (Marketing) view. That's your part, done. From there the copywriter writes it and the head copywriter approves it — not you."}],"quiz":null,"gate":[]},{"n":20,"kind":"divider","eyebrow":"Part four","head":"Overseeing","subhead":"","lines":[{"t":"lead","x":"The team, and the projects."}],"quiz":null,"gate":[]},{"n":21,"kind":"body","eyebrow":"Your accountability · non-negotiable","head":"If it stalls, it's on you.","subhead":"","lines":[{"t":"li","x":"Own every project's deadline — on time, deliverables moving, no silent slippage."},{"t":"li","x":"Own the team's flow — nobody stuck, overloaded, or blowing a lead time on your watch."},{"t":"li","x":"Kill bottlenecks fast — the moment a record stops moving, you unblock it. Same day."},{"t":"li","x":"Guard the lead times — every role turns work around on time, every time."},{"t":"li","x":"Answer for performance — know what's winning, and feed it into next month."},{"t":"li","x":"Keep the calendar full — a thin pipeline is your problem before it's anyone else's."},{"t":"callout","x":"The pipeline is yours end to end. Nothing stalling is ever \"someone else's\" — it's yours to catch, and yours to answer for."}],"quiz":null,"gate":[]},{"n":22,"kind":"body","eyebrow":"Diagnose a video · the funnel formula","head":"A video is a funnel. Find the stage that broke.","subhead":"","lines":[{"t":"callout","x":"The formula: match the symptom → the funnel stage → the usual cause → the fix. High views + no leads is almost always the CTA / offer , never the content."}],"quiz":null,"gate":[]},{"n":23,"kind":"divider","eyebrow":"Part five","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Three calls. Get them graded."}],"quiz":null,"gate":[]},{"n":24,"kind":"body","eyebrow":"Question 1 · setting up a new video","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You open a brand-new video re ,"kind":"body","eyebrow":"Your mission","head":"Plan it well. Guard it well.","subhead":"","lines":[{"t":"lead","x":"You turn an approved idea into a shoot-ready plan, then protect the quality before anything reaches the client."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"Storyboards run without you — hook, arc and shot notes complete enough that the shoot never stalls"},{"t":"win","x":"Every plan serves one objective — lead-gen or awareness, matched to the page's vertical and country"},{"t":"win","x":"QC catches it before the client does — every edit checked inside 16 hours, nothing weak ships"},{"t":"win","x":"Amendments land in one clean pass — specific, timestamped notes, 6-hour turnaround, no back-and-forth"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"Where you sit","head":"You own two stages.","subhead":"","lines":[{"t":"lead","x":"QC means quality check. Nothing gets shot without your plan. Nothing reaches the client without your check."}],"quiz":null,"gate":[]},{"n":5,"kind":"divider","eyebrow":"Part one","head":"In the base","subhead":"","lines":[{"t":"lead","x":"What you fill, and where you look."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Your views","head":"Two queues are home.","subhead":"","lines":[{"t":"lead","x":"Planning queue: videos waiting for a storyboard, your scene by scene shoot plan. Strategist QC queue: finished edits waiting for your quality check. Open both every morning."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"In planning, you fill","head":"","subhead":"","lines":[{"t":"lead","x":"Setting the shoot date starts the producer's 16 hour footage clock and builds the calendar event. Get it right."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"The storyboard","head":" . You are also Koocester's face in the field."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"A qualified guest is locked — sourced, confirmed, and submitted with contact details filled in"},{"t":"win","x":"Footage is delivered on time — raw file uploaded within 16 hours of every shoot, no chasing"},{"t":"win","x":"Organic ideas keep flowing — Wealth & Sensational features you find yourself, into the backlog"},{"t":"win","x":"Every shoot runs clean — clean audio, storyboard covered, guest put at ease"}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"Where you sit","head":"You own the front of the line.","subhead":"","lines":[{"t":"lead","x":"If you stall, the whole team stalls."}],"quiz":null,"gate":[]},{"n":5,"kind":"divider","eyebrow":"Part one","head":"In the base","subhead":"","lines":[{"t":"lead","x":"What you fill, and where you look."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Your view","head":"The sourcing queue is home.","subhead":"","lines":[{"t":"lead","x":"The base is the team's shared tracker in Lark. Your view inside it, Producer Sourcing, lists every video waiting for you to find and confirm a guest. Check it daily."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"When you source a guest, you fill","head":"","subhead":"","lines":[{"t":"lead","x":"Sourcing means finding and confirming the guest for a video. Fill these on the video's record, then press Confirm submission so marketing can approve before you book the shoot."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"After the shoot","head":"","subhead":"","lines":[{"t":"lead","x":"The raw file link is the Google Drive link to your unedited footage. Paste it in within 16 hours of the shoot or the base flags you overdue. Don't sit on footage."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"The whole operational discipline","head":"Fill the yellow. Co "Your turn","subhead":"","lines":[{"t":"lead","x":"Three calls. Get them graded."}],"quiz":null,"gate":[]},{"n":22,"kind":"body","eyebrow":"Question 1 · the hook","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A 6-slide carousel opens with a full formal introduction on slide one, and saves its sharpest line for slide three.","q":"Correct. Slide one is the hook. If it does not stop the scroll, nothing else in the carousel counts — a formal opener buries the one line that earns the tap.\" data-no=\" Not quite. Slide one is the hook. If it does not stop the scroll, nothing else counts — rewrite the opener, don't save the sharp line for later or park it in the caption.\"> A 6-slide carousel opens with a full formal introduction on slide one, and saves its sharpest line for slide three.","opts":[{"k":"A","t":"Leave it — the payoff always outweighs the opener","correct":false},{"k":"B","t":"Make slide one the hook — if it doesn't stop the scroll, nothing else counts","correct":true},{"k":"C","t":"Move the introduction into the caption instead","correct":false}]},"gate":[]},{"n":23,"kind":"body","eyebrow":"Question 2 · convert vs travel","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"A carousel has a strong hook and a clean CTA, but nothing in it feels worth saving or sending.","q":"Correct. Every carousel has two jobs: convert and travel. A hook and a clean CTA make it convert — a save-worthy or send-worthy line is what makes it travel. Without that, it never leaves the feed.\" data-no=\" Not the fix. More CTAs or a longer caption serve conversion, not travel. What's missing is something worth a save or a send — a line people want to quote.\" > A carousel has a strong hook and a clean CTA, but nothing in it feels worth saving or sending.","opts":[{"k":"A","t":"A second CTA, so more slides drive clicks","correct":false},{"k":"B","t":"A longer caption to compensate","correct":false},{"k":"C","t":"Something worth sharing — a quotable line or a save-worthy slide, so it travels","correct":true}]},"gate":[]},{"n":24,"kind":"body","eyebrow":"Question 3 · the offer & the gate","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"You think a punchier CTA than the source video's offer would convert better, and the carousel is ready to submit.","q":"Correct. The CTA is inherited from the source video's offer — never invent a new one, however punchy. Keep it true, then submit for the Head Copywriter's final approval.\" data-no=\" No. The call to action is inherited from the source video's offer; you don't swap it in and the Social Media Manager doesn't decide it. Keep it true, then submit for the Head Copywriter.\"> You think a punchier CTA than the source video's offer would convert better, and the carousel is ready to submit.","opts":[{"k":"A","t":"Keep the CTA true to the source video's offer, then submit for the Head Copywriter's approval","correct":true},{"k":"B","t":"Swap in your own CTA since you're the copywriter","correct":false},{"k":"C","t":"Submit as-is and let the Social Media Manager decide the CTA","correct":false}]},"gate":[]},{"n":25,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all six?","subhead":"","lines":[],"quiz":null,"gate":["Do you work your Copywriter queue top to bottom?","Do you press Start copywriting before you draft, so the 3 hour clock is real?","Do you fill the carousel copy and caption, pulling from the Article Source when it applies?","Is your call to action always true to the Source Video's offer?","Do you sharpen the AI draft caption before it posts?","Do you write to the Page's vertical and country, ready for Head Copywriter approval?"]},{"n":26,"kind":"close","eyebrow":"","head":"Empowering growth. Built on trust.","subhead":"","lines":[{"t":"lead","x":"Your words are where the work becomes revenue. Write the ones that convert, and the ones that travel."}],"quiz":null,"gate":[]}]},{"id":"veditor","bucket":"Marketing & Content","title":"Video editing — the Koocester way","href":"video-editor-training.html","step":"Your role","count":30,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · role certification","head":"Video editing — the Koocester way","subhead":"","lines":[{"t":"lead","x":"The Standard Operating Procedure (SOP) and brand guideline for every cut, caption and title you ship. On-brand, precise, emotionally engaging."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"Every edit is on-brand — right fonts, right colours, right watermark — no exceptions"},{"t":"win","x":"Subtitles & titles follow the SOP exactly — size, spacing, shadow, position, glow — to the number"},{"t":"win","x":"The story lands with emotion — strong hook, clean pace, the viewer feels it"},{"t":"win","x":"It ships clean & on time — quality-checked, correct export, no typos, no missed deadline"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"The editing mission","head":"Every edit reflects our values .","subhead":"","lines":[{"t":"lead","x":"At Koocester, every piece of content reflects our core values through professional, inspiring and emotionally engaging storytelling — building trust, connection and positive impact, with a bold and modern creative approach."}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one","head":"The look","subhead":"","lines":[{"t":"lead","x":"Fonts, the caption colour code, and subtitle specs."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Typography · three fonts, one system","head":"Know which font, and when.","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"The caption colour code · learn it cold","head":"Colour tells the viewer who's speaking.","subhead":"","lines":[{"t":"
