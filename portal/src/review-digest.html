A green run alone is not proof the other side arrived.\" data-no=\" Too risky. Never edit a live workflow in place and trust a green tick. Duplicate, run one test execution, then confirm the downstream system received what you expected.\"> You need to change the brief that goes out every morning to hundreds of people.","opts":[{"k":"A","t":"Edit the live workflow directly and watch tomorrow's run","correct":false},{"k":"B","t":"Duplicate, test with one execution, then confirm downstream received it","correct":true},{"k":"C","t":"Duplicate it and switch over — a green test run is proof enough","correct":false}]},"gate":[]},{"n":22,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you keep the always-on layer running and safe to change?","subhead":"","lines":[],"quiz":null,"gate":["Can you say what belongs in n8n versus a native Lark automation?","Do you know the briefs, syncs and alerts run from n8n, not a laptop?","Do dashboards live in Metabase, off data in Supabase — never in Lark?","Do you append dated rows on every sync, never overwrite the live value?","Do you store secrets as credentials and rotate anything exposed?","Do you duplicate, test one run, and confirm downstream before you change anything?"]},{"n":23,"kind":"close","eyebrow":"","head":"The layer that runs when nobody is watching.","subhead":"","lines":[{"t":"lead","x":"The briefs land, the syncs preserve history, the secrets stay safe — because you keep the always-on layer running, and change it the careful way. Duplicate, test one, confirm downstream. Escalate anything structural to Hakim."}],"quiz":null,"gate":[]}]},{"id":"tech_devaccess","bucket":"Operations & Tech","title":"Device & access administration","href":"device-access-admin-training.html","step":"Specialisation","count":24,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · tech role · administrator","head":"Device & access administration","subhead":"","lines":[{"t":"lead","x":"The admin counterpart to the staff modules. Everyone else looks after their own device and account — you provision, secure and de-provision devices and access for the whole company ."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"Who this is for","head":"You hold the master keys.","subhead":"","lines":[{"t":"lead","x":"Information Technology (IT) owns the fleet and the access map. Staff protect the device and login in front of them; you set up every device, grant every login, and take them all back when people leave. If it's a company laptop, a shared vault, or a service key — it's yours to administer."},{"t":"callout","x":"This is the admin side. Staff-facing modules teach people to look after their own device and account. This module is how you run it for everyone."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're doing this right when…","subhead":"","lines":[{"t":"win","x":"Every device is provisioned, secured and wipeable — encrypted, enrolled, patched, and remote-wipe ready"},{"t":"win","x":"Access follows least-privilege — only what the role needs — and revoked cleanly on exit"},{"t":"win","x":"Credentials are managed, never shared in plain text — in the vault, two-factor on, rotated on staff changes"},{"t":"win","x":"Secrets live in a store, never hard-coded — and any exposed key is rotated the moment it's found"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one","head":"The device fleet","subhead":"","lines":[{"t":"lead","x":"Provision it, secure it, keep it wipeable."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Provisioning · a device isn't ready until it's enrolled","head":"","subhead":"","lines":[{"t":"p","x":"Mobile Device Management (MDM) is the console that lets you push settings, patches and — critically — a remote wipe to every device you manage. If it isn't enrolled, you can't protect it or recover it."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Keep the fleet current · centrally, not device by device","head":"Patch and enforce from one console.","subhead":"","lines":[{"t":"li","x":"Push updates centrally — operating system and app patches roll out from Mobile Device Management (MDM), so no device is left running old, exploitable software."},{"t":"li","x":"Enforce a security baseline — encryption on, screen-lock timeout, firewall up, no disabling protections. Set it once, apply it to every device."},{"t":"li","x":"Watch for drift — a device that falls out of policy (encryption off, updates paused) is flagged and brought back into line."},{"t":"callout","x":"Most breaches exploit unpatched software. Central patching is the single highest-leverage thing you do for the fleet — one push protects everyone."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Lost, stolen, or leaving","head":"If a device is gone, you wipe it remotely.","subhead":"","lines":[{"t":"lead","x":"A reported-lost or stolen laptop, and every device at offboarding, gets wiped from Mobile Device Management (MDM). Encryption buys you time; the remote wipe ends the risk. Cut its access first, then wipe — the faster you act, the less exposure."},{"t":"callout","x":"This is why enrolment is non-negotiable. A device that was never enrolled can't be wiped — so a lost one stays a live risk until you can physically recover it."}],"quiz":null,"gate":[]},{"n":8,"kind":"divider","eyebrow":"Part two","head":"The access lifecycle","subhead":"","lines":[{"t":"lead","x":"Joiner → mover → leaver. Grant, adjust, revoke."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Every person moves through three states","head":"Grant it, adjust it, take it all back.","subhead":"","lines":[{"t":"li","x":"Joiner — grant access only after the IT & Digital Access Declaration is signed, and only what the role needs."},{"t":"li","x":"Mover — on a role change, add what the new role needs and remove what the old one did . Access should never just accumulate."},{"t":"li","x":"Leaver — on the last day, revoke everything and wipe the device. No lingering logins."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Granting access · the two rules","head":"","subhead":"","lines":[{"t":"li","x":"The signed IT & Digital Access Declaration comes before any access"},{"t":"li","x":"It's the switch that turns access on — you don't grant ahead of it"},{"t":"li","x":"No signed form? Access waits."},{"t":"li","x":"Grant the minimum access the role requires — nothing \"just in case\""},{"t":"li","x":"Every extra login is another door an attacker could use"},{"t":"li","x":"Scope tightly; expand only on a real, stated need"}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"The leaver · your most important admin task","head":"An ex-employee with a live login is a serious risk.","subhead":"","lines":[{"t":"lead","x":"When someone leaves, revoke every access promptly — email, tools, shared vaults, third-party apps, building and device access. A single forgotten login is a standing hole in the company. Do it on the last day, work from a checklist, and confirm nothing was missed."},{"t":"callout","x":"Promptly means same day, not \"when I get to it\". The window between someone leaving and their access being cut is exactly when the damage happens."}],"quiz":null,"gate":[]},{"n":12,"kind":"divider","eyebrow":"Part three","head":"Credentials & secrets","subhead":"","lines":[{"t":"lead","x":"The vault, two-factor, and where keys live."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"Running the password manager · the admin side","head":"You own the vault, not just a login in it.","subhead":"","lines":[{"t":"li","x":"Scope shared vaults by team — each team sees only its own credentials. Who can access what is a decision you make and review, not a default."},{"t":"li","x":"Enforce two-factor authentication (2FA) everywhere — on every account that supports it, no opt-outs."},{"t":"li","x":"Never share credentials in plain text — not in Lark, chat, or email. Credentials move through the vault's share feature, never pasted into a message."},{"t":"li","x":"Rotate on staff changes — when someone with access to a shared credential leaves or moves, change it. Their departure shouldn't leave a known password behind."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Secrets · Application Programming Interface (API) keys and service credentials","head":"Secrets live in a store — never hard-coded.","subhead":"","lines":[{"t":"lead","x":"Application Programming Interface (API) keys, database passwords and service credentials belong in a secrets store, referenced by the systems that need them. They are never pasted inline into a workflow, script, or config. If a secret has ever been exposed in plain text — in code, a message, or a screenshot — treat it as compromised and rotate it ."},{"t":"callout","x":"Ties to the n8n rule: any secret found hard-coded inside an automation gets moved to the store and rotated. An exposed key is a live key until you change it."}],"quiz":null,"gate":[]},{"n":15,"kind":"divider","eyebrow":"Part four","head":"Audit & change safely","subhead":"","lines":[{"t":"lead","x":"Know who has what. Change it on the record."}],"quiz":null,"gate":[]},{"n":16,"kind":"body","eyebrow":"Access auditing · keep the map current","head":"Know who has access to what — and review it.","subhead":"","lines":[{"t":"li","x":"Keep a live picture — maintain a record of who holds which access, across every system. If you can't see it, you can't secure it."},{"t":"li","x":"Review on a schedule — walk the map regularly and ask, for each entry, \"does this person still need this?\""},{"t":"li","x":"Remove stale access — dormant logins, access left over from an old role, accounts nobody uses. Every one you remove is one less way in."},{"t":"callout","x":"Access creep is the quiet risk. People gain access over time and rarely lose it. Regular review is what keeps least-privilege true months later."}],"quiz":null,"gate":[]},{"n":17,"kind":"body","eyebrow":"Change safely · leave a trail","head":"","subhead":"","lines":[{"t":"li","x":"Document every access or config change — who, what, when, why"},{"t":"li","x":"Make changes deliberately, one at a time, so you can undo them"},{"t":"li","x":"Report and act on any suspected compromise immediately"},{"t":"li","x":"Cut access first, investigate second — contain before you diagnose"},{"t":"li","x":"Silent changes nobody can trace back later"},{"t":"li","x":"Granting access \"temporarily\" with no plan to remove it"},{"t":"li","x":"Sitting on a suspected breach to avoid raising an alarm"},{"t":"li","x":"Sharing a credential in plain text to move fast"},{"t":"p","x":"There's no blame for reporting a suspected compromise early. There is a real cost to hiding one."}],"quiz":null,"gate":[]},{"n":18,"kind":"divider","eyebrow":"Part five","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Four admin calls. Get them graded."}],"quiz":null,"gate":[]},{"n":19,"kind":"body","eyebrow":"Question 1 · an employee leaves today","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"A staff member's last day is today. They have email, several tools, a shared vault, and a company laptop.","q":"Correct. Revoke every access promptly and wipe the device. A leaver with a single live login is a standing risk — email, tools, shared vaults, third-party apps, the lot. Work from a checklist and confirm nothing was missed.\" data-no=\" Not enough. Disabling one account or waiting leaves live doors open. On the last day you revoke every access promptly and wipe the device — a lingering login for an ex-employee is a serious risk.\"> A staff member's last day is today. They have email, several tools, a shared vault, and a company laptop.","opts":[{"k":"A","t":"Disable their email — the rest can be cleaned up next week","correct":false},{"k":"B","t":"Leave access for a few days in case they need to hand things over","correct":false},{"k":"C","t":"Revoke every access promptly and wipe the device, from a checklist","correct":true}]},"gate":[]},{"n":20,"kind":"body","eyebrow":"Question 2 · where secrets belong","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"An automation needs an Application Programming Interface (API) key to call an external service.","q":"Correct. Application Programming Interface (API) keys and service credentials live in a secrets store, referenced by the systems that need them — never hard-coded inline. Any key that's been exposed in plain text is treated as compromised and rotated.\" data-no=\" No. Keys are never pasted inline into a workflow, script, or config. They belong in a secrets store, referenced by the system that needs them — and any exposed key gets rotated.\"> An automation needs an Application Programming Interface (API) key to call an external service.","opts":[{"k":"A","t":"Pasted directly into the workflow so it just works","correct":false},{"k":"B","t":"In a secrets store, referenced by the workflow — never hard-coded","correct":true},{"k":"C","t":"Shared in the team chat so everyone can reuse it","correct":false}]},"gate":[]},{"n":21,"kind":"body","eyebrow":"Question 3 · a stolen device","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"A staff member reports their work laptop was stolen. It has access to company accounts and it's enrolled in Mobile Device Management (MDM).","q":"Correct. Cut its access, then remote-wipe it from Mobile Device Management (MDM). Encryption buys time, but killing access and wiping the device is what ends the risk — and it's only possible because the device was enrolled.\" data-no=\" No. Don't rely on encryption alone or wait. Cut the device's access and remote-wipe it from Mobile Device Management (MDM). Speed limits the exposure — and enrolment is what makes the wipe possible.\"> A staff member reports their work laptop was stolen. It has access to company accounts and it's enrolled in Mobile Device Management (MDM).","opts":[{"k":"A","t":"Cut its access, then remote-wipe it from Mobile Device Management (MDM)","correct":true},{"k":"B","t":"Nothing urgent — the disk is encrypted, so it's safe","correct":false},{"k":"C","t":"Wait to see if it's returned before touching anything","correct":false}]},"gate":[]},{"n":22,"kind":"body","eyebrow":"Question 4 · granting access to a joiner","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A new hire starts Monday. A manager asks you to \"just give them the same access as their teammate so they can get going\".","q":"Correct. Grant only after the IT & Digital Access Declaration is signed, and only what the role needs — least privilege. Copying a colleague's full access hands over doors the new starter doesn't need and shouldn't hold.\" data-no=\" No. Don't grant ahead of the signed Declaration, and don't clone a colleague's access. Grant after the Declaration is signed, scoped to only what this role needs — least privilege.\"> A new hire starts Monday. A manager asks you to \"just give them the same access as their teammate so they can get going\".","opts":[{"k":"A","t":"Clone the teammate's access — it's the fastest way to unblock them","correct":false},{"k":"B","t":"Grant after the signed Declaration, scoped to only what the role needs","correct":true},{"k":"C","t":"Grant broad access now and trim it back later if there's time","correct":false}]},"gate":[]},{"n":23,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you administer devices, access and credentials for the whole company?","subhead":"","lines":[],"quiz":null,"gate":["Is every device encrypted, enrolled in Mobile Device Management (MDM), and remote-wipeable?","Do you patch and enforce security baselines across the fleet centrally?","Do you grant access only after the Declaration is signed, and only what the role needs?","On a leaver, do you revoke every access promptly and wipe the device?","Are credentials in the vault, two-factor on, never shared in plain text, and rotated on staff changes?","Do secrets live in a store — never hard-coded — with exposed keys rotated?","Do you review who has access to what, remove stale access, and report compromise immediately?"]},{"n":24,"kind":"close","eyebrow":"","head":"Provisioned, least-privilege, and revocable.","subhead":"","lines":[{"t":"lead","x":"You run the fleet and the access map for everyone. Every device is secured and wipeable, access is granted tight and revoked clean, and credentials and secrets are managed — never shared in plain text, always rotated when they should be."}],"quiz":null,"gate":[]}]},{"id":"admin","bucket":"Operations & Tech","title":"Admin","href":"admin-training.html","step":"Your role","count":18,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · role certification","head":"Admin hygiene.","subhead":"","lines":[{"t":"lead","x":"Keep the records true — clear the yellow cells, hunt the orphans, and the whole base runs on data you can trust."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"Your mission","head":"Keep the data clean.","subhead":"","lines":[{"t":"lead","x":"Every automation, every dashboard, every assignment reads from these records. When the data is true, the base runs itself. When it slips, everything downstream slips with it."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"Records always true — Page, objective and assignee never missing"},{"t":"win","x":"Back office tidy — hygiene view empty, orphans cleared"},{"t":"win","x":"Yellow cells cleared same day — nothing sits unfilled overnight"},{"t":"win","x":"Dashboards you can trust — because the data behind them is clean"}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one","head":"The hygiene rule","subhead":"","lines":[{"t":"lead","x":"Three fields, never missing."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Your mission","head":"No record you touch is missing the essentials.","subhead":"","lines":[{"t":"lead","x":"Hygiene means Page, objective and assignee are always filled. A bright yellow cell means must fill, so clear it before you move on to the next record."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"The hygiene rule","head":"","subhead":"","lines":[{"t":"lead","x":"These three drive everything else. Miss one and the record can't be trusted downstream, not by the team, not by the dashboards."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Watch for orphans","head":"No Page means no team.","subhead":"","lines":[{"t":"lead","x":"A record with no Page is an orphan: no team gets assigned, so nobody works it. Hunt orphans down and clear duplicates before a deadline runs out on them."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"How assignment works","head":"","subhead":"","lines":[{"t":"lead","x":"Records are born at Not Started and take their team from the Page. Your job is to catch the ones that slipped through without a Page, because those never got assigned."}],"quiz":null,"gate":[]},{"n":9,"kind":"divider","eyebrow":"Part two","head":"Work the view","subhead":"","lines":[{"t":"lead","x":"Top to bottom, until it's empty."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Where to look","head":"The hygiene view.","subhead":"","lines":[{"t":"lead","x":"It surfaces records missing key fields. Work it top to bottom until it is empty. An empty hygiene view is a base you can trust."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Why this matters","head":"Dashboards are only as honest as the records feeding them.","subhead":"","lines":[{"t":"lead","x":"A missing field doesn't just sit quietly, it breaks a rollup, skips an assignment, or shows up as a wrong number on someone's dashboard. Clean data upstream is the whole reason downstream work is trustworthy."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Your first day","head":"Do these five things","subhead":"","lines":[{"t":"li","x":"Open the base and find the hygiene view, that is admin home."},{"t":"li","x":"Work it top to bottom, filling every yellow cell you find."},{"t":"li","x":"Search for records with no Page, that is your orphan hunt."},{"t":"li","x":"Clear one orphan by linking it to the right Page."},{"t":"li","x":"Check the view is emptier than when you started."}],"quiz":null,"gate":[]},{"n":13,"kind":"divider","eyebrow":"Part three","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Three calls. Get them graded."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Question 1 · orphans","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"You open a video record and its Page field is empty — a bright yellow cell.","q":"Correct. No Page means no team: the record is an orphan, since assignment cascades from the Page. Hunt these down and clear them before a deadline runs out unattended.\" data-no=\" It's not cosmetic. A record with no Page never gets a team assigned — that's an orphan. Clear yellow cells like this before a deadline runs out on them.\"> You open a video record and its Page field is empty — a bright yellow cell.","opts":[{"k":"A","t":"No team gets assigned — it's an orphan nobody is working","correct":true},{"k":"B","t":"Nothing, the objective fills in automatically anyway","correct":false},{"k":"C","t":"It's cosmetic, clear it whenever you get to it","correct":false}]},"gate":[]},{"n":15,"kind":"body","eyebrow":"Question 2 · the hygiene view","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You open the hygiene view and it lists dozens of records missing key fields.","q":"Correct. Work the hygiene view top to bottom until it's empty. An empty hygiene view is a base you can trust — Page, objective and assignee all need to be clean, not just Page.\" data-no=\" Not quite. Work it top to bottom until it's empty, not by picking urgency or skipping fields. Objective and assignee matter as much as Page — an empty hygiene view is what makes the base trustworthy.\"> You open the hygiene view and it lists dozens of records missing key fields.","opts":[{"k":"A","t":"Sort by client name and fix whichever looks most urgent","correct":false},{"k":"B","t":"Work it top to bottom until it's empty","correct":true},{"k":"C","t":"Skip anything that isn't missing its Page field","correct":false}]},"gate":[]},{"n":16,"kind":"body","eyebrow":"Question 3 · why it matters","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You notice a video record has sat with an empty Objective field for two weeks, but it hasn't caused a visible problem yet.","q":"Correct. A missing field doesn't announce itself, it quietly breaks a rollup or shows a wrong number somewhere downstream. Fix it the moment you see it, not when someone complains.\" data-no=\" Not quite. Silence doesn't mean it's fine, a missing field breaks something downstream quietly whether or not anyone has noticed yet. Fill it the moment you see it.\"> You notice a video record has sat with an empty Objective field for two weeks, but it hasn't caused a visible problem yet.","opts":[{"k":"A","t":"Leave it, no one's complained so it isn't urgent","correct":false},{"k":"B","t":"Fill it — a missing field quietly breaks rollups and dashboards before anyone notices","correct":true},{"k":"C","t":"Only fix it if a manager asks about that specific record","correct":false}]},"gate":[]},{"n":17,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all five?","subhead":"","lines":[],"quiz":null,"gate":["Do you clear every bright yellow cell — Page, objective, assignee?","Do you hunt down orphan records with no Page?","Do you work the hygiene view top to bottom until it's empty?","Do you fix a missing field the moment you see it, not when someone complains?","Do you trust your dashboards are only as clean as the records behind them?"]},{"n":18,"kind":"close","eyebrow":"","head":"Keep the base true.","subhead":"","lines":[{"t":"lead","x":"Clean records make every automation, every dashboard and every assignment trustworthy. That trust starts with you."}],"quiz":null,"gate":[]}]},{"id":"finance","bucket":"Finance & People","title":"Finance","href":"finance-training.html","step":"Your role","count":19,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · role certification","head":"The finance seat","subhead":"","lines":[{"t":"lead","x":"You keep the books true. The mundane runs on cron jobs — you own the judgment, the exceptions, and the trust."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"The books reconcile — every transaction matched, nothing floating"},{"t":"win","x":"Cash position is known and trusted — you can state it cold, no guessing"},{"t":"win","x":"Nothing sits unexplained — every variance has an answer attached"},{"t":"win","x":"The mundane runs itself — cron jobs handle the repetition, you own the judgment"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"The one idea","head":"Automate the mundane. Own the judgment.","subhead":"","lines":[{"t":"lead","x":"Repetitive matching, entry, and reminders go to cron jobs. You review, catch exceptions, and make the calls no machine can. Run the machine — don't do the machine's job."}],"quiz":null,"gate":[]},{"n":4,"kind":"divider","eyebrow":"Part one","head":"Reconciliation","subhead":"","lines":[{"t":"lead","x":"What it is, why it matters, and how you do it."}],"quiz":null,"gate":[]},{"n":5,"kind":"body","eyebrow":"Reconciliation · what it is and why","head":"Match every transaction to reality.","subhead":"","lines":[{"t":"lead","x":"Reconciliation means matching every transaction — bank ↔ accounting system ↔ card or float — so the books reflect what actually happened. Unreconciled books mean you don't actually know your numbers, no matter how confident the report looks."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"How to reconcile · the discipline","head":"Five steps, every time.","subhead":"","lines":[{"t":"li","x":"Pull the statement — bank, card, or float, for the period."},{"t":"li","x":"Match each line — to a record in the accounting system."},{"t":"li","x":"Flag the unmatched — anything without a clean pair."},{"t":"li","x":"Chase or explain the difference — get the answer, don't guess."},{"t":"li","x":"Mark it reconciled — only once every line has a match or an explanation."},{"t":"callout","x":"Do it on a regular cadence. Weekly or monthly, never let it pile up — a backlog is where errors hide."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"How to check the books · the few things to read","head":"","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":8,"kind":"divider","eyebrow":"Part two","head":"Human vs cron","subhead":"","lines":[{"t":"lead","x":"Know exactly which one owns which task."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"The split · run the machine, don't do the machine's job","head":"","subhead":"","lines":[{"t":"li","x":"Pull statements automatically"},{"t":"li","x":"Match obvious, clean transactions"},{"t":"li","x":"Send invoice & payment reminders"},{"t":"li","x":"Run recurring reports"},{"t":"li","x":"Flag duplicates and overdue items"},{"t":"li","x":"Review the reconciliation"},{"t":"li","x":"Judge exceptions and odd entries"},{"t":"li","x":"Approvals"},{"t":"li","x":"Month-end sign-off"},{"t":"li","x":"Anything needing a decision or a relationship"},{"t":"callout","x":"The test: if it repeats exactly the same way every time, it's a cron job. If it needs a judgment call, it's yours."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Month-end close · light","head":"Five checks before you call it closed.","subhead":"","lines":[{"t":"li","x":"Everything reconciled — bank, card, float, all matched."},{"t":"li","x":"Receivables & payables current — nothing stale unflagged."},{"t":"li","x":"P&L reviewed — the numbers make sense against last month."},{"t":"li","x":"Exceptions explained — every variance has an answer attached."},{"t":"li","x":"Report out — cash, P&L, and anything odd, in plain language."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Red flags to catch","head":"Trust the numbers only as far as the records are clean .","subhead":"","lines":[{"t":"li","x":"Unexplained variances — a gap with no story behind it."},{"t":"li","x":"A transaction that doesn't match anything — chase it, don't wave it through."},{"t":"li","x":"An overdue receivable creeping up — the trend matters more than the single case."},{"t":"li","x":"A number that \"looks off\" — trust the instinct enough to check it."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Controls & integrity · brief","head":"","subhead":"","lines":[{"t":"li","x":"Separation of duties — whoever spends isn't the one who reconciles."},{"t":"li","x":"Keep records true — no smoothing, no rounding to make it look tidy."},{"t":"li","x":"Escalate anything that looks wrong — immediately, not after you've tried to explain it away."},{"t":"li","x":"Confidentiality — financial data stays need-to-know."}],"quiz":null,"gate":[]},{"n":13,"kind":"divider","eyebrow":"Part three","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Four calls. Get them graded."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Question 1 · an unmatched transaction","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"You're reconciling the month and find a bank line with no matching record in the accounting system.","q":"Correct. Flag it and chase the explanation. You don't mark anything reconciled until every line has a match or a real answer behind it.\" data-no=\" No. Never ignore it and never force the totals to match by deleting it. Flag the unmatched line and chase the explanation before you mark anything reconciled.\"> You're reconciling the month and find a bank line with no matching record in the accounting system.","opts":[{"k":"A","t":"Ignore it — it's probably a small timing difference","correct":false},{"k":"B","t":"Flag it and chase down the explanation before marking anything reconciled","correct":true},{"k":"C","t":"Delete it from the accounting system so the totals match","correct":false}]},"gate":[]},{"n":15,"kind":"body","eyebrow":"Question 2 · cron vs human","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"You're deciding what to hand to automation and what to keep for yourself.","q":"Correct. A routine, repeat-every-time reminder is exactly what a cron job should own. Judging a strange entry and signing off month-end are yours — they need a decision.\" data-no=\" No. Judging a strange one-off entry and month-end sign-off both need a human call. The routine reminder is the one that repeats exactly the same way every time — hand that to a cron job.\"> You're deciding what to hand to automation and what to keep for yourself.","opts":[{"k":"A","t":"Sending a routine reminder for an overdue invoice","correct":true},{"k":"B","t":"Judging whether a strange, one-off entry is legitimate","correct":false},{"k":"C","t":"Signing off month-end close","correct":false}]},"gate":[]},{"n":16,"kind":"body","eyebrow":"Question 3 · trusting the number","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"It's month-end. The P&L looks great, but reconciliation hasn't been done this month.","q":"Correct. Unreconciled books mean you don't actually know if the numbers are right, however good the P&L looks. Reconcile first, then trust it.\" data-no=\" No. The P&L is built from the same records reconciliation checks. If those records aren't matched to reality yet, you can't state the P&L is right — reconcile first.\"> It's month-end. The P&L looks great, but reconciliation hasn't been done this month.","opts":[{"k":"A","t":"Yes — the P&L is a separate system, reconciliation doesn't affect it","correct":false},{"k":"B","t":"No — unreconciled books mean you don't actually know if the numbers are right","correct":true},{"k":"C","t":"Only the revenue line, not the expenses","correct":false}]},"gate":[]},{"n":17,"kind":"body","eyebrow":"Question 4 · controls","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"The same person who approves and makes payments also reconciles that account, with no one else reviewing it.","q":"Correct. Separation of duties is broken. The person who spends and approves shouldn't be the only one checking the record — someone else needs to review it, honesty aside.\" data-no=\" No. It's not about trust in the individual — it's a control. The person who spends shouldn't be the only one reconciling that account; someone else needs to review it.\"> The same person who approves and makes payments also reconciles that account, with no one else reviewing it.","opts":[{"k":"A","t":"None — one owner is more efficient","correct":false},{"k":"B","t":"Separation of duties is broken — the spender shouldn't be the only check","correct":true},{"k":"C","t":"It's fine as long as they're honest","correct":false}]},"gate":[]},{"n":18,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all five?","subhead":"","lines":[],"quiz":null,"gate":["Do you reconcile on a regular cadence?","Do you flag and explain every unmatched line?","Do you know what's automated vs your judgment?","Do you review before you trust a number?","Do you escalate anything that looks off?"]},{"n":19,"kind":"close","eyebrow":"","head":"Automate the mundane. Own the judgment. Keep the books true.","subhead":"","lines":[{"t":"lead","x":"The cron layer feeds the tiles","head":"You don't type the numbers. The pipeline pulls them.","subhead":"","lines":[{"t":"lead","x":"n8n runs 24/7 on its own connection. It pulls from the finance tools — the accounting ledger, the bank and card feeds — and pipes those numbers into the database, which the dashboard reads. Nobody keys the tiles by hand."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"The most important idea in this module","head":"The dashboard is a mirror , not the source.","subhead":"","lines":[{"t":"lead","x":"A tile only reflects what the pipeline last put in the database. So trust the source — the accounting ledger is the truth, the tile is a reflection of it. If the reflection looks wrong, suspect the mirror before you believe the number."},{"t":"callout","x":"A stale tile is a broken sync, not a real number. If a tile hasn't updated in days, the pipeline stopped feeding it — the figure is old, not fact. Fix the sync; don't act on the frozen number."}],"quiz":null,"gate":[]},{"n":7,"kind":"divider","eyebrow":"Part two","head":"Lead versus lag","subhead":"","lines":[{"t":"lead","x":"One kind you can still act on. One kind is already history."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"The key idea","head":"Lag is what happened. Lead is what predicts it.","subhead":"","lines":[{"t":"li","x":"Receivables ageing — how overdue we're getting"},{"t":"li","x":"Spend rate versus budget"},{"t":"li","x":"Invoices sitting unsent"},{"t":"li","x":"Revenue booked"},{"t":"li","x":"Cash in the bank"},{"t":"callout","x":"Act on the lead ones. By the time cash in the bank drops, the cause happened weeks ago. The lead tiles — ageing, spend rate, unsent invoices — are where you can still change the outcome."}],"quiz":null,"gate":[]},{"n":9,"kind":"divider","eyebrow":"Part three","head":"Every tile triggers an action","subhead":"","lines":[{"t":"lead","x":"See this → do this. A tile you don't act on is wallpaper."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Your finance tiles · read each as a trigger","head":"See this → do this.","subhead":"","lines":[{"t":"p","x":"Illustrative tile set — confirm the exact tiles on your live dashboard."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"The two tiles you read first","head":"Cash tells you where you stand . Ageing tells you what's coming .","subhead":"","lines":[{"t":"lead","x":"Cash position is a lag number — where you are today. Receivables ageing is the lead number that predicts next month's cash: money already earned, still sitting with customers. Read them together."},{"t":"p","x":"Illustrative — values load from the live source. Never quote a placeholder as a real figure."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Your OMTM · the One Metric That Matters this month","head":"Pick one lead number, and move it: overdue receivables .","subhead":"","lines":[{"t":"lead","x":"Each month, name the single number that most predicts cash health and watch it daily. Overdue receivables is a strong default — it's money you've already earned, and chasing it is the fastest, cheapest cash you'll ever raise. Drive it toward zero and cash follows."},{"t":"callout","x":"One number, watched. Cash in the bank is the score; overdue receivables is the lever. Pick the lever as your One Metric That Matters, and the score takes care of itself."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"The honesty rule · non-negotiable","head":"A number you can't source is a number you don't trust .","subhead":"","lines":[{"t":"lead","x":"Some figures look important but have no real source wired behind them yet. Burn rate and runway are the classic trap — if no true burn source is connected, the runway tile is a guess dressed as a fact."},{"t":"callout","x":"Say \"not yet measurable\" — never fabricate a runway. If a burn or runway figure has no real source behind it, report that plainly. A confident wrong number is worse than an honest gap, because es":[],"quiz":{"ans":"A","scenario":"You're deciding which tiles deserve action today: receivables ageing, cash in the bank, revenue booked last month.","q":"Correct. Receivables ageing is a lead indicator — it predicts next month's cash and you can still act on it today by chasing. Cash in the bank and revenue booked are lag: the result, already happened.\" data-no=\" It's a lead indicator. Receivables ageing predicts cash you haven't collected yet — you can still act on it by chasing. Cash in the bank and revenue booked are lag numbers: already booked, nothing left to change there.\"> You're deciding which tiles deserve action today: receivables ageing, cash in the bank, revenue booked last month.","opts":[{"k":"A","t":"A lead indicator — it predicts cash, and I can still act on it","correct":true},{"k":"B","t":"A lag indicator — it's already happened, like cash in the bank","correct":false},{"k":"C","t":"Neither — ageing is just a report, not something to act on","correct":false}]},"gate":[]},{"n":18,"kind":"body","eyebrow":"Question 3 · turning a tile into an action","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"Your dashboard shows a growing \"invoices outstanding\" tile — several jobs delivered but not yet billed.","q":"Correct. Invoices outstanding is a lead tile — work done but not yet billed. The action is to send them. An unsent invoice is cash you're choosing not to collect; nothing gets paid until it goes out.\" data-no=\" Read the tile as a trigger. Invoices outstanding means work done but not yet billed — the action is to send them. Waiting or writing them off leaves earned cash on the table; the invoice has to go out before it can be paid.\"> Your dashboard shows a growing \"invoices outstanding\" tile — several jobs delivered but not yet billed.","opts":[{"k":"A","t":"Wait until the customer asks for the invoice","correct":false},{"k":"B","t":"Write them off — outstanding means uncollectable","correct":false},{"k":"C","t":"Send the ry claim has a receipt attached — no claim goes in without proof"},{"t":"win","x":"Approval happens before reimbursement — never after the money's already out"},{"t":"win","x":"Reimbursements land fast — staff aren't chasing their own money"},{"t":"win","x":"Card spend stays visible — no surprises when the statement lands"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"Why we use Aspire","head":"Nobody should be out of pocket for long.","subhead":"","lines":[{"t":"li","x":"One system for claims and cards — staff submit in one place, finance reviews in one place."},{"t":"li","x":"A clear approval trail — every claim has a receipt, a reviewer, and a decision."},{"t":"li","x":"Keeps Xero clean — expenses get categorised and booked correctly, not dumped into the books as guesswork."},{"t":"li","x":"Fast turnaround — the sooner a claim is reviewed, the sooner someone gets paid back."}],"quiz":null,"gate":[]},{"n":5,"kind":"divider","eyebrow":"Part one","head":"The claim flow","subhead":"","lines":[{"t":"lead","x":"Three steps. The order never changes."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Submitting a claim","head":"","subhead":"","lines":[{"t":"callout","x":"No receipt, no claim. No approval, no reimbursement. That order never changes — a claim without a receipt gets bounced back before it goes anywhere near approval."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Finance's part · reviewing a claim","head":"Four checks, every time.","subhead":"","lines":[{"t":"li","x":"Receipt attached — legible, matches the amount claimed."},{"t":"li","x":"Category correct — filed under the right expense type, not \"miscellaneous.\""},{"t":"li","x":"Amount is reasonable — matches policy, no red flags."},{"t":"li","x":"Approve or reject with a reason — a rejection without a reason just bounces back and forth."}],"quiz":null,"gate":[]},{"n":8,"kind":"divider","eyebrow":"Part two","head":"Good to know","subhead":"","lines":[{"t":"lead","x":"Practical habits, and one open item."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Keep in mind","head":"","subhead":"","lines":[{"t":"li","x":"Submit claims promptly — don't let a month of receipts pile up before filing."},{"t":"li","x":"Use the correct category — it keeps Xero's books clean downstream."},{"t":"li","x":"Receipts must be legible — a blurry photo slows down approval, not speeds it up."},{"t":"li","x":"Company cards still need records — card spend isn't exempt from the same discipline as a claim."}],"quiz":null,"gate":[]},{"n":10,"kind":"divider","eyebrow":"Part three","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Three calls. Get them graded."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Question 1 · what a claim needs","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"A staff member submits an expense claim in Aspire but forgot to attach the receipt.","q":"Correct. No receipt, no claim. Every expense claim needs a receipt attached before it can move to approval — no exceptions for small amounts.\" data-no=\" No. A claim without a receipt doesn't move forward. The receipt is what makes it a legitimate, approvable claim in the first place.\"> A staff member submits an expense claim in Aspire but forgot to attach the receipt.","opts":[{"k":"A","t":"It can't move forward — a claim needs a receipt attached","correct":true},{"k":"B","t":"It goes to approval anyway; the receipt can follow later","correct":false},{"k":"C","t":"It gets auto-approved for small amounts without a receipt","correct":false}]},"gate":[]},{"n":12,"kind":"body","eyebrow":"Question 2 · the order of operations","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A claim is sitting in the queue, fully submitted with a receipt attached.","q":"Correct. Approval always comes before reimbursement. Reimbursing first and approving later defeats the entire point of a review step.\" data-no=\" No. Reimbursement never happens before approval. The review has to happen first — otherwise there's nothing stopping an unreviewed claim from getting paid.\"> A claim is sitting in the queue, fully submitted with a receipt attached.","opts":[{"k":"A","t":"Nothing — submission with a receipt is enough to trigger payment","correct":false},{"k":"B","t":"It must be approved first — approval always comes before reimbursement","correct":true},{"k":"C","t":"It gets reimbursed immediately, then reviewed afterward","correct":false}]},"gate":[]},{"n":13,"kind":"body","eyebrow":"Question 3 · Aspire vs Xero","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"Someone asks whether they should raise an invoice in Aspire or reconcile the bank feed there.","q":"Correct. Aspire is for expense management — claims, reimbursements and card spend. Xero is the accounting system that holds the books. They're different tools for different jobs.\" data-no=\" No. Aspire doesn't do invoicing or bank reconciliation — that's Xero's job. Aspire's job is expense management: claims, reimbursements and card spend.\"> Someone asks whether they should raise an invoice in Aspire or reconcile the bank feed there.","opts":[{"k":"A","t":"Yes — Aspire handles invoicing and reconciliation too","correct":false},{"k":"B","t":"Only reconciliation happens in Aspire, invoicing is elsewhere","correct":false},{"k":"C","t":"No — that's Xero. Aspire is for expense management, not accounting","correct":true}]},"gate":[]},{"n":14,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all five?","subhead":"","lines":[],"quiz":null,"gate":["Do you know Aspire is for expense management, not accounting?","Do you know a claim needs a receipt before it can move?","Do you know approval always comes before reimbursement?","Do you check receipt, category and amount before approving?","Will you confirm our exact Aspire setup in-app rather than assume?"]},{"n":15,"kind":"close","eyebrow":"","head":"Receipt, approval, reimbursement. In that order.","subhead":"","lines":[{"t":"lead","x":"Aspire keeps the team whole while Xero keeps the books straight. Next in your path: Xero, for accounting management."}],"quiz":null,"gate":[]}]},{"id":"hr","bucket":"Finance & People","title":"HR","href":"hr-training.html","step":"Your role","count":22,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · role certification","head":"People & culture","subhead":"","lines":[{"t":"lead","x":"You run the human side of Koocester — hiring, growth, records, and the hard conversations. The mundane runs on cron jobs; you own every call that needs judgment."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"The right people, hired well — a real job description and role profile behind every hire"},{"t":"win","x":"Onboarded to be productive fast — a real 30/60/90-day plan, not sink-or-swim"},{"t":"win","x":"Performance & growth cadence running — goals set, 1:1s happening, feedback flowing both ways"},{"t":"win","x":"Records clean and compliant — employee data accurate, MOM/CPF filings on time"},{"t":"win","x":"Issues handled early and fairly — documented, private, resolved before they fester"},{"t":"win","x":"The mundane runs itself — cron jobs handle the repetition, you focus on people"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"The one idea","head":"Automate the mundane. Own the people.","subhead":"","lines":[{"t":"lead","x":"Cron jobs handle reminders, tracking, records, and reports. You own hiring decisions, performance conversations, grievances, and culture — the calls a machine can't make."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"The HR function map · where everything lives","head":"One map. Sixteen areas.","subhead":"","lines":[{"t":"callout","x":"Each area has its own SOP document. The Employee Onboarding SOP, Recruitment & Talent Acquisition SOP, Performance Management SOP, Learning & Development SOP, Compensation & Benefits SOP, Attendance & Leave Management SOP, HR Compliance SOP, and Offboarding & Employee Separation SOP each spell out the phases, rules, and metrics in full. This deck teaches the real substance from each — the SOP is where you go for the step-by-step."}],"quiz":null,"gate":[]},{"n":5,"kind":"divider","eyebrow":"Part one","head":"How the areas group","subhead":"","lines":[{"t":"lead","x":"Four groups, so sixteen areas are easy to hold."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Bring people in","head":"Plan the seat. Fill it well.","subhead":"","lines":[{"t":"li","x":"Workforce planning — know what roles you need before you're desperate for them."},{"t":"li","x":"Recruitment & talent acquisition — per the Recruitment & Talent Acquisition SOP : 8 phases, Vacancy Approval → Sourcing → Screening → Interviews → Verification → Offer → Handover. Target ≤45 days to fill, ≥90% offer acceptance. Never issue an offer, and never skip background verification, without approval."},{"t":"li","x":"Onboarding — per the Employee Onboarding SOP : 9 phases running from Day One readiness through Week 1 / Day 30 / 60 / 90 reviews. Nail Day One — equipment, access, and workspace ready before they arrive — and the rest falls into place."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Employee Onboarding SOP · the real checklist","head":"Day One readiness first. Everything else follows.","subhead":"","lines":[{"t":"callout","x":"Target: 100% Day One readiness, ≥85% new-hire satisfaction, ≥90% 90-day retention."}],"quiz":null,"gate":[]},{"n":8,"kind":"body","eyebrow":"Grow & keep people","head":"Once they're in, don't let them stall.","subhead":"","lines":[{"t":"li","x":"Performance management — per the Performance Management SOP : SMART goals → ongoing coaching → mid-year review → self-assessment → annual evaluation → calibration → a 1–5 rating → development plan (PIP if it's a 1 or 2). Every rating needs documented evidence — never assign one from memory."},{"t":"li","x":"Learning & development — per the Learning & Development SOP : start with a Training Needs Analysis, not a course catalogue. Build the skills the role and the company need next, not the ones that are easiest to deliver."},{"t":"li","x":"Engagement — check the pulse before people quietly check out."},{"t":"li","x":"Succession & talent — know who's next for every seat that matters, before it's empty."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"Performance Management SOP · the cadence","head":"One cycle, eleven phases, five ratings.","subhead":"","lines":[{"t":"lead","x":"Rating scale: 5 Exceptional · 4 High · 3 Solid · 2 Developing · 1 Performance Concern (→ PIP)."},{"t":"callout","x":"The rule that matters most: never assign a rating without documented evidence — coaching notes win calibration, memory doesn't."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"Run the back office","head":"The parts that must never be wrong.","subhead":"","lines":[{"t":"li","x":"Compensation, benefits & payroll — per the Compensation & Benefits SOP : benchmark the market, check internal pay equity, then get approval before a single number changes. Confidentiality is rule one — never disclose an individual's pay."},{"t":"li","x":"Attendance & leave — per the Attendance & Leave Management SOP : verify eligibility before you approve, reconcile attendance against payroll monthly, and keep every medical certificate confidential."},{"t":"li","x":"Records management — employee data accurate and current, nothing stale."},{"t":"li","x":"HR reporting & analytics — the KPI dashboard tells you the state of the team at a glance."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Handle the hard things","head":"Early, documented, fair.","subhead":"","lines":[{"t":"li","x":"Employee relations & grievance — every complaint logged, investigated, and closed — early, documented, private."},{"t":"li","x":"Discipline & industrial relations — handled to one fair, consistent standard, never ad hoc."},{"t":"li","x":"Compliance — per the HR Compliance SOP : monitor regulatory change before it lands, run the gap assessment, update the policy, then train and audit. Never implement an unapproved policy. MOM / IRAS / CPF reporting and work pass renewals are on time, every time."},{"t":"li","x":"Offboarding — per the Offboarding & Employee Separation SOP : knowledge transfer and work handover happen before the exit interview; assets and access come back before final payroll clears."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"Offboarding & Employee Separation SOP · the exit checklist","head":"The order protects the business.","subhead":"","lines":[{"t":"li","x":"Notify & review notice — every separation documented in writing, notice obligations confirmed."},{"t":"li","x":"Knowledge transfer & work handover — critical responsibilities documented and a successor assigned before the exit interview."},{"t":"li","x":"Exit interview — structured, confidential, kept neutral."},{"t":"li","x":"Assets back, access off — equipment recovered and every system account disabled before clearance."},{"t":"li","x":"Final payroll, then clearance — salary, leave balance and claims independently verified before sign-off."},{"t":"callout","x":"The rule that never bends: no access removal = security risk. No knowledge transfer = business disruption."}],"quiz":null,"gate":[]},{"n":13,"kind":"divider","eyebrow":"Part two","head":"Human vs cron","subhead":"","lines":[{"t":"lead","x":"Know exactly which one owns which task."}],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"The split · automate the mundane, own the people","head":"","subhead":"","lines":[{"t":"li","x":"Leave & attendance tracking"},{"t":"li","x":"Onboarding checklists & reminders"},{"t":"li","x":"Contract & record filing"},{"t":"li","x":"Recurring HR reports"},{"t":"li","x":"Payroll runs"},{"t":"li","x":"Birthday / anniversary / probation reminders"},{"t":"li","x":"Hiring calls"},{"t":"li","x":"Performance & growth conversations"},{"t":"li","x":"Grievances & discipline"},{"t":"li","x":"Culture"},{"t":"li","x":"Succession decisions"},{"t":"li","x":"Anything sensitive"},{"t":"callout","x":"The test: if it repeats exactly the same way every time, it's a cron job. If it needs judgment or a relationship, it's yours."}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"Compliance & confidentiality · brief","head":"","subhead":"","lines":[{"t":"li","x":"Employee data is highly sensitive — treat it as need-to-know, always."},{"t":"li","x":"Follow the HR compliance SOP for MOM / IRAS / CPF reporting and work pass renewals — deadlines are real, not soft."},{"t":"li","x":"Keep records accurate and private — no shortcuts, no guessing."},{"t":"li","x":"Escalate anything legal or serious immediately — don't sit on it."}],"quiz":null,"gate":[]},{"n":16,"kind":"divider","eyebrow":"Part three","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Four calls. Get them graded."}],"quiz":null,"gate":[]},{"n":17,"kind":"body","eyebrow":"Question 1 · cron vs human","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"You're deciding what to automate vs keep for yourself.","q":"Correct. A routine reminder that fires the same way every time is exactly what a cron job should own. Firing someone and having the actual conversation both need a human call.\" data-no=\" No. Deciding on termination and having the conversation itself both need a human judgment call. The reminder that repeats the same way every time is the one to hand to a cron job.\"> You're deciding what to automate vs keep for yourself.","opts":[{"k":"A","t":"Sending a probation-review reminder before it's due","correct":true},{"k":"B","t":"Deciding whether to let someone go for repeated lateness","correct":false},{"k":"C","t":"Having the actual conversation with an underperformer","correct":false}]},"gate":[]},{"n":18,"kind":"body","eyebrow":"Question 2 · handling a grievance","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"An employee comes to you with a complaint about their manager.","q":"Correct. Log it, investigate promptly, document every step, and keep it confidential. That's the fair standard — early, documented, private.\" data-no=\" No. A grievance doesn't wait for a review cycle, and it never gets aired in a group setting. Log it, investigate promptly, document it, and keep it confidential.\"> An employee comes to you with a complaint about their manager.","opts":[{"k":"A","t":"Note it and raise it at the next performance review cycle","correct":false},{"k":"B","t":"Log it, investigate promptly, document it, keep it confidential","correct":true},{"k":"C","t":"Raise it openly in the next team meeting so everyone's aware","correct":false}]},"gate":[]},{"n":19,"kind":"body","eyebrow":"Question 3 · onboarding","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"A new hire starts Monday.","q":"Correct. A real 30/60/90-day plan with clear goals and check-ins gets a new hire productive fast — that's what onboarding exists to do.\" data-no=\" No. Sink-or-swim and a document dump on day one both fail the point of onboarding. A real 30/60/90-day plan, with goals and check-ins, is what makes a new hire productive fast.\"> A new hire starts Monday.","opts":[{"k":"A","t":"Get them productive fast, with clear goals and real check-ins on a plan","correct":true},{"k":"B","t":"Leave them to figure it out — sink or swim shows who's serious","correct":false},{"k":"C","t":"Front-load every policy document on day one, then move on","correct":false}]},"gate":[]},{"n":20,"kind":"body","eyebrow":"Question 4 · cron vs human","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"It's the end of the month.","q":"Correct. Running the payroll cycle and generating payslips repeats exactly the same way every month — that's a cron job. Approving a raise and sitting down with someone whose numbers are slipping both need you.\" data-no=\" No. A raise decision and a hard performance conversation both need human judgment. Running the payroll cycle itself is the one that repeats the same way every month — that's the cron job's task.\"> It's the end of the month.","opts":[{"k":"A","t":"Running the payroll cycle and generating payslips","correct":true},{"k":"B","t":"Approving a raise for a top performer","correct":false},{"k":"C","t":"Sitting down with someone whose numbers have been slipping","correct":false}]},"gate":[]},{"n":21,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all six?","subhead":"","lines":[],"quiz":null,"gate":["Do you hire against a real job description and role profile?","Do you onboard so new hires are productive fast?","Do you run the performance & growth cadence — goals, 1:1s, feedback?","Do you handle issues early, fair, and documented?","Do you keep records clean and confidential?","Do you automate the mundane and own the people?"]},{"n":22,"kind":"close","eyebrow":"","head":"Hire well. Grow them. Handle the hard things early. Automate the rest.","subhead":"","lines":[{"t":"lead","x":"Cron jobs pull the reminders, file the records, and run the payroll. You make the calls that need judgment — who to hire, how to grow them, and how to handle it when things go wrong."}],"quiz":null,"gate":[]}]},{"id":"perf_mgmt","bucket":"Finance & People","title":"Performance management & PIP","href":"performance-management-training.html","step":"Specialisation","count":19,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · Human Resources module","head":"Performance management & the Improvement Program","subhead":"","lines":[{"t":"lead","x":"The fair, consistent process Human Resources (HR) owns to handle under-performance with dignity — the formal step after a manager's coaching hasn't closed the gap."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"Under-performance is caught early — addressed while it's still fixable, not months late"},{"t":"win","x":"Most people recover — a clear program pulls the majority back on track"},{"t":"win","x":"No one is ever blindsided — expectations were explicit long before any decision"},{"t":"win","x":"The process is identical for everyone — same steps, no favouritism, no surprises"},{"t":"win","x":"Every step is documented — fair to the person, protective of the company"},{"t":"win","x":"Dignity is never optional — even an exit is handled with respect"},{"t":"p","x":"This is the bar. Everything that follows is how you hit it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"HR's job here","head":"Make it fair, consistent, documented, and humane.","subhead":"","lines":[{"t":"lead","x":"A good process protects both sides — the person gets a real, honest chance to recover, and the company gets a defensible record. That only holds if you run it the same way every time: no surprises, no favouritism."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"Where this sits · the consequence ladder","head":"Coaching first. The Program is the formal step.","subhead":"","lines":[{"t":"callout","x":"The Program is not step one. It starts only after a manager has coached and given direct feedback and the gap is still open. When judgment and documentation are needed, it becomes HR's process to run."}],"quiz":null,"gate":[]},{"n":5,"kind":"divider","eyebrow":"Part one","head":"The conversation & the record","subhead":"","lines":[{"t":"lead","x":"Before any program, how you talk and what you write down."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"The performance conversation","head":"Direct, specific, evidence-based — and kind.","subhead":"","lines":[{"t":"lead","x":"Use the numbers. Name the gap plainly, tie it to what was expected, and stay warm while you do it. The goal is a person who leaves clear on what must change and believing you're on their side."},{"t":"li","x":"\"The last three deliverables missed their deadline by a week\""},{"t":"li","x":"Facts, dates, numbers — not adjectives"},{"t":"li","x":"Tied to a clear, agreed expectation"},{"t":"li","x":"Opens a path: \"here's what good looks like\""},{"t":"li","x":"\"You're careless / lazy / not a team player\""},{"t":"li","x":"Labels, character, tone-policing"},{"t":"li","x":"Vague — \"your attitude needs work\""},{"t":"li","x":"Closes the door and invites defensiveness"},{"t":"p","x":"Attack the gap, never the human. A person can change behaviour — they can't change a label you've pinned on them."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"Documentation · why it matters, done simply","head":"If it isn't written down, it didn't happen.","subhead":"","lines":[{"t":"li","x":"It's fairness — a written record means the person is judged on facts, not on someone's memory or mood."},{"t":"li","x":"It's protection — for them and for the company, if the decision is ever questioned."},{"t":"li","x":"Keep it simple — date, what was discussed, what was agreed, by when. A few honest lines after each conversation beats a perfect document written after the fact."},{"t":"li","x":"Write it near the moment — same day, while it's accurate. Late notes look like a case being built."},{"t":"callout","x":"The rule: document as you go, in plain language. The record should read as a fair account anyone could pick up — not a paper trail assembled to justify a decision already made."}],"quiz":null,"gate":[]},{"n":8,"kind":"divider","eyebrow":"Part two","head":"The Performance Improvement Program","subhead":"","lines":[{"t":"lead","x":"The core of this module — abbreviated PIP."}],"quiz":null,"gate":[]},{"n":9,"kind":"body","eyebrow":"The Performance Improvement Program (PIP) · what it must always include","head":"Four things. Never fewer.","subhead":"","lines":[{"t":"callout","x":"Miss one and it isn't a fair PIP. No support means you set them up to fail; no clear success bar means the outcome is an opinion, not a fact."}],"quiz":null,"gate":[]},{"n":10,"kind":"body","eyebrow":"The timeline · a real window, with support inside it","head":"30–60 days. Check in the whole way through.","subhead":"","lines":[{"t":"callout","x":"The check-ins are the point. Regular reviews mean the person always knows where they stand — the final review confirms what the check-ins already showed. No one hears the outcome for the first time on the last day."}],"quiz":null,"gate":[]},{"n":11,"kind":"body","eyebrow":"Inside the program · the bar must be unambiguous","head":"Define \"success\" so both of you would score it the same.","subhead":"","lines":[{"t":"lead","x":"A vague target — \"improve your work\" — is unfair; no one can pass it or fail it cleanly. Write the bar as something measurable and dated: the deliverables, the quality, the deadline they must hit by the end of the window. If two people would disagree on whether it was met, it isn't defined yet."}],"quiz":null,"gate":[]},{"n":12,"kind":"body","eyebrow":"The two outcomes · dignity is non-negotiable either way","head":"Passes, or doesn't. Both handled with respect.","subhead":"","lines":[{"t":"li","x":"Back on track — the gap is closed against the bar"},{"t":"li","x":"Recognised, not held under suspicion afterwards"},{"t":"li","x":"Return to the normal performance cadence"},{"t":"li","x":"The program worked exactly as intended"},{"t":"li","x":"A respectful role change, or a respectful exit"},{"t":"li","x":"No blindsiding — the check-ins made it foreseeable"},{"t":"li","x":"Handled privately, with notice and support"},{"t":"li","x":"They leave with their dignity intact"},{"t":"callout","x":"Dignity is not the reward for passing. It's how every person is treated through the whole process — including the one who has to leave."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"How it connects · not a standalone event","head":"One piece of a bigger system.","subhead":"","lines":[{"t":"li","x":"Sits on the Rewards & consequences ladder — coaching and feedback come before it; a role change or exit comes after. The Program is the fair, formal middle step."},{"t":"li","x":"Feeds from the bi-annual evaluation — a low rating is often what surfaces a real gap and triggers the conversation. The evaluation flags it; the Program addresses it."},{"t":"li","x":"Feeds back into it — a passed program shows up as recovery in the next evaluation; a defined success bar makes that judgment easy and fair."},{"t":"callout","x":"The through-line: evaluation surfaces the gap → conversation names it → the Program gives a fair, supported chance to close it → the outcome is recorded, with dignity, either way."}],"quiz":null,"gate":[]},{"n":14,"kind":"divider","eyebrow":"Part three","head":"Your turn","subhead":"","lines":[{"t":"lead","x":"Three calls. Get them graded."}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"Question 1 · what a program must include","head":"","subhead":"","lines":[],"quiz":{"ans":"C","scenario":"You're about to put a struggling team member on a Performance Improvement Program.","q":"Correct. A Performance Improvement Program must always include written expectations, the support provided, a clear timeline, and a defined 'what success looks like' — with regular check-ins throughout. Drop any one and it stops being fair.\" data-no=\" No. A fair PIP is not just a deadline or a warning. It must always include written expectations, the support the company will provide, a clear timeline, and a defined success bar — with regular check-ins along the way.\"> You're about to put a struggling team member on a Performance Improvement Program.","opts":[{"k":"A","t":"A firm deadline and a warning that their job is at risk","correct":false},{"k":"B","t":"A list of everything they've done wrong so far","correct":false},{"k":"C","t":"Written expectations, the support provided, a clear timeline, and a defined success bar","correct":true}]},"gate":[]},{"n":16,"kind":"body","eyebrow":"Question 2 · the performance conversation","head":"","subhead":"","lines":[],"quiz":{"ans":"B","scenario":"A team member has missed their last three deadlines. You sit down to talk.","q":"Correct. Name the specific gap with evidence — the numbers, the dates — and separate the behaviour from the person. It's direct and kind at once, and it opens a path to fix it.\" data-no=\" No. Labelling the person ('careless', 'not a team player') or softening it into vagueness both fail them. Be specific and evidence-based about the behaviour, and keep it kind — attack the gap, not the human.\"> A team member has missed their last three deadlines. You sit down to talk.","opts":[{"k":"A","t":"\"You've been careless and it's becoming a pattern\"","correct":false},{"k":"B","t":"\"The last three deliverables were each about a week late — let's look at what's getting in the way\"","correct":true},{"k":"C","t":"\"Your work just hasn't felt right lately — try to lift it\"","correct":false}]},"gate":[]},{"n":17,"kind":"body","eyebrow":"Question 3 · the outcome","head":"","subhead":"","lines":[],"quiz":{"ans":"A","scenario":"The program window closes and, measured against the bar, the person has not met it.","q":"Correct. If someone doesn't pass, the outcome is a respectful role change or exit — handled privately, with notice, and no blindsiding, because the check-ins made it foreseeable. Dignity is non-negotiable either way.\" data-no=\" No. A person who doesn't pass is never dismissed on the spot or blindsided. The regular check-ins mean the outcome was foreseeable, and the exit or role change is handled respectfully — with dignity intact.\"> The program window closes and, measured against the bar, the person has not met it.","opts":[{"k":"A","t":"A respectful role change or exit — private, with notice, no surprise","correct":true},{"k":"B","t":"Immediate dismissal on the final day, effective at once","correct":false},{"k":"C","t":"Quietly extend the program again and again until it works out","correct":false}]},"gate":[]},{"n":18,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you run a fair Performance Improvement Program with dignity?","subhead":"","lines":[],"quiz":null,"gate":["Do you reach the Program only after coaching and feedback haven't closed the gap?","Do you hold the conversation with evidence, separating the behaviour from the person?","Do you document simply, in plain language, near the moment?","Does every Program include expectations, support, a timeline, and a defined success bar?","Do you run regular check-ins so no outcome is ever a surprise?","Do you handle both outcomes — recovery or exit — with dignity?"]},{"n":19,"kind":"close","eyebrow":"","head":"Handle it early, run it fairly, protect the person's dignity.","subhead":"","lines":[{"t":"lead","x":"The Performance Improvement Program isn't a trap — it's a real, supported chance to recover, run the same way for everyone. Most people come back through it. The ones who don't leave with respect. Either way, no one is ever blindsided."}],"quiz":null,"gate":[]}]},{"id":"manager","bucket":"Management & Command","title":"Manager","href":"manager-training.html","step":"Your role","count":23,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · role certification","head":"The Manager","subhead":"","lines":[{"t":"lead","x":"You don't do the stage work. You keep the pipeline flowing."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"Your mission","head":"Clear the road, don't drive the car.","subhead":"","lines":[{"t":"lead","x":"Your team owns the stages. You own the flow: spot where work is stuck, unblock it, and hold the standard. If nothing's overdue and nothing's stuck, you're winning."}],"quiz":null,"gate":[]},{"n":3,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"No bottleneck lives long — you spot the wall and clear it same day"},{"t":"win","x":"Every role is on its lead time — no stage quietly running over its clock"},{"t":"win","x":"You escalate the right things — the person who's blocking, not the record"},{"t":"win","x":"The floor keeps moving — work flows end to end, nothing stalls silently"},{"t":"p","x":"This is the bar. Everything that follows is how you hold it — and the final gate checks you against it."}],"quiz":null,"gate":[]},{"n":4,"kind":"body","eyebrow":"Where you sit","head":"Above the pipeline, not inside it.","subhead":"","lines":[{"t":"lead","x":"You watch the whole line. Your job starts where a record stops moving."}],"quiz":null,"gate":[]},{"n":5,"kind":"divider","eyebrow":"Part one","head":"Reading the base","subhead":"","lines":[{"t":"lead","x":"Where to look, and what \"good\" looks like."}],"quiz":null,"gate":[]},{"n":6,"kind":"body","eyebrow":"Your views","head":"Manager · Pipeline is home.","subhead":"","lines":[{"t":"lead","x":"It shows the whole flow by stage. Group by stage to see the shape of the queue, by editor or producer to see load. Read it top to bottom every morning."}],"quiz":null,"gate":[]},{"n":7,"kind":"body","eyebrow":"The daily read, in order","head":"","subhead":"","lines":[{"t":"li","x":"What's overdue? Anything past its clock is a dropped ball. Chase it."},{"t":"li","x":"What's stuck at Not Started? The backlog isn't planned. Push it to the coordinator."},{"t":"li","x":"Where's the wall? The stage with the most records piled up is today's bottleneck."},{"t":"li","x":"Who's overloaded? Rebalance before someone drowns."}],"quiz":null,"gate":[]},{"n":8,"kind":"divider","eyebrow":"Part two","hea d only for yourself.","opts":[{"k":"A","t":"Edit the shared Manager Pipeline view to add your filter","correct":false},{"k":"B","t":"Ask the coordinator to change the shared view for everyone","correct":false},{"k":"C","t":"Build a personal view — filter and group it however you like","correct":true}]},"gate":[]},{"n":22,"kind":"body","eyebrow":"Certification · answer Yes to every question","head":"Can you say Yes to all six?","subhead":"","lines":[],"quiz":null,"gate":["Do you read the Manager Pipeline view every morning, overdue first?","Can you name today's bottleneck and who owns it?","Do you know every gate and what it protects?","When something's stuck, do you chase the person, not the record?","Do you build personal views and never edit a locked shared view?","Do you rebalance load before anyone drowns?"]},{"n":23,"kind":"close","eyebrow":"","head":"Empowering growth. Built on trust.","subhead":"","lines":[{"t":"lead","x":"Next in this classroom: the base walkthrough video and a live pipeline review with the head of growth."}],"quiz":null,"gate":[]}]},{"id":"leading","bucket":"Management & Command","title":"Leading the Koocester way","href":"leading-the-koocester-way-training.html","step":"Specialisation","count":39,"slides":[{"n":1,"kind":"title","eyebrow":"Koocester Academy · manager leadership","head":"Leading the Koocester way","subhead":"","lines":[{"t":"lead","x":"Managing, guiding and growing people with abundance. Empowering Growth. Built on Trust."}],"quiz":null,"gate":[]},{"n":2,"kind":"body","eyebrow":"What success looks like","head":"You're winning when…","subhead":"","lines":[{"t":"win","x":"Your people feel your abundance — managed, guided and trained well"},{"t":"win","x":"The team hits its outcomes — without you chasing anyone"},{"t":"win","x":"Hard things are said early — with care, not left to fester"},{"t":"win","x":"You could step away two weeks — and the team runs without you"},{"t":"p","x":"This is the bar. Everything that follows is how ":"Bouncing in amendments? The notes weren't specific enough — get one clear pass."},{"t":"li","x":"Aging in Ready to Upload? That's a backlog, not a mystery — rebalance or reprioritise."},{"t":"p","x":"This is separate from escalating people matters to Human Resources — this is you, running the floor."}],"quiz":null,"gate":[]},{"n":13,"kind":"body","eyebrow":"What a strong Koocester manager looks like","head":"Ten traits, no shortcuts.","subhead":"","lines":[],"quiz":null,"gate":[]},{"n":14,"kind":"body","eyebrow":"Before you lead others","head":"Know yourself. Know your team.","subhead":"","lines":[{"t":"li","x":"Your strengths"},{"t":"li","x":"Your development areas"},{"t":"li","x":"Your triggers — what sets you off, and why"},{"t":"li","x":"Different strengths"},{"t":"li","x":"Different motivations"},{"t":"li","x":"Different aspirations — help each perform at their best"},{"t":"p","x":"Build on strengths. Coach the gaps."}],"quiz":null,"gate":[]},{"n":15,"kind":"body","eyebrow":"Understand your people","head":"Different generations, different expectations.","subhead":"","lines":[{"t":"p","x":"Lead to the person, not the age. Hold the same high standard for everyone."}],"quiz":null,"gate":[]},{"n":16,"kind":"body","eyebrow":"The 4 basics · 1 of 4","head":"Set crystal-clear expectations.","subhead":"","lines":[{"t":"li","x":"Outcomes, not tasks. Tell them what \"done well\" produces, not just what to do."},{"t":"li","x":"Define what good looks like — show an example."},{"t":"li","x":"Always give the why."},{"t":"li","x":"Agree, then write it down."},{"t":"p","x":"Most performance problems are clarity problems."}],"quiz":null,"gate":[]},{"n":17,"kind":"body","eyebrow":"The 4 basics · 2 of 4","head":"The weekly 1-on-1.","subhead":"","lines":[{"t":"lead","x":"It's their meeting, not your status update."},{"t":"p","x":"Default: weekly, 30 minutes, every direct report — on video across Singapore, Malaysia and Indonesia. Never skip it."}],"quiz":null,"gate":[]},{"n":18,"kind":"body","eyebrow":"How you run it","head":"Listening isn't just words.","subhead":"","lines":[{"t":"lead","x":"A great 1-on-1 runs on three moves: you listen for the pattern, you ask the open question, then you get out of the way."},{"t":"li","x":"Hesitation before a \"yes\""},{"t":"li","x":"What they don't say"},{"t":"li","x":"Energy dropping on a topic"},{"t":"li","x":"Repeating the same worry"},{"t":"li","x":"Over-explaining"},{"t":"li","x":"\"I'm fine\" that isn't"},{"t":"li","x":"\"What's really going on?\""},{"t":"li","x":"\"What's the hard part?\""},{"t":"li","x":"\"What do you need from me?\""},{"t":"li","x":"\"What am I missing?\""},{"t":"li","x":"Talking 70%, you 30%"},{"t":"li","x":"They surface the real issue"},{"t":"li","x":"You guide, you don't lead the witness"}],"quiz":null,"gate":[]},{"n":19,"kind":"body","eyebrow":"How you communicate","head":"Do this. Steer clear of that.","subhead":"","lines":[{"t":"li","x":"Listen first"},{"t":"li","x":"Be specific"},{"t":"li","x":"Ask, don't assume"},{"t":"li","x":"Explain why"},{"t":"li","x":"Address behaviour, not personality"},{"t":"li","x":"Praise in public, coach in private"},{"t":"li","x":"Stay calm"},{"t":"li","x":"Confirm understanding"},{"t":"li","x":"Interrupting"},{"t":"li","x":"⚠ Assuming intent common trap — easy to default to, must catch yourself"},{"t":"li","x":"⚠ Vague feedback common trap — specific is harder, do it anyway"},{"t":"li","x":"Public embarrassment"},{"t":"li","x":"⚠ Speaking from emotion common trap — pause before you react"},{"t":"li","x":"Empty promises"},{"t":"li","x":"⚠ Avoiding hard talks common trap — hardest to avoid, most costly to skip"},{"t":"p","x":"Standard: Clear · Respectful · Honest · Timely."}],"quiz":null,"gate":[]},{"n":20,"kind":"body","eyebrow":"The 4 basics · 3 of 4","head":"Feedback, direct and kind.","subhead":"","lines":[{"t":"li","x":"Situation — when and where it happened."},{"t":"li","x":"Behaviour — exactly what you observed."},{"t":"li","x":"Impac
