<!doctype html>
<html lang="en">
<head>
<script src="koo-nav.js?v=2026072106"></script>
<script src="koo-auth-guard.js?v=2026072104"></script>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sales Kits · Koocester</title>
<style>
:root{
  --maroon:#C02025; --maroon-tint:#F2CECF; --maroon-deep:#C02025; --ink:#000; --body:#333; --muted:#666;
  --line:#CCC; --line2:#F2CECF; --bg:#fff; --ok:#1A7F37;
  --base:'Helvetica Neue',Helvetica,Inter,'SF Pro Text',Arial,sans-serif; --mono:'SF Mono',ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.22,.61,.36,1); --pop:cubic-bezier(.22,1.12,.4,1);
  --shadow:0 1px 2px rgba(0,0,0,.04),0 12px 34px rgba(0,0,0,.07);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--body);font-family:var(--base);-webkit-font-smoothing:antialiased;line-height:1.5}
.top{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px clamp(20px,5vw,56px);border-bottom:1px solid var(--line2);position:sticky;top:0;background:rgba(255,255,255,.9);backdrop-filter:blur(12px);z-index:5}
.brand{display:flex;align-items:center;gap:12px}
.brand img{height:20px}
.brand .tag{font-size:10px;letter-spacing:.22em;text-transform:uppercase;color:var(--maroon);font-weight:800;border:1px solid var(--maroon);border-radius:5px;padding:4px 9px;background:var(--maroon-tint);font-family:var(--mono)}
.back{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:#fff;color:var(--muted);font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:9px 14px;border-radius:20px;text-decoration:none;transition:.15s;white-space:nowrap}
.back:hover{border-color:var(--maroon);color:var(--maroon)}
.wrap{max-width:1000px;margin:0 auto;padding:clamp(32px,6vw,56px) clamp(20px,5vw,56px) 90px}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--maroon);font-weight:800;margin-bottom:12px}
h1{font-size:clamp(1.9rem,4.4vw,2.8rem);line-height:1.04;letter-spacing:-.03em;color:var(--ink);font-weight:800;margin:0 0 8px}
.lead{color:var(--muted);margin:0 0 32px;font-size:1rem;max-width:620px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:16px}
.kit{position:relative;display:flex;flex-direction:column;text-align:left;text-decoration:none;border:1.5px solid var(--line);background:#fff;border-radius:18px;padding:22px 20px 20px;color:inherit;cursor:pointer;transition:transform .17s var(--pop),border-color .16s,box-shadow .16s}
.kit:hover:not(.soon){transform:translateY(-5px);border-color:var(--maroon);box-shadow:var(--shadow)}
.kit.soon{cursor:default}
.icn{width:48px;height:48px;border-radius:13px;background:var(--maroon-tint);border:1px solid rgba(192,32,37,.16);display:flex;align-items:center;justify-content:center;font-size:24px;margin-bottom:15px}
.kit h3{margin:0 0 5px;font-size:1.22rem;color:var(--ink);font-weight:800;letter-spacing:-.015em}
.kit:hover:not(.soon) h3{color:var(--maroon)}
.kit p{margin:0;font-size:.88rem;color:var(--muted);line-height:1.5;flex:1}
.meta{display:flex;align-items:center;gap:7px;margin-top:16px}
.chip{font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;padding:5px 9px;border-radius:20px;font-family:var(--mono)}
.chip.live{color:var(--ok);background:#fff;border:1px solid var(--ok)}
.chip.soon{color:var(--muted);background:#fff;border:1px solid var(--line)}
.go{position:absolute;top:22px;right:20px;color:var(--line);font-size:19px;transition:.16s}
.kit:hover:not(.soon) .go{color:var(--maroon);transform:translateX(3px)}
.kit.soon .go{display:none}
.note{margin-top:28px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:#fff;font-size:.9rem;color:var(--muted)}
.note b{color:var(--ink)}
/* segmented toggle */
.seg{display:inline-flex;padding:4px;gap:4px;border:1.5px solid var(--line);border-radius:999px;background:#fff;margin:0 0 26px}
.seg button{font-family:var(--mono);font-size:12px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:transparent;border:none;border-radius:999px;padding:9px 20px;cursor:pointer;transition:background .16s,color .16s}
.seg button.on{background:var(--maroon);color:#fff}
.seg button:not(.on):hover{color:var(--maroon)}
.flag{position:absolute;top:22px;left:20px;font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--maroon);background:var(--maroon-tint);border:1px solid rgba(192,32,37,.22);border-radius:20px;padding:4px 9px}
.kit.flagged{padding-top:44px}
@media (max-width:560px){.grid{grid-template-columns:1fr}.seg{display:flex;width:100%}.seg button{flex:1;padding:11px 12px}}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="koocester.png" alt="Koocester"><span class="tag">Sales Kits</span></div>
  <a class="back" href="portal.html">← Portal</a>
</header>
<main class="wrap">
  <div class="eyebrow">Sell &amp; Pitch</div>
  <h1>Sales Kits</h1>
  <p class="lead">Open the Academy Sales Kit engine, choose the client market and language, then present full screen or export the selected version as PDF.</p>
  <div class="seg" id="seg" role="tablist">
    <button data-seg="sme" class="on">SME</button>
    <button data-seg="mnc">MNC</button>
  </div>
  <div class="grid" id="grid"></div>
  <div class="note" id="note"></div>
</main>
<script>
// Sales kit variants. sme: live href per kit. mnc: coming soon across the board.
const KITS = [
  { icon:'⭐', name:'Company Sales Kit', desc:'The one pitch for every category. Who Koocester is, what we deliver, the à la carte price for every vertical, and the path to launch.', sme:'sales-kit-slides.html?kit=COMPANY', flag:'Start here' },
];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let SEG = 'sme';
function render(){
  const live = SEG === 'sme';
  document.getElementById('grid').innerHTML = KITS.map(k=>{
    const href = live ? k.sme : '';
    const isLive = live && href;
    const el = isLive ? 'a' : 'div';
    const attr = isLive ? (' href="'+esc(href)+'"') : '';
    const flagged = live && k.flag;
    const tag = isLive
      ? '<span class="chip live">Live</span>'+(k.note?'<span class="chip soon">'+esc(k.note)+'</span>':'')
      : '<span class="chip soon">Coming soon</span>';
    return '<'+el+attr+' class="kit'+(isLive?'':' soon')+(flagged?' flagged':'')+'">'+
      (isLive?'<span class="go">→</span>':'')+
      (flagged?'<span class="flag">'+esc(k.flag)+'</span>':'')+
      '<div class="icn">'+k.icon+'</div>'+
      '<h3>'+esc(k.name)+'</h3><p>'+esc(k.desc)+'</p>'+
      '<div class="meta">'+tag+'</div></'+el+'>';
  }).join('');
  document.getElementById('note').innerHTML = live
    ? '<b>Small &amp; Medium Enterprises.</b> One kit covers every category — the à la carte price for each vertical is inside. Singapore, Malaysia and Indonesia; English, Chinese, Bahasa Indonesia and Bahasa Melayu; presentation mode and PDF export.'
    : '<b>MNC rate card in progress.</b> The enterprise kit is being built. For multinational and large-account pitches, use the SME Company kit for now.';
}
document.getElementById('seg').addEventListener('click', function(e){
  const b = e.target.closest('button'); if(!b) return;
  SEG = b.getAttribute('data-seg');
  [].forEach.call(this.querySelectorAll('button'), x=>x.classList.toggle('on', x===b));
  render();
});
render();
</script>
</body>
</html>
